    status: in_progress
  - id: t3-probe
    title: scripts/capacity_probe.py + `make probe-capacity` target
    status: in_progress
  - id: t4-resolver
    title: scripts/resolve_topology.py + `make resolve-topology` + `make plan-capacity`
    status: in_progress
