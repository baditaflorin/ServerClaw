  notes: "Sweep ADR 0457 Phase 2's host_pinning_guard role across every service\n\
    playbook in one edit instead of touching 50+ files individually.\n\nMechanism:\
    \ 52 service playbooks (ops-portal, keycloak, gitea,\nmail-platform, openbao,\
    \ dify, etc.) already import\n`playbooks/tasks/preflight.yml` as a shared pre_task\
