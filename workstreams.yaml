    \ can opt out per-play with\n`host_pinning_guard_skip_in_preflight: true` \u2014\
    \ documented but not\nrecommended.\n\nPlaybooks that do NOT use `tasks/preflight.yml`\
    \ (proxmox-host\nbootstrap plays, fixture playbooks, the standalone public-edge\n\
    playbook which already has the guard wired directly) are unchanged.\n"
