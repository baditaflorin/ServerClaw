  adr: 0380
  title: Neko edge vhost must use the shared edge certificate lineage, not a per-host
    one
  status: in_progress
  ready_to_merge: true
  live_applied: false
  owner: claude
  branch: claude/fix-neko-vhost-cert-drift-2026-08-29
  worktree_path: .worktrees/fix-neko-vhost-cert-drift
  doc: docs/adr/0380-neko-for-operator-remote-browser-access.md
  depends_on:
