  notes: "Phase 2 of ADR 0457. Closes the lv3 \u2194 0fork oauth2-proxy@4180\ncollision\
    \ class of bug at converge time rather than at incident time.\n\nNew role `lv3.platform.host_pinning_guard`:\n\
    \ - Resolves the active deployment slug from active_deployment_slug,\n   $DEPLOYMENT,\
    \ or .local/active-deployment.\n - Looks up the host's deployment_owner from proxmox_guests.\n\
    \ - Refuses the converge with a remediation message when the slugs\n   mismatch,\
    \ OR when deployment_owner is set but no active slug is\n   resolvable (strict\
    \ mode default).\n - Skips silently when neither side is set (legacy single-deployment\n\
    \   behavior).\n\nWired into playbooks/public-edge.yml as the first role so it\
    \ runs\nbefore linux_guest_firewall, public_edge_oidc_auth, and\nnginx_edge_publication.\
    \ Other playbooks (ops-portal.yml,\nkeycloak.yml, etc.) can opt in by adding the\
    \ same role. Wiring\nbeyond public-edge is deliberately deferred \u2014 each playbook's\n\
    author should review the change.\n\n9 tests: 5 structure (role exists, files present,\
    \ defaults\nunchanged, public-edge wired) + 4 behavioural (ansible-playbook\n\
    --check on a synthetic inventory). Behavioural tests skip when\nansible-playbook\
    \ is not on PATH.\n"
