  summary: 'Phase 8 ships the two structural follow-ups left after Phase 7: cross-deployment
    visibility (Option B) and advisory auto-promotion (Option C). The local doctor
    signal is already at 1/7 non-zero; Phase 8 makes the remaining drift surfaces
    visible across deployments and starts graduating long-clean advisories toward
    required.

    '
  phases:
    phase_0_open_workstream:
      status: in_progress
    phase_1_promotion_tracker:
      status: not_started
