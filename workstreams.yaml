- id: ws-0447-coolify-apps-self-healing
  title: 'Coolify apps self-healing: coolify-apps bootstrap + DNS-01 cert + app-deploy
    role'
  status: in_progress
  priority: p0
  owner: platform
  created: 2026-04-28
  branch: claude/ws-0447-coolify-apps-self-healing
  context: "After the 0fork Coolify deployment (converges 16-25) and the first app\
    \ deploy\n(education_wemeshup), several manual steps were required:\n  1. nginx\
    \ was manually patched to point to coolify VM (10.10.10.70:80) instead\n     of\
    \ coolify-apps VM (10.10.10.71:443), because coolify-apps has no Traefik.\n  2.\
    \ The app's domain scheme was switched from https:// to http:// to avoid\n   \
    \  Traefik's HTTP-01 ACME challenge loop (nginx redirects port 80\u2192443, so\n\
    \     the challenge can never complete).\n  3. PermitRootLogin was manually enabled\
    \ on coolify-apps VM.\n\nThese patches are WRONG. The next `make converge-nginx`\
    \ overwrites the manual\nnginx patch and the app breaks. This workstream makes\
    \ the platform converge to\nthe correct state unattended.\n\nKey insight: the\
    \ nginx template at publication/templates/proxmox-host.yml:2982\nis ALREADY CORRECT\
    \ \u2014 it looks up coolify-apps-lv3 by name, not by hardcoded IP.\nThe problem\
    \ is that coolify-apps never has Traefik on it, so the upstream is dead.\n"
  design: "Three independent Ansible-level changes, all self-healing:\n\n## 1. coolify_runtime:\
    \ bootstrap coolify-apps VM as a Coolify server\n\nAdd a second play in the coolify\
    \ playbook targeting coolify-apps-lv3 that:\n- Installs Docker (same docker_runtime\
    \ role already used elsewhere)\n- Adds PermitRootLogin yes + coolify deploy pubkey\
    \ to authorized_keys\n  (derived from coolify_deploy_ssh_pubkey, already in defaults/main.yml)\n\
    - Registers coolify-apps as a Coolify server via API call\n  (idempotent: check\
    \ if server with ip == coolify_apps_ip exists first)\n- Triggers validate \u2192\
    \ Coolify installs its own Traefik on coolify-apps\n\nWhen this runs, the nginx\
    \ upstream (https://coolify-apps-lv3:443) is live and\ncorrect. When coolify-apps\
    \ IP changes, generate-platform-vars + converge heals it.\n\nVariables needed\
    \ (add to coolify_runtime defaults):\n  coolify_apps_vm_host: \"{{ (proxmox_guests\
    \ | selectattr('name', 'equalto',\n                            'coolify-apps-lv3')\
    \ | map(attribute='ipv4') | first) }}\"\n  coolify_apps_vm_ssh_port: 22\n  coolify_apps_server_name:\
    \ coolify-apps\n\n## 2. coolify_runtime: switch Traefik to DNS-01 cert resolution\n\
    \nThe docker-compose.yml.j2 template hardcodes HTTP-01 acme.httpchallenge.\nHTTP-01\
    \ is broken when nginx is in front (port 80 redirects to 443; the\nACME challenge\
    \ response can never be served).\n\nReplace with DNS-01 via Hetzner DNS, which\
    \ the platform already uses:\n  --certificatesresolvers.letsencrypt.acme.dnschallenge=true\n\
    \  --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=hetzner\n  --certificatesresolvers.letsencrypt.acme.dnschallenge.delaybeforecheck=10\n\
    \nTraefik needs HETZNER_API_KEY env var injected at runtime (from Vault/OpenBao\n\
    or from the coolify .env file). The platform already has hetzner_dns_zone_id\n\
    in .local/identity.yml and a rotate-hetzner-dns-token playbook.\n\nNew variable\
    \ (add to coolify_runtime defaults):\n  coolify_traefik_cert_resolver: dns  #\
    \ or http; default dns for behind-nginx use\n  coolify_hetzner_dns_api_token_vault_path:\
    \ \"secret/hetzner/dns-api-token\"\n\nWhen coolify_traefik_cert_resolver == dns:\n\
    \  - Render the dnschallenge lines instead of httpchallenge in docker-compose.yml.j2\n\
    \  - Inject HETZNER_API_KEY into the proxy container env\n\nThis makes Traefik\
    \ on coolify-apps get real certs for *.apps.0fork.com via\nDNS TXT records \u2014\
    \ no dependency on nginx port-80 routing whatsoever.\n\n## 3. coolify_app_deploy\
    \ role: idempotent app registration via Coolify API\n\nA new role that, given:\n\
    \  - repo_url, branch, compose_file\n  - domain (derived from platform_domain\
    \ \u2014 never hardcoded)\n  - service_name (the compose service that gets the\
    \ domain)\n  - project_name, server_name\n\nDoes, via delegate_to targeting the\
    \ coolify VM (bypasses API IP whitelist):\n  1. Check if project exists \u2192\
    \ create if not\n  2. Check if application exists \u2192 create if not\n  3. Check\
    \ if GitHub deploy key exists for the repo \u2192 add if not\n     (uses coolify_deploy_ssh_pubkey,\
    \ already derived from server-key.pub)\n  4. Trigger deploy if application config\
    \ changed (changed_when on diff)\n  5. Wait for deployment status: finished\n\n\
    Domain derivation (no hardcoded TLD or host):\n  coolify_app_domain: \"http://{{\
    \ app_name }}.apps.{{ platform_domain }}\"\n  (http:// because nginx terminates\
    \ TLS; Traefik on coolify-apps serves HTTP\n  internally and handles TLS from\
    \ DNS-01 cert at its own entrypoint)\n\nReceipts written to .local/coolify/apps/{{\
    \ app_name }}.json for admin-auth\nparity.\n\n## What self-heals without LLM involvement\n\
    \nAfter these three changes, the full lifecycle is:\n\n  VM IP changes:\n    make\
    \ generate-platform-vars \u2192 regenerates all IP references by name lookup\n\
    \    make converge-nginx \u2192 nginx picks up new coolify-apps IP from topology\n\
    \    make converge-coolify \u2192 coolify-apps re-registered if IP changed\n\n\
    \  New app deployment:\n    make deploy-app app=education_wemeshup \u2192 runs\
    \ coolify_app_deploy role\n    GitHub deploy key added automatically\n    App\
    \ registered in Coolify with correct domain from platform_domain\n    Deployed\
    \ and health-checked\n\n  Certificate rotation:\n    Traefik on coolify-apps handles\
    \ DNS-01 renewal automatically\n    No nginx involvement, no HTTP-01 dependency\n\
    \nNothing in this path calls an LLM or requires a human to:\n  - patch nginx\n\
    \  - switch domain schemes\n  - relay API calls manually\n  - hardcode any IP\
    \ or hostname\n"
  tasks:
  - id: t1
    title: Bootstrap coolify-apps in coolify_runtime play
    status: pending
    files:
    - collections/ansible_collections/lv3/platform/roles/coolify_runtime/tasks/main.yml
    - playbooks/coolify.yml
  - id: t2
    title: Switch Traefik to DNS-01 cert resolver (Hetzner)
    status: pending
    files:
    - collections/ansible_collections/lv3/platform/roles/coolify_runtime/templates/docker-compose.yml.j2
    - collections/ansible_collections/lv3/platform/roles/coolify_runtime/defaults/main.yml
  - id: t3
    title: Write coolify_app_deploy role
    status: pending
    files:
    - collections/ansible_collections/lv3/platform/roles/coolify_app_deploy/ (new)
  - id: t4
    title: Add make deploy-app target
    status: pending
    files:
    - Makefile
  - id: t5
    title: Revert manual nginx patch via converge
    status: pending
    notes: 'Once t1 is complete (coolify-apps has Traefik on 443), run `make converge-nginx`
      to restore the correct upstream from the template. The manual nginx patch (http://10.10.10.70:80)
      is TEMPORARY and will be overwritten.

      '
  references:
  - postmortem: docs/postmortems/2026-04-28-coolify-0fork-deployment-and-education-wemeshup.md
  - adr: docs/adr/0340-coolify-vm-separation.md
  - template: publication/templates/proxmox-host.yml:2982
  - role: collections/ansible_collections/lv3/platform/roles/coolify_runtime/
surface_ownership:
  global_mutable_paths:
  - receipts/gate-bypasses/*
  - receipts/restic-backups/*
