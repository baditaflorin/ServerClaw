services:
  openbao-agent:
    image: docker.io/openbao/openbao:2.5.4
    container_name: woodpecker-openbao-agent
    user: "0:0"
    environment:
      BAO_SKIP_DROP_ROOT: "true"
    command:
      - "agent"
      - "-config=/openbao-agent/agent.hcl"
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "test -s /run/0mpc-secrets/woodpecker/runtime.env"
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - /opt/woodpecker/openbao:/openbao-agent:ro
      - /run/0mpc-secrets/woodpecker:/run/0mpc-secrets/woodpecker

  woodpecker-agent:
    image: docker.io/woodpeckerci/woodpecker-agent:v3.17.0
    container_name: woodpecker-agent
    restart: unless-stopped
    depends_on:
      openbao-agent:
        condition: service_healthy
    env_file:
      - /run/0mpc-secrets/woodpecker/runtime.env
    environment:
      WOODPECKER_SERVER: "10.10.10.20:9000"
      WOODPECKER_HOSTNAME: "docker-build-lv3-woodpecker-agent"
      WOODPECKER_AGENT_LABELS: "lv3=true,repo=*,backend=docker,host=docker-build-lv3"
      # Per-step memory cap, added 2026-10-28 (the ci.0exec agents of this VM have had it since 2026-10-22): every container
      # this agent starts is capped at 5 GiB and swap is forbidden, so a runaway step is OOM-killed inside its own cgroup
      # instead of stalling the VM. The agent's capacity (WOODPECKER_MAX_WORKFLOWS=2) is not set here: it comes from the
      # untracked OpenBao template /opt/woodpecker/openbao/runtime.env.ctmpl (hand-changed 2026-09-01); an entry in this
      # environment: block would override it.
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM: "5368709120"
      WOODPECKER_BACKEND_DOCKER_LIMIT_MEM_SWAP: "5368709120"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/woodpecker/data/agent:/etc/woodpecker
    networks:
      - default

networks:
  default:
    name: woodpecker_default
