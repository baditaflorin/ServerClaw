# DomainScope ports on VM101 docker-prod (10.10.10.30): who may reach them from the LAN (eth0).
# The same sources and ports are the docker_user group of VM 101 in config/network-policy/0docker.yaml; a test keeps the two equal.
# `port N` one TCP port per line; `allow A` one IPv4 address or CIDR per line (no wildcard, no 0.0.0.0). An empty allow list closes the ports.
# Measured 2026-10-21 (go-url-categorizer-api#2638), finding 13 of the 2026-10-19 audit (go-url-categorizer-api#2510).

port 23480   # prod web (frontend)
port 23481   # prod api
port 23482   # prod api-next: the backup upstream while a start-first deploy runs (published only during a deploy)
port 23483   # prod frontend-next: the web backup upstream while a start-first deploy runs (published only during a deploy)
port 23580   # staging web
port 23581   # staging api

allow 10.10.10.1      # the hypervisor (vmbr1): GET /health on 23481
allow 10.10.10.10     # VM104, the edge nginx: every prod and staging upstream
allow 10.10.10.20     # VM100: POST /api/v1/categorize (~1,600/day) and the Prometheus /metrics scrape (23481, 23581)
allow 10.10.10.30     # the VM itself (its own LAN address)
allow 172.20.0.0/14   # the VM's Docker bridges (172.20.0-5.0/24): container to published port
