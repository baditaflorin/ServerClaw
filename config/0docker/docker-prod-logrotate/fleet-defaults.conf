# Fleet tool logs only; distribution package policies own the OS logs.
/var/log/docker-safe-prune.log
/var/log/domainscope-disable-proxy-heavy-enrichers.log
/var/log/domainscope-api-events/*.log
/var/log/scanopy/*.log
{
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    maxsize 100M
    copytruncate
    sharedscripts
}
