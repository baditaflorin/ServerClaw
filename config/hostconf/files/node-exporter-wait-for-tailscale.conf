# pools session 2026-10-16: the exporter binds to the tailscale IP, which does not exist yet when it starts at boot; it crash-looped and hit the start limit (seen on 0own VM 660 after a reboot).
[Unit]
After=tailscaled.service network-online.target
Wants=network-online.target
StartLimitIntervalSec=0
[Service]
Restart=always
RestartSec=5
