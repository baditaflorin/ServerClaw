[Service]
# ingestion-only OpenObserve token from vault secret openobserve-ingest-0docker; read by the tool from env CA_OO_AUTH (keeps it out of argv)
EnvironmentFile=-/etc/fleet-container-audit/oo-auth.env
ExecStart=
ExecStart=/usr/local/bin/fleet-container-audit --services /var/lib/fleet-container-audit/services.json --oo-url=${CA_OO_URL} --prom=${CA_PROM}
