# Added 2026-11-03: woodpecker-exec-proxy@.socket listens on the tailnet address (ListenStream=100.64.0.5:%i) with BindToDevice=tailscale0. After a tailscaled restart the device tailscale0 exists about 5 ms
# after tailscaled reports "started" but has no address for another 0.3 s (journal of this host, 2026-11-02: "Started tailscaled.service" 12:34:59.942, "Creating WireGuard device" .946, "peerapi: serving on
# http://100.64.0.5" 12:35:00.252). The device drop-in woodpecker-exec-proxy-follows-tailscale0 (2026-11-02) starts the socket the moment the device is active, which is before the address exists, and without
# FreeBind the bind then fails with "Cannot assign requested address" and the socket stays dead again: the CI plane (ci.0exec.com) stood still for 71 minutes on 2026-11-02 for the first half of this.
# FreeBind=true (IP_FREEBIND) lets the bind succeed before the address exists; the connection works as soon as the address is back. BindToDevice=tailscale0 stays (the socket must never answer on another
# interface). Both parts are needed: scripts/tailscaled_restart_rig and docs/runbooks/tailscaled-restart-proxies.md ("0docker hypervisor") prove it on this host's systemd (252).
# It is a drop-in of the template, so every instance has it. It takes effect when a socket next starts; applying it restarts nothing.
# Remove this file and run `systemctl daemon-reload` to undo.
[Socket]
FreeBind=true
