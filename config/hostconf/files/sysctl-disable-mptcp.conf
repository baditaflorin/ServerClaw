# CVE-2026-98432 (2026-10-30), stop-gap: no new MPTCP sockets in this network namespace (the demonstrated exploit path needs an MPTCP listener).
# Not a fix: the kernel bug is not MPTCP-specific, and a container with its own network namespace keeps the kernel default (1).
# Remove this file (and the catalog entry) once every host runs a fixed kernel. A listener that is already open stays MPTCP until its service restarts.
net.mptcp.enabled = 0
