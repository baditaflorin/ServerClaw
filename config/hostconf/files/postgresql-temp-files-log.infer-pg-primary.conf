# Kept in git: baditaflorin/platform_server, config/hostconf (scripts/hostconf.py drift / apply). ADR 0495 (amendment of 2026-11-04).
# Log every temporary file of 64 MB or more with its size and the statement that wrote it. pg_stat_database counts 612 GB of temporary files (3,540 files, 177 MB on average)
# since 2026-10-31, but pg_stat_statements attributes only 3.8 GB of them: its table holds 5,000 entries and evicts (2,000+ deallocations), so the statements behind the spills
# are not known. With this setting each such file writes `temporary file: path "...", size N` and the STATEMENT (checked on Postgres 17: a 131 MB spill logged both, a 12 MB one
# logged nothing although pg_stat_database counted it). The limit is per file: a query that leaves several files under 64 MB is not logged.
# Expected volume: about ten lines an hour at the recent 1.9 GB an hour (177 MB average file), about 34 at the average of about 6 GB an hour since 2026-10-31 (612 GB, 3,540 files in
# 104 h), hundreds in a busy evening.
# A reload is enough (a superuser setting, no restart). It is -1 (off) today and not in postgresql.auto.conf, so nothing shadows this file and a plain `hostconf.py apply` works.
# Rollback: remove the file (the default -1 is back at the next reload).
log_temp_files = 64MB
