[Service]
# Precaution, NOT the cause of the 2026-10-14 backup failure (that was an agent session sending SIGTERM to the vzdump
# process at 03:33:52; see fleet-state hypervisor-0docker/README.md). The ct108-nightly backup runs in stop mode and keeps
# CT108 stopped with its rootfs mounted for minutes, and this timer fires `pct fstrim 108` every 5 minutes, so a trim
# can land inside that window (one failed at 03:33:36 that night). vzdump holds an exclusive flock on
# /var/run/vzdump.lock for the whole job, so skip the trim (as a success) while a backup runs.
ExecStart=
ExecStart=/usr/bin/flock -n -E 0 /var/run/vzdump.lock /usr/sbin/pct fstrim 108 --ignore-mountpoints 1
