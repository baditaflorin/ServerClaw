# Kept in git: baditaflorin/platform_server, config/hostconf (scripts/hostconf.py drift / apply). ADR 0495 (huge pages, S2).
# huge_pages = on: Postgres refuses to start when the huge pages are not there, instead of silently falling back to 4 kB pages as the default 'try' would. Needs
# vm.nr_hugepages = 12800 (91-postgres-hugepages.conf, sysctl-postgres-hugepages.infer-pg-primary), reserved while Postgres is stopped.
# NEEDS A RESTART: huge_pages is a postmaster setting. A reload leaves the running value at 'try' (pg_settings.pending_restart = t) and hostconf.py never restarts, so
# `apply` of this file while the server still runs with 'try' finds the setting not in effect, puts the file back and exits 5. It is therefore applied after the restart,
# when SHOW already says on, with the value seeded by ALTER SYSTEM before the stop: docs/runbooks/host-local-config.md ("Huge pages for infer-pg-primary").
# If the reservation is short the fallback is 'try' (start without huge pages, reserve at the next reboot), never a server that does not start.
huge_pages = on
