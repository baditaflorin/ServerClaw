# Kept in git: baditaflorin/platform_server, config/hostconf (scripts/hostconf.py drift / apply). ADR 0495 (huge pages, S2).
# Huge pages for the shared-memory segment of the production Postgres (VM701): shared_memory_size_in_huge_pages is 12628 (24.66 GiB); 12800 adds 172 pages = 344 MiB of margin,
# 25.0 GiB reserved. Page tables per backend fall from 43-48 MiB to about 0.1 MiB (3.7 GiB at the 140 processes of 2026-10-31 01:25Z, about 15 GiB in the connection-storm worst case).
# Reserved pages belong to nothing else and are never swapped: ballooning must stay off while they are reserved (VM701: balloon = memory = 66560 MiB).
# IMPORTANT: `hostconf.py apply` of a sysctl file runs `sysctl -p` at once. Apply this file ONLY with Postgres stopped: reserving while it runs counts the 24.6 GiB segment twice
# (it is already resident) and evicts the page cache of an I/O-bound 654 GB database. If the kernel cannot reserve all 12800 pages (fragmentation), `apply` finds the setting
# not in effect, puts the old file and the old page count back and exits 5.
# The window order is in docs/runbooks/host-local-config.md ("Huge pages for infer-pg-primary"); the restart setting is 99-huge-pages.conf.
vm.nr_hugepages = 12800
