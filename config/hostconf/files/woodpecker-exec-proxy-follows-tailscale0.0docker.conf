# Added 2026-11-02: when tailscale0 goes away and comes back, systemd stops woodpecker-exec-proxy@9000.socket (it is bound to the device through
# BindToDevice) and nothing starts it again, so every Woodpecker agent of ci.0exec.com is refused on 100.64.0.5:9000 until somebody does. On
# 2026-11-02 that took the whole CI plane down for 71 minutes (11:33Z to 12:44Z): the automatic start at 12:34:59 CET failed because the device was
# not active yet ("Bound to unit sys-subsystem-net-devices-tailscale0.device, but unit isn't active"), and the web API stayed up, so nothing looked wrong.
# A unit that is Wanted by the device is started when the device becomes active (the same thing SYSTEMD_WANTS does for a udev rule); tried on this
# host with a dummy interface and systemd 252: the unit stopped with the device and started when the device came back.
# Remove this file and run `systemctl daemon-reload` to undo.
[Unit]
Wants=woodpecker-exec-proxy@9000.socket
