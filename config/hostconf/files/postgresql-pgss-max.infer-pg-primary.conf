# Kept in git: baditaflorin/platform_server, config/hostconf (scripts/hostconf.py drift / apply). ADR 0495 (huge-pages rider).
# pg_stat_statements.max 5000 -> 20000. The table holds 5,000 entries and evicts (2,000+ deallocations since 2026-10-31), so pg_stat_statements attributes only 3.8 GB of the 612 GB
# of temporary files that pg_stat_database counts; with 20,000 entries the next 24 h of attribution are complete. It costs about 6 MB of shared memory (measured on Postgres 17:
# shared_memory_size 146 MB -> 152 MB), about 3 huge pages, inside the 172-page margin of vm.nr_hugepages = 12800. A clean shutdown keeps the statistics file (14 entries survived
# a restart that raised the maximum, checked on Postgres 17).
# NEEDS A RESTART: pg_stat_statements.max is a postmaster setting of a preloaded library. A reload leaves the running value at 5000 (pg_settings.pending_restart = t) and hostconf.py
# never restarts, so `apply` of this file while the server still runs with 5000 finds the setting not in effect, puts the file back and exits 5. It rides on the restart of the huge-pages
# window with the same order as huge_pages = on: the value seeded with ALTER SYSTEM before the stop, this file applied after the start (SHOW says 20000), then ALTER SYSTEM RESET:
# docs/runbooks/host-local-config.md ("Huge pages for infer-pg-primary"). Rollback: remove the file; 5000 is back at the next restart.
pg_stat_statements.max = 20000
