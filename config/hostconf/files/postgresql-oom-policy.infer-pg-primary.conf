# 2026-10-19 (claude.191a): at 11:31:13Z a burst of ~125 new connections exhausted RAM and the kernel OOM killer shot PostgreSQL's helper
# processes (checkpointer, io workers). systemd's default OOMPolicy=stop then stopped the whole unit and, with Restart=no, PostgreSQL stayed
# down for 21 minutes. With OOMPolicy=continue the unit keeps running and the postmaster does what it does whenever a child dies from a
# signal: terminate the other children, run crash recovery, accept connections again (about a minute). Nothing else changes.
# To undo: delete this file and run systemctl daemon-reload.
[Service]
OOMPolicy=continue
