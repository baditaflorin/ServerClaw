# Kept in git: baditaflorin/platform_server, config/hostconf (scripts/hostconf.py drift / apply). ADR 0495 (amendment of 2026-11-02).
# Bound the shared memory that parallel queries can take. On 2026-10-31 at 01:25Z parallel-query dynamic shared memory (/dev/shm) grew 24.5 GiB beyond the main
# segment inside one 30 s scrape and the kernel OOM-killed nine postgres processes; the cluster crash-recovered for about 25 s. The ceiling it came from was 24 workers at
# 4 per gather = 6 gathers, a parallel hash node being at most work_mem x hash_mem_multiplier x (workers + 1) = 512 MiB x 2 x 5 = 5 GiB for the role domainscope_app: 30 GiB.
# max_parallel_workers = 12 (was 24): at most 3 gathers of 4 workers at once. With work_mem 128 MiB for that role (98-work-mem-guardrails.conf sets 64 MiB for the others)
# a node is 128 MiB x 2 x 5 = 1.25 GiB (640 MiB for the others): 3 gathers x 1.25 GiB = 3.75 GiB of /dev/shm (7.5 GiB if every gather has two hash nodes), under the 10 GiB cap
# (config/0infer/pg-primary-memory). A bound for fully staffed gathers; the cap is the backstop for the rest.
# max_parallel_workers_per_gather = 4 again: S1 set it to 2 on 2026-11-01 and the 24 h acceptance found SELECT COUNT(*) FROM mv_domains_denormalized going from 0.42 s to 0.62 s
# (+48 %, workers per call 3.94 -> 1.97); only that knob is reverted, 12 and 150GB stay. temp_file_limit keeps a process that spills (work_mem is lower) from filling the data disk.
# A reload is enough: none of these settings needs a restart.
# Before the S1 apply of 2026-11-01 the two worker limits were ALTER SYSTEM values (4 and 24) in postgresql.auto.conf and temp_file_limit was unlimited; postgresql.auto.conf beats
# every conf.d file: docs/runbooks/host-local-config.md ("Postgres settings that postgresql.auto.conf shadows") gives the order that moved them here.
max_parallel_workers_per_gather = 4
max_parallel_workers = 12
temp_file_limit = 150GB
