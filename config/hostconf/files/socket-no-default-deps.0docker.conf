# Added 2026-10-13: these sockets are ordered After=tailscaled.service, and tailscaled starts after basic.target,
# which starts after sockets.target, which every socket unit is implicitly Before=. That is an ordering cycle; at the
# 2026-10-13 12:39 reboot systemd broke it by deleting start jobs (the sockets, and tailscaled itself), so the host came
# up without the tailnet proxies. Without default dependencies the socket is no longer ordered Before=sockets.target.
# Remove this file and run `systemctl daemon-reload` to undo.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
