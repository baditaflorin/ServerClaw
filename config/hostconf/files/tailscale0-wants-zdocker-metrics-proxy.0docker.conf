# Added 2026-11-03: zdocker-hypervisor-metrics-proxy.socket (the tailnet :9100 node-exporter proxy of this hypervisor) has FreeBind=true, so a restart of tailscaled brings it back by itself (it listened again at
# 12:34:59.957 on 2026-11-02, 15 ms after tailscaled started). It has Requires=tailscaled.service and is only WantedBy=sockets.target: when tailscaled is stopped, systemd stops the socket, and after a separate
# `systemctl stop tailscaled` and a later `start` (an apt upgrade done by hand, an operator's restart in two steps) nothing starts it again until somebody does (scripts/tailscaled_restart_rig, rows docker0-freebind).
# A unit that is Wanted by the device is started when the device becomes active (the same mechanism as the 0docker fix woodpecker-exec-proxy-follows-tailscale0 and the 0mcp tailscale0-wants-lv3-proxies); this
# socket has no BindToDevice and has FreeBind, so it does not depend on the device or on the address, the Wants= only pulls it up again.
# A second drop-in next to 10-wants-woodpecker-exec-proxy.conf: systemd adds up Wants=, and that file stays as it is.
# Remove this file and run `systemctl daemon-reload` to undo (the Wants= is a one-time pull when the device appears; applying this restarts nothing).
[Unit]
Wants=zdocker-hypervisor-metrics-proxy.socket
