# Managed in baditaflorin/fleet-edge-hardening hypervisor-0infer/. node-exporter binds the Tailscale IP;
# without this it lost a race with tailscaled at boot and hit the start limit (5 tries in 10 s).
[Unit]
After=tailscaled.service
Wants=tailscaled.service
StartLimitIntervalSec=0

[Service]
RestartSec=3
