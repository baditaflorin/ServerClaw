[Unit]
After=tailscaled.service
Requires=tailscaled.service
RequiresMountsFor=/srv/ct108-worktrees

[Service]
# nfsd binds the tailnet address set in /etc/nfs.conf (host=100.88.44.116), and tailscaled being started does not mean it has the address yet: at the
# 2026-10-19 23:36Z reboot nfsd failed with "unable to bind AF_INET TCP socket: Cannot assign requested address" and stayed failed. Wait for the
# address (at most 60 s), and retry a failed start.
ExecStartPre=-/bin/sh -c 'for i in $(seq 1 60); do ip -4 -o addr show dev tailscale0 2>/dev/null | grep -qF " 100.88.44.116/" && exit 0; sleep 1; done; exit 0'
Restart=on-failure
RestartSec=15
