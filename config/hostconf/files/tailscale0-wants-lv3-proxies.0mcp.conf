# Added 2026-11-02: the lv3 tailnet proxy sockets listen with BindToDevice=tailscale0, which makes systemd add BindsTo= and After= on the device unit
# sys-subsystem-net-devices-tailscale0.device. When tailscaled restarts, systemd stops the sockets (they Require tailscaled.service) and starts them again
# the moment tailscaled reports "started", which is before tailscale0 exists: the start job fails with "Bound to unit sys-subsystem-net-devices-tailscale0.device,
# but unit isn't active" and nothing starts the socket again. On 2026-11-02 12:33 that left all 19 of them dead for 8 hours (OpenBao, Postgres, Vaultwarden,
# Gitea, Woodpecker, ...). A unit that is Wanted by the device is started when the device becomes active (the same mechanism as SYSTEMD_WANTS of a udev
# rule, and the 0docker fix woodpecker-exec-proxy-follows-tailscale0); the sockets also need FreeBind=true (socket-free-bind) because the device appears
# before it has its address.
# The two node-exporter proxies (fleet_node_exporter_socket_proxies of operator-bastion) have no BindToDevice, so FreeBind alone keeps them across a tailscaled restart, but they are
# only WantedBy=sockets.target: after `systemctl stop tailscaled` and a later `start` nothing starts them (the rig in scripts/tailscaled_restart_rig shows it), so they are Wanted here too.
# One name per proxy of proxmox_tailscale_tcp_proxies in inventory/host_vars/proxmox-host.yml and per state-present proxy of operator-bastion in inventory/fleet-observability.yml;
# tests/test_tailscaled_restart_proxies.py keeps the lists equal.
# Remove this file and run `systemctl daemon-reload` to undo.
[Unit]
Wants=lv3-tailscale-proxy-coolify.socket
Wants=lv3-tailscale-proxy-gitea.socket
Wants=lv3-tailscale-proxy-matrix-synapse.socket
Wants=lv3-tailscale-proxy-mattermost.socket
Wants=lv3-tailscale-proxy-netbox.socket
Wants=lv3-tailscale-proxy-nomad.socket
Wants=lv3-tailscale-proxy-ntopng.socket
Wants=lv3-tailscale-proxy-openbao.socket
Wants=lv3-tailscale-proxy-openfga.socket
Wants=lv3-tailscale-proxy-plane.socket
Wants=lv3-tailscale-proxy-platform-context-api.socket
Wants=lv3-tailscale-proxy-portainer.socket
Wants=lv3-tailscale-proxy-postgres.socket
Wants=lv3-tailscale-proxy-semaphore.socket
Wants=lv3-tailscale-proxy-step-ca.socket
Wants=lv3-tailscale-proxy-typesense.socket
Wants=lv3-tailscale-proxy-vaultwarden.socket
Wants=lv3-tailscale-proxy-windmill.socket
Wants=lv3-tailscale-proxy-woodpecker.socket
Wants=woodpecker-0exec-build-metrics-proxy.socket
Wants=zmcp-runtime-general-metrics-proxy.socket
