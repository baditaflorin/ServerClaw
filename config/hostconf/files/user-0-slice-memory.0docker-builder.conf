# 2026-10-21 (claude.191a): a mutation-testing run started over ssh as root on the Builder (CT108) let one `go test` grow to 9.6 GB; with the
# hypervisor's guests already adding up to 112 % of its RAM that pushed the whole 0docker host into swap (load 257, ci.0exec.com and the builder's
# ssh unreachable for ~40 minutes). Everything a person or an agent starts through ssh runs in user-0.slice; the fleet's own services run in
# system.slice and the CI step containers in docker, so this limit only reaches interactive/ssh work. Measured over 14 days the whole builder's
# working set (cache excluded) was median 2.9, p99 5.3, max 7.2 GiB, so a legitimate `go build`/`go test` stays far below 5 GiB.
# MemoryHigh throttles (reclaim pressure) first, MemoryMax kills the biggest process of the slice, and no swap: a runaway is stopped inside
# the container instead of pushing the hypervisor's disks into swap.
# To undo: delete this file, run systemctl daemon-reload (the limits go back to infinity).
[Slice]
MemoryHigh=5G
MemoryMax=6G
MemorySwapMax=0
