# 2026-10-19 (claude.191a): same drop-in as on the production Postgres VM701 after its 11:31Z OOM outage. With the default OOMPolicy=stop (and Restart=no) systemd stops the whole
# unit when the kernel OOM killer shoots any process of the cgroup and the database stays down until someone notices; with continue the postmaster crash-recovers by itself.
# To undo: delete this file and run systemctl daemon-reload.
[Service]
OOMPolicy=continue
