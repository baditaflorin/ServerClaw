# Added 2026-11-02: a socket unit binds its address when it starts, and after a tailscaled restart tailscale0 has no 100.x address for the first second or
# so (tailscaled reports "started" before it creates the device and before the netmap assigns the address). The bind then fails with "Cannot assign
# requested address", the socket stays failed and nothing starts it again: on 2026-11-02 12:33 (tailscaled updated itself) zmcp-runtime-general-metrics-proxy.socket
# stayed dead for 8 hours. woodpecker-0exec-build-metrics-proxy.socket already had FreeBind=true and came back at once in the same restart.
# FreeBind=true (IP_FREEBIND) lets the bind succeed before the address exists; the connection works as soon as the address is back.
# Remove this file and run `systemctl daemon-reload` to undo (it takes effect at the next start of the socket; applying it restarts nothing).
[Socket]
FreeBind=true
