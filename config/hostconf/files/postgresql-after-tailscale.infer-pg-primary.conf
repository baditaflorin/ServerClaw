# 2026-10-17: PostgreSQL listens on the tailnet address 100.64.0.22, so start it after tailscaled has assigned it
# (postgres only warns about an unbindable listen address, it would silently not serve the tailnet).
[Unit]
After=tailscaled.service
Wants=tailscaled.service
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 40 ]; do ip -4 addr show tailscale0 2>/dev/null | grep -q 100.64.0.22 && exit 0; i=$((i+1)); sleep 1; done; exit 0'
