# Added 2026-10-12 after the 14:45Z OOM outage (69 nginx processes, Restart=no, OOMPolicy=stop).
# Restart the unit if it dies, and do not stop the whole unit when the kernel OOM-kills one worker.
# Rollback: rm this file; systemctl daemon-reload
[Service]
Restart=on-failure
RestartSec=3
OOMPolicy=continue
