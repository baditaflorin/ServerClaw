# Added 2026-10-19 (claude.191a), the same override as on the gateway (VM104, 2026-10-12 after its 14:45Z OOM outage: Restart=no, OOMPolicy=stop).
# This nginx carries the SSH jump ports (11022-11025) and 443 of the 0docker VMs: if it died, every unattended ssh path into them would be gone until someone logged in
# another way. Restart the unit if it dies, and do not stop the whole unit when the kernel OOM-kills one worker.
# Rollback: rm this file; systemctl daemon-reload
[Service]
Restart=on-failure
RestartSec=3
OOMPolicy=continue
