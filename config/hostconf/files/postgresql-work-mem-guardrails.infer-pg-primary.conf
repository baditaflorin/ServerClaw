# Kept in git: baditaflorin/platform_server, config/hostconf (scripts/hostconf.py drift / apply). ADR 0495.
# work_mem 256 MB -> 64 MB. One parallel hash node may use work_mem x hash_mem_multiplier (2) x (workers + 1) of shared memory: 256 MB with 4 workers is 2.5 GiB per node
# (5.0 GiB for the role domainscope_app, which carries its own 512 MB) for each of up to 6 simultaneous gathers, against the 24.5 GiB of parallel-query shared memory
# seen at the 2026-10-31 01:25Z OOM. With 64 MB and 2 workers a node is 384 MB; the role setting for domainscope_app (128 MB, 768 MB per node) lives in the application repository.
# A hash join that outgrows work_mem spills to the data disk (3 temp files, 2.1 GB, since 01:25Z, so spills are rare today); temp_file_limit in
# 98-parallel-guardrails.conf caps what one process may spill.
# Separate file on purpose: applied 30 minutes after 98-parallel-guardrails.conf, so a regression is attributable to one knob. A reload is enough.
# Until now this was an ALTER SYSTEM value (256MB) in postgresql.auto.conf, which beats every conf.d file: docs/runbooks/host-local-config.md
# ("Postgres settings that postgresql.auto.conf shadows") gives the order that moves it here.
work_mem = 64MB
