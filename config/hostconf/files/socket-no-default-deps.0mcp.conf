# Added 2026-10-13: this socket is ordered After=tailscaled.service, and tailscaled starts after basic.target, which starts
# after sockets.target, which every socket unit is implicitly Before=. That is an ordering cycle; at boot systemd breaks it
# by deleting start jobs (it deleted the proxy sockets and tailscaled itself on the 0docker hypervisor on 2026-10-13).
# Without default dependencies the socket is no longer ordered Before=sockets.target.
# Remove this file and run `systemctl daemon-reload` to undo.
[Unit]
DefaultDependencies=no
Conflicts=shutdown.target
Before=shutdown.target
