# /etc/sysctl.d/90-fleet-neigh-gc.conf
# Raise the kernel neighbour (ARP / NDP) table GC thresholds on dockerhost (ubuntuvm1, 10.10.10.20).
#
# Why: ~460 containers on ~460 docker bridge/netns share ONE global kernel neighbour table. The thresholds
#   below apply to the sum over all network namespaces (they exist only in the init-netns "default" dir; there is
#   nothing per interface or per container). Measured 2026-10-18 06:45-07:00Z: 940-1022 live entries
#   (host netns ~410, mostly Prometheus in host network mode reaching container IPs, plus ~540 in container netns)
#   against the kernel defaults 128/512/1024. That keeps the table above gc_thresh2 (forced GC every ~5 s that
#   deletes ~100 live entries which are then re-resolved; 115k forced_gc_runs) and within ~3% of gc_thresh3, so any
#   burst (a fleet-runner deploy, the 30 s Prometheus scrape cycle, the daily 02:00Z scanopy discovery) logs
#   "neighbour: arp_cache: neighbor table overflow!" (50-175 per hour since 2026-10-17 ~16:00Z) and drops packets.
#
# Sizing: working set ~1000 and growing with the container count. thresh2 = 4x and thresh3 = 8x the measured peak.
#   Cost is ~0.3 KB per entry, so the full 8192 is about 2.5 MB.
#
# Applied: 2026-10-18 by Claude Code (agent session) on Florin's request.
# Previous values (kernel defaults) for both ipv4 and ipv6: gc_thresh1=128 gc_thresh2=512 gc_thresh3=1024.
# Rollback: delete this file, then sysctl -w net.ipv4.neigh.default.gc_thresh3=1024 ... gc_thresh2=512 ... gc_thresh1=128
#   (same for net.ipv6.neigh.default). Backup of /etc/sysctl.d before this change: /var/backups/arp-fix-20261018T065539Z/
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh1 = 2048
net.ipv6.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh1 = 2048
