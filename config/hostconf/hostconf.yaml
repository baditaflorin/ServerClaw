    src: tailscale0-wants-zdocker-metrics-proxy.0docker.conf
    purpose: >-
      The 0docker hypervisor's tailnet device tailscale0 Wants=zdocker-hypervisor-metrics-proxy.socket (the tailnet :9100 node-exporter proxy), so it is started again when the device comes
      back. The socket has FreeBind=true and survives a restart of tailscaled, but it is only WantedBy=sockets.target: after a separate stop and start of tailscaled nothing started it.
      A second drop-in next to woodpecker-exec-proxy-follows-tailscale0 (systemd adds up Wants=).
    expect:
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: zdocker-hypervisor-metrics-proxy.socket}

  node-exporter-after-tailscale:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/10-after-tailscale.conf
    src: node-exporter-after-tailscale.conf
    purpose: >-
      node-exporter binds the Tailscale address: start it after tailscaled and without a start limit, because at boot it lost the race with tailscaled and
      hit the start limit (5 tries in 10 s) and nothing scraped the host. Rolled out 2026-10-15 to the hypervisors and the 0infer VMs; also recorded in
      fleet-edge-hardening hypervisor-0infer/.
    expect:
      - {systemd: prometheus-node-exporter.service, property: After, contains: tailscaled.service}

  node-exporter-wait-for-tailscale:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/10-wait-for-tailscale.conf
    src: node-exporter-wait-for-tailscale.conf
    purpose: >-
      Pools session 2026-10-16: the exporter binds to the Tailscale IP, which does not exist yet when it starts at boot; it crash-looped and hit the start
      limit (seen on 0own VM 660 after a reboot). Wait for tailscaled and network-online, no start limit, restart every 5 s.
    expect:
      - {systemd: prometheus-node-exporter.service, property: Restart, value: always}

  node-exporter-retry-until-tailnet:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/10-retry-until-tailnet.conf
    src: node-exporter-retry-until-tailnet.conf
    purpose: >-
      Added 2026-10-13 on the 0docker gateway: the exporter listens on the tailnet address, which does not exist until tailscaled is up; the stock unit gave
      up for good at the 2026-10-13 reboot and nothing scraped the host. Retry every 15 s without a start limit.
    expect:
      - {systemd: prometheus-node-exporter.service, property: Restart, value: always}

  node-exporter-restart-always:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/restart-always.conf
    src: node-exporter-restart-always.conf
    purpose: >-
      node-exporter on the monitoring VM restarts whatever the exit reason, every 5 s (added 2026-10-14).
    expect:
      - {systemd: prometheus-node-exporter.service, property: Restart, value: always}

  sysctl-fleet-neigh-gc:
    dest: /etc/sysctl.d/90-fleet-neigh-gc.conf
    src: sysctl-fleet-neigh-gc.conf
    purpose: >-
      Raise the kernel neighbour table GC thresholds on dockerhost: about 460 containers share one global table (940-1022 live entries against the defaults
      128/512/1024), which overflowed ('neighbor table overflow', 50-175 per hour on 2026-10-17/18) and dropped packets. Applied 2026-10-18; the file header
      has the measurements and the rollback.
    expect:
      - {sysctl: net.ipv4.neigh.default.gc_thresh3, value: "8192"}

  sysctl-docker-fleet:
    dest: /etc/sysctl.d/99-docker-fleet.conf
    src: sysctl-docker-fleet.conf
    purpose: >-
      dockerhost kernel limits for about 460 containers: kernel.threads-max 2000000 (the same thread-limit fix as sysctl-hotplug-threads-max, written here
      on 2026-05-22 without a comment), pid_max, vm.max_map_count and the inotify limits.
    expect:
      - {sysctl: kernel.threads-max, value: "2000000"}

  docker-limits:
    dest: /etc/systemd/system/docker.service.d/limits.conf
    src: docker-limits.conf
    purpose: >-
      dockerd runs with LimitNOFILE=65535 on dockerhost (about 460 containers).
    expect:
      - {systemd: docker.service, property: LimitNOFILE, value: "65535"}

  fstrim-hourly:
    dest: /etc/systemd/system/fstrim.timer.d/0docker-hourly.conf
    src: fstrim-hourly.conf
    purpose: >-
      fstrim on dockerhost runs HOURLY (up to 5 minutes of random delay, one minute of accuracy) instead of weekly. The qcow2 of VM 100 on the 0docker hypervisor only
      shrinks when the guest trims, and the hypervisor's root file system fell under its 14 % admission hold on 2026-10-22; another session replaced the daily drop-in
      (kept on the host as 0docker-daily.conf.pre-hourly-20261022T070928Z) at 07:09Z and this entry adopts the live file byte for byte. The check reads the random delay,
      because systemd prints the calendar normalised.
    expect:
      - {systemd: fstrim.timer, property: RandomizedDelayUSec, value: 5min}

  fleet-container-audit-oo-auth:
    dest: /etc/systemd/system/fleet-container-audit.service.d/oo-auth.conf
    src: fleet-container-audit-oo-auth.conf
    purpose: >-
      The fleet container audit on dockerhost runs with its OpenObserve ingest settings from an EnvironmentFile; the ingestion-only token stays on the host
      (the tool reads it from CA_OO_AUTH).
    expect:
      - {systemd: fleet-container-audit.service, property: ExecStart, contains: "path=/usr/local/bin/fleet-container-audit"}

  ct108-fstrim-skip-during-vzdump:
    dest: /etc/systemd/system/0docker-ct108-fstrim.service.d/10-skip-during-vzdump.conf
    src: ct108-fstrim-skip-during-vzdump.conf
    purpose: >-
      The 5-minute `pct fstrim 108` on the 0docker hypervisor is skipped (as a success) while a vzdump holds /var/run/vzdump.lock: the nightly CT108 backup
      runs in stop mode and a trim could land inside it. A precaution (2026-10-14); also recorded in fleet-edge-hardening hypervisor-0docker/ct108-fstrim.
    expect:
      - {systemd: 0docker-ct108-fstrim.service, property: ExecStart, contains: /var/run/vzdump.lock}

  nftables-infer-preload:
    dest: /etc/systemd/system/nftables.service.d/10-infer.conf
    src: nftables-infer-preload.conf
    purpose: >-
      The 0infer hypervisor loads its infer nftables preload before nftables starts.
    expect:
      - {systemd: nftables.service, property: ExecStartPre, contains: "path=/usr/local/sbin/infer-nftables-preload"}

  nftables-destroy-table:
    dest: /etc/systemd/system/nftables.service.d/override.conf
    src: nftables-destroy-table.conf
    purpose: >-
      On runtime-general-lv3 stopping nftables destroys table inet filter instead of flushing the whole ruleset (so Docker's tables stay).
    expect:
      - {systemd: nftables.service, property: ExecStop, contains: destroy}

  proxmox-incident-control-sync-metric:
    dest: /etc/systemd/system/proxmox-incident-control-sync.service.d/metric.conf
    src: proxmox-incident-control-sync-metric.conf
    purpose: >-
      proxmox-incident-control-sync records proxmox_incident_sync_last_success_timestamp_seconds after every successful run (a textfile metric the alerts
      read).
    expect:
      - {systemd: proxmox-incident-control-sync.service, property: ExecStartPost, contains: "path=/usr/local/libexec/proxmox-incident-control-metric.sh"}

  proxmox-incident-control-restore-verify-metric:
    dest: /etc/systemd/system/proxmox-incident-control-restore-verify.service.d/metric.conf
    src: proxmox-incident-control-restore-verify-metric.conf
    purpose: >-
      proxmox-incident-control-restore-verify records proxmox_incident_restore_verify_last_success_timestamp_seconds after every successful run (a textfile
      metric the alerts read).
    expect:
      - {systemd: proxmox-incident-control-restore-verify.service, property: ExecStartPost, contains: "path=/usr/local/libexec/proxmox-incident-control-metric.sh"}

  woodpecker-exec-proxy-9100-target:
    dest: /etc/systemd/system/woodpecker-exec-proxy@9100.service.d/override.conf
    src: woodpecker-exec-proxy-9100-target.conf
    purpose: >-
      The woodpecker exec proxy instance 9100 on the 0docker hypervisor forwards to the hypervisor's node exporter at 10.10.10.1:9100.
    expect:
      - {systemd: woodpecker-exec-proxy@9100.service, property: ExecStart, contains: 10.10.10.1:9100}

  nfs-server-after-tailscale:
    dest: /etc/systemd/system/nfs-server.service.d/ct108-worktrees.conf
    src: nfs-server-after-tailscale.conf
    purpose: >-
      The NFS server of the 0own build worker (it exports the CT108 worktrees) starts after tailscaled and the worktrees mount, waits for its tailnet
      address and retries a failed start: at the 2026-10-19 23:36Z reboot nfsd failed to bind the address it had not been given yet and stayed failed.
    expect:
      - {systemd: nfs-server.service, property: Requires, contains: tailscaled.service}
      - {systemd: nfs-server.service, property: Restart, value: on-failure}

  rpcbind-socket-v4-only:
    dest: /etc/systemd/system/rpcbind.socket.d/ct108-nfs-v4-only.conf
    src: rpcbind-socket-loopback-only.conf
    purpose: >-
      rpcbind on the 0own build worker listens on loopback and its unix socket only (the CT108 worktrees are exported over NFSv4 alone).
    expect:
      - {systemd: rpcbind.socket, property: Listen, contains: 127.0.0.1:111}

  caddy-after-tailscale:
    dest: /etc/systemd/system/caddy.service.d/10-after-tailscale.conf
    src: caddy-after-tailscale.conf
    purpose: >-
      Caddy on the Hermes agent VM starts after tailscaled and network-online (it serves on the tailnet).
    expect:
      - {systemd: caddy.service, property: After, contains: tailscaled.service}

  hermes-gateway-release-path:
    dest: /etc/systemd/system/hermes-gateway.service.d/60-reliability-release.conf
    src: hermes-gateway-release-path.conf
    purpose: >-
      hermes-gateway runs from the reliability release (PYTHONPATH points at releases/reliability-5c2eebfcc).
    expect:
      - {systemd: hermes-gateway.service, property: Environment, contains: "PYTHONPATH=/home/hermes/.hermes/releases/reliability-5c2eebfcc"}

  logrotate-timer-hourly:
    dest: /etc/systemd/system/logrotate.timer.d/override.conf
    src: logrotate-timer-hourly.conf
    purpose: >-
      logrotate runs hourly on the 0docker gateway (the access logs reach 250 MB within a day on a storm day), with 5 minutes of accuracy and random delay
      (the check reads the accuracy, because systemd prints the calendar normalised).
    expect:
      - {systemd: logrotate.timer, property: AccuracyUSec, value: 5min}

  sysctl-fleet-swap:
    dest: /etc/sysctl.d/99-fleet-swap.conf
    src: sysctl-fleet-swap.conf
    purpose: >-
      vm.swappiness=20 on the 0mcp guests that have swap (2026-10-13).
    expect:
      - {sysctl: vm.swappiness, value: "20"}

  sysctl-docker-runtime-swap:
    dest: /etc/sysctl.d/99-docker-runtime-swap.conf
    src: sysctl-docker-runtime-swap.conf
    purpose: >-
      vm.swappiness=20 on the 0mcp Docker host (2026-10-12).
    expect:
      - {sysctl: vm.swappiness, value: "20"}

  sysctl-0mcp-ip-forwarding:
    dest: /etc/sysctl.d/99-0mcp-ip-forwarding.conf
    src: sysctl-ip-forward.conf
    purpose: >-
      IPv4 forwarding on the 0mcp hypervisor (guest routing).
    expect:
      - {sysctl: net.ipv4.ip_forward, value: "1"}

  sysctl-0mpc-ip-forwarding:
    dest: /etc/sysctl.d/99-0mpc-ip-forwarding.conf
    src: sysctl-ip-forward.conf
    purpose: >-
      IPv4 forwarding on the 0mcp hypervisor (guest routing): the same line also lives in 99-0mcp-ip-forwarding.conf under the older, misspelled name
    expect:
      - {sysctl: net.ipv4.ip_forward, value: "1"}

  sysctl-infer-proxmox-forwarding:
    dest: /etc/sysctl.d/99-infer-proxmox-forwarding.conf
    src: sysctl-ip-forward.conf
    purpose: >-
      IPv4 forwarding on the 0infer hypervisor (guest routing).
    expect:
      - {sysctl: net.ipv4.ip_forward, value: "1"}

  sysctl-tailscale-forwarding:
    dest: /etc/sysctl.d/99-tailscale.conf
    src: sysctl-tailscale-forwarding.conf
    purpose: >-
      IPv4 and IPv6 forwarding on the 0docker hypervisor (it is a Tailscale subnet router).
    expect:
      - {sysctl: net.ipv4.ip_forward, value: "1"}

  sysctl-disable-ipv6:
    dest: /etc/sysctl.d/99-disable-ipv6.conf
    src: sysctl-disable-ipv6.conf
    purpose: >-
      IPv6 is disabled on the 0docker gateway VM.
    expect:
      - {sysctl: net.ipv6.conf.all.disable_ipv6, value: "1"}

  sysctl-disable-mptcp:
    dest: /etc/sysctl.d/99-disable-mptcp.conf
    src: sysctl-disable-mptcp.conf
    purpose: >-
      CVE-2026-98432 stop-gap (2026-10-30): the demonstrated exploit needs an MPTCP listener, and every Go program since 1.24 opens its listeners as MPTCP when
      the kernel allows it. net.mptcp.enabled=0 makes new sockets plain TCP in the host network namespace. It does not fix the kernel bug, it does not reach
      containers that have their own network namespace, and an open listener stays MPTCP until its service restarts. Remove once the fixed kernel runs everywhere.
    expect:
      - {sysctl: net.mptcp.enabled, value: "0"}

  sysctl-tailscale-rpfilter:
    dest: /etc/sysctl.d/99-tailscale-rpfilter.conf
    src: sysctl-tailscale-rpfilter.conf
    purpose: >-
      Reverse-path filtering is off on the Hermes agent VM: with a strict rp_filter the return packets of tailnet peers reaching services bound on
      tailscale0 are dropped when the default route is another interface (inbound timeouts).
    expect:
      - {sysctl: net.ipv4.conf.all.rp_filter, value: "0"}

  aivoicebus-observer:
    dest: /etc/systemd/system/aivoicebus.service.d/observer.conf
    src: aivoicebus-observer.conf
    purpose: >-
      The aivoicebus service on the hypervisors loads its observer token as a systemd credential from /etc/aivoicebus/observer-token; the token itself stays
      on the host (the file names the path only; systemctl prints credentials as [unprintable], so the check only proves that one is configured).
    expect:
      - {systemd: aivoicebus.service, property: LoadCredential, contains: "LoadCredential=[unprintable]"}

