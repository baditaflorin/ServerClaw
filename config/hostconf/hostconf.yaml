    src: woodpecker-exec-proxy-follows-tailscale0.0docker.conf
    purpose: >-
      The 0docker hypervisor's tailnet device tailscale0 Wants=woodpecker-exec-proxy@9000.socket, so that the socket is started again when the device comes back.
