    src: tailscale0-wants-lv3-proxies.0mcp.conf
    purpose: >-
      The 0mcp hypervisor's tailnet device tailscale0 Wants= all 19 lv3-tailscale-proxy-*.socket and the two node-exporter proxy sockets, so each is started again when the device comes back. They listen with
      BindToDevice=tailscale0, so systemd stops them with the device and the automatic start fails ("Bound to unit sys-subsystem-net-devices-tailscale0.device, but
      unit isn't active") because tailscaled reports started before it has created the device: on 2026-11-02 12:33 (tailscaled updated itself) that left OpenBao, Postgres,
      Vaultwarden, Gitea, Woodpecker and 14 more proxies dead for 8 hours. Needs socket-free-bind (the device appears before it has its address).
    expect:
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-coolify.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-gitea.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-matrix-synapse.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-mattermost.socket}
