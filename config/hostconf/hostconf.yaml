# Host-local OS configuration under version control: the files that must exist on a host, and the setting each one has to produce.
# Edit this file and config/hostconf/files/ in a PR; scripts/hostconf.py drift tells how the live hosts differ, scripts/hostconf.py apply
# writes the files (reload only, never a restart). README.md in this directory says how to add a file or a host.
#
# files: the catalog. dest is where the file goes on the host (only systemd drop-ins, /etc/sysctl.d/NN-*.conf and Postgres conf.d/NN-*.conf are
#        possible), src is the content under files/, purpose says why it exists, expect is the effective setting that proves it works
#        (systemctl show, sysctl -n, Postgres SHOW). mode/owner/group default to 0644 root:root.
# hosts: id -> ssh alias, the name `hostname` prints there (apply refuses another machine), and the catalog ids the host carries (none is fine when only the baseline
#        applies to it). `sudo: false` for a host where the ssh user is root and there is no sudo.
# baseline: floors EVERY host in this file must meet, checked by `drift` whether or not the host carries a file. A host already above a floor carries nothing (a file
#        with a fixed value would lower it); a host below it gets the `fix` catalog file listed. Every machine of the fleet belongs in `hosts`: add a new VM here when it is created.
version: 1

baseline:
  - {sysctl_min: kernel.threads-max, value: "131072", fix: sysctl-hotplug-threads-max}

# inventory: the hypervisors whose VMs and containers `drift --all` lists. A guest that is neither a host above (`vm:` names it) nor exempt here is reported as UNMANAGED, so a machine
# created by hand (a clone of a template, a restore) is noticed instead of keeping a default nobody looked at.
inventory:
  hypervisors: [pve-0mcp, pve-0infer, bastion, pve-0own, pve-0pipe]
  exempt:
    - {hypervisor: pve-0mcp, id: 9109, why: "outline-restore-canary, a stopped LXC container for the Outline restore drill; a container shares the hypervisor's kernel limits, which the baseline checks"}
    - {hypervisor: pve-0infer, id: 8101, why: "standby-docker-prod, a stopped standby copy of docker-prod restored from PBS#2 (never started by hand); its limit comes from docker-prod's disk and is checked the next time it runs"}

files:
  nginx-restart-policy.webgateway:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    src: nginx-restart-policy.webgateway.conf
    purpose: >-
      nginx on the 0docker gateway VM (VM104) restarts when it dies and is not stopped as a whole when the kernel OOM-kills one worker.
      Added after the 2026-10-12 14:45Z outage (69 workers, Restart=no and the default OOMPolicy=stop kept the public edge down).
    expect:
      - {systemd: nginx.service, property: Restart, value: on-failure}
      - {systemd: nginx.service, property: OOMPolicy, value: continue}
  nginx-restart-policy.nginx-lv3:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    src: nginx-restart-policy.nginx-lv3.conf
    purpose: >-
      The same restart policy for nginx on the 0mcp gateway VM (nginx-lv3), which had Restart=no and OOMPolicy=stop like the 0docker gateway did
      before its 2026-10-12 outage. Found by the restart-policy scan of 2026-10-19.
    expect:
      - {systemd: nginx.service, property: Restart, value: on-failure}
      - {systemd: nginx.service, property: OOMPolicy, value: continue}
  nginx-restart-policy.bastion:
    dest: /etc/systemd/system/nginx.service.d/override.conf
    src: nginx-restart-policy.bastion.conf
    purpose: >-
      The same restart policy for nginx on the 0docker hypervisor, which carries 443 and the SSH jump ports 11022-11025 into every 0docker VM:
      if it died, every unattended ssh path into them would be gone. Found by the restart-policy scan of 2026-10-19.
    expect:
      - {systemd: nginx.service, property: Restart, value: on-failure}
      - {systemd: nginx.service, property: OOMPolicy, value: continue}

  user-0-slice-memory.0docker-builder:
    dest: /etc/systemd/system/user-0.slice.d/50-memory.conf
    src: user-0-slice-memory.0docker-builder.conf
    purpose: >-
      Everything started through ssh as root on the Builder (CT108) shares 6 GiB and no swap, so a runaway `go test` (a mutation run reached 9.6 GB
      on 2026-10-21 and took the 0docker hypervisor into swap, load 257) dies inside the container. The fleet's services (system.slice) and the CI
      step containers (docker, limited per step by the agents) are not in this slice.
    expect:
      - {systemd: user-0.slice, property: MemoryHigh, value: "5368709120"}
      - {systemd: user-0.slice, property: MemoryMax, value: "6442450944"}
      - {systemd: user-0.slice, property: MemorySwapMax, value: "0"}

  postgresql-oom-policy.infer-pg-primary:
    dest: /etc/systemd/system/postgresql@18-main.service.d/20-oom-policy.conf
    src: postgresql-oom-policy.infer-pg-primary.conf
    purpose: >-
      The production DomainScope Postgres (VM701) keeps running when the kernel OOM-kills one of its processes: the postmaster crash-recovers in
      about a minute instead of systemd stopping the whole unit (OOMPolicy=stop with Restart=no kept it down 21 minutes on 2026-10-19 11:31Z).
    expect:
      - {systemd: postgresql@18-main.service, property: OOMPolicy, value: continue}
  postgresql-oom-policy.postgres-lv3:
    dest: /etc/systemd/system/postgresql@17-main.service.d/20-oom-policy.conf
    src: postgresql-oom-policy.postgres-lv3.conf
    purpose: >-
      The same OOMPolicy=continue for PostgreSQL 17 on the 0mcp database VM (postgres-lv3), found by the restart-policy scan of 2026-10-19.
    expect:
      - {systemd: postgresql@17-main.service, property: OOMPolicy, value: continue}

  postgresql-after-tailscale.infer-pg-primary:
    dest: /etc/systemd/system/postgresql@18-main.service.d/10-after-tailscale.conf
    src: postgresql-after-tailscale.infer-pg-primary.conf
    purpose: >-
      The production DomainScope Postgres listens on its tailnet address (100.64.0.22): start it after tailscaled has assigned it, because
      Postgres only warns about an address it cannot bind and would silently not serve the tailnet. Added by the 2026-10-17 cutover.
    expect:
      - {systemd: postgresql@18-main.service, property: After, contains: tailscaled.service}

  postgresql-log-connections.infer-pg-primary:
    dest: /etc/postgresql/18/main/conf.d/97-log-connections.conf
    src: postgresql-log-connections.infer-pg-primary.conf
    mode: "0640"
    group: postgres
    purpose: >-
      The production DomainScope Postgres logs every connection and its authorization, so the source of a burst of new connections (about 125 in
      15 s killed it on 2026-10-19 11:31Z) can be traced afterwards. Was an ALTER SYSTEM in postgresql.auto.conf, which no file or review showed.
    expect:
      - {pg_setting: log_connections, cluster: "18/main", value: "receipt,authorization"}

  postgresql-temp-files-log.infer-pg-primary:
    dest: /etc/postgresql/18/main/conf.d/98-temp-files-log.conf
    src: postgresql-temp-files-log.infer-pg-primary.conf
    mode: "0640"
    group: postgres
    purpose: >-
      The production DomainScope Postgres (VM701) logs every temporary file of 64 MB or more with its size and the statement (ADR 0495, amendment of 2026-11-04). pg_stat_database counts 612 GB of
      temporary files (3,540 files, 177 MB on average) since 2026-10-31, but pg_stat_statements attributes only 3.8 GB: its table holds 5,000 entries and evicts (2,000+ deallocations), so the
      statements behind the spills are unknown. log_temp_files is -1 (off) today and not in postgresql.auto.conf, so nothing shadows this file and a plain `hostconf.py apply` works (reload only, no
      restart). Expected volume: about ten to a few tens of log lines an hour, hundreds in a busy evening. Rollback: remove the file.
    expect:
      - {pg_setting: log_temp_files, cluster: "18/main", value: "64MB"}
  postgresql-parallel-guardrails.infer-pg-primary:
    dest: /etc/postgresql/18/main/conf.d/98-parallel-guardrails.conf
    src: postgresql-parallel-guardrails.infer-pg-primary.conf
    mode: "0640"
    group: postgres
    purpose: >-
      Bounds the shared memory that parallel queries of the production DomainScope Postgres (VM701) can take: at most 12 workers in total (was 24), 4 per gather (S1 set 2 on 2026-11-01 and the
      24 h acceptance reverted that knob: SELECT COUNT(*) FROM mv_domains_denormalized went from 0.42 s to 0.62 s, workers per call 3.94 -> 1.97), and 150 GB of temporary files per process (was
      unlimited). With 12 workers at most 3 gathers of 4 run at once: 128 MiB x 2 x 5 = 1.25 GiB per parallel hash node for the role domainscope_app, 3.75 GiB of /dev/shm in all, under the 10 GiB
      cap (ADR 0495, amendment of 2026-11-02). Added after the 2026-10-31 01:25Z global OOM, when parallel-query dynamic shared memory (/dev/shm) grew 24.5 GiB beyond the main segment in one
      scrape interval and the kernel killed nine postgres processes. Before the S1 apply of 2026-11-01 the two worker limits were ALTER SYSTEM values in postgresql.auto.conf (temp_file_limit was at its
      default), and postgresql.auto.conf overrides conf.d: the apply runbook (docs/runbooks/host-local-config.md) must run ALTER SYSTEM RESET on each name after the file is written, as for
      97-log-connections, or this file is shadowed and `drift` reports the setting not in effect.
    expect:
      - {pg_setting: max_parallel_workers_per_gather, cluster: "18/main", value: "4"}
      - {pg_setting: max_parallel_workers, cluster: "18/main", value: "12"}
      - {pg_setting: temp_file_limit, cluster: "18/main", value: "150GB"}
  postgresql-work-mem-guardrails.infer-pg-primary:
    dest: /etc/postgresql/18/main/conf.d/98-work-mem-guardrails.conf
    src: postgresql-work-mem-guardrails.infer-pg-primary.conf
    mode: "0640"
    group: postgres
    purpose: >-
      The global work_mem of the production DomainScope Postgres (VM701) goes from 256 MB to 64 MB, so one parallel hash node (work_mem x hash_mem_multiplier x workers + 1) stops
      reaching 2.5 GiB (5.0 GiB for the role that carries 512 MB) in each of 6 simultaneous gathers. Added after the 2026-10-31 01:25Z global OOM (parallel-query shared memory, ADR 0495).
      A file of its own because it is applied 30 minutes after 98-parallel-guardrails.conf, so a regression is attributable to one knob. work_mem is an ALTER SYSTEM value in
      postgresql.auto.conf today, which overrides conf.d: the apply runbook (docs/runbooks/host-local-config.md) must run ALTER SYSTEM RESET work_mem after the file is written, as for
      97-log-connections, or this file is shadowed and `drift` reports the setting not in effect.
    expect:
      - {pg_setting: work_mem, cluster: "18/main", value: "64MB"}
  postgresql-huge-pages.infer-pg-primary:
    dest: /etc/postgresql/18/main/conf.d/99-huge-pages.conf
    src: postgresql-huge-pages.infer-pg-primary.conf
    mode: "0640"
    group: postgres
    purpose: >-
      The production DomainScope Postgres (VM701) starts with huge_pages = on, so it refuses to start when the pages reserved by sysctl-postgres-hugepages.infer-pg-primary are not there
      instead of silently running on 4 kB pages (ADR 0495, S2, applied in a maintenance window, planned 2026-11-04, 11:00-12:00Z (any day 11:00-13:00Z once S1c has run 24 h)). huge_pages needs a RESTART: a reload leaves the running value at try
      (pending_restart), hostconf never restarts, and `apply` reads the setting back right after the reload, finds try, puts the file back and exits 5. So the file is applied after the
      restart, once SHOW already says on, with the value seeded by ALTER SYSTEM before the stop and reset afterwards (docs/runbooks/host-local-config.md, "Huge pages for infer-pg-primary").
      Until then `drift` reports it missing and the setting not in effect.
    expect:
      - {pg_setting: huge_pages, cluster: "18/main", value: "on"}
  postgresql-pgss-max.infer-pg-primary:
    dest: /etc/postgresql/18/main/conf.d/99-pgss-max.conf
    src: postgresql-pgss-max.infer-pg-primary.conf
    mode: "0640"
    group: postgres
    purpose: >-
      pg_stat_statements.max goes from 5000 to 20000 on the production DomainScope Postgres (VM701), riding on the restart of the huge-pages window (ADR 0495): the 5,000-entry table evicts (2,000+
      deallocations since 2026-10-31), so pg_stat_statements attributes only 3.8 GB of the 612 GB of temporary files that pg_stat_database counts. It costs about 6 MB of shared memory, inside the
      172-page margin of the huge-pages reservation. pg_stat_statements.max needs a RESTART: a reload leaves the running value at 5000 (pending_restart), hostconf never restarts, and `apply` reads
      the setting back right after the reload, finds 5000, puts the file back and exits 5. So the value is seeded with ALTER SYSTEM before the stop, this file is applied after the start (SHOW says
      20000) and the seed is reset, exactly as for huge_pages (docs/runbooks/host-local-config.md, "Huge pages for infer-pg-primary"). Until then `drift` reports it missing and the setting not in effect.
    expect:
      - {pg_setting: pg_stat_statements.max, cluster: "18/main", value: "20000"}


  sysctl-pg-swap.infer-pg-primary:
    dest: /etc/sysctl.d/91-pg-swap.conf
    src: sysctl-pg-swap.infer-pg-primary.conf
    purpose: >-
      vm.swappiness=10 on the production DomainScope Postgres VM (VM701), which got a 16 GiB swapfile on its ROOT disk (/dev/sda1, not the database disk /dev/sdb)
      on 2026-10-31 13:27Z after the 01:25Z global OOM: shared memory that the kernel cannot reclaim can now be swapped instead of killing postgres backends, and a low
      swappiness keeps ordinary page cache and anonymous memory from being swapped for nothing. The swapfile itself is not a managed file (the tool writes drop-ins only); a
      rebuilt VM needs, as root: `fallocate -l 16G /swapfile && chmod 600 /swapfile && mkswap -L pgswap /swapfile && swapon /swapfile` and the line
      `/swapfile none swap sw,pri=10 0 0` in /etc/fstab, only when the root disk has at least 36 GiB free. Watch it with the hub alerts PgPrimarySwapUsed (over 1 GiB for 5
      minutes), PgPrimarySwapIn and PgPrimarySwapAlmostFull (go-fleet-metrics-hub 0.1.17).
    expect:
      - {sysctl: vm.swappiness, value: "10"}

  sysctl-hotplug-threads-max:
    dest: /etc/sysctl.d/90-memory-hotplug-threads.conf
    src: sysctl-hotplug-threads-max.conf
    purpose: >-
      The floor of 131072 threads for VMs that boot below it. VMs whose memory is hot-plugged get kernel.threads-max from the memory the kernel sees at boot (about 1 GB: about 7000
      threads), not from their real size: a container start storm after the 2026-10-19 17:28Z reboot of infer-runtime hit that limit (fork and pthread_create returned EAGAIN and 22 containers
      ran without a network endpoint). The small 0own VMs (31k-95k, sized from 2-8 GB of RAM) get the same floor. A host that boots above it (hypervisors, big VMs) carries no file, because a fixed
      value would lower it; the baseline checks those.
    expect:
      - {sysctl: kernel.threads-max, value: "131072"}
  sysctl-postgres-hugepages.infer-pg-primary:
    dest: /etc/sysctl.d/91-postgres-hugepages.conf
    src: sysctl-postgres-hugepages.infer-pg-primary.conf
    purpose: >-
      Reserves 12800 huge pages (25.0 GiB; the segment needs 12628, 172 pages = 344 MiB of margin) for the shared memory of the production DomainScope Postgres (VM701), which takes the
      page tables of its 140 processes from 3.7 GiB to about 0.02 GiB (ADR 0495, S2, applied in a maintenance window, planned 2026-11-04, 11:00-12:00Z (any day 11:00-13:00Z once S1c has run 24 h)). `apply` of a sysctl file runs `sysctl -p` at once: apply it ONLY
      with Postgres stopped (reserving while it runs counts the 24.6 GiB segment twice and evicts the page cache). A short reservation is reported by `apply` as the setting not in effect: it puts
      the file and the old page count back and exits 5. Ballooning must stay off while the pages are reserved (balloon = memory on VM701). Until applied, `drift` reports it missing.
    expect:
      - {sysctl: vm.nr_hugepages, value: "12800"}

  socket-no-default-deps.lv3-tailscale-proxy-coolify:
    dest: /etc/systemd/system/lv3-tailscale-proxy-coolify.socket.d/10-no-default-deps.conf
    src: socket-no-default-deps.0mcp.conf
    purpose: >-
      The 0mcp hypervisor's tailnet proxy socket lv3-tailscale-proxy-coolify.socket is no longer ordered Before=sockets.target: it is also
      After=tailscaled.service, and tailscaled starts after sockets.target, an ordering cycle that made systemd delete start jobs (the proxy sockets and
      tailscaled itself) at the 2026-10-13 reboots.
    expect:
      - {systemd: lv3-tailscale-proxy-coolify.socket, property: DefaultDependencies, value: "no"}

