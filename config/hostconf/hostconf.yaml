      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-ntopng.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-openbao.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-openfga.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-plane.socket}
      - {systemd: sys-subsystem-net-devices-tailscale0.device, property: Wants, contains: lv3-tailscale-proxy-platform-context-api.socket}
