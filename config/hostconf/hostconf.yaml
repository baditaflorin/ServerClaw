    purpose: >-
      The 0docker hypervisor's tailnet proxy socket woodpecker-exec-proxy@.socket (every instance; 9000 is the Woodpecker agent path) binds even when tailscale0 has no address yet
      (FreeBind=true). The device drop-in woodpecker-exec-proxy-follows-tailscale0 starts the socket when tailscale0 comes back, and tailscale0 appears about 0.3 s before it has its
      address: without FreeBind that start fails with "Cannot assign requested address" and the socket stays dead after a tailscaled restart (the 2026-11-02 12:34:59 self-update left the
