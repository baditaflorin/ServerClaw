groups:
  - name: slo_recording_rules
    interval: 5m
    rules:
# BEGIN SERVICE: api_gateway
      - record: slo:api_gateway_availability:success_ratio_5m
        expr: avg_over_time(probe_success{job="slo-blackbox",slo_id="api-gateway-availability"}[5m])
          and probe_success{job="slo-blackbox",slo_id="api-gateway-availability"}
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:success_ratio_1h
        expr: avg_over_time(probe_success{job="slo-blackbox",slo_id="api-gateway-availability"}[1h])
          and probe_success{job="slo-blackbox",slo_id="api-gateway-availability"}
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:success_ratio_30d
        expr: avg_over_time(probe_success{job="slo-blackbox",slo_id="api-gateway-availability"}[30d])
          and probe_success{job="slo-blackbox",slo_id="api-gateway-availability"}
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:error_rate_5m
        expr: 1 - slo:api_gateway_availability:success_ratio_5m
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:error_rate_1h
        expr: 1 - slo:api_gateway_availability:success_ratio_1h
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:error_rate_30d
        expr: 1 - slo:api_gateway_availability:success_ratio_30d
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:budget_remaining
        expr: clamp_min(1 - (slo:api_gateway_availability:error_rate_30d / 0.005000), 0)
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:burn_rate_1h
        expr: slo:api_gateway_availability:error_rate_1h / 0.005000
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
      - record: slo:api_gateway_availability:time_to_budget_exhaustion_days
        expr: (slo:api_gateway_availability:budget_remaining * 30) / clamp_min(slo:api_gateway_availability:burn_rate_1h,
          0.001)
        labels:
          slo_id: api-gateway-availability
          service_id: api_gateway
          indicator: availability
# END SERVICE: api_gateway
