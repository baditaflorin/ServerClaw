# Added 2026-10-13. Dead-man and finding alerts for the two unattended loops that run on the 0docker builder (CT108):
# `fleet-runner pool-guardian` (timer every 10 minutes) and `fleet-runner horizon` (timer every 6 hours). Both write
# node_exporter textfile metrics, which the builder's exporter serves (scraped through the builder's tailscale serve forward on port 9100). A loop that stops
# is otherwise silent, so staleness is alerted from here, off the builder.
#
# Two failure shapes need two alerts: when the series exists but its timestamp is old, the loop stopped running
# (`*Silent`); when the series is gone (target down, file unreadable, exporter misconfigured) a staleness expression
# returns nothing and would resolve by itself, so `absent()` covers it (`*NotReporting`). The builder is stopped for
# about 10 minutes each night by its vzdump job (`ct108-nightly`); every `for:` below outlasts that.
#
# Added 2026-10-14: `FleetRunnerConfig*` for the hourly runner-config-drift check on the builder (fleet-state
# scripts/ct108/runner-config-drift.py). fleet-runner reads its pools and upstream overrides from /root/fleet-state, which is
# not a git checkout, and a standby builder is bootstrapped from git: a live change that never reached git is lost on failover.
#
# Added 2026-10-14: `FleetPoolBalance*` for `fleet-runner pool-balance` (timer every 15 minutes), which applies pool-plan's capacity
# proposals (weights only). `*Silent` / `*NotReporting` are its dead-man pair; `FleetPoolBalanceFailed` fires when a routing change
# failed or was rolled back (the loop also pushes a high-priority ntfy notice of its own).
groups:
  - name: fleet_loops
    rules:
      # 2026-10-18: two levels. A guardian run takes 25-45 minutes on the loaded builder (the scan of ~280 pools over ssh through the userspace tailscale proxy), so completions are
      # 35-55 minutes apart and the old single critical alert at 45 minutes (+10) paged eight times in three days for a loop that was running, just slowly.
      - alert: FleetPoolGuardianSlow
        expr: (time() - fleet_pool_guardian_last_run_timestamp_seconds) > 45 * 60
        for: 10m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The pool guardian on {{ $labels.instance }} has not finished a run for 45 minutes"
          description: "fleet-pool-guardian.timer fires every 10 minutes, but a run takes 25-45 minutes on the loaded builder, so completions are 35-55 minutes apart. No run has FINISHED for {{ $value | humanizeDuration }}: `systemctl status fleet-pool-guardian.service` on the builder says `activating` with ssh children alive = a slow scan, not a dead loop. It becomes critical (FleetPoolGuardianSilent) at 2 hours."
          runbook_url: docs/runbooks/fleet-observability.md

      # 2026-10-19: a guardian kept out of the pools lock is alive, not dead. A tick that finds the lock held (a deploy-pool or an nginx-render batch holds it
      # exclusively; the guardian's scan takes the shared lock) prints "another run holds the lock; nothing to do", exits 0 and, since fleet-runner v0.7.672, writes
      # fleet_pool_guardian_lock_skip_timestamp_seconds (its own textfile). On 2026-10-19 a batch re-render of 278 pooled vhosts and the deploys queued behind it kept
      # every tick out from 10:36Z to 12:44Z and the critical below paged for a loop that was asking every ten minutes. While that heartbeat is fresh (a tick in the last
      # 75 minutes, which also covers the 20-45 minute run that follows the wait) the critical is held back and FleetPoolGuardianLockedOut warns instead; it comes
      # back when the heartbeat stops (the timer died, or a scan hung) and after 8 hours without a finished run (something holds the lock far too long). A runner older
      # than v0.7.672 writes no heartbeat, so nothing is held back and the alert behaves as before.
      - alert: FleetPoolGuardianSilent
        expr: |
          (time() - fleet_pool_guardian_last_run_timestamp_seconds) > 120 * 60
          unless on (instance)
          (
            (time() - fleet_pool_guardian_lock_skip_timestamp_seconds) < 75 * 60
            and on (instance)
            (time() - fleet_pool_guardian_last_run_timestamp_seconds) < 8 * 3600
          )
        for: 10m
        labels:
          severity: critical
          service: fleet_loops
        annotations:
          summary: "The pool guardian on {{ $labels.instance }} has not finished a run for 2 hours"
          description: "fleet-pool-guardian.timer fires every 10 minutes. Nothing has observed or repaired the service pools for {{ $value | humanizeDuration }}. On the builder check `systemctl status fleet-pool-guardian.timer fleet-pool-guardian.service` and `journalctl -u fleet-pool-guardian.service`: a scan hung on an ssh child holds the lock (flock -n) and every later timer run is skipped. If every tick says `another run holds the lock; nothing to do` instead, a deploy batch has held the pools lock for hours: that is FleetPoolGuardianLockedOut (a warning for up to 8 hours), and this alert only fires for it after 8 hours or when the lock-skip heartbeat stops (docs/runbooks/fleet-observability.md, Fleet loops)."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolGuardianLockedOut
        expr: |
          (time() - fleet_pool_guardian_last_run_timestamp_seconds) > 120 * 60
          and on (instance)
          (time() - fleet_pool_guardian_lock_skip_timestamp_seconds) < 75 * 60
        for: 10m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The pool guardian on {{ $labels.instance }} is alive but kept out by the pools lock: no finished run for 2 hours"
          description: "fleet-pool-guardian.timer is ticking (the lock-skip heartbeat is fresh) but every tick finds the pools lock held: a deploy-pool or an nginx-render batch holds it exclusively, and the guardian's scan, which takes the shared lock, never starts while one does. No run has FINISHED for {{ $value | humanizeDuration }}. It clears by itself about 20 minutes after the lock frees. Who holds it, and what to do if it is stuck: docs/runbooks/fleet-observability.md, Fleet loops, guardian kept out by the lock. After 8 hours without a finished run FleetPoolGuardianSilent (critical) takes over."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolGuardianNotReporting
        expr: absent(fleet_pool_guardian_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
          service: fleet_loops
        annotations:
          summary: "No pool guardian metrics are visible to Prometheus"
          description: "fleet_pool_guardian_last_run_timestamp_seconds has been absent for 30 minutes: the builder (CT108) or its node exporter is down, or the textfile is missing or not readable by the exporter user (it must be mode 0644; fleet-runner before v0.7.340 wrote it 0600)."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolGuardianCriticalFinding
        expr: fleet_pool_guardian_findings{severity="critical"} > 0
        for: 1h
        labels:
          severity: critical
          service: fleet_loops
        annotations:
          summary: "A service pool has had a critical finding for an hour"
          description: "{{ $value }} critical pool finding(s) on {{ $labels.instance }} for 1 hour. The guardian repairs what is safe within minutes, so a finding this old is one it cannot or may not repair (credentials, capacity, an open circuit). Run `fleet-runner pool-guardian` (without --apply) on the builder for the findings."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolGuardianCircuitOpen
        expr: fleet_pool_guardian_circuits_open > 0
        for: 30m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The pool guardian stopped repairing {{ $value }} service(s)"
          description: "The repair circuit is open for {{ $value }} service(s) on {{ $labels.instance }}: three repairs failed within 24 hours, so the guardian leaves them alone until the hold passes. Read the failure output in /root/fleet-state/state/pool-guardian/events.jsonl."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolGuardianPaused
        expr: fleet_pool_guardian_paused == 1
        for: 24h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The pool guardian kill switch has been on for 24 hours"
          description: "Repairs are off on {{ $labels.instance }} (PAUSE file or FLEET_GUARDIAN_PAUSE) and have been for a day. The kill switch is meant for short interventions; remove it when the intervention is over."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetHorizonSilent
        expr: (time() - fleet_horizon_last_run_timestamp_seconds) > 13 * 3600
        for: 15m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The horizon watch on {{ $labels.instance }} has not run for 13 hours"
          description: "fleet-horizon.timer fires every 6 hours; two runs were missed ({{ $value | humanizeDuration }} since the last one). Nothing is watching expiring certificates, tokens, domains, RAID or backups. On the builder check `systemctl status fleet-horizon.timer fleet-horizon.service` and `journalctl -u fleet-horizon.service`."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetHorizonNotReporting
        expr: absent(fleet_horizon_last_run_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "No horizon watch metrics are visible to Prometheus"
          description: "fleet_horizon_last_run_timestamp_seconds has been absent for an hour: the builder or its node exporter is down, or the textfile is missing or not readable by the exporter user (it must be mode 0644)."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetHorizonCriticalFinding
        expr: fleet_horizon_findings{severity="critical"} > 0
        for: 1h
        labels:
          severity: critical
          service: fleet_loops
        annotations:
          summary: "The horizon watch has {{ $value }} critical finding(s)"
          description: "Something that expires or degrades slowly has crossed its critical threshold (a degraded RAID array, a disk or backup problem, an expiry inside two weeks). Run `fleet-runner horizon` on the builder for the list; the horizon verb also pages its own ntfy topic, this is the independent second path."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetRunnerConfigDrift
        expr: fleet_runner_config_drift == 1
        for: 1h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "{{ $labels.file }} on {{ $labels.instance }} differs from git"
          description: "The runner config file {{ $labels.file }} on the builder has differed from master of the fleet-state repository for an hour. A standby builder is bootstrapped from git, so a promoted standby would run the old file. Run `journalctl -u runner-config-drift.service -n 60` on the builder for the diff, then open a PR that brings fleet-state in line with the live file (or restore the live file from git). A pool's weights adjusted by pool-balance are not drift while the pool has base_weights."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetRunnerConfigCheckFailing
        expr: fleet_runner_config_check_ok == 0
        for: 3h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The runner-config drift check on {{ $labels.instance }} cannot read the fleet-state repository"
          description: "fleet_runner_config_check_ok has been 0 for three hours: the builder cannot fetch master of the private fleet-state repository (credentials, GitHub or network), so whether the live runner config matches git is unknown. Check `journalctl -u runner-config-drift.service -n 20` and `git ls-remote https://github.com/baditaflorin/fleet-state` as root on the builder."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetRunnerConfigCheckSilent
        expr: (time() - fleet_runner_config_check_last_run_timestamp_seconds) > 3 * 3600
        for: 15m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The runner-config drift check on {{ $labels.instance }} has not run for 3 hours"
          description: "runner-config-drift.timer fires hourly; nothing has compared the live runner config with git for {{ $value | humanizeDuration }}. On the builder check `systemctl status runner-config-drift.timer runner-config-drift.service`."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetRunnerConfigNotReporting
        expr: absent(fleet_runner_config_check_last_run_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "No runner-config drift metrics are visible to Prometheus"
          description: "fleet_runner_config_check_last_run_timestamp_seconds has been absent for an hour: the builder or its node exporter is down, or runner_config_drift.prom is missing or not readable by the exporter."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolBalanceSilent
        expr: (time() - fleet_pool_balance_last_run_timestamp_seconds) > 60 * 60
        for: 15m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The pool balance loop on {{ $labels.instance }} has not run for an hour"
          description: "fleet-pool-balance.timer fires every 15 minutes; nothing has planned capacity-based routing for the service pools for {{ $value | humanizeDuration }}. On the builder check `systemctl status fleet-pool-balance.timer fleet-pool-balance.service` and `journalctl -u fleet-pool-balance.service -n 40`."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolBalanceNotReporting
        expr: absent(fleet_pool_balance_last_run_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "No pool balance metrics are visible to Prometheus"
          description: "fleet_pool_balance_last_run_timestamp_seconds has been absent for an hour: the builder or its node exporter is down, or fleet_pool_balance.prom is missing or not readable by the exporter."
          runbook_url: docs/runbooks/fleet-observability.md

      - alert: FleetPoolBalanceFailed
        expr: fleet_pool_balance_failed > 0
        for: 30m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "A pool routing change failed or was rolled back on {{ $labels.instance }}"
          description: "pool-balance reports {{ $value }} failed or rolled-back routing change(s) in its last run. A rollback leaves the pool as it was; a failed rollback means the gateway route for that pool must be checked by hand (`fleet-runner pool-status --only <service>`). Details are in the pool guardian's events.jsonl (balance_failed, balance_rolled_back) under /root/fleet-state/state/pool-guardian/."
          runbook_url: docs/runbooks/fleet-observability.md

      # 2026-10-18. The tailnet policy reconciler (`tailscale-policy-reconcile.timer` on CT108, every 15 minutes, APPLY on since 2026-10-18; scripts/tailscale_policy_reconcile.py) exports a
      # textfile with a dead-man timestamp, in_sync, blocked, pending_apply and look_ok. Nothing watched them: it sat BLOCKED for four days (2026-10-14..18) behind one live-only grant with
      # a single ntfy notice, and every additive grant merged in between waited. docs/runbooks/tailscale-metrics-grants.md says what each state needs.
      - alert: FleetTailnetReconcileSilent
        expr: (time() - tailscale_policy_reconcile_last_run_timestamp_seconds) > 60 * 60
        for: 10m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The tailnet policy reconciler on {{ $labels.instance }} has not run for an hour"
          description: "tailscale-policy-reconcile.timer fires every 15 minutes; no merged tailnet policy change has been judged or applied for {{ $value | humanizeDuration }}. On the builder check `systemctl status tailscale-policy-reconcile.timer tailscale-policy-reconcile.service` and `journalctl -u tailscale-policy-reconcile.service`."
          runbook_url: docs/runbooks/tailscale-metrics-grants.md

      - alert: FleetTailnetReconcileNotReporting
        expr: absent(tailscale_policy_reconcile_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "No tailnet policy reconciler metrics are visible to Prometheus"
          description: "tailscale_policy_reconcile_last_run_timestamp_seconds has been absent for 30 minutes: the builder or its node exporter is down, or tailscale_policy_reconcile.prom is missing or not readable by the exporter."
          runbook_url: docs/runbooks/tailscale-metrics-grants.md

      - alert: FleetTailnetReconcileBlocked
        expr: tailscale_policy_reconcile_blocked == 1
        for: 1h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "A merged tailnet policy change needs a human: the reconciler is blocked"
          description: "The reconciler will not apply what is in git: a removal, a grant outside its guard (a management port, a wildcard, more than 8 endpoints), an edit of groups/tagOwners/ssh/nodeAttrs, an installed reconciler that differs from git, or live edits that git does not have (found 2026-10-18: one live-only grant kept it blocked for four days). `scripts/tailscale-policy-ct108.sh drift` and `plan` show the difference; adopt live-only text into git first, then `apply`. The last ntfy notice names the reasons."
          runbook_url: docs/runbooks/tailscale-metrics-grants.md

      - alert: FleetTailnetPolicyOutOfSync
        expr: tailscale_policy_reconcile_in_sync == 0 and on (instance) tailscale_policy_reconcile_blocked == 0
        for: 2h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The live tailnet policy has differed from git for two hours and the reconciler has not applied the difference"
          description: "An additive or text-only change is waiting (`tailscale_policy_reconcile_pending_apply`): its commit's CI is not green, the daily cap of 3 rule-changing applies is used up (text-only applies do not count), an apply failed twice for that commit, or the reconciler is paused (a PAUSE file) or in report-only mode. `journalctl -u tailscale-policy-reconcile.service` on the builder says which; `scripts/tailscale-policy-ct108.sh plan` shows the difference."
          runbook_url: docs/runbooks/tailscale-metrics-grants.md

      - alert: FleetTailnetReconcileCannotLook
        expr: tailscale_policy_reconcile_look_ok == 0
        for: 1h
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The tailnet policy reconciler cannot read git or the live policy"
          description: "look_ok has been 0 for an hour: the vault OAuth client for the tailnet API (`tailscale_policy_oauth_client`, read on the builder through fleet-vault), the GitHub token, the network or the policy API failed. `journalctl -u tailscale-policy-reconcile.service` on the builder names the step."
          runbook_url: docs/runbooks/tailscale-metrics-grants.md

      # 2026-10-21. The live policy was changed outside the reconciler twice in two days, both times with the sync tool on CT108 while the reconciler waited on its daily cap
      # (2026-10-20 15:32 UTC: six grants git did not have yet, which blocked it; 2026-10-21 06:37 UTC: the merged #533). Nothing said so: the first only showed up as `blocked`,
      # the second not at all. Tailscale's ETag is the sha256 of the stored policy text, so the reconciler counts every ETag change it did not make itself, with via="sync_tool"
      # when tailscale_policy_sync.py apply recorded it and via="unknown" otherwise. It fires on the scrape after the run that found it and clears three hours later, so the
      # next change from outside fires again. No `for:`: a change that already happened does not need to persist.
      - alert: FleetTailnetPolicyChangedOutsideReconciler
        expr: increase(tailscale_policy_reconcile_out_of_band_changes_total[3h]) > 0
        labels:
          severity: warning
          service: fleet_loops
        annotations:
          summary: "The live tailnet policy was changed outside the reconciler (via {{ $labels.via }})"
          description: "The live policy changed between two runs of the reconciler on {{ $labels.instance }}, and the reconciler did not change it. via=sync_tool: `tailscale_policy_sync.py apply` (scripts/tailscale-policy-ct108.sh apply) ran on the builder; /var/lib/tailscale-policy-sync/applies.jsonl names the rollback copy. via=unknown: the admin console, another credential or an old copy of the sync tool. A merged additive change never needs a hand apply (the reconciler applies it, after its daily cap if that is spent), and rules that git lacks block the reconciler until git has them. The reconcile events log (out_of_band_change) has both ETags; `scripts/tailscale-policy-ct108.sh drift` shows what differs from git. A planned manual apply of a blocked change needs nothing more."
          runbook_url: docs/runbooks/tailscale-metrics-grants.md
