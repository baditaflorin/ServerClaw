# BEGIN SERVICE: api_gateway
- targets:
    - https://{{ monitoring_slo_edge_connect_host }}/healthz
  labels:
    service_id: api_gateway
    slo_id: api-gateway-availability
    indicator: availability
    probe_module: http_2xx_follow_redirects
    probe_hostname: api.{{ platform_domain }}
    display_url: https://api.{{ platform_domain }}/healthz
# END SERVICE: api_gateway
