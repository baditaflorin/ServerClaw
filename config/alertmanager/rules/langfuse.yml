groups:
  - name: lv3-langfuse
    rules:
      - alert: LangfuseReadinessDown
        expr: probe_success{service="langfuse",probe_kind="readiness"} == 0
        for: 2m
        labels:
          severity: warning
          service: langfuse
        annotations:
          summary: Langfuse sign-in readiness is failing.
          description: The Langfuse readiness probe has failed for at least two minutes.
          runbook_url: https://docs.{{ platform_domain }}/runbooks/configure-langfuse/

      - alert: LangfuseLivenessDown
        expr: probe_success{service="langfuse",probe_kind="liveness"} == 0
        for: 2m
        labels:
          severity: warning
          service: langfuse
        annotations:
          summary: Langfuse runtime health is failing.
          description: The private Langfuse health endpoint has failed for at least two minutes.
          runbook_url: https://docs.{{ platform_domain }}/runbooks/configure-langfuse/
