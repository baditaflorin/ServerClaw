groups:
  - name: lv3-api-gateway
    rules:
      - alert: LV3ApiGatewayUnavailable
        expr: probe_success{service="api_gateway",probe_kind="readiness"} == 0
        for: 2m
        labels:
          severity: critical
          service: api_gateway
        annotations:
          summary: API Gateway readiness probe is failing
          description: The public API Gateway readiness probe has failed continuously for at least two minutes.
          runbook_url: https://docs.{{ platform_domain }}/runbooks/configure-api-gateway/
