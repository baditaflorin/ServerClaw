groups:
  - name: lv3-grafana
    rules:
      - alert: LV3GrafanaUnavailable
        expr: probe_success{service="grafana",probe_kind="readiness"} == 0
        for: 2m
        labels:
          severity: critical
          service: grafana
        annotations:
          summary: Grafana is unavailable.
          description: The Grafana readiness probe has been failing for at least two minutes.
          runbook_url: https://docs.{{ platform_domain }}/runbooks/monitoring-stack/
