groups:
  - name: lv3-woodpecker
    rules:
      - alert: LV3WoodpeckerUnavailable
        expr: probe_success{service="woodpecker",probe_kind="readiness"} == 0
        for: 2m
        labels:
          severity: critical
          service: woodpecker
        annotations:
          summary: Woodpecker CI readiness probe is failing
          description: The public Woodpecker health endpoint has failed continuously for at least two minutes.
          runbook_url: https://docs.{{ platform_domain }}/runbooks/configure-woodpecker/
