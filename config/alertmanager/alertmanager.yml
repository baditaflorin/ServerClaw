# managed-by: role=alertmanager_runtime adr=0097
# ntfy-only routing: critical -> ntfy critical topic, warning -> ntfy warning topic, info -> dropped, Watchdog ->
# ntfy heartbeat topic (dead-man's switch). Credentials are never rendered here: ntfy basic auth reads
# {{ alertmanager_runtime_ntfy_password_file }} (ntfy user {{ alertmanager_runtime_ntfy_username }}).
global:
  resolve_timeout: 5m

route:
  receiver: ntfy-warning
  group_by: ['alertname', 'cluster', 'host']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Dead-man's switch: always-firing Watchdog rule -> low-priority heartbeat topic.
    - matchers: ['alertname="Watchdog"']
      receiver: ntfy-watchdog
      group_by: ['alertname']
      group_wait: 0s
      group_interval: 6h
      repeat_interval: 6h
    - matchers:
        - alertname="PostgresUnknownRoleConnection"
      receiver: pgaudit-unknown-role-relay
      continue: true
# {% if alertmanager_runtime_triage_webhook_url | length > 0 %}
    # fleet-triage (shadow mode): additional read-only triage receiver. continue: true => the routes below still run
    # unchanged; a failing triage webhook only fails this receiver.
    - matchers: ['severity=~"critical|warning"']
      receiver: fleet-triage
      group_by: ['alertname']
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 6h
      continue: true
# {% endif %}

    - matchers: ['severity="info"']
      receiver: "null"
    # Storm collapse: per-service alert families fan out into one alert per service.
    # Group them by job+severity so a fleet-wide failure becomes ONE notification.
    - matchers: ['alertname=~"HTTPSProbeFailed_.*|SLOFastBurn_.*|SLOBudgetCritical_.*|SLOSlowBurn_.*|TLSCertificateExpiring(Warning|Critical)_.*"']
      group_by: ['cluster', 'job', 'severity']
      group_wait: 2m
      group_interval: 15m
      repeat_interval: 12h
      routes:
        - matchers: ['severity="critical"']
          receiver: ntfy-critical
          repeat_interval: 6h
        - matchers: ['severity="warning"']
          receiver: ntfy-warning
          group_wait: 5m
          group_interval: 1h
          repeat_interval: 24h
    - matchers: ['severity="critical"']
      receiver: ntfy-critical
      repeat_interval: 4h
    - matchers: ['severity="warning"']
      receiver: ntfy-warning
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 12h

inhibit_rules:
  # A critical alert for a service suppresses its own warning-level alerts (e.g. SLO slow burn).
  - source_matchers: ['severity="critical"', 'service_id=~".+"']
    target_matchers: ['severity="warning"', 'service_id=~".+"']
    equal: ['service_id']
  - source_matchers: ['severity="critical"', 'certificate_id=~".+"']
    target_matchers: ['severity="warning"', 'certificate_id=~".+"']
    equal: ['certificate_id']
  # Batch edge failure (>=5 services) collapses the per-service edge/probe alerts.
  - source_matchers: ['alertname="FleetEdgeManyDown"']
    target_matchers: ['alertname=~"FleetServiceEdgeDown|HTTPSProbeFailed_.*"']
    equal: ['cluster']
  # Proxmox exporter/host-metrics unreachable => "stale/missing metric" alerts are noise.
  - source_matchers: ['alertname=~"PveExporterUnavailable|PveHostNodeExporterUnavailable"']
    target_matchers: ['alertname=~"PveHostHealthMetricsStale|PveBackupFreshnessLow|ProxmoxHostCpuPackageTemperatureSensorMissing"']
    equal: ['cluster']

receivers:
  - name: "null"

  - name: pgaudit-unknown-role-relay
    webhook_configs:
      - url: "{{ alertmanager_runtime_pgaudit_relay_webhook_url }}"
        send_resolved: false

  - name: ntfy-critical
    webhook_configs:
      - url: '{{ alertmanager_runtime_ntfy_base_url }}/{{ alertmanager_runtime_ntfy_topics.critical }}?{{ alertmanager_runtime_ntfy_query }}&p=5&tags=rotating_light%2Cwarning'
        send_resolved: true
        http_config:
          basic_auth:
            username: "{{ alertmanager_runtime_ntfy_username }}"
            password_file: "{{ alertmanager_runtime_ntfy_password_file }}"

  - name: ntfy-warning
    webhook_configs:
      - url: '{{ alertmanager_runtime_ntfy_base_url }}/{{ alertmanager_runtime_ntfy_topics.warning }}?{{ alertmanager_runtime_ntfy_query }}&p=3&tags=warning'
        send_resolved: false
        http_config:
          basic_auth:
            username: "{{ alertmanager_runtime_ntfy_username }}"
            password_file: "{{ alertmanager_runtime_ntfy_password_file }}"

  - name: ntfy-watchdog
    webhook_configs:
      - url: '{{ alertmanager_runtime_ntfy_base_url }}/{{ alertmanager_runtime_ntfy_topics.watchdog }}?{{ alertmanager_runtime_ntfy_query }}&p=1&tags=heartbeat'
        send_resolved: false
        http_config:
          basic_auth:
            username: "{{ alertmanager_runtime_ntfy_username }}"
            password_file: "{{ alertmanager_runtime_ntfy_password_file }}"
# {% if alertmanager_runtime_triage_webhook_url | length > 0 %}

  - name: fleet-triage
    webhook_configs:
      - url: '{{ alertmanager_runtime_triage_webhook_url }}'
        send_resolved: false
        max_alerts: 20
        timeout: 10s
        http_config:
          authorization:
            type: Bearer
            credentials_file: "{{ alertmanager_runtime_triage_token_file }}"
# {% endif %}
