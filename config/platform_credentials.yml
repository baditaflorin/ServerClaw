---
# ADR 0438 Phase 3: Declarative credential registry.
# Single source of truth for every shared credential file path.
#
# Naming convention:
#   id:             <service>_<credential_role>  (snake_case, no _local_file suffix)
#   local_file_var: <id>_local_file
#   local_file_path: default path (may contain Jinja2; repo_shared_local_root resolved at runtime)
#
# Rules (enforced by validate_tier0_crossrefs.py Group D checks and test_platform_credentials.py):
#   - Exactly one owner_role per id
#   - No two entries share the same local_file_var
#   - consumer_roles and owner_role must be valid role-name identifiers
#   - id must match ^[a-z][a-z0-9_]*$
#
# To add a new credential:
#   1. Pick an id: <owner_service>_<purpose>
#   2. Set owner_role to the role that generates/writes/rotates the credential
#   3. List consumer_roles (roles that read this credential)
#   4. Set local_file_var = <id>_local_file
#   5. Set local_file_path to the canonical path (Jinja2 ok)
#   6. Run: uv run --with pyyaml --with jsonschema python scripts/validate_tier0_crossrefs.py

platform_credentials:

  # ---------------------------------------------------------------------------
  # OpenBao credentials
  # ---------------------------------------------------------------------------

  - id: openbao_postgres_rotator_password
    owner_role: openbao_postgres_backend
    consumer_roles:
      - openbao_runtime
    local_file_var: openbao_postgres_rotator_password_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/postgres-rotator-password.txt"
    secret_type: password
    description: Password for the OpenBao PostgreSQL rotator role (openbao_rotator) used to mint dynamic DB credentials
    notes: >
      ADR 0438 Phase 3 model case: openbao_postgres_backend was the writer (using
      openbao_postgres_admin_password_local_file) and openbao_runtime was the reader
      (using openbao_postgres_rotator_password_local_file). Unified to the rotator name.

  - id: openbao_ops_password
    owner_role: openbao_runtime
    consumer_roles: []
    local_file_var: openbao_ops_password_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/ops-password.txt"
    secret_type: password
    description: Password for the OpenBao ops userpass login (human operator access, 8h TTL)

  - id: openbao_breakglass_password
    owner_role: openbao_runtime
    consumer_roles: []
    local_file_var: openbao_breakglass_password_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/breakglass-password.txt"
    secret_type: password
    description: Password for the OpenBao breakglass userpass login (emergency access, 15m TTL)

  - id: openbao_controller_approle
    owner_role: openbao_runtime
    consumer_roles: []
    local_file_var: openbao_controller_approle_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/controller-automation-approle.json"
    secret_type: approle
    description: AppRole credentials for the controller-automation agent (ADR 0165); consumed by scripts not Ansible roles

  - id: openbao_atlas_approle
    owner_role: openbao_runtime
    consumer_roles: []
    local_file_var: openbao_atlas_approle_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/atlas-approle.json"
    secret_type: approle
    description: AppRole credentials for the Atlas agent

  - id: openbao_mail_platform_approle
    owner_role: openbao_runtime
    consumer_roles:
      - mail_platform_runtime
    local_file_var: openbao_mail_platform_approle_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/mail-platform-approle.json"
    secret_type: approle
    description: AppRole credentials for the mail-platform service (secret-rotation pipeline)

  - id: openbao_secret_rotation_approle
    owner_role: openbao_runtime
    consumer_roles: []
    local_file_var: openbao_secret_rotation_approle_local_file
    local_file_path: "{{ repo_shared_local_root }}/openbao/secret-rotation-approle.json"
    secret_type: approle
    description: AppRole credentials for the secret-rotation agent

  # ---------------------------------------------------------------------------
  # Monitoring credentials
  # ---------------------------------------------------------------------------

  - id: monitoring_proxmox_writer_token
    owner_role: monitoring_vm
    consumer_roles:
      - monitoring_vm
    local_file_var: monitoring_proxmox_writer_token_local_file
    local_file_path: "{{ repo_shared_local_root }}/monitoring/proxmox-writer.token"
    secret_type: token
    description: Proxmox API token with write permissions for Prometheus metrics scraping

  - id: monitoring_guest_writer_token
    owner_role: monitoring_vm
    consumer_roles:
      - monitoring_vm
    local_file_var: monitoring_guest_writer_token_local_file
    local_file_path: "{{ repo_shared_local_root }}/monitoring/guest-writer.token"
    secret_type: token
    description: Proxmox API token for guest VM metrics write path

  # ---------------------------------------------------------------------------
  # Authentik credentials
  # ---------------------------------------------------------------------------

  - id: authentik_agent_hub_client_secret
    owner_role: authentik_runtime
    consumer_roles:
      - api_gateway_runtime
    local_file_var: authentik_agent_hub_client_secret_local_file
    local_file_path: "{{ repo_shared_local_root }}/authentik/agent-hub-client-secret.txt"
    secret_type: secret
    description: OIDC client secret for the platform agent-hub Authentik provider (used by API gateway)

  # ---------------------------------------------------------------------------
  # Mail platform credentials
  # ---------------------------------------------------------------------------

  - id: mail_platform_admin_password
    owner_role: mail_platform_runtime
    consumer_roles: []
    local_file_var: mail_platform_admin_password_local_file
    local_file_path: "{{ repo_shared_local_root }}/mail-platform/stalwart-admin-password.txt"
    secret_type: password
    description: Stalwart mail server admin password (human operator access only)

  - id: mail_platform_mailbox_password
    owner_role: mail_platform_runtime
    consumer_roles:
      - dify_runtime
      - changedetection_runtime
      - alertmanager_runtime
    local_file_var: mail_platform_mailbox_password_local_file
    local_file_path: "{{ repo_shared_local_root }}/mail-platform/server-mailbox-password.txt"
    secret_type: password
    description: Stalwart server@<domain> mailbox SMTP password shared by platform services as smtp_password_local_file

  - id: mail_platform_metrics_password
    owner_role: mail_platform_runtime
    consumer_roles:
      - monitoring_vm
    local_file_var: mail_platform_metrics_password_local_file
    local_file_path: "{{ repo_shared_local_root }}/mail-platform/metrics-password.txt"
    secret_type: password
    description: Password for the Stalwart metrics scrape endpoint (consumed by Prometheus)
