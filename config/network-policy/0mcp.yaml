# Canonical network policy for one hypervisor: the ONE place the allowed flows of its VMs are decided.
# Layers: pve = Proxmox VM firewall, input / forward = guest nftables, docker_user = guest iptables DOCKER-USER.
# Edit this file in a PR; scripts/netpolicy.py drift tells how the live hosts differ. Every group needs a purpose.
# `from` is one IPv4 address or CIDR per entry (no wildcard unless `public: true`), `wide_ok: <reason>` allows a CIDR wider than /24.
