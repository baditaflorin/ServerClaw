# Sizing Policy — ADR 0482.
# Per-service-class resource allocation rules consumed by
# scripts/resolve_topology.py to compute per-VM allocations from probed
# host capacity. Operator overrides land in profile.yml service_overrides.
#
# Priorities (shrink-order, lowest priority shrinks first under pressure):
#   critical      — platform cannot function without it
#   important     — degrades user experience if shrunk to min
#   nice-to-have  — operational convenience (HA, replication, cache)
#   optional      — opt-in workloads (AI, large CI)
#
# ram_mb values are guest-side allocations (with ballooning enabled, the
# kernel can reclaim down toward min under host pressure). cpu values are
# virtual cores.

schema_version: 1
priority_order:
- critical
- important
- nice-to-have
- optional
classes:
  nginx:
    priority: critical
    cpu:
      min: 1
      preferred: 2
      max: 4
    ram_mb:
      min: 1024
      preferred: 4096
      max: 8192
    disk_gb:
      min: 16
      preferred: 32
      max: 64
  postgres:
    priority: critical
    cpu:
      min: 2
      preferred: 4
      max: 8
    ram_mb:
      min: 2048
      preferred: 8192
      max: 32768
    disk_gb:
      min: 32
      preferred: 96
      max: 512
  runtime-control:
    priority: critical
    cpu:
      min: 2
      preferred: 4
      max: 8
    ram_mb:
      min: 4096
      preferred: 12288
      max: 24576
    disk_gb:
      min: 64
      preferred: 128
      max: 256
  docker-runtime:
    priority: critical
    cpu:
      min: 2
      preferred: 4
      max: 12
    ram_mb:
      min: 4096
      preferred: 16384
      max: 32768
    disk_gb:
      min: 64
      preferred: 128
      max: 512
  monitoring:
