# Playbook: artifact-cache-ghcr-secret-renderer.yml
# Purpose: Install the Dockerhost one-shot reader bridge and render the fixed private GHCR proxy configuration on VM180.
# Use case: Run after the cache-only package credential and vault record are provisioned, before enabling the private loopback adapter.
# Inputs: Deployment-local paired SSH transport material and pinned Dockerhost host keys; no API key or package credential is passed to Ansible.
# Outputs: Root-only bridge/renderer contracts, one atomic config file, and a non-secret renderer receipt.
# Idempotency: Installation is idempotent. Each explicit render consumes a newly minted one-use reader and replaces the fixed file atomically.
# Dependencies: artifact_cache_ghcr_reader_bridge, go-apikey-service atomic one-use claims, fleet-secrets consumer ACLs, and ws-0502 cache adapter contract.
---
- name: Converge the Dockerhost cache GHCR reader bridge
  hosts: docker-runtime
  become: true
  gather_facts: true
  tags:
    - tier-2
    - security
    - service-artifact-cache
    - service-artifact-cache-ghcr-reader

  pre_tasks:
    - name: Run shared preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
      vars:
        playbook_execution_require_debian: true
        playbook_execution_emit_audit: false
        required_hosts:
          - docker-runtime

  roles:
    - role: lv3.platform.artifact_cache_ghcr_reader_bridge

- name: Render the private GHCR proxy configuration on artifact-cache
  hosts: artifact-cache
  become: true
  gather_facts: true
  tags:
    - tier-2
    - security
    - service-artifact-cache
    - service-artifact-cache-ghcr-renderer

  pre_tasks:
    - name: Run shared preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
      vars:
        playbook_execution_require_debian: true
        playbook_execution_emit_audit: false
        required_hosts:
          - artifact-cache

  roles:
    - role: lv3.platform.artifact_cache_ghcr_secret_renderer

  post_tasks:
    - name: Render the fixed private GHCR proxy configuration with one transient reader
      ansible.builtin.command:
        argv:
          - "{{ artifact_cache_ghcr_secret_renderer_binary_path }}"
          - render
      changed_when: true
      no_log: true
