---
# Neko Remote Desktop Deployment Playbook
#
# Deploys Neko WebRTC remote desktop for interactive operator browser access.
# Implements ADR 0380 architecture with dedicated runtime-comms VM.
# Supports N isolated browser containers driven by neko_instances dict.
#
# Topology:
#   Operator (headscale 100.64.0.0/10)
#       ↓
#   nginx (TLS termination, browser.{{ platform_domain }})
#       ↓ X-Auth-Request-Email (per-user routing via map)
#   runtime-comms (VMID 121, 10.10.10.21)
#       ├─ neko-<name> signalling (TCP port per instance)
#       └─ WebRTC media (UDP range per instance)
#
# Instance lifecycle:
#   - Add entry to neko_instances in inventory/group_vars/platform.yml
#   - Run this playbook → container created + existing Authentik account assigned
#   - Remove entry → container destroyed + Authentik assignment removed
#
# Usage:
#   make converge-service service=neko env=production

# ---------------------------------------------------------------------------
# Play 1: Converge Neko runtime (containers) on runtime-comms
# ---------------------------------------------------------------------------
- name: "Converge Neko Runtime on runtime-comms"
  hosts: "runtime-comms"
  become: true
  gather_facts: true
  tags: [tier-1, automation, service-neko]

  pre_tasks:
    - name: Run shared preflight checks
      import_tasks: tasks/preflight.yml
      tags: [preflight, neko]

  roles:
    - role: lv3.platform.common
      tags: [common, neko]
      vars:
        ensure_directories:
          - path: /opt/neko/instances
            owner: root
            group: root
            mode: '0755'
            description: "Neko per-instance data root"

    - role: lv3.platform.docker_runtime
      tags: [docker, neko]

    - role: lv3.platform.linux_guest_firewall
      tags: [firewall, neko]

    - role: lv3.platform.neko_runtime
      tags: [neko, service-neko]

  post_tasks:
    - name: Run shared post-verify checks
      import_tasks: tasks/post-verify.yml
      tags: [post-verify, neko]

    - name: Run shared completion notifications
      import_tasks: tasks/notify.yml
      tags: [notify, neko]

# ---------------------------------------------------------------------------
# Play 2: Authentik assignment lifecycle for instances
# ---------------------------------------------------------------------------
# For each entry in neko_instances: require an existing Authentik user with the
# configured email and attach the neko_managed=true assignment attribute.
# For users no longer assigned to an instance, remove only that attribute; do
# not delete their platform identity.
#
# The lifecycle deliberately does not create accounts or set passwords. Account
# provisioning belongs to the platform operator workflow, while Neko only owns
# its per-user session assignment.
# ---------------------------------------------------------------------------
- name: "Authentik Assignment Lifecycle for Neko Instances"
  hosts: localhost
  gather_facts: false
  tags: [tier-2, authentik, service-neko]

  vars:
    _neko_authentik_url: "{{ authentik_oidc_base_url | default('https://id.' + platform_domain) }}"
    _neko_authentik_token_file: "{{ lookup('env', 'REPO_ROOT') | default(playbook_dir + '/../../../..', true) }}/.local/authentik/bootstrap-token.txt"
    _neko_authentik_managed_attribute: "neko_managed"
    _neko_authentik_managed_attribute_value: "true"

  tasks:
    - name: Load Authentik bootstrap API token from local secrets store
      ansible.builtin.set_fact:
        _neko_authentik_token: "{{ lookup('ansible.builtin.file', _neko_authentik_token_file) | trim }}"
      no_log: true

    - name: Store Authentik API headers
      ansible.builtin.set_fact:
        _neko_authentik_headers:
          Authorization: "Bearer {{ _neko_authentik_token }}"
          Content-Type: "application/json"
      no_log: true

    - name: List Authentik users for Neko assignment reconciliation
      ansible.builtin.uri:
        url: "{{ _neko_authentik_url }}/api/v3/core/users/?page_size=100"
        method: GET
        headers: "{{ _neko_authentik_headers }}"
        status_code: 200
        return_content: true
      register: _neko_authentik_users_response
      changed_when: false
      retries: 3
      delay: 5
      until: _neko_authentik_users_response.status == 200

    - name: Store Authentik users for assignment reconciliation
      ansible.builtin.set_fact:
        _neko_authentik_users: "{{ _neko_authentik_users_response.json.results | default([]) }}"

    # --- Assign: require an existing Authentik user for each neko_instances entry ---

    - name: "Assign Authentik user — {{ _item.key }} ({{ _item.value.email }})"
      ansible.builtin.include_tasks:
        file: _includes/neko_authentik_assign_user.yml
      loop: "{{ neko_instances | dict2items }}"
      loop_control:
        loop_var: _item
        label: "{{ _item.key }} ({{ _item.value.email }})"

    - name: Build set of expected emails from neko_instances
      ansible.builtin.set_fact:
        _neko_expected_emails: "{{ neko_instances.values() | map(attribute='email') | list }}"

    # --- Unassign: remove only the Neko-owned metadata from stale accounts ---

    - name: "Remove stale Authentik Neko assignment — {{ _user.email | default(_user.username) }}"
      ansible.builtin.uri:
        url: "{{ _neko_authentik_url }}/api/v3/core/users/{{ _user.pk }}/"
        method: PATCH
        headers: "{{ _neko_authentik_headers }}"
        body_format: json
        body:
          attributes: "{{ _user.attributes | default({}) | dict2items | rejectattr('key', 'equalto', _neko_authentik_managed_attribute) | items2dict }}"
        status_code: 200
      loop: "{{ _neko_authentik_users }}"
      loop_control:
        loop_var: _user
        label: "{{ _user.email | default(_user.username) }}"
      when:
        - (_user.attributes | default({})).get(_neko_authentik_managed_attribute, '') == _neko_authentik_managed_attribute_value
        - (_user.email | default('')) not in _neko_expected_emails
      changed_when: true

    - name: Display Authentik assignment lifecycle summary
      ansible.builtin.debug:
        msg:
          - "Neko Authentik Assignment Lifecycle"
          - "===================================="
          - "Configured instances: {{ neko_instances | length }}"
          - "Expected emails:      {{ _neko_expected_emails }}"
          - "Users inspected:      {{ _neko_authentik_users | length }}"

# ---------------------------------------------------------------------------
# Play 3: Publish Neko on NGINX Edge Gateway (email-keyed routing)
# ---------------------------------------------------------------------------
- name: "Publish Neko on NGINX Edge Gateway"
  hosts: "nginx"
  become: true
  gather_facts: false
  tags: [tier-2, networking, service-neko]
  serial: 1

  tasks:
    - name: Render browser.{{ platform_domain }} NGINX site configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/nginx-site-neko.conf.j2"
        dest: "/etc/nginx/sites-available/browser.{{ platform_domain }}.conf"
        owner: root
        group: root
        mode: '0644'
      register: nginx_neko_site
      tags: [nginx, neko, edge-publication]

    - name: Enable browser.{{ platform_domain }} site
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/browser.{{ platform_domain }}.conf"
        dest: "/etc/nginx/sites-enabled/browser.{{ platform_domain }}.conf"
        state: link
        force: true
      tags: [nginx, neko, edge-publication]

    - name: Test NGINX configuration syntax
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false
      tags: [nginx, neko, edge-publication]

    - name: Reload NGINX to apply updated site configuration
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: nginx_neko_site.changed
      tags: [nginx, neko, edge-publication]

    - name: Verify browser.{{ platform_domain }} is reachable (expects oauth2 redirect, not 500)
      ansible.builtin.uri:
        url: "https://browser.{{ platform_domain }}/"
        validate_certs: true
        follow_redirects: none
        status_code: [200, 302, 401, 403]
      register: neko_edge_probe
      retries: 5
      delay: 5
      until: neko_edge_probe.status in [200, 302, 401, 403]
      tags: [nginx, neko, edge-publication]

    - name: Display NGINX edge publication result
      ansible.builtin.debug:
        msg:
          - "Neko NGINX Edge Publication"
          - "============================="
          - "Hostname:  browser.{{ platform_domain }}"
          - "Instances: {{ neko_instances | length }}"
          - "Routing:   X-Auth-Request-Email → per-user container (TCP port map)"
          - "TLS:       Let's Encrypt"
          - "Timeout:   3600s (ADR 0170 exception for long-lived WebRTC streams)"
          - "Status:    HTTP {{ neko_edge_probe.status }} ({{ neko_edge_probe.msg | default('ok') }})"
      tags: [nginx, neko, edge-publication]

# ---------------------------------------------------------------------------
# Play 4: Post-Deployment Verification
# ---------------------------------------------------------------------------
- name: "Post-Deployment Verification"
  hosts: "runtime-comms"
  become: true
  gather_facts: false
  tags: [tier-3, verify, service-neko]

  tasks:
    - name: Check all configured Neko containers are running
      ansible.builtin.shell: |
        docker inspect neko-{{ item.key }} --format='{{ "{{" }}.State.Health.Status{{ "}}" }}' 2>/dev/null \
          || echo 'not_found'
      loop: "{{ neko_instances | dict2items }}"
      loop_control:
        label: "neko-{{ item.key }}"
      register: _neko_verify_health
      changed_when: false
      ignore_errors: true

    - name: Display per-instance health status
      ansible.builtin.debug:
        msg:
          - "neko-{{ item.item.key }} ({{ item.item.value.email }}):"
          - "  port: {{ item.item.value.port }}"
          - "  udp:  {{ item.item.value.udp_range }}"
          - "  health: {{ item.stdout | default('unknown') }}"
      loop: "{{ _neko_verify_health.results }}"
      loop_control:
        label: "neko-{{ item.item.key }}"

    - name: Verify each instance responds on its signalling port
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ item.value.port }}/"
        status_code: [200, 301, 302]
      loop: "{{ neko_instances | dict2items }}"
      loop_control:
        label: "neko-{{ item.key }}"
      register: _neko_api_health
      retries: 3
      delay: 5
      until: _neko_api_health.status in [200, 301, 302]
      ignore_errors: true

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Neko Multi-Instance Deployment Summary"
          - "======================================"
          - "Configured instances: {{ neko_instances | length }}"
          - "Edge URL: https://browser.{{ platform_domain }}"
          - ""
          - "Each user authenticates via Authentik SSO (browser.{{ platform_domain }})."
          - "After login, NGINX routes X-Auth-Request-Email to their container."
          - "Users not assigned a container receive HTTP 403."
          - ""
          - "To add a user: add entry to neko_instances in"
          - "inventory/group_vars/platform.yml and re-run this playbook."
