---
- name: Install Proxmox VE on Debian 13 hosts
  hosts: proxmox_hosts
  become: true
  gather_facts: true
  vars:
    # ADR 0494: the default guest set is every declared guest EXCEPT those declared with `lifecycle: planned` (declared, not
    # yet approved or provisioned). Without this the guests role falls back to ALL declared guests (an empty
    # proxmox_guests_active counts as unset) and would clone a planned guest. Names are used for the exclusion because a
    # guest without a lifecycle key must stay selected. The per-guest playbooks set their own list and are unaffected.
    proxmox_guests_active: >-
      {{
        proxmox_guests
        | rejectattr('name', 'in', (proxmox_guests | selectattr('lifecycle', 'defined') | selectattr('lifecycle', 'equalto', 'planned') | map(attribute='name') | list))
        | list
      }}

  pre_tasks:
    - name: Ensure target host is Debian 13
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version == "13"
        fail_msg: "This playbook only supports Debian 13 targets."

  roles:
    - role: lv3.platform.proxmox_repository
      tags:
        - repository
    - role: lv3.platform.proxmox_kernel
    - role: lv3.platform.proxmox_platform
    - role: lv3.platform.proxmox_access
      tags:
        - access
    - role: lv3.platform.proxmox_network
      tags:
        - network
        - ingress
    - role: lv3.platform.proxmox_tailscale
      tags:
        - tailscale
    - role: lv3.platform.proxmox_headscale
      tags:
        - headscale
        - access
    - role: lv3.platform.proxmox_tailscale_proxy
      tags:
        - tailscale
    - role: lv3.platform.proxmox_guests
      tags:
        - guests
    - role: lv3.platform.proxmox_security
      tags:
        - security
    - role: lv3.platform.proxmox_api_access
      tags:
        - api-access
    - role: lv3.platform.proxmox_backups
      tags:
        - storage
        - backups
