---
argument_specs:
  main:
    short_description: Configure Grafana to use the shared Authentik OIDC login flow.
    options:
      grafana_sso_service_topology:
        type: dict
        required: true
        description:
          - Service topology entry for Grafana.
      grafana_sso_client_id:
        type: str
        required: true
        description:
          - OIDC client id Grafana should use against Authentik.
      grafana_sso_client_secret_local_file:
        type: path
        required: true
        description:
          - Controller-local file containing the OIDC client secret Grafana should use against Authentik.
      grafana_sso_oidc_issuer_url:
        type: str
        required: true
        description:
          - Authentik issuer URL for the Grafana provider.
      grafana_sso_oidc_authorization_url:
        type: str
        required: true
        description:
          - Authentik authorization endpoint for Grafana login.
      grafana_sso_oidc_token_url:
        type: str
        required: true
        description:
          - Authentik token endpoint for Grafana login.
      grafana_sso_oidc_userinfo_url:
        type: str
        required: true
        description:
          - Authentik userinfo endpoint for Grafana login.
      grafana_sso_login_groups:
        type: list
        elements: str
        required: true
        description:
          - Authentik groups that should be requested and mapped during login.
      grafana_sso_root_url:
        type: str
        required: true
        description:
          - Public Grafana root URL.
      grafana_sso_signout_redirect_url:
        type: str
        required: true
        description:
          - Logout redirect URL sent to Authentik after Grafana signout.
