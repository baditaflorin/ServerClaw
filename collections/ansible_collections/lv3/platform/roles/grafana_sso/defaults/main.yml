# Purpose: Define Grafana's managed Authentik OIDC endpoints and least-privilege groups.
# Use case: Consumed by grafana_sso when converging the Grafana runtime for a selected deployment.
# Inputs: Authentik OIDC/session authority variables and canonical Grafana topology from inventory.
# Outputs: Fully derived grafana_sso_* settings; no credentials are embedded in this file.
# Idempotency: Yes; defaults are declarative and contain no runtime mutations.
# Dependencies: ADR 0491 Authentik migration, platform topology, and ignored local client-secret file.
---
grafana_sso_service_topology: "{{ hostvars[platform_topology_host].platform_service_topology | service_topology_get('grafana') }}"
grafana_sso_session_authority: "{{ platform_session_authority }}"
grafana_sso_client_id: grafana-oauth
grafana_sso_client_secret_local_file: "{{ authentik_grafana_client_secret_local_file }}"
grafana_sso_client_secret: "{{ lookup('ansible.builtin.file', grafana_sso_client_secret_local_file) | trim }}"
grafana_sso_oidc_issuer_url: "{{ authentik_oidc_provider_base_url }}/grafana/"
grafana_sso_oidc_authorization_url: "{{ authentik_oidc_provider_base_url }}/authorize/"
grafana_sso_oidc_token_url: "{{ authentik_oidc_provider_base_url }}/token/"
grafana_sso_oidc_userinfo_url: "{{ authentik_oidc_provider_base_url }}/userinfo/"
grafana_sso_oidc_logout_url: "{{ grafana_sso_oidc_issuer_url }}end-session/"
grafana_sso_oidc_hostname: "{{ authentik_oidc_base_url | urlsplit('hostname') }}"
grafana_sso_internal_edge_ipv4: "{{ hostvars[platform_topology_host].proxmox_public_edge_ipv4 }}"
grafana_sso_login_groups:
  - grafana-admins
  - grafana-viewers
grafana_sso_root_url: "https://{{ grafana_sso_service_topology.public_hostname }}"
grafana_sso_signout_redirect_url: >-
  {{ grafana_sso_oidc_logout_url }}?post_logout_redirect_uri={{ grafana_sso_session_authority.shared_proxy_cleanup_url | urlencode }}
