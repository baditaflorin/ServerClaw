---
- name: Validate Grafana SSO inputs
  ansible.builtin.assert:
    that:
      - grafana_sso_client_id | length > 0
      - grafana_sso_client_secret | length > 0
      - grafana_sso_oidc_issuer_url | length > 0
      - grafana_sso_oidc_authorization_url | length > 0
      - grafana_sso_oidc_token_url | length > 0
      - grafana_sso_oidc_userinfo_url | length > 0
      - grafana_sso_authentik_hostname | length > 0
      - grafana_sso_internal_edge_ip is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$')
      - grafana_sso_service_topology.public_hostname | length > 0
    fail_msg: >-
      grafana_sso requires a client id, client secret, Authentik OIDC endpoints,
      a public hostname, and private NGINX edge topology.

- name: Verify the topology-derived private edge is reachable before changing host resolution
  ansible.builtin.wait_for:
    host: "{{ grafana_sso_internal_edge_ip }}"
    port: 443
    state: started
    timeout: 5
  changed_when: false

- name: Route Grafana's server-side Authentik requests through the private edge
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} LV3 GRAFANA AUTHENTIK HAIRPIN"
    block: "{{ grafana_sso_internal_edge_ip }} {{ grafana_sso_authentik_hostname }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Ensure Grafana knows its public root URL
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: server
    option: root_url
    value: "{{ grafana_sso_root_url }}"
    mode: "0640"
  notify: Restart Grafana

- name: Enable Generic OAuth in Grafana
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: auth.generic_oauth
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0640"
  loop:
    - option: enabled
      value: "true"
    - option: name
      value: Authentik
    - option: allow_sign_up
      value: "true"
    - option: client_id
      value: "{{ grafana_sso_client_id }}"
    - option: client_secret
      value: "{{ grafana_sso_client_secret }}"
    - option: scopes
      value: openid profile email groups
    - option: email_attribute_path
      value: email
    - option: login_attribute_path
      value: preferred_username
    - option: name_attribute_path
      value: name
    - option: auth_url
      value: "{{ grafana_sso_oidc_authorization_url }}"
    - option: token_url
      value: "{{ grafana_sso_oidc_token_url }}"
    - option: api_url
      value: "{{ grafana_sso_oidc_userinfo_url }}"
    - option: role_attribute_path
      value: "contains(groups[*], 'grafana-admins') && 'Admin' || contains(groups[*], 'grafana-viewers') && 'Viewer' || 'Viewer'"
    - option: groups_attribute_path
      value: groups
    - option: allowed_groups
      value: "{{ grafana_sso_login_groups | join(',') }}"
    - option: signout_redirect_url
      value: "{{ grafana_sso_signout_redirect_url }}"
  loop_control:
    label: "{{ item.option }}"
  notify: Restart Grafana
  no_log: true

- name: Flush Grafana SSO handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for Grafana to answer locally
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/login
    method: GET
    status_code: 200
  register: grafana_sso_login_page
  retries: 20
  delay: 3
  until: grafana_sso_login_page.status == 200
  changed_when: false

- name: Verify Grafana's host can reach the Authentik provider discovery endpoint
  ansible.builtin.uri:
    url: "{{ grafana_sso_oidc_issuer_url }}.well-known/openid-configuration"
    method: GET
    status_code: 200
    return_content: true
    timeout: 10
  register: grafana_sso_oidc_discovery
  changed_when: false
  no_log: true

- name: Verify Grafana client credentials are accepted by Authentik
  ansible.builtin.uri:
    url: "{{ grafana_sso_oidc_token_url }}"
    method: POST
    url_username: "{{ grafana_sso_client_id }}"
    url_password: "{{ grafana_sso_client_secret }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      grant_type: authorization_code
      code: lv3-preflight-invalid-authorization-code
      redirect_uri: "{{ grafana_sso_root_url }}/login/generic_oauth"
    status_code: 400
    return_content: true
    timeout: 10
  register: grafana_sso_client_auth_probe
  failed_when: >-
    grafana_sso_client_auth_probe.status != 400
    or grafana_sso_client_auth_probe.json.error | default('') != 'invalid_grant'
  changed_when: false
  no_log: true

- name: Verify Grafana redirects the OAuth login to Authentik
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/login/generic_oauth
    method: GET
    follow_redirects: none
    status_code: 302
  register: grafana_sso_redirect
  changed_when: false

- name: Assert the Grafana OAuth redirect is wired to Authentik
  ansible.builtin.assert:
    that:
      - >-
        grafana_sso_oidc_authorization_url in grafana_sso_redirect.location
      - ('client_id=' ~ grafana_sso_client_id) in grafana_sso_redirect.location
    fail_msg: "Grafana is not redirecting the generic OAuth login path to the expected Authentik client."
