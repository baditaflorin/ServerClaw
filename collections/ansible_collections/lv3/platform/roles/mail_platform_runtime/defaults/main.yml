# Purpose: Define default runtime paths, ports, and credential locations for the shared mail platform role.
# Use case: Load during mail-platform convergence so compose rendering, gateway wiring, and artifact mirroring resolve consistently.
# Inputs: Platform topology, image catalog, shared secret roots, and optional mail-platform overrides.
# Outputs: Default variables consumed by the mail_platform_runtime tasks and templates.
# Idempotency: Fully idempotent; defaults declare desired values only.
# Dependencies: ADR 0165 metadata standard, ADR 0130, and the mail_platform_runtime role tasks.
---
# NOTE: Conventional variables (site_dir, image, compose_file, env_file,
# openbao_*, container_name, internal_port, local_artifact_dir) are derived
# from platform_service_registry — ADR 0373.
# Purpose: Declare the canonical mail-platform runtime defaults, secrets, ports, and policy metadata used by the managed Stalwart and gateway stack.
# Use case: Loaded whenever the mail_platform_runtime role converges or verifies the live mail platform.
# Inputs: Inventory-derived platform port assignments, container image catalog entries, OpenBao defaults, and controller-local artifact paths.
# Outputs: Stable role defaults for the mail platform runtime, bootstrap artifacts, notification profiles, and verification settings.
# Idempotency: Fully idempotent because these defaults describe desired state only and do not mutate targets on their own.
# Dependencies: ADR 0165, ADR 0077, and the shared mail platform runtime contract.

mail_platform_domain: "{{ platform_domain }}"
mail_platform_hostname: "mail.{{ platform_domain }}"
mail_platform_mailbox_localpart: server
mail_platform_mailbox_login: "{{ mail_platform_mailbox_localpart }}"
mail_platform_mailbox_address: "{{ mail_platform_mailbox_localpart }}@{{ mail_platform_domain }}"
mail_platform_mailbox_description: LV3 managed server mailbox
mail_platform_stalwart_dir: /opt/mail-platform/stalwart
mail_platform_gateway_dir: /opt/mail-platform/gateway
# argument_specs.yml declares mail_platform_compose_file as required: true.
# Argument validation runs BEFORE role tasks, so derive_service_defaults (which
# would set this) hasn't run yet at validation time. Provide the canonical value
# as a default here so validation passes; derive_service_defaults will
# overwrite it with the identical value during the converge run.
mail_platform_compose_file: "{{ mail_platform_site_dir }}/docker-compose.yml"
mail_platform_gateway_app_dir: "{{ mail_platform_gateway_dir }}/app"
mail_platform_gateway_data_dir: "{{ mail_platform_gateway_dir }}/data"
mail_platform_gateway_profiles_file: "{{ mail_platform_gateway_dir }}/notification-profiles.json"
mail_platform_gateway_profiles_container_file: /config/notification-profiles.json
mail_platform_gateway_env_file: "{{ compose_runtime_secret_root }}/mail-platform/runtime.env"
mail_platform_gateway_legacy_env_file: "{{ mail_platform_gateway_dir }}/gateway.env"
mail_platform_docker_network_name: mail-platform_default
mail_platform_stalwart_config_file: "{{ mail_platform_stalwart_dir }}/etc/config.toml"
mail_platform_stalwart_bootstrap_file: "{{ mail_platform_site_dir }}/bootstrap-mail-platform.py"
mail_platform_stalwart_container_name: "{{ platform_identity.config_prefix }}-mail-stalwart"
mail_platform_gateway_container_name: "{{ platform_identity.config_prefix }}-mail-gateway"
mail_platform_stalwart_image: "{{ container_image_catalog.images.mail_platform_stalwart_runtime.ref }}"
mail_platform_gateway_base_image: "{{ container_image_catalog.images.mail_platform_gateway_python_base.ref }}"
mail_platform_gateway_port: "{{ hostvars[platform_topology_host].platform_port_assignments.mail_platform_gateway_port }}"
mail_platform_stalwart_http_port: 8080
mail_platform_internal_submission_port: "{{ hostvars[platform_topology_host].platform_port_assignments.mail_platform_internal_submission_port }}"
mail_platform_submission_auth_retries: 12
mail_platform_submission_auth_delay_seconds: 5
mail_platform_profile_secret_dir: "{{ mail_platform_secret_dir }}/profiles"
mail_platform_admin_password_file: "{{ mail_platform_secret_dir }}/stalwart-admin-password"
mail_platform_mailbox_password_file: "{{ mail_platform_secret_dir }}/server-mailbox-password"
mail_platform_metrics_password_file: "{{ mail_platform_secret_dir }}/metrics-password"
mail_platform_gateway_api_key_file: "{{ mail_platform_secret_dir }}/gateway-api-key"
mail_platform_profile_local_artifact_dir: "{{ mail_platform_local_artifact_dir }}/profiles"
mail_platform_admin_password_local_file: "{{ repo_shared_local_root }}/mail-platform/stalwart-admin-password.txt"
mail_platform_mailbox_password_local_file: "{{ repo_shared_local_root }}/mail-platform/server-mailbox-password.txt"
mail_platform_metrics_password_local_file: "{{ repo_shared_local_root }}/mail-platform/metrics-password.txt"
mail_platform_gateway_api_key_local_file: "{{ repo_shared_local_root }}/mail-platform/gateway-api-key.txt"
mail_platform_brevo_api_key_local_file: "{{ repo_shared_local_root }}/mail-platform/brevo-api-key.txt"
mail_platform_brevo_api_url: https://api.brevo.com/v3/smtp/email
mail_platform_brevo_sender_email: operator@example.com
mail_platform_brevo_sender_name: LV3 Platform
mail_platform_reply_to_email: "{{ mail_platform_mailbox_address }}"
mail_platform_gateway_bind_port: "{{ mail_platform_gateway_port }}"
mail_platform_gateway_force_brevo_fallback: false
mail_platform_gateway_attempt_local_first: true
mail_platform_dkim_enabled: true
mail_platform_dkim_selector: mail
mail_platform_dkim_private_key_local_file: "{{ repo_shared_local_root }}/mail-platform/dkim-private.pem"
mail_platform_dkim_private_key_host_path: "{{ mail_platform_stalwart_dir }}/etc/dkim-private.pem"
mail_platform_dkim_private_key_container_path: /opt/stalwart/etc/dkim-private.pem
# Public key (base64, no PEM headers) — read from .local at runtime.
# lookup() returns '' when the file is absent so a missing key becomes a visible empty record.
mail_platform_dkim_public_key: >-
  {{ lookup('ansible.builtin.file', repo_shared_local_root ~ '/mail-platform/dkim-public-key.txt', errors='ignore') | default('', true) | trim }}
# DNS TXT record value split into ≤255-char chunks (DNS limit per string).
# Produces: "v=DKIM1; k=rsa; p=<chunk1>" "<chunk2>"
mail_platform_dkim_dns_value: >-
  {%- set full = 'v=DKIM1; k=rsa; p=' ~ mail_platform_dkim_public_key -%}
  "{{ full[:255] }}" "{{ full[255:] }}"
mail_platform_gateway_uvicorn_workers: 1
mail_platform_gateway_api_user: mail-platform
mail_platform_notification_profiles:
  - id: operator-alerts
    mailbox_localpart: alerts
    mailbox_address: "alerts@{{ mail_platform_domain }}"
    sender_email: "alerts@{{ mail_platform_domain }}"
    sender_name: LV3 Operator Alerts
    reply_to: "{{ mail_platform_mailbox_address }}"
    description: LV3 operator alert sender
    owner: Platform operations
    credential_scope: Scoped gateway API key and mailbox password for operator-facing alert traffic only.
    rate_expectation: Low volume with bursty spikes during incidents; never used for bulk campaigns.
    retention_policy: Retain gateway counters and Stalwart delivery logs under the managed platform observability and host retention policies.
    observability_policy: Track requests, fallback use, and delivery failures per profile in the mail gateway state and Grafana mail dashboard.
  - id: platform-transactional
    mailbox_localpart: platform
    mailbox_address: "platform@{{ mail_platform_domain }}"
    sender_email: "platform@{{ mail_platform_domain }}"
    sender_name: LV3 Platform
    reply_to: "{{ mail_platform_mailbox_address }}"
    description: LV3 platform transactional sender
    owner: Platform services
    credential_scope: Scoped gateway API key and mailbox password for repo-managed platform services.
    rate_expectation: Low to moderate transactional volume; message flows must stay application-driven and auditable.
    retention_policy: Retain gateway counters and delivery traces needed to audit transactional notifications without treating the profile as a mailbox for operators.
    observability_policy: Track profile-specific send volume and failures in the shared mail dashboard and gateway state.
  - id: agent-reports
    mailbox_localpart: agents
    mailbox_address: "agents@{{ mail_platform_domain }}"
    sender_email: "agents@{{ mail_platform_domain }}"
    sender_name: LV3 Agent Reports
    reply_to: "{{ mail_platform_mailbox_address }}"
    description: LV3 agent and workflow reporting sender
    owner: Repository automation
    credential_scope: Scoped gateway API key and mailbox password for agents, scheduled workflows, and machine-generated reports.
    rate_expectation: Low to moderate report volume with occasional bursts during audits or recovery workflows.
    retention_policy: Retain gateway counters and delivery traces long enough to audit agent-generated reports and incident outputs.
    observability_policy: Track request, success, fallback, and failure counters per agent profile in the gateway state and Grafana mail dashboard.
mail_platform_gateway_trace_service_name: mail-gateway
mail_platform_gateway_trace_service_namespace: lv3
mail_platform_gateway_trace_environment: lv3
mail_platform_gateway_trace_otlp_endpoint: "{{ hostvars[platform_topology_host].platform_service_topology | platform_service_url('grafana', 'otlp_http') }}"
mail_platform_gateway_sentry_dsn_local_file: "{{ repo_shared_local_root }}/glitchtip/mail-gateway.dsn"
# lookup(..., errors='ignore') returns Python None (not '') when the file is absent.
# default('', true) coerces None → '' so the template renders SENTRY_DSN= (empty)
# rather than SENTRY_DSN=None (a literal string that sentry_sdk rejects as an invalid DSN).
mail_platform_gateway_sentry_dsn: "{{ lookup('ansible.builtin.file', mail_platform_gateway_sentry_dsn_local_file, errors='ignore') | default('', true) | trim }}"
mail_platform_gateway_sentry_environment: "{{ env | default('production') }}"
mail_platform_gateway_sentry_release: "{{ lookup('ansible.builtin.file', repo_shared_root ~ '/VERSION') | trim }}"
mail_platform_metrics_username: prometheus
mail_platform_webhook_events:
  - queue.queue-message-authenticated
  - delivery.delivered
  - delivery.failed
  - delivery.message-rejected
  - auth.failed
  - auth.success
  - smtp.connection-start
