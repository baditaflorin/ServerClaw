---
argument_specs:
  main:
    short_description: Install the root-only Step-CA and fleet-secrets handoff for fleet-build-broker.
    options:
      fleet_build_broker_pki_server_ip:
        type: str
        required: true
        description:
          - Private IP address required in the fleet-build-broker server certificate SAN set.
      fleet_build_broker_pki_vault_writer_command:
        type: list
        elements: str
        required: true
        description:
          - Absolute command for the canonical short-lived fleet-secrets writer transaction bridge.
      fleet_build_broker_pki_client_ca_certificate_file:
        type: path
        required: true
        description:
          - Root-only, self-signed, broker-exclusive client trust anchor certificate.
      fleet_build_broker_pki_client_ca_key_file:
        type: path
        required: true
        description:
          - Root-only broker-exclusive client trust-anchor private key; it is never rendered into a workload.
      fleet_build_broker_pki_client_ca_directory:
        type: path
        required: true
        description:
          - Controlled root-only child directory of the PKI state directory for the broker client trust anchor.
