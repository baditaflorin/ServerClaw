---
# Purpose: Declare safe defaults for per-user Neko browser sessions.
# Use case: Loaded whenever the neko_runtime role validates or deploys instances.
#
# Outputs:
#   - Generic image, resource, and health defaults with full teardown disabled unless explicitly opted into locally.
#
# Idempotency: Fully idempotent
#              This file only declares role defaults.
#
# Dependencies:
#   - ADR 0380: Defines Neko browser session routing and runtime behavior.
#   - ADR 0491: Defines Authentik as the platform identity provider.
#   - Requires: Deployment-specific identity and instance inputs from the selected private overlay.
#
# Related ADRs: 0165, 0380, 0491
# Related Runbooks: docs/adr/0380-neko-for-operator-remote-browser-access.md
#
# Author: LV3 Platform
# Last Updated: 2026-10-13

# Neko Remote Desktop Role Defaults

# --- Multi-instance configuration (primary interface) ---
# Each entry provisions an isolated browser container for an existing Authentik user.
# Key = instance name (used for container name, data dir, logs).
# Removing an entry from this dict causes the container to be destroyed
# and its Authentik Neko assignment to be removed on the next converge.
# The entire map may not be empty unless a deployment explicitly opts in to
# a full teardown with neko_allow_empty_instances=true.
#
# Example:
#   neko_instances:
#     florin:
#       email: florin@example.com
#       port: 8080
#       udp_range: "50000-52999"
#     alice:
#       email: alice@example.com
#       port: 8081
#       udp_range: "53000-55999"
neko_instances: {}
neko_allow_empty_instances: false

# --- Image configuration (shared across all instances) ---
neko_runtime_image_name: "m1k1o/neko"
neko_runtime_image_tag: "chromium"

# --- Per-instance defaults (overridable per entry in neko_instances) ---
neko_default_browser: "chromium"
neko_default_res: "1440x900"
neko_default_max_connections: 10
neko_default_cpu_limit: "2"
neko_default_memory_limit: "4g"
neko_default_restart_policy: "unless-stopped"

# --- Storage ---
neko_data_dir: "/opt/neko/instances"

# --- Health check ---
neko_healthcheck_interval: "30s"
neko_healthcheck_timeout: "5s"
neko_healthcheck_retries: 3

# --- Logging ---
neko_log_driver: "json-file"
neko_log_max_size: "10m"
neko_log_max_file: "3"

# --- Authentik assignment lifecycle ---
# The playbook reads the bootstrap API token from the controller-local Authentik
# secret store. It never creates an identity or changes a password.
neko_authentik_admin_url: "{{ authentik_oidc_base_url | default('https://id.' + platform_domain) }}"

# Attribute used solely to track the Neko assignment. Removing an instance
# clears this attribute but intentionally preserves the Authentik user.
neko_authentik_managed_attribute: "neko_managed"
neko_authentik_managed_attribute_value: "true"

# --- Change detection (do not edit manually) ---
neko_runtime_image_pull_digest: ""
