monitoring_prometheus_fleet_disk_rules_file: "{{ monitoring_prometheus_rules_dir }}/fleet-disk.yml"
monitoring_prometheus_fleet_loops_rules_source_file: "{{ monitoring_repo_root }}/config/prometheus/rules/fleet-loops.yml"
monitoring_prometheus_fleet_loops_rules_file: "{{ monitoring_prometheus_rules_dir }}/fleet-loops.yml"
# Rule files that were running on the monitoring VM with no copy in git (found 2026-10-14: a rebuilt VM would have lost them).
# Each is shipped as is from config/prometheus/rules/<name>; tests/test_adopted_prometheus_rules.py pins this list.
monitoring_prometheus_adopted_rule_files:
  - fleet-edge-probe.yml
  - node-placement.yml
  - node-thermal-alerts.yml
  - prometheus-capacity.yml
  - pve-host-incident.yml
  - pve-recovery-alerts.yml
  - pve-storage-capacity.yml
  # Added 2026-10-16 (reconciliation): live-only files adopted verbatim, and the resilience rules that were live before they had a way onto the VM.
  - public-edge-critical.yml
  - restore-drill.yml
  - tier0-standby.yml
  - pbs-usage.yml
  # Added 2026-10-18: alerts for the network policy drift check (scripts/netpolicy.py, docs/runbooks/network-policy.md).
  - netpolicy.yml
  # Added 2026-10-19: the Postgres cluster unit (node_systemd_unit_state); the production database was down 21 minutes with the edge probe as the only alert.
  - fleet-postgres-unit.yml
  # Bounded image cleanup must surface registry refusals and failed attempts.
  - fleet-image-gc.yml
  # Added 2026-10-21: the DomainScope search probe on CT108 (production search answers its golden queries; docs/runbooks/domainscope-search-probe.md).
  - domainscope-search.yml
  # Added 2026-10-28: the DomainScope Drive data room refresh on CT108 (live figures in the Drive folder; docs/runbooks/domainscope-drive-refresh.md).
  - domainscope-drive-refresh.yml
  # Added 2026-10-22: the keystore apikey wave on the builder (fleet-state scripts/ct108/apikey-wave.py, docs/runbooks/apikey-wave.md): halted, silent, stalled.
  - fleet-apikey-wave.yml
  # Added 2026-10-28 (ADR 0494): the agent-history store on VM 155 (store down, ingest lag, spool depth, silent collector, redaction canary, backup gap, data disk). The guest does not exist yet: nothing fires until its metrics bridge writes agent_history.prom.
  - agent-history.yml
  # Added 2026-11-04 (docs/runbooks/fleet-observability.md#build-host-cache-trim-alerts): the Go build cache trim of the build VM's GC (step 3d): a run that failed or was skipped, no run for 9 hours, no metric for a day, a volume over its cap for a day. Applying it is a separate step; its expressions return nothing today.
  - fleet-job-caches-trim.yml
  # Added 2026-11-01 (docs/runbooks/pve-0mcp-memory-budget.md): the guaranteed memory of pve-0mcp's running VMs (balloon floors plus VMs with balloon 0) against the 80% budget. Applying it is a separate step; it fires at once while the sum is above 80%.
  - proxmox-host-memory-budget.yml
  # Added 2026-11-02: the shared CI cache prune on the Woodpecker pilot agent (services-registry PR #806, docs/runbooks/fleet-observability.md#ci-cache-prune-alerts):
  # a cache still over its cap, a prune that stopped, no series at all. Inert until the host writes ci_cache_prune_*.
  - fleet-ci-cache-prune.yml
monitoring_prometheus_hypervisor_memory_rules_source_file: "{{ monitoring_repo_root }}/config/prometheus/rules/fleet-hypervisor-memory.yml"
monitoring_prometheus_hypervisor_memory_rules_file: "{{ monitoring_prometheus_rules_dir }}/fleet-hypervisor-memory.yml"
