---
# Purpose: Declare the shared defaults for converging the monitoring VM and its Grafana, Loki, Prometheus, Tempo, and InfluxDB surfaces.
# Use case: Used whenever the monitoring_vm role renders monitoring configuration, dashboards, and managed tokens.
#
# Inputs (required):
#   - repo root and host facts (generated, required): Supply source paths, hostnames, and topology-derived URLs.
#
# Inputs (optional):
#   - monitoring_stack_packages (list[str], optional): Monitoring packages installed on monitoring.
#   - monitoring_prometheus_retention_time (str, optional, default=15d): Prometheus retention budget.
#
# Outputs:
#   - Default variable values consumed by the monitoring_vm role.
#
# Idempotency: Fully idempotent
#              This file only declares role defaults.
#
# Dependencies:
#   - ADR 0041: Defines the monitoring stack baseline.
#   - Role: monitoring_vm — converges the monitoring guest and bundled observability services.
#
# Related ADRs: 0041, 0165
# Related Runbooks: docs/runbooks/deploy-uptime-kuma.md
#
# Author: LV3 Platform
# Last Updated: 2026-03-28
monitoring_grafana_repo_key_url: https://apt.grafana.com/gpg-full.key
monitoring_grafana_repo_keyring: /etc/apt/keyrings/grafana.asc
monitoring_grafana_repo_file: /etc/apt/sources.list.d/grafana.list
monitoring_stack_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - grafana
  - influxdb2
  - influxdb2-cli
  - loki
  - loki-canary
  - prometheus
  - prometheus-blackbox-exporter
monitoring_stack_dir: "/etc/{{ platform_identity.unix_prefix }}/monitoring"
monitoring_legacy_stack_dirs:
  - "/etc/{{ platform_identity.config_prefix }}/monitoring"
monitoring_repo_root: "{{ inventory_dir | dirname }}"
monitoring_grafana_admin_user: admin
monitoring_grafana_admin_password_file: "/etc/{{ platform_identity.unix_prefix }}/monitoring/grafana-admin-password"
monitoring_grafana_admin_password_hash_file: /var/lib/grafana/.{{ platform_identity.config_prefix }}-admin-password.sha256
monitoring_grafana_datasource_name: InfluxDB Proxmox
monitoring_grafana_datasource_token_file: "/etc/{{ platform_identity.unix_prefix }}/monitoring/grafana-reader.token"
monitoring_grafana_provisioning_file: /etc/grafana/provisioning/datasources/influxdb-proxmox.yml
monitoring_grafana_loki_datasource_name: Loki Logs
monitoring_grafana_loki_provisioning_file: /etc/grafana/provisioning/datasources/loki-logs.yml
monitoring_grafana_prometheus_datasource_name: Prometheus Service Graphs
monitoring_grafana_prometheus_datasource_uid: "{{ platform_identity.config_prefix }}-prometheus"
monitoring_grafana_prometheus_provisioning_file: /etc/grafana/provisioning/datasources/prometheus-service-graphs.yml
monitoring_grafana_tempo_datasource_name: Tempo
monitoring_grafana_tempo_datasource_uid: "{{ platform_identity.config_prefix }}-tempo"
monitoring_grafana_tempo_provisioning_file: /etc/grafana/provisioning/datasources/tempo-traces.yml
monitoring_grafana_folder_uid: lv3
monitoring_grafana_folder_title: LV3
monitoring_grafana_dashboard_dir: /var/lib/grafana/dashboards/lv3
monitoring_grafana_dashboard_file: /var/lib/grafana/dashboards/lv3/{{ platform_identity.config_prefix }}-platform-overview.json
monitoring_grafana_dashboard_uid: "{{ platform_identity.config_prefix }}-platform-overview"
monitoring_grafana_dashboard_title: LV3 Platform Overview
monitoring_grafana_public_url: "https://{{ hostvars[groups['proxmox_hosts'][0]].platform_service_topology.grafana.public_hostname }}"
monitoring_grafana_vm_dashboard_dir: /var/lib/grafana/dashboards/lv3/vms
monitoring_grafana_mail_dashboard_file: /var/lib/grafana/dashboards/lv3/{{ platform_identity.config_prefix }}-mail-platform.json
monitoring_grafana_mail_dashboard_uid: "{{ platform_identity.config_prefix }}-mail-platform"
monitoring_grafana_mail_dashboard_title: LV3 Mail Platform
monitoring_grafana_slo_dashboard_file: /var/lib/grafana/dashboards/lv3/{{ platform_identity.config_prefix }}-slo-overview.json
monitoring_grafana_slo_dashboard_uid: "{{ platform_identity.config_prefix }}-slo-overview"
monitoring_grafana_slo_dashboard_title: LV3 SLO Overview
monitoring_grafana_slo_dashboard_source_file: "{{ monitoring_repo_root }}/config/grafana/dashboards/slo-overview.json"
monitoring_grafana_capacity_dashboard_file: /var/lib/grafana/dashboards/lv3/{{ platform_identity.config_prefix }}-capacity-overview.json
monitoring_grafana_capacity_dashboard_uid: "{{ platform_identity.config_prefix }}-capacity-overview"
monitoring_grafana_capacity_dashboard_title: Capacity Overview
monitoring_grafana_capacity_dashboard_source_file: "{{ monitoring_repo_root }}/config/grafana/dashboards/capacity-overview.json"
monitoring_grafana_log_canary_dashboard_file: /var/lib/grafana/dashboards/lv3/{{ platform_identity.config_prefix }}-log-canary-overview.json
monitoring_grafana_log_canary_dashboard_uid: "{{ platform_identity.config_prefix }}-log-canary-overview"
monitoring_grafana_log_canary_dashboard_title: LV3 Log Canary
monitoring_grafana_log_canary_dashboard_source_file: "{{ monitoring_repo_root }}/config/grafana/dashboards/log-canary-overview.json"
monitoring_influxdb_admin_user: "{{ platform_identity.config_prefix }}-monitoring-admin"
monitoring_influxdb_admin_password_file: "/etc/{{ platform_identity.unix_prefix }}/monitoring/influxdb-admin-password"
monitoring_influxdb_operator_token_file: "/etc/{{ platform_identity.unix_prefix }}/monitoring/influxdb-operator.token"
monitoring_influxdb_cli_configs_file: /root/.influxdbv2/configs
monitoring_influxdb_legacy_org_name: ""
monitoring_influxdb_proxmox_writer_token_file: "/etc/{{ platform_identity.unix_prefix }}/monitoring/influxdb-proxmox-writer.token"
monitoring_influxdb_proxmox_writer_description: "{{ platform_identity.config_prefix }}-proxmox-writer"
monitoring_influxdb_guest_writer_token_file: "/etc/{{ platform_identity.unix_prefix }}/monitoring/influxdb-guest-writer.token"
monitoring_influxdb_guest_writer_description: "{{ platform_identity.config_prefix }}-guest-writer"
monitoring_influxdb_grafana_reader_description: "{{ platform_identity.config_prefix }}-grafana-reader"
monitoring_secret_migration_files:
  - "{{ monitoring_grafana_admin_password_file }}"
  - "{{ monitoring_influxdb_admin_password_file }}"
  - "{{ monitoring_influxdb_operator_token_file }}"
  - "{{ monitoring_influxdb_proxmox_writer_token_file }}"
  - "{{ monitoring_influxdb_guest_writer_token_file }}"
  - "{{ monitoring_grafana_datasource_token_file }}"
monitoring_loki_config_file: /etc/loki/config.yml
monitoring_loki_data_dir: /var/lib/loki
monitoring_loki_http_url: http://127.0.0.1:3100
monitoring_loki_port: "{{ hostvars[groups['proxmox_hosts'][0]].platform_port_assignments.monitoring_loki_port }}"
# gRPC port used internally for querier→query-scheduler communication.
# Must match the Loki server.grpc_listen_port (default 9095).
monitoring_loki_grpc_port: 9095
monitoring_loki_filesystem_schema_start_date: "2026-03-22"
monitoring_loki_minio_schema_cutover_date: "2026-03-30"
monitoring_loki_minio_access_key_id: lokichunks
monitoring_loki_minio_secret_key_local_file: "{{ repo_shared_local_root }}/monitoring/loki-minio-secret-key.txt"
monitoring_loki_minio_bucket_name: loki-chunks
monitoring_loki_minio_region: us-east-1
monitoring_loki_minio_endpoint: >-
  {{ hostvars[groups['proxmox_hosts'][0]].platform_service_topology.minio.private_ip }}:{{
    hostvars[groups['proxmox_hosts'][0]].platform_port_assignments.minio_api_port
  }}
monitoring_loki_retention_default: 720h
monitoring_loki_retention_edge_access: 720h
monitoring_loki_retention_control_plane: 720h
# Where the Loki compactor stores delete requests.
# Production uses "s3" (MinIO backend). Forks without MinIO must set this
# to "filesystem" via fork-overrides.yml (see ADR 0424).
monitoring_loki_delete_request_store: s3
monitoring_loki_canary_service_name: loki-canary
monitoring_loki_canary_service_file: /etc/systemd/system/loki-canary.service
monitoring_loki_canary_metrics_port: 3500
monitoring_loki_canary_interval: 15s
monitoring_loki_canary_wait: 3m
monitoring_loki_canary_max_wait: 5m
monitoring_loki_canary_query_timeout: 30s
monitoring_loki_canary_metric_test_interval: 2m
monitoring_loki_canary_metric_test_range: 15m
monitoring_loki_canary_spot_check_interval: 2m
monitoring_loki_canary_spot_check_max: 30m
monitoring_loki_canary_spot_check_query_rate: 1m
monitoring_loki_canary_line_size: 256
monitoring_loki_canary_log_selector: >-
  {name="loki-canary",stream="stdout"}
monitoring_grafana_annotation_retention: 2160h
monitoring_prometheus_service_name: "{{ platform_identity.config_prefix }}-prometheus"
monitoring_prometheus_service_file: /etc/systemd/system/{{ platform_identity.config_prefix }}-prometheus.service
monitoring_prometheus_legacy_service_names: []
monitoring_prometheus_config_file: /etc/prometheus/prometheus.yml
monitoring_prometheus_data_dir: /var/lib/prometheus
monitoring_prometheus_rules_dir: /etc/prometheus/rules
monitoring_prometheus_file_sd_dir: /etc/prometheus/file_sd
monitoring_prometheus_slo_rules_file: /etc/prometheus/rules/slo-rules.yml
monitoring_prometheus_slo_rules_source_file: "{{ monitoring_repo_root }}/config/prometheus/rules/slo_rules.yml"
monitoring_prometheus_slo_alerts_file: /etc/prometheus/rules/slo-alerts.yml
monitoring_prometheus_slo_alerts_source_file: "{{ monitoring_repo_root }}/config/prometheus/rules/slo_alerts.yml"
monitoring_prometheus_slo_targets_file: /etc/prometheus/file_sd/slo-targets.yml
monitoring_prometheus_slo_targets_source_file: "{{ monitoring_repo_root }}/config/prometheus/file_sd/slo_targets.yml"
monitoring_prometheus_https_tls_alerts_file: /etc/prometheus/rules/https-tls-alerts.yml
monitoring_prometheus_https_tls_alerts_source_file: "{{ monitoring_repo_root }}/config/prometheus/rules/https_tls_alerts.yml"
monitoring_prometheus_https_tls_targets_file: /etc/prometheus/file_sd/https-tls-targets.yml
monitoring_prometheus_https_tls_targets_source_file: "{{ monitoring_repo_root }}/config/prometheus/file_sd/https_tls_targets.yml"
monitoring_prometheus_retention_time: 15d
monitoring_prometheus_enable_features:
  - exemplar-storage
  - native-histograms
monitoring_prometheus_listen_address: 0.0.0.0:9090
monitoring_prometheus_remote_write_url: >-
  http://{{ hostvars[groups['proxmox_hosts'][0]].platform_service_topology.grafana.private_ip }}:9090/api/v1/write
# --- Prometheus scrape surface that is data-driven instead of hard-coded in prometheus.yml.j2 ---
# Catalog-derived liveness/readiness blackbox jobs (config/health-probe-catalog.json). An empty list renders every
# http/tcp probe in the catalog (legacy behaviour); a non-empty list restricts the jobs to these service ids.
monitoring_prometheus_health_probe_service_ids: []
# RE2 regex matched against __address__ of the slo-blackbox and https-tls-blackbox file_sd targets. Matching targets
# are dropped at relabel time (the generated file_sd source files stay untouched). Empty string disables the rule.
monitoring_prometheus_blackbox_drop_address_regex: ""
# Private address of the nginx edge. The SLO and TLS file_sd sources (config/slo-probe-overlay.json) probe edge-published
# endpoints through it with the public hostname as Host/SNI, because the monitoring VM cannot reach the public address.
monitoring_slo_edge_connect_host: "{{ hostvars[groups['proxmox_hosts'][0]].platform_service_topology.nginx_edge.private_ip }}"
# file_sd file feeding the public-edge-critical blackbox job. Empty string disables the job. The file itself is not
# managed by this role.
monitoring_prometheus_public_edge_targets_file: ""
# Extra scrape_config entries rendered verbatim (as YAML) after the catalog jobs. Use for static fleet exporters that
# inventory discovery does not cover. Each item is a normal Prometheus scrape_config mapping.
monitoring_prometheus_extra_scrape_jobs: []
# remote_write destinations rendered at the end of prometheus.yml. Each item: url (required), basic_auth
# {username, password_file}, queue_config {capacity, max_shards}. Never put a password in this list: reference a
# password_file (see monitoring_prometheus_remote_write_credentials).
monitoring_prometheus_remote_write_targets: []
# systemd encrypted credentials handed to the Prometheus unit through a drop-in so password_file can point at
# /run/credentials/<unit>/<name>. The encrypted blob must already exist on the host; it is never created or stored here.
# Each item: name, encrypted_file.
monitoring_prometheus_remote_write_credentials: []
monitoring_prometheus_credentials_dropin_file: "{{ monitoring_prometheus_service_file }}.d/openobserve.conf"
# promtool validates every rendered prometheus.yml before it replaces the live file.
monitoring_prometheus_config_validate_command: promtool check config %s
# --- Scanopy-driven service discovery (see docs/runbooks/scanopy-service-discovery.md) ---
monitoring_scanopy_sd_enabled: false
monitoring_scanopy_sd_install_dir: /opt/scanopy-sd
monitoring_scanopy_sd_script_file: "{{ monitoring_scanopy_sd_install_dir }}/scanopy_sd.py"
monitoring_scanopy_sd_readme_file: "{{ monitoring_scanopy_sd_install_dir }}/README"
monitoring_scanopy_sd_extra_endpoints_file: "{{ monitoring_scanopy_sd_install_dir }}/extra-endpoints.json"
monitoring_scanopy_sd_ignored_hosts_file: "{{ monitoring_scanopy_sd_install_dir }}/ignored-hosts.json"
monitoring_scanopy_sd_state_dir: /var/lib/scanopy-sd
monitoring_scanopy_sd_config_dir: /etc/scanopy-sd
monitoring_scanopy_sd_api_key_file: "{{ monitoring_scanopy_sd_config_dir }}/api-key"
# Controller-local source for the Scanopy Viewer API key (the vault secret scanopy-inventory-reader-api-key, shared with
# fleet-runner). The key is never stored in git. When this file is absent or empty the role requires an already-provisioned
# non-empty key on the host (root 0600) and leaves its content untouched.
monitoring_scanopy_sd_api_key_local_file: "{{ repo_shared_local_root }}/scanopy/api-key.txt"
monitoring_scanopy_sd_textfile_dir: /var/lib/prometheus/node-exporter
monitoring_scanopy_sd_node_targets_file: "{{ monitoring_prometheus_file_sd_dir }}/scanopy-node.json"
monitoring_scanopy_sd_blackbox_targets_file: "{{ monitoring_prometheus_file_sd_dir }}/scanopy-blackbox.json"
monitoring_scanopy_sd_service_name: scanopy-sd.service
monitoring_scanopy_sd_timer_name: scanopy-sd.timer
monitoring_scanopy_sd_service_file: /etc/systemd/system/scanopy-sd.service
monitoring_scanopy_sd_timer_file: /etc/systemd/system/scanopy-sd.timer
monitoring_scanopy_sd_interval: 5min
# Optional Environment= overrides for the generator (SCANOPY_URL, SD_MIN_RATIO, ...). Empty keeps the script defaults.
monitoring_scanopy_sd_environment: {}
# Known-real endpoints Scanopy has no port data for; rendered into extra-endpoints.json.
monitoring_scanopy_sd_extra_endpoints: []
# Inventory host names that are switched off on purpose (an abandoned replica, say): no node_exporter is expected there, so
# NodeExporterMissing stays quiet. Rendered into ignored-hosts.json; a host that answers is still scraped normally.
monitoring_scanopy_sd_ignored_hosts: []
# RE2 regex matched against __address__ of scanopy-node targets. Matching targets are dropped so that exporters kept
# as static jobs in monitoring_prometheus_extra_scrape_jobs are never scraped twice. Empty string disables the rule.
monitoring_scanopy_sd_node_drop_address_regex: ""
# --- Scanopy Docker bridge subnet tagging (see docs/runbooks/scanopy-service-discovery.md) ---
# Tags every Docker bridge subnet with `docker-bridge` so the Scanopy topology (which hides subnets by that tag) stays tidy.
monitoring_scanopy_retag_enabled: false
monitoring_scanopy_retag_install_dir: /opt/scanopy-retag
monitoring_scanopy_retag_script_file: "{{ monitoring_scanopy_retag_install_dir }}/scanopy_retag.py"
monitoring_scanopy_retag_readme_file: "{{ monitoring_scanopy_retag_install_dir }}/README"
monitoring_scanopy_retag_config_dir: /etc/scanopy-retag
monitoring_scanopy_retag_api_key_file: "{{ monitoring_scanopy_retag_config_dir }}/api-key"
# Controller-local source for the retag API key. It must be allowed to assign tags (Member or higher), so it is NOT the
# Viewer key used by scanopy-sd. Never stored in git. When this file is absent or empty the role requires an
# already-provisioned non-empty key on the host (root 0600) and leaves its content untouched.
monitoring_scanopy_retag_api_key_local_file: "{{ repo_shared_local_root }}/scanopy/retag-api-key.txt"
monitoring_scanopy_retag_textfile_dir: "{{ monitoring_scanopy_sd_textfile_dir }}"
monitoring_scanopy_retag_service_name: scanopy-retag.service
monitoring_scanopy_retag_timer_name: scanopy-retag.timer
monitoring_scanopy_retag_service_file: /etc/systemd/system/scanopy-retag.service
monitoring_scanopy_retag_timer_file: /etc/systemd/system/scanopy-retag.timer
monitoring_scanopy_retag_interval: 15min
# Optional Environment= overrides for the job (SCANOPY_URL, RETAG_TAG_NAME, RETAG_MAX_PER_RUN). Empty keeps the script defaults.
monitoring_scanopy_retag_environment: {}
# --- External Scanopy discovery trigger (see docs/runbooks/scanopy-service-discovery.md) ---
# Scanopy's own scheduler does not fire reliably, so a timer starts each daemon's discovery at a fixed daily UTC slot via the API.
monitoring_scanopy_discover_enabled: false
monitoring_scanopy_discover_install_dir: /opt/scanopy-discover
monitoring_scanopy_discover_script_file: "{{ monitoring_scanopy_discover_install_dir }}/scanopy_discover.py"
monitoring_scanopy_discover_readme_file: "{{ monitoring_scanopy_discover_install_dir }}/README"
monitoring_scanopy_discover_schedule_file: "{{ monitoring_scanopy_discover_install_dir }}/schedule.json"
# Reuses the key the retag tasks install; this role never installs or replaces a key.
monitoring_scanopy_discover_api_key_file: "{{ monitoring_scanopy_retag_api_key_file }}"
monitoring_scanopy_discover_textfile_dir: "{{ monitoring_scanopy_sd_textfile_dir }}"
monitoring_scanopy_discover_service_name: scanopy-discover.service
monitoring_scanopy_discover_timer_name: scanopy-discover.timer
monitoring_scanopy_discover_service_file: /etc/systemd/system/scanopy-discover.service
monitoring_scanopy_discover_timer_file: /etc/systemd/system/scanopy-discover.timer
# Minutes 2/17/32/47: just after the quarter-hour slots, so Scanopy's own scheduler (if it fires) has already updated last_run.
monitoring_scanopy_discover_on_calendar: "*:02/15"
# Optional Environment= overrides for the job (SCANOPY_URL, DISCOVER_CATCHUP_HOURS, DISCOVER_MAX_STARTS_PER_RUN).
monitoring_scanopy_discover_environment: {}
# {Scanopy daemon name: "HH:MM" UTC}; set per host in inventory/host_vars.
monitoring_scanopy_discover_schedule: {}
# --- Automatic Scanopy onboarding of new Proxmox guests (see docs/runbooks/scanopy-service-discovery.md, "Automatic onboarding") ---
# Lists the running guests of every hypervisor through a forced-command SSH key and installs the Scanopy daemon in guests that
# have none. The hypervisor side (scanopy_onboard_hv.py + the key line in root's authorized_keys) is installed per hypervisor,
# outside this role; the runbook has the procedure.
monitoring_scanopy_onboard_enabled: false
monitoring_scanopy_onboard_install_dir: /opt/scanopy-onboard
monitoring_scanopy_onboard_script_file: "{{ monitoring_scanopy_onboard_install_dir }}/scanopy_onboard.py"
monitoring_scanopy_onboard_hv_script_file: "{{ monitoring_scanopy_onboard_install_dir }}/scanopy_onboard_hv.py"
monitoring_scanopy_onboard_readme_file: "{{ monitoring_scanopy_onboard_install_dir }}/README"
monitoring_scanopy_onboard_fleets_file: "{{ monitoring_scanopy_onboard_install_dir }}/fleets.json"
monitoring_scanopy_onboard_config_dir: /etc/scanopy-onboard
monitoring_scanopy_onboard_ssh_key_file: "{{ monitoring_scanopy_onboard_config_dir }}/id_ed25519"
monitoring_scanopy_onboard_state_dir: /var/lib/scanopy-onboard
monitoring_scanopy_onboard_api_key_file: "{{ monitoring_scanopy_retag_api_key_file }}"
monitoring_scanopy_onboard_textfile_dir: "{{ monitoring_scanopy_sd_textfile_dir }}"
monitoring_scanopy_onboard_service_name: scanopy-onboard.service
monitoring_scanopy_onboard_timer_name: scanopy-onboard.timer
monitoring_scanopy_onboard_service_file: /etc/systemd/system/scanopy-onboard.service
monitoring_scanopy_onboard_timer_file: /etc/systemd/system/scanopy-onboard.timer
# Minutes 7/22/37/52: between the discovery trigger runs (2/17/32/47).
monitoring_scanopy_onboard_on_calendar: "*:07/15"
# Optional Environment= overrides (ONBOARD_MAX_INSTALLS_PER_RUN, ONBOARD_MIN_UNCOVERED_RUNS, ONBOARD_SLOT_FROM, SCANOPY_URL).
monitoring_scanopy_onboard_environment: {}
# Scanopy site and Docker credential new daemons are attached to; "exclude" entries are "<fleet>:<vm|ct>:<id>".
monitoring_scanopy_onboard_site_id: ""
monitoring_scanopy_onboard_docker_credential_id: ""
monitoring_scanopy_onboard_exclude: []
# [{name, ssh: "root@host", port, relay_url}] one per hypervisor; set per host in inventory/host_vars.
monitoring_scanopy_onboard_fleets: []
# --- Nightly Scanopy database backup (see docs/runbooks/scanopy-service-discovery.md, "Database backup") ---
# The Scanopy Postgres lives on the 0docker hypervisor, which PBS does not back up. The monitoring VM (another fleet) pulls a
# pg_dump every night through a forced-command SSH key; the hypervisor side (scanopy_backup_hv.sh + key line) is installed outside
# this role.
monitoring_scanopy_backup_enabled: false
monitoring_scanopy_backup_install_dir: /opt/scanopy-backup
monitoring_scanopy_backup_script_file: "{{ monitoring_scanopy_backup_install_dir }}/scanopy_backup.py"
monitoring_scanopy_backup_hv_script_file: "{{ monitoring_scanopy_backup_install_dir }}/scanopy_backup_hv.sh"
monitoring_scanopy_backup_readme_file: "{{ monitoring_scanopy_backup_install_dir }}/README"
monitoring_scanopy_backup_config_dir: /etc/scanopy-backup
monitoring_scanopy_backup_ssh_key_file: "{{ monitoring_scanopy_backup_config_dir }}/id_ed25519"
monitoring_scanopy_backup_dir: /var/backups/scanopy
monitoring_scanopy_backup_textfile_dir: "{{ monitoring_scanopy_sd_textfile_dir }}"
monitoring_scanopy_backup_service_name: scanopy-backup.service
monitoring_scanopy_backup_timer_name: scanopy-backup.timer
monitoring_scanopy_backup_service_file: /etc/systemd/system/scanopy-backup.service
monitoring_scanopy_backup_timer_file: /etc/systemd/system/scanopy-backup.timer
monitoring_scanopy_backup_on_calendar: "*-*-* *:20:00 UTC"
# Optional Environment= overrides (BACKUP_SSH, BACKUP_SSH_PORT, BACKUP_KEEP_HOURS, BACKUP_KEEP_DAYS, BACKUP_MIN_BYTES).
monitoring_scanopy_backup_environment: {}
# Weekly restore drill: the newest dump is restored into a throwaway Postgres container (no network) and its core tables are
# counted. Needs Docker on this VM.
monitoring_scanopy_backup_drill_enabled: false
monitoring_scanopy_backup_drill_script_file: "{{ monitoring_scanopy_backup_install_dir }}/scanopy_backup_drill.py"
monitoring_scanopy_backup_drill_service_name: scanopy-backup-drill.service
monitoring_scanopy_backup_drill_timer_name: scanopy-backup-drill.timer
monitoring_scanopy_backup_drill_service_file: /etc/systemd/system/scanopy-backup-drill.service
monitoring_scanopy_backup_drill_timer_file: /etc/systemd/system/scanopy-backup-drill.timer
monitoring_scanopy_backup_drill_on_calendar: "Sun *-*-* 04:10:00 UTC"
# Image of the throwaway Postgres; keep the major version equal to the Scanopy database (17).
monitoring_scanopy_backup_drill_image: postgres:17-alpine
# --- Warm standby of the Scanopy server (see docs/runbooks/scanopy-service-discovery.md, "Warm standby") ---
# The newest dump from scanopy-backup is restored into a persistent Postgres container here every hour; the standby server
# (compose profile `failover`) stays stopped until a failover and is boot-tested weekly. Needs Docker on this VM and the backup role.
monitoring_scanopy_standby_enabled: false
monitoring_scanopy_standby_install_dir: /opt/scanopy-standby
monitoring_scanopy_standby_state_dir: /var/lib/scanopy-standby
