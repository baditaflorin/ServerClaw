# Role Metadata File: monitoring_vm/meta/argument_specs.yml
# Purpose: Declare the supported input contract for the monitoring VM role and its Loki Canary extensions.
# Use case: Validated before role execution so monitoring stack converges fail early on missing or malformed inputs.
#
# Inputs (required):
#   - monitoring_* role arguments: Service package, path, URL, and dashboard values consumed by the role.
#
# Inputs (optional):
#   - monitoring_loki_canary_* role arguments: Canary timing and selector overrides for ADR 0250.
#
# Outputs:
#   - Enforces the argument schema that gates monitoring VM role execution.
#
# Idempotency: Fully idempotent
#              Schema-only metadata; does not mutate remote state.
#
# Dependencies:
#   - ADR 0011: Defines the monitoring role surface.
#   - ADR 0250: Extends the role contract for Loki Canary assurance.
#   - Requires: ansible-core argument spec validation support.
#
# Related ADRs: 0011, 0250
# Related Runbooks: docs/runbooks/monitoring-stack.md
#
# Author: LV3 Platform
# Last Updated: 2026-03-28
---
argument_specs:
  main:
    short_description: Install and configure the monitoring VM service stack.
    options:
      monitoring_stack_packages:
        type: list
        elements: str
        required: true
        description:
          - Packages installed for the monitoring stack.
      monitoring_stack_dir:
        type: path
        required: true
        description:
          - Directory that stores monitoring secrets and rendered state.
      monitoring_grafana_admin_user:
        type: str
        required: true
        description:
          - Admin username configured for Grafana.
      monitoring_grafana_dashboard_dir:
        type: path
        required: false
        description:
          - Base directory containing managed Grafana dashboards.
      monitoring_grafana_dashboard_uid:
        type: str
        required: true
        description:
          - UID assigned to the primary platform overview dashboard.
      monitoring_grafana_dashboard_file:
        type: path
        required: true
        description:
          - Path where the primary platform overview dashboard is rendered.
      monitoring_grafana_public_url:
        type: str
        required: false
        description:
          - Public HTTPS base URL used to verify unauthenticated Grafana behavior through the edge.
      monitoring_grafana_vm_dashboard_dir:
        type: path
        required: true
        description:
          - Directory that stores per-VM dashboard JSON definitions.
      monitoring_grafana_slo_dashboard_file:
        type: path
        required: true
        description:
          - Path where the generated SLO overview dashboard is copied before import.
      monitoring_grafana_log_canary_dashboard_file:
        type: path
        required: true
        description:
          - Path where the generated log-canary overview dashboard is copied before import.
      monitoring_grafana_loki_datasource_name:
        type: str
        required: true
        description:
          - Grafana datasource name used for Loki logs.
      monitoring_grafana_prometheus_datasource_uid:
        type: str
        required: true
        description:
          - Grafana datasource UID used for Prometheus graphs.
      monitoring_grafana_tempo_datasource_uid:
        type: str
        required: true
        description:
          - Grafana datasource UID used for Tempo traces.
      monitoring_prometheus_legacy_service_names:
        type: list
        elements: str
        required: false
        description:
          - Explicit legacy Prometheus systemd units to stop and disable before starting the canonical unit.
      monitoring_prometheus_0own_node_exporter_target:
        type: dict
        required: false
        description:
          - Production-only 0own node-exporter target applied by the narrow scrape-target playbook.
      monitoring_prometheus_health_probe_service_ids:
        type: list
        elements: str
        required: false
        description:
          - Catalog service ids whose liveness and readiness blackbox jobs are rendered; an empty list renders every http and tcp probe.
      monitoring_prometheus_blackbox_drop_address_regex:
        type: str
        required: false
        description:
          - RE2 regex; slo-blackbox and https-tls-blackbox targets whose address matches are dropped at relabel time.
      monitoring_slo_edge_connect_host:
        type: str
        required: false
        description:
          - Private address of the nginx edge, substituted into the SLO and HTTPS/TLS probe targets of edge-published endpoints.
      monitoring_prometheus_public_edge_targets_file:
        type: str
        required: false
        description:
          - file_sd file for the public-edge-critical blackbox job; empty disables the job. The file is maintained outside this role.
      monitoring_prometheus_extra_scrape_jobs:
        type: list
        elements: dict
        required: false
        description:
          - Extra Prometheus scrape_config mappings rendered verbatim for static exporters that inventory discovery does not cover.
      monitoring_prometheus_remote_write_targets:
        type: list
        elements: dict
        required: false
        description:
          - remote_write destinations (url, basic_auth.username, basic_auth.password_file, queue_config). Secrets are referenced by password_file only.
      monitoring_prometheus_remote_write_credentials:
        type: list
        elements: dict
        required: false
        description:
          - Encrypted systemd credentials (name, encrypted_file) loaded into the Prometheus unit; the encrypted blob must already exist on the host.
      monitoring_prometheus_config_validate_command:
        type: str
        required: false
        description:
          - Validation command (with a %s placeholder) run against every rendered prometheus.yml before it replaces the live file.
      monitoring_scanopy_sd_enabled:
        type: bool
        required: false
        description:
          - Install the Scanopy service-discovery generator and render the Scanopy file_sd scrape jobs.
      monitoring_scanopy_sd_api_key_local_file:
        type: path
        required: false
        description:
          - Controller-local Scanopy Viewer API key; when absent the host must already hold a root-only 0600 key.
      monitoring_scanopy_sd_extra_endpoints:
        type: list
        elements: dict
        required: false
        description:
          - Known-real endpoints that Scanopy has no port data for, written to extra-endpoints.json.
      monitoring_scanopy_sd_node_drop_address_regex:
        type: str
        required: false
        description:
          - RE2 regex; Scanopy node targets matching it are dropped because the exporter is kept as a static job.
      monitoring_scanopy_sd_environment:
        type: dict
        required: false
        description:
          - Optional Environment= overrides for the generator unit (for example SCANOPY_URL).
      monitoring_scanopy_retag_enabled:
        type: bool
        required: false
        description:
          - Install the job that tags Docker bridge subnets in Scanopy as docker-bridge (hidden in the topology) and its timer.
      monitoring_scanopy_retag_api_key_local_file:
        type: path
        required: false
        description:
          - Controller-local Scanopy API key allowed to assign tags (Member or higher); when absent the host must already hold a root-only 0600 key.
      monitoring_scanopy_retag_interval:
        type: str
        required: false
        description:
          - systemd time span between retag runs (default 15min).
      monitoring_scanopy_retag_environment:
        type: dict
        required: false
        description:
          - Optional Environment= overrides for the retag unit (for example SCANOPY_URL, RETAG_TAG_NAME, RETAG_MAX_PER_RUN).
      monitoring_scanopy_discover_enabled:
        type: bool
        required: false
        description:
          - Install the job and timer that start Scanopy discovery at a fixed daily UTC slot per daemon, independent of Scanopy's scheduler.
      monitoring_scanopy_discover_schedule:
        type: dict
        required: false
        description:
          - Map of Scanopy daemon name to the UTC start time (HH:MM) of its daily discovery.
      monitoring_scanopy_discover_on_calendar:
        type: str
        required: false
        description:
          - systemd OnCalendar expression of the timer (default *:02/15, every 15 minutes).
      monitoring_scanopy_discover_environment:
        type: dict
        required: false
        description:
          - Optional Environment= overrides for the discover unit (for example SCANOPY_URL, DISCOVER_CATCHUP_HOURS).
      monitoring_scanopy_onboard_enabled:
        type: bool
        required: false
        description:
          - Install the job and timer that install the Scanopy daemon in new Proxmox guests through the hypervisors' forced-command key.
      monitoring_scanopy_onboard_fleets:
        type: list
        elements: dict
        required: false
        description:
          - One entry per hypervisor with name, ssh (user@host), port and relay_url (the Scanopy relay the guests of that fleet poll).
      monitoring_scanopy_onboard_site_id:
        type: str
        required: false
        description:
          - Scanopy site id new daemons are provisioned in.
      monitoring_scanopy_onboard_docker_credential_id:
        type: str
        required: false
        description:
          - Scanopy credential id attached to hosts that run Docker (empty skips the attach).
      monitoring_scanopy_onboard_exclude:
        type: list
        elements: str
        required: false
        description:
          - Guests the job must ignore, as "<fleet>:<vm|ct>:<id>".
      monitoring_scanopy_onboard_on_calendar:
        type: str
        required: false
        description:
          - systemd OnCalendar expression of the timer (default *:07/15).
      monitoring_scanopy_onboard_environment:
        type: dict
        required: false
        description:
          - Optional Environment= overrides for the onboard unit (ONBOARD_MAX_INSTALLS_PER_RUN, ONBOARD_MIN_UNCOVERED_RUNS, ONBOARD_SLOT_FROM).
      monitoring_scanopy_backup_enabled:
        type: bool
        required: false
        description:
          - Install the job and timer that pull a nightly dump of the Scanopy database from the 0docker hypervisor to this VM.
      monitoring_scanopy_backup_on_calendar:
        type: str
        required: false
        description:
          - systemd OnCalendar expression of the timer (default every day 03:20 UTC).
      monitoring_scanopy_backup_environment:
        type: dict
        required: false
        description:
          - Optional Environment= overrides for the backup unit (BACKUP_SSH, BACKUP_SSH_PORT, BACKUP_KEEP, BACKUP_MIN_BYTES).
      monitoring_scanopy_backup_drill_enabled:
        type: bool
        required: false
        description:
          - Install the weekly timer that restores the newest Scanopy dump into a throwaway Postgres container and checks the core tables.
      monitoring_scanopy_backup_drill_on_calendar:
        type: str
        required: false
        description:
          - systemd OnCalendar expression of the drill timer (default Sundays 04:10 UTC).
      monitoring_scanopy_backup_drill_image:
        type: str
        required: false
        description:
          - Image of the throwaway Postgres (same major version as the Scanopy database).
      monitoring_influxdb_url:
        type: str
        required: true
        description:
          - Base URL for the managed InfluxDB instance.
      monitoring_influxdb_cli_configs_file:
        type: path
        required: false
        description:
          - Root CLI configuration used only as a validated recovery source for a stale operator-token file.
      monitoring_influxdb_legacy_org_name:
        type: str
        required: false
        description:
          - Explicit legacy organization name that may be renamed to monitoring_influxdb_org when the desired organization is absent.
      monitoring_influxdb_org:
        type: str
        required: true
        description:
          - InfluxDB organization name used for monitoring data.
      monitoring_influxdb_bucket:
        type: str
        required: true
        description:
          - InfluxDB bucket used for monitoring data.
      monitoring_loki_config_file:
        type: path
        required: true
        description:
          - Loki configuration file rendered by the role.
      monitoring_loki_data_dir:
        type: path
        required: true
        description:
          - Persistent data directory used by Loki.
      monitoring_loki_http_url:
        type: str
        required: true
        description:
          - Guest-local Loki HTTP base URL used for verification.
      monitoring_loki_canary_service_name:
        type: str
        required: true
        description:
          - Systemd service name used by the managed Loki Canary runtime.
      monitoring_loki_canary_service_file:
        type: path
        required: true
        description:
          - Systemd service unit rendered for Loki Canary.
      monitoring_loki_retention_default:
        type: str
        required: false
        description:
          - Default Loki retention window applied to unmatched streams.
      monitoring_loki_retention_edge_access:
        type: str
        required: false
        description:
          - Loki retention window applied to edge access logs.
      monitoring_loki_retention_control_plane:
        type: str
        required: false
        description:
          - Loki retention window applied to control-plane streams.
      monitoring_grafana_annotation_retention:
        type: str
        required: false
        description:
          - Grafana annotation max_age setting.
      monitoring_prometheus_config_file:
        type: path
        required: true
        description:
          - Prometheus configuration file rendered by the role.
      monitoring_prometheus_rules_dir:
        type: path
        required: true
        description:
          - Directory where Prometheus rule files are copied.
      monitoring_prometheus_file_sd_dir:
        type: path
        required: true
        description:
          - Directory where Prometheus file-based service discovery definitions are copied.
      monitoring_blackbox_exporter_config_file:
        type: path
        required: true
        description:
          - Blackbox exporter configuration file copied by the role.
      monitoring_blackbox_exporter_env_file:
        type: path
        required: true
        description:
          - Environment file used to pin blackbox exporter runtime arguments.
      monitoring_tempo_deb_url:
        type: str
        required: true
        description:
          - Download URL for the pinned Tempo package.
      monitoring_tempo_deb_checksum:
        type: str
        required: true
        description:
          - Checksum used to verify the pinned Tempo package.
      monitoring_tempo_config_file:
        type: path
        required: true
        description:
          - Tempo configuration file rendered by the role.
      monitoring_tempo_trace_retention:
        type: str
        required: false
        description:
          - Tempo block retention window used by the compactor.
      monitoring_otelcol_deb_url:
        type: str
        required: true
        description:
          - Download URL for the pinned OpenTelemetry Collector package.
      monitoring_otelcol_deb_checksum:
        type: str
        required: true
        description:
          - Checksum used to verify the pinned OpenTelemetry Collector package.
      monitoring_otelcol_config_file:
        type: path
        required: true
        description:
          - Collector configuration file rendered by the role.
