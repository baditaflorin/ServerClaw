---
# Purpose: Preserve one monitoring credential while moving to the ADR 0438 POSIX-safe secret directory.
# Use case: Included before Grafana and InfluxDB read or reconcile any managed credential.
# Inputs: monitoring_secret_contract with canonical_file and legacy_files.
# Outputs: The canonical file exists when an accepted legacy copy is available.
# Idempotency: Fully idempotent; an existing canonical credential is never overwritten.
# Dependencies: ADR 0438 identity flavors and monitoring_vm secret path defaults.
- name: Check the canonical monitoring secret {{ monitoring_secret_contract.canonical_file | basename }}
  ansible.builtin.stat:
    path: "{{ monitoring_secret_contract.canonical_file }}"
  register: monitoring_canonical_secret_stat
  no_log: true

- name: Check legacy monitoring secret candidates for {{ monitoring_secret_contract.canonical_file | basename }}
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ monitoring_secret_contract.legacy_files }}"
  register: monitoring_legacy_secret_stats
  when: item != monitoring_secret_contract.canonical_file
  no_log: true

- name: Select the first legacy monitoring secret for {{ monitoring_secret_contract.canonical_file | basename }}
  ansible.builtin.set_fact:
    monitoring_selected_legacy_secret_file: >-
      {{
        monitoring_legacy_secret_stats.results
        | default([])
        | selectattr('stat', 'defined')
        | selectattr('stat.isreg', 'defined')
        | selectattr('stat.isreg', 'equalto', true)
        | map(attribute='item')
        | first
        | default('')
      }}
  no_log: true

- name: Migrate the legacy monitoring secret {{ monitoring_secret_contract.canonical_file | basename }}
  ansible.builtin.copy:
    src: "{{ monitoring_selected_legacy_secret_file }}"
    dest: "{{ monitoring_secret_contract.canonical_file }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - not monitoring_canonical_secret_stat.stat.exists
    - monitoring_selected_legacy_secret_file | length > 0
  no_log: true
