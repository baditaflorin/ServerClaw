# Role Task File: monitoring_vm/tasks/scanopy_sd.yml
# Purpose: Install the Scanopy-to-Prometheus service-discovery generator, its systemd timer, and its Prometheus rules.
# Use case: Included by the monitoring_vm role when monitoring_scanopy_sd_enabled is true so a monitoring converge keeps
#           the inventory-derived file_sd targets that prometheus.yml.j2 references.
#
# Inputs (required):
#   - monitoring_scanopy_sd_* role defaults: install, state, config, and file_sd paths.
#   - monitoring_repo_root: repository root that holds config/prometheus/rules/.
#
# Inputs (optional):
#   - monitoring_scanopy_sd_api_key_local_file: controller-local Scanopy Viewer API key (never stored in git).
#   - monitoring_scanopy_sd_extra_endpoints / monitoring_scanopy_sd_environment: generator overrides.
#
# Outputs:
#   - /opt/scanopy-sd generator + README, /etc/scanopy-sd/api-key, /var/lib/scanopy-sd state directory,
#     scanopy-sd.service and scanopy-sd.timer, plus the inventory and Watchdog Prometheus rule files.
#
# Idempotency: Fully idempotent
#              Files are compared by content and mode; the timer is only enabled, never restarted; Prometheus is
#              reloaded (SIGHUP), not restarted, when a rule file changes.
#
# Dependencies:
#   - docs/runbooks/scanopy-service-discovery.md: describes the flow, the guards, and the rollback.
#   - Requires: python3 on the guest and a reachable Scanopy API.
#
# Related Runbooks: docs/runbooks/scanopy-service-discovery.md, docs/runbooks/monitoring-stack.md
#
# Author: LV3 Platform
# Last Updated: 2026-10-12
---
- name: Validate Scanopy service-discovery inputs
  ansible.builtin.assert:
    that:
      - monitoring_scanopy_sd_install_dir | length > 0
      - monitoring_scanopy_sd_state_dir | length > 0
      - monitoring_scanopy_sd_config_dir | length > 0
      - monitoring_scanopy_sd_api_key_file | length > 0
      - monitoring_scanopy_sd_textfile_dir | length > 0
      - monitoring_prometheus_file_sd_dir | length > 0
    fail_msg: "monitoring_scanopy_sd_enabled requires the Scanopy install, state, config, textfile, and file_sd paths."
    quiet: true

- name: Check whether a controller-local Scanopy API key is available
  ansible.builtin.stat:
    path: "{{ monitoring_scanopy_sd_api_key_local_file }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  register: monitoring_scanopy_sd_api_key_local_stat

- name: Check whether a Scanopy API key is already provisioned on the host
  ansible.builtin.stat:
    path: "{{ monitoring_scanopy_sd_api_key_file }}"
    get_checksum: false
  register: monitoring_scanopy_sd_api_key_remote_stat

# An empty or missing controller-local file is never installed: it would replace a working host key with nothing and
# turn every discovery run into a keyless failure.
- name: Decide whether the controller-local Scanopy API key is usable
  ansible.builtin.set_fact:
    monitoring_scanopy_sd_api_key_local_usable: "{{ monitoring_scanopy_sd_api_key_local_stat.stat.exists and monitoring_scanopy_sd_api_key_local_stat.stat.size > 0 }}"

- name: Refuse to run discovery without any non-empty Scanopy API key
  ansible.builtin.assert:
    that:
      - >-
        monitoring_scanopy_sd_api_key_local_usable | bool
        or (monitoring_scanopy_sd_api_key_remote_stat.stat.exists and monitoring_scanopy_sd_api_key_remote_stat.stat.size > 0)
    fail_msg: >-
      No usable Scanopy API key found. Put the key (vault secret scanopy-inventory-reader-api-key) in
      {{ monitoring_scanopy_sd_api_key_local_file }} on the control machine, or provision a non-empty
      {{ monitoring_scanopy_sd_api_key_file }} (root, 0600) on the monitoring host. An empty file is never installed and
      the key is never stored in git.
    quiet: true

- name: Ensure the Scanopy discovery directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ monitoring_scanopy_sd_install_dir }}"
      mode: "0755"
    - path: "{{ monitoring_scanopy_sd_config_dir }}"
      mode: "0700"
    - path: "{{ monitoring_scanopy_sd_state_dir }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Install the Scanopy API key from the controller-local secret file
  ansible.builtin.copy:
    src: "{{ monitoring_scanopy_sd_api_key_local_file }}"
    dest: "{{ monitoring_scanopy_sd_api_key_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: monitoring_scanopy_sd_api_key_local_usable | bool

- name: Keep an existing host-provisioned Scanopy API key private
  ansible.builtin.file:
    path: "{{ monitoring_scanopy_sd_api_key_file }}"
    owner: root
    group: root
    mode: "0600"
  when: not (monitoring_scanopy_sd_api_key_local_usable | bool)

- name: Install the Scanopy service-discovery generator
  ansible.builtin.copy:
    src: scanopy-sd/scanopy_sd.py
    dest: "{{ monitoring_scanopy_sd_script_file }}"
    owner: root
    group: root
    mode: "0755"

- name: Install the Scanopy service-discovery operator README
  ansible.builtin.copy:
    src: scanopy-sd/README
    dest: "{{ monitoring_scanopy_sd_readme_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Render the Scanopy extra-endpoints list
  ansible.builtin.template:
    src: scanopy-sd-extra-endpoints.json.j2
    dest: "{{ monitoring_scanopy_sd_extra_endpoints_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Render the Scanopy service-discovery systemd service
  ansible.builtin.template:
    src: scanopy-sd.service.j2
    dest: "{{ monitoring_scanopy_sd_service_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Render the Scanopy service-discovery systemd timer
  ansible.builtin.template:
    src: scanopy-sd.timer.j2
    dest: "{{ monitoring_scanopy_sd_timer_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Copy the Scanopy inventory Prometheus rules
  ansible.builtin.copy:
    src: "{{ monitoring_prometheus_inventory_rules_source_file }}"
    dest: "{{ monitoring_prometheus_inventory_rules_file }}"
    owner: root
    group: prometheus
    mode: "0644"
  notify: Reload Prometheus configuration

- name: Enable the Scanopy service-discovery timer
  ansible.builtin.systemd:
    name: "{{ monitoring_scanopy_sd_timer_name }}"
    enabled: true
    state: started
    daemon_reload: true
