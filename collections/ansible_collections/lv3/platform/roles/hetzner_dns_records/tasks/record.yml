---
# Purpose: Create, update, or delete one canonical Hetzner DNS record payload for the managed DNS boundary role.
# Use case: Included by `hetzner_dns_records` when reconciling a single repo-declared DNS record against the provider API.
# Inputs: `hetzner_dns_record`, `dns_provider_boundary_zone`, and the loaded provider-side record inventory.
# Outputs: A matching provider-side DNS record state for the requested name/type/value tuple.
# Idempotency: Fully idempotent; re-runs only create, update, or delete when the provider state diverges.
# Dependencies: ADR 0165 metadata standard and the `hetzner_dns_records` role entrypoint that loads provider inventory and auth context.
- name: Select existing canonical DNS records with the same name and type
  ansible.builtin.set_fact:
    dns_provider_boundary_same_name_type_records: >-
      {{
        dns_provider_boundary_existing_records
        | selectattr('record_name', 'equalto', hetzner_dns_record.name)
        | selectattr('record_type', 'equalto', hetzner_dns_record.type)
        | list
      }}

- name: Select exact canonical DNS record matches by value
  ansible.builtin.set_fact:
    dns_provider_boundary_exact_records: >-
      {{
        dns_provider_boundary_same_name_type_records
        | selectattr('record_value', 'equalto', hetzner_dns_record.value)
        | list
      }}

- name: Select canonical managed DNS records by value identity
  ansible.builtin.set_fact:
    dns_provider_boundary_matching_records: >-
      {{
        dns_provider_boundary_exact_records
        if (dns_provider_boundary_exact_records | length > 0)
        else (
          (
            dns_provider_boundary_same_name_type_records
            | selectattr('record_value', 'search', hetzner_dns_record.value_match_regex)
            | list
          )
          if (hetzner_dns_record.value_match_regex is defined)
          else (
            dns_provider_boundary_same_name_type_records
            if (hetzner_dns_record.state | default('present')) == 'present'
            else dns_provider_boundary_exact_records
          )
        )
      }}

- name: Assert the canonical DNS record match is unambiguous
  ansible.builtin.assert:
    that:
      - dns_provider_boundary_matching_records | length <= 1
    fail_msg: >-
      Multiple Hetzner DNS records matched {{ hetzner_dns_record.name }} {{ hetzner_dns_record.type }}
      for managed identity {{ hetzner_dns_record.value_match_regex | default(hetzner_dns_record.value) }}.
      Clean up duplicates before rerunning automation.

- name: Assert the desired DNS record state is supported
  ansible.builtin.assert:
    that:
      - (hetzner_dns_record.state | default('present')) in ['present', 'absent']
    fail_msg: >-
      Unsupported Hetzner DNS record state {{ hetzner_dns_record.state | default('present') }}
      for {{ hetzner_dns_record.name }} {{ hetzner_dns_record.type }}.

# Body shape for the new Hetzner Console API (api.hetzner.cloud/v1):
#   POST /v1/zones/{zone_id}/rrsets        — body: {name, type, ttl, records}
#   PUT  /v1/zones/{zone_id}/rrsets/{id}   — same body; records[] REPLACES set
#   DELETE /v1/zones/{zone_id}/rrsets/{id} — no body
# `records` is the rrset's full value list. Because this role iterates one
# desired (name,type,value) at a time, the payload below carries a single-
# entry records[] — fine for the predominant single-value rrset case.
# A multi-value rrset (e.g. multiple MX hosts) where two desired records
# share the same (name,type) would clobber each other on PUT; that's a
# known limitation tracked by ADR 0430 PR 4 follow-up.
- name: Build the canonical DNS rrset provider payload
  ansible.builtin.set_fact:
    dns_provider_boundary_desired_record_payload: >-
      {{
        {
          'name': hetzner_dns_record.name,
          'type': hetzner_dns_record.type,
          'ttl': (hetzner_dns_record.ttl | default(60) | int),
          'records': [
            {'value': hetzner_dns_record.value, 'comment': ''}
          ]
        }
      }}

- name: Delete the canonical DNS record when it is retired
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones/{{ dns_provider_boundary_zone.provider_ref | urlencode }}/rrsets/{{ dns_provider_boundary_matching_records[0].provider_ref }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    return_content: true
    status_code:
      - 200
      - 204
      - 429
      - 500
      - 502
      - 503
      - 504
  register: hetzner_dns_record_delete_response
  when:
    - not (hetzner_dns_brownout_manual_fallback | bool)
    - (hetzner_dns_record.state | default('present')) == 'absent'
    - dns_provider_boundary_matching_records | length == 1
  retries: 5
  delay: 2
  # The new Hetzner Console API returns 201 + an action body for DELETE on
  # rrsets (the deletion is async). 200 / 204 are kept for backward
  # compatibility with the legacy API path.
  until: hetzner_dns_record_delete_response.status in [200, 201, 204]
  failed_when: hetzner_dns_record_delete_response.status not in [200, 201, 204]
  changed_when: true
  no_log: true

- name: Create the canonical DNS record when it does not exist
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones/{{ dns_provider_boundary_zone.provider_ref | urlencode }}/rrsets"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    body_format: json
    return_content: true
    body: "{{ dns_provider_boundary_desired_record_payload }}"
    status_code:
      - 200
      - 201
      - 429
      - 500
      - 502
      - 503
      - 504
  register: hetzner_dns_record_create_response
  when:
    - not (hetzner_dns_brownout_manual_fallback | bool)
    - (hetzner_dns_record.state | default('present')) == 'present'
    - dns_provider_boundary_matching_records | length == 0
  retries: 5
  delay: 2
  until: hetzner_dns_record_create_response.status in [200, 201]
  failed_when: hetzner_dns_record_create_response.status not in [200, 201]
  changed_when: true
  no_log: true

# Update path on the new Hetzner Console API:
#   - PUT  /v1/zones/{id}/rrsets/{rrset}                — only updates rrset
#     metadata (TTL, labels, protection). Sending `records` returns 422
#     "can't update records with this endpoint".
#   - POST /v1/zones/{id}/rrsets/{rrset}/actions/set_records — replaces the
#     `records[]` list, returns a 201 with an async action object.
# We update records via the action endpoint. TTL changes are handled by
# the separate PUT task below; for the common "value drifts but TTL is
# unchanged" case the action is sufficient.
- name: Update the canonical DNS record values when value drift is detected
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones/{{ dns_provider_boundary_zone.provider_ref | urlencode }}/rrsets/{{ dns_provider_boundary_matching_records[0].provider_ref }}/actions/set_records"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    body_format: json
    return_content: true
    body:
      records: "{{ dns_provider_boundary_desired_record_payload.records }}"
    status_code:
      - 200
      - 201
      - 429
      - 500
      - 502
      - 503
      - 504
  register: hetzner_dns_record_update_response
  when:
    - not (hetzner_dns_brownout_manual_fallback | bool)
    - (hetzner_dns_record.state | default('present')) == 'present'
    - dns_provider_boundary_matching_records | length == 1
    - dns_provider_boundary_matching_records[0].record_value != hetzner_dns_record.value
  retries: 5
  delay: 2
  until: hetzner_dns_record_update_response.status in [200, 201]
  failed_when: hetzner_dns_record_update_response.status not in [200, 201]
  changed_when: true
  no_log: true

- name: Update the canonical DNS record TTL when only TTL drift is detected
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones/{{ dns_provider_boundary_zone.provider_ref | urlencode }}/rrsets/{{ dns_provider_boundary_matching_records[0].provider_ref }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    body_format: json
    return_content: true
    body:
      ttl: "{{ hetzner_dns_record.ttl | default(60) | int }}"
    status_code:
      - 200
      - 201
      - 429
      - 500
      - 502
      - 503
      - 504
  register: hetzner_dns_record_ttl_update_response
  when:
    - not (hetzner_dns_brownout_manual_fallback | bool)
    - (hetzner_dns_record.state | default('present')) == 'present'
    - dns_provider_boundary_matching_records | length == 1
    - >-
      (dns_provider_boundary_matching_records[0].record_ttl | int)
      != (hetzner_dns_record.ttl | default(60) | int)
  retries: 5
  delay: 2
  until: hetzner_dns_record_ttl_update_response.status in [200, 201]
  failed_when: hetzner_dns_record_ttl_update_response.status not in [200, 201]
  changed_when: true
  no_log: true

# ADR 0430 PR 3 — when brownout fallback is active, record what the writes
# would have been so main.yml can emit a single consolidated operator summary.
- name: Collect the record change for the brownout manual-fallback summary
  ansible.builtin.set_fact:
    hetzner_dns_brownout_pending_records: >-
      {{
        (hetzner_dns_brownout_pending_records | default([])) +
        [{
          'action': (
            'delete' if (hetzner_dns_record.state | default('present')) == 'absent'
              and dns_provider_boundary_matching_records | length == 1
            else 'create' if (hetzner_dns_record.state | default('present')) == 'present'
              and dns_provider_boundary_matching_records | length == 0
            else 'update' if (hetzner_dns_record.state | default('present')) == 'present'
              and dns_provider_boundary_matching_records | length == 1
              and (
                dns_provider_boundary_matching_records[0].record_value != hetzner_dns_record.value
                or (dns_provider_boundary_matching_records[0].record_ttl | int)
                   != (hetzner_dns_record.ttl | default(60) | int)
              )
            else 'noop'
          ),
          'name': hetzner_dns_record.name,
          'type': hetzner_dns_record.type,
          'value': hetzner_dns_record.value,
          'ttl': hetzner_dns_record.ttl | default(60) | int,
        }]
      }}
  when: hetzner_dns_brownout_manual_fallback | bool
