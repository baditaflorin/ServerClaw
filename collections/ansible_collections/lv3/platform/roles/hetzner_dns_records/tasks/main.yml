---
- name: Assert Hetzner DNS API token is available
  ansible.builtin.assert:
    that:
      - hetzner_dns_zone_name | length > 0
      - hetzner_dns_records | length > 0
      - (lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim | length) > 0
    fail_msg: "Set HETZNER_DNS_API_TOKEN before running this play."

# ADR 0430 PR 4 — Hetzner DNS-Console (legacy dns.hetzner.com/api/v1) is being
# replaced by the new Hetzner Console at api.hetzner.cloud/v1. The new API:
#   - Authenticates with `Authorization: Bearer <token>` instead of the
#     `Auth-API-Token` header.
#   - Groups records into rrsets (record sets) keyed by name+type instead
#     of returning a flat record list. Each rrset contains a `records[]`
#     array of `{value, comment}` entries.
#   - Uses path-style ids (e.g. `@/A`, `nginx/A`) on the rrset endpoint
#     rather than opaque numeric record ids.
# The role flattens rrsets into the canonical (one-record-per-value) model
# the rest of the role already uses, so migration is contained here and in
# record.yml.
- name: Read Hetzner DNS zone information
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones?name={{ hetzner_dns_zone_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    return_content: true
  register: hetzner_dns_zone_lookup
  changed_when: false
  no_log: true

- name: Translate Hetzner DNS zone provider payload into canonical zone facts
  ansible.builtin.set_fact:
    dns_provider_boundary_zone_candidates: >-
      {%- set items = [] -%}
      {%- for zone in hetzner_dns_zone_lookup.json.zones | default([]) -%}
      {%- set _ = items.append({
        "zone_ref": "dns-zone:" ~ (zone.name | default(hetzner_dns_zone_name)),
        "zone_name": zone.name | default(hetzner_dns_zone_name),
        "provider_ref": zone.id | default(""),
        "provider": "hetzner_dns"
      }) -%}
      {%- endfor -%}
      {{ items }}

- name: Assert the canonical DNS zone lookup is unambiguous
  ansible.builtin.assert:
    that:
      - dns_provider_boundary_zone_candidates | length == 1
    fail_msg: "Expected exactly one Hetzner DNS zone named {{ hetzner_dns_zone_name }}."

- name: Record the canonical DNS zone reference
  ansible.builtin.set_fact:
    dns_provider_boundary_zone: "{{ dns_provider_boundary_zone_candidates[0] }}"

# Pull all rrsets for the zone. per_page=100 is the maximum the new Console
# API accepts; a zone that outgrows a single page (e.g. a busy apex with many
# subdomains) is walked page-by-page below so we never silently miss records
# and infer false drift / spurious deletes. The Console pagination object
# exposes `last_page` and `total_entries`, which drive the walk and the
# completeness assert.
- name: Read the first page of Hetzner DNS rrsets for the zone
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones/{{ dns_provider_boundary_zone.provider_ref | urlencode }}/rrsets?per_page=100&page=1"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    return_content: true
  register: hetzner_dns_rrsets_first_page
  changed_when: false
  no_log: true

- name: Read any remaining pages of Hetzner DNS rrsets for the zone
  ansible.builtin.uri:
    url: "{{ hetzner_dns_api_base_url }}/zones/{{ dns_provider_boundary_zone.provider_ref | urlencode }}/rrsets?per_page=100&page={{ item }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'HETZNER_DNS_API_TOKEN') | trim }}"
    return_content: true
  register: hetzner_dns_rrsets_more_pages
  changed_when: false
  no_log: true
  loop: "{{ range(2, (hetzner_dns_rrsets_first_page.json.meta.pagination.last_page | default(1) | int) + 1) | list }}"

- name: Combine all Hetzner DNS rrset pages into a single listing
  ansible.builtin.set_fact:
    hetzner_dns_all_rrsets: >-
      {{ (hetzner_dns_rrsets_first_page.json.rrsets | default([]))
         + (hetzner_dns_rrsets_more_pages.results | default([])
            | map(attribute='json.rrsets') | map('default', []) | flatten(levels=1)) }}

- name: Assert every Hetzner DNS rrset was retrieved across all pages
  ansible.builtin.assert:
    that:
      - >-
        (hetzner_dns_all_rrsets | length)
        == (hetzner_dns_rrsets_first_page.json.meta.pagination.total_entries
            | default(hetzner_dns_all_rrsets | length) | int)
    fail_msg: >-
      Retrieved {{ hetzner_dns_all_rrsets | length }} rrsets for zone
      {{ hetzner_dns_zone_name }} but the provider reports
      {{ hetzner_dns_rrsets_first_page.json.meta.pagination.total_entries | default('?') }}
      total; the page-walk is incomplete.

# Each Hetzner Console rrset groups all values for one (name,type) pair.
# Flatten each rrset.records[].value into a separate canonical record so the
# rest of the role keeps working against its existing flat-record model.
# The provider_ref is the rrset id (e.g. "@/A", "nginx/A") — multiple
# canonical records for the same rrset will share the same provider_ref,
# which the per-value matchers in record.yml use as the rrset locator on
# update/delete.
- name: Translate Hetzner DNS rrset provider payload into canonical record facts
  ansible.builtin.set_fact:
    dns_provider_boundary_existing_records: >-
      {%- set items = [] -%}
      {%- for rrset in hetzner_dns_all_rrsets | default([]) -%}
      {%- for entry in rrset.records | default([]) -%}
      {%- set _ = items.append({
        "record_ref": "dns-record:" ~ (rrset.type | default("unknown")) ~ ":" ~ (rrset.name | default("")),
        "record_name": rrset.name | default(""),
        "record_type": rrset.type | default(""),
        "record_value": entry.value | default(""),
        "record_ttl": rrset.ttl | default(0) | int,
        "provider_ref": rrset.id | default(""),
        "provider": "hetzner_dns"
      }) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ items }}

- name: Ensure desired Hetzner DNS records are present
  ansible.builtin.include_tasks: record.yml
  loop: "{{ hetzner_dns_records }}"
  loop_control:
    loop_var: hetzner_dns_record

- name: Summarise Hetzner DNS records awaiting manual publication
  ansible.builtin.debug:
    msg: |-
      Hetzner DNS brownout manual-fallback summary for zone {{ hetzner_dns_zone_name }}:

      {% set pending = (hetzner_dns_brownout_pending_records | default([]))
         | rejectattr('action', 'equalto', 'noop') | list %}
      {% if pending | length == 0 %}
      All declared records already match the provider state; nothing to
      publish manually.
      {% else %}
      {{ pending | length }} record(s) require manual publication via
      https://dns.hetzner.com/zones. The brownout ends with the full
      DNS-Console API shutdown on 2026-05-20:

      {% for r in pending %}
      - [{{ r.action | upper }}] {{ r.name }} {{ r.type }} "{{ r.value }}" (TTL {{ r.ttl }})
      {% endfor %}
      {% endif %}
  when: hetzner_dns_brownout_manual_fallback | bool
