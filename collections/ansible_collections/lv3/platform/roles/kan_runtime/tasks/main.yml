---
- name: Derive Kan conventional defaults from the service registry
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: derive_service_defaults
  vars:
    common_derive_service_name: kan

- name: Validate Kan runtime inputs
  ansible.builtin.assert:
    that:
      - kan_site_dir | length > 0
      - kan_secret_dir | length > 0
      - kan_compose_file | length > 0
      - kan_internal_port | int > 0
      - kan_public_base_url | length > 0
    fail_msg: "kan_runtime requires site_dir, secret_dir, compose_file, port, and public URL."

- name: Ensure Kan directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ kan_site_dir }}"
      mode: "0755"
    - path: "{{ kan_secret_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure Kan local artifact directory exists
  ansible.builtin.file:
    path: "{{ kan_local_artifact_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate Kan database password
  ansible.builtin.command:
    argv: [openssl, rand, -hex, 32]
  register: kan_db_password_raw
  changed_when: false
  no_log: true

- name: Generate Kan NextAuth secret
  ansible.builtin.command:
    argv: [openssl, rand, -hex, 32]
  register: kan_nextauth_secret_raw
  changed_when: false
  no_log: true

- name: Persist Kan secrets on guest (once-only)
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop:
    - path: "{{ kan_db_password_remote_file }}"
      content: "{{ kan_db_password_raw.stdout | trim }}"
    - path: "{{ kan_nextauth_secret_remote_file }}"
      content: "{{ kan_nextauth_secret_raw.stdout | trim }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Read Kan secrets from guest
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ kan_db_password_remote_file }}"
    - "{{ kan_nextauth_secret_remote_file }}"
  register: kan_secrets_raw
  no_log: true

- name: Decode Kan secrets
  ansible.builtin.set_fact:
    kan_db_password: "{{ kan_secrets_raw.results[0].content | b64decode | trim }}"
    kan_nextauth_secret: "{{ kan_secrets_raw.results[1].content | b64decode | trim }}"
  no_log: true

- name: Mirror Kan secrets to control machine
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    mode: "0600"
    force: false
  delegate_to: localhost
  become: false
  loop:
    - path: "{{ kan_db_password_local_file }}"
      content: "{{ kan_db_password }}"
    - path: "{{ kan_nextauth_secret_local_file }}"
      content: "{{ kan_nextauth_secret }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Render the Kan compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ kan_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  register: kan_compose_template

- name: Converge the Kan runtime stack
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: docker_compose_converge
  vars:
    common_docker_compose_converge_compose_file: "{{ kan_compose_file }}"
    common_docker_compose_converge_site_dir: "{{ kan_site_dir }}"
    common_docker_compose_converge_service_name: kan
    common_docker_compose_converge_force_recreate_entire_stack: true
    common_docker_compose_converge_template_results:
      - "{{ kan_compose_template }}"

- name: Wait for Kan to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ kan_internal_port }}"
    delay: 5
    timeout: 300

- name: Verify Kan runtime
  ansible.builtin.import_tasks: verify.yml
