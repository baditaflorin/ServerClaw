---
nginx_observability_state_dir: "/etc/{{ platform_identity.unix_prefix }}/observability"
nginx_observability_telegraf_config_file: /etc/telegraf/telegraf.d/{{ platform_identity.config_prefix }}-nginx.conf
nginx_observability_stub_status_config_file: /etc/nginx/conf.d/{{ platform_identity.config_prefix }}-stub-status.conf
nginx_observability_stub_status_url: http://127.0.0.1:8080/basic_status
nginx_observability_hostname: "{{ inventory_hostname }}"
nginx_observability_role: nginx-edge
