---
argument_specs:
  main:
    short_description: Configure Nomad OIDC auth method with Authentik SSO.
    options:
      nomad_oidc_auth_server_url:
        type: str
        required: true
      nomad_oidc_auth_ca_cert_file:
        type: path
        required: true
      nomad_oidc_auth_bootstrap_token_remote_file:
        type: path
        required: true
      nomad_oidc_auth_authentik_client_id:
        type: str
        required: true
      nomad_oidc_auth_authentik_client_secret_local_file:
        type: path
        required: true
      nomad_oidc_auth_authentik_provider_slug:
        type: str
        required: true
      nomad_oidc_auth_oidc_discovery_url:
        type: str
        required: true
      nomad_oidc_auth_allowed_redirect_uris:
        type: list
        elements: str
        required: true
      nomad_oidc_auth_admin_group:
        type: str
        required: true
      nomad_oidc_auth_retired_method_names:
        type: list
        elements: str
        required: false
      nomad_oidc_auth_retire_legacy_methods:
        type: bool
        required: false
