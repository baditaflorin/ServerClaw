---
# host_pinning_guard tasks — ADR 0457 Phase 2.

- name: "host_pinning_guard: short-circuit when disabled"
  ansible.builtin.meta: end_host
  when: not host_pinning_guard_enabled | bool

- name: "host_pinning_guard: resolve active deployment slug"
  ansible.builtin.set_fact:
    _host_pinning_active_slug: >-
      {{
        active_deployment_slug
          | default(
              host_pinning_guard_active_slug_lookup_paths
                | reject('equalto', '')
                | list
                | first,
              true
            )
          | default('', true)
          | trim
      }}

- name: "host_pinning_guard: look up this host's deployment_owner from proxmox_guests"
  ansible.builtin.set_fact:
    _host_pinning_owner: >-
      {{
        (proxmox_guests | default([]))
          | selectattr('name', 'equalto', inventory_hostname)
          | map(attribute='deployment_owner')
          | reject('equalto', None)
          | list
          | first
          | default('', true)
          | string
          | trim
      }}

- name: "host_pinning_guard: surface diagnostic context"
  ansible.builtin.debug:
    msg:
      - "host_pinning_guard active_slug={{ _host_pinning_active_slug | default('(unset)') }}"
      - "host_pinning_guard host={{ inventory_hostname }} declared_owner={{ _host_pinning_owner | default('(unset)') }}"
    verbosity: 1

- name: "host_pinning_guard: warn when host pinning is set but no active deployment"
  ansible.builtin.fail:
    msg: |
      host_pinning_guard (ADR 0457 Phase 2) refuses to converge:
      host {{ inventory_hostname }} declares deployment_owner={{ _host_pinning_owner }}
      but no active deployment slug was resolvable. Set one of:
        - export DEPLOYMENT=<slug>
        - write .local/active-deployment
        - pass -e active_deployment_slug=<slug>
      Or, if this converge legitimately targets a host that should not be
      pinned, remove `deployment_owner` from the guest's topology stanza.
  when:
    - _host_pinning_owner | length > 0
    - _host_pinning_active_slug | length == 0
    - host_pinning_guard_strict | bool

- name: "host_pinning_guard: refuse converge when host is pinned to another deployment"
  ansible.builtin.fail:
    msg: |
      host_pinning_guard (ADR 0457 Phase 2) refuses to converge:
      host {{ inventory_hostname }} is pinned to deployment_owner={{ _host_pinning_owner }}
      but the active deployment slug is {{ _host_pinning_active_slug }}.
      This is the lv3 ↔ 0fork oauth2-proxy@4180 collision class of bug —
      installing services from {{ _host_pinning_active_slug }} on a host
      owned by {{ _host_pinning_owner }} would create a port conflict
      with the resident deployment's services.

      Resolve by either:
        - converging from the {{ _host_pinning_owner }} deployment instead
          (export DEPLOYMENT={{ _host_pinning_owner }} or pass
          -e active_deployment_slug={{ _host_pinning_owner }}),
        - or moving the host to {{ _host_pinning_active_slug }} by updating
          its `deployment_owner` field in
          .local/deployments/{{ _host_pinning_owner }}/topology.yml.
  when:
    - _host_pinning_owner | length > 0
    - _host_pinning_active_slug | length > 0
    - _host_pinning_owner != _host_pinning_active_slug

- name: "host_pinning_guard: confirm pinning OK"
  ansible.builtin.debug:
    msg: >-
      host_pinning_guard OK — host {{ inventory_hostname }}
      {% if _host_pinning_owner | length > 0 %}pinned to {{ _host_pinning_owner }}{% else %}unpinned (legacy shared-VM behavior){% endif %},
      active deployment={{ _host_pinning_active_slug | default('(unset)') }}
