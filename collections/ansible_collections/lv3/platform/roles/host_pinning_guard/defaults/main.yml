---
# host_pinning_guard role — ADR 0457 Phase 2.
#
# Refuses converge when the target host's `proxmox_guests[*].deployment_owner`
# is set AND points at a deployment different from the active one. Prevents
# the lv3 ↔ 0fork oauth2-proxy@4180 collision class of bug at converge time
# rather than at incident time.
#
# Inputs:
#   - active_deployment_slug (string, optional): operator-provided slug for
#     the deployment this converge belongs to. When unset, the role looks up
#     the slug from $DEPLOYMENT, then `.local/active-deployment`. When still
#     unset, the guard skips silently (legacy single-deployment behavior).
#   - proxmox_guests (list, optional): the topology guest list. When unset
#     or empty, the guard skips silently.
#   - host_pinning_guard_enabled (bool, default true): kill-switch for
#     debugging. Operators should NOT set this to false in production.
#   - host_pinning_guard_strict (bool, default true): when true, a missing
#     active_deployment_slug AND a host with deployment_owner set is treated
#     as a hard error. When false, the guard logs a warning instead.

host_pinning_guard_enabled: true
host_pinning_guard_strict: true
host_pinning_guard_active_slug_lookup_paths:
  - "{{ lookup('env', 'DEPLOYMENT') | default('', true) }}"
  - "{{ lookup('file', repo_shared_local_root ~ '/active-deployment', errors='ignore') | default('', true) | trim }}"
