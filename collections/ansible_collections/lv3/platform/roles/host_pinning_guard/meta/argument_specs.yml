---
argument_specs:
  main:
    short_description: Refuse converge when proxmox_guests deployment_owner pins host to a different deployment.
    description:
      - ADR 0457 Phase 2 — convert the host_pinning audit primitive into a
        converge-time guard. Reads the active deployment slug from one of
        active_deployment_slug, $DEPLOYMENT, or .local/active-deployment;
        looks up the host's declared deployment_owner from proxmox_guests;
        fails the play with a remediation message when they disagree.
    options:
      host_pinning_guard_enabled:
        type: bool
        required: true
        description:
          - Kill-switch for the guard. Operators should not disable it in
            production. When false, the guard short-circuits via end_host
            without inspecting any state.
      host_pinning_guard_strict:
        type: bool
        required: true
        description:
          - When true, a host with deployment_owner set but no resolvable
            active deployment slug is treated as a hard failure. When
            false, the guard issues a warning but allows the converge.
      host_pinning_guard_active_slug_lookup_paths:
        type: list
        elements: str
        required: false
        description:
          - Ordered fallback chain consulted to resolve the active
            deployment slug when the operator did not pass
            active_deployment_slug explicitly. Rendered Jinja strings are
            stripped of whitespace and the first non-empty value wins.
