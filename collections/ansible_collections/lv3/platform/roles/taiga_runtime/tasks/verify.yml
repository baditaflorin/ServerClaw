---
- name: Verify Taiga responds on local port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ taiga_internal_port }}/"
    method: GET
    status_code: [200, 301, 302]
  register: taiga_verify_response
  retries: 12
  delay: 5
  until: taiga_verify_response.status in [200, 301, 302]
  changed_when: false
