---
# Purpose: Converge the Proxmox host bridge, nftables, and conntrack-helper configuration that exposes the managed guest networks and ingress rules.
# Use case: Run during host bootstrap, ingress changes, or recovery when vmbr topology, forwarding, nftables, or firewall helper state must be replayed from repo truth.
# Inputs: management_* and proxmox_* role variables describing the host uplink, internal bridge layout, optional staging bridge, and ingress/NAT helpers.
# Outputs: Host bridge configuration rendered, IPv4 forwarding enabled, nftables/proxmox-firewall helpers installed, and the managed network rules applied.
# Idempotency: Yes; templates, packages, and systemd/service tasks reconcile host network state and only apply when drift is detected.
# Dependencies: ADR 0165, ADR 0270, Proxmox VE host networking, nftables, and pve-firewall.
- name: Validate Proxmox network inputs
  ansible.builtin.assert:
    that:
      - management_interface | length > 0
      - management_ipv4 | length > 0
      - management_gateway4 | length > 0
      - proxmox_wan_bridge | length > 0
      - proxmox_internal_bridge | length > 0
      - proxmox_internal_ipv4 | length > 0
      - proxmox_internal_network | length > 0
    fail_msg: "proxmox_network requires management and internal bridge topology inputs."

# SAFETY GUARD: Writing a placeholder IP to /etc/network/interfaces causes total host
# lockout on the next reboot or ifreload — the host gets the wrong IP and all traffic
# to the real IP is dropped at the network level. This guard aborts convergence before
# any file is written. Root cause incident: 2026-04-12, 6+ hours of downtime.
#
# Real values must come from .local/identity.yml via -e @.local/identity.yml.
# The committed codebase uses RFC 5737 (203.0.113.x) and RFC 3849 (2001:db8::/32)
# placeholder addresses; the identity overlay replaces them at runtime.
- name: SAFETY GUARD — Reject RFC 5737 / placeholder management IP before writing host network config
  ansible.builtin.assert:
    that:
      - not (management_ipv4 | regex_search('^203\.0\.113\.'))
      - not (management_ipv4 | regex_search('^192\.0\.2\.'))
      - not (management_ipv4 | regex_search('^198\.51\.100\.'))
      - not (management_gateway4 | regex_search('^203\.0\.113\.'))
      - not (management_ipv4 | regex_search('^2001:db8:'))
    fail_msg: >-
      SAFETY GUARD TRIGGERED: management_ipv4={{ management_ipv4 }} or
      management_gateway4={{ management_gateway4 }} is an RFC 5737/3849 documentation
      placeholder. Writing this to /etc/network/interfaces causes TOTAL HOST LOCKOUT
      on the next reboot (wrong IP — server unreachable). Aborting convergence.
      Fix: ensure .local/identity.yml is injected via -e @.local/identity.yml.
      See incident postmortem 2026-04-12 (6h outage on 203.0.113.1).

- name: Validate optional staging bridge inputs
  ansible.builtin.assert:
    that:
      - proxmox_staging_bridge | default('') | length > 0
      - proxmox_staging_ipv4 | default('') | length > 0
      - proxmox_staging_network | default('') | length > 0
      - (proxmox_staging_cidr | default(0) | int) > 0
    fail_msg: "proxmox_network staging bridge mode requires bridge name, gateway, cidr, and network."
  when: proxmox_staging_bridge_enabled | default(false) | bool

- name: Ensure nftables is installed
  ansible.builtin.apt:
    name:
      - nftables
      - pve-firewall
    state: present
    update_cache: true
    force_apt_get: true
    cache_valid_time: 3600

- name: Persist IPv4 forwarding configuration
  ansible.builtin.copy:
    dest: "/etc/sysctl.d/99-{{ platform_config_prefix }}-ip-forwarding.conf"
    content: |
      net.ipv4.ip_forward = 1
    mode: "0644"
  register: proxmox_network_ipv4_forwarding

- name: Read the active IPv4 forwarding value
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: proxmox_network_ipv4_forwarding_current
  changed_when: false

- name: Apply IPv4 forwarding configuration
  ansible.builtin.command: sysctl --system
  when:
    - proxmox_network_ipv4_forwarding.changed
      or (proxmox_network_ipv4_forwarding_current.stdout | trim) != "1"
  changed_when: true

- name: Render Proxmox host network interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: "0644"
    validate: "ifquery -i %s -l"
  register: proxmox_interfaces

- name: Render nftables rules for VM egress
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: "nft -c -f %s"
  register: proxmox_nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Install Proxmox firewall conntrack helper
  ansible.builtin.template:
    src: proxmox-firewall-conntrack.sh.j2
    dest: "{{ proxmox_network_conntrack_helper_path }}"
    mode: "0755"

- name: Install Proxmox firewall conntrack service
  ansible.builtin.template:
    src: proxmox-firewall-conntrack.service.j2
    dest: "{{ proxmox_network_conntrack_service_file }}"
    mode: "0644"
  register: proxmox_network_conntrack_service

- name: Reload systemd after conntrack service updates
  ansible.builtin.systemd:
    daemon_reload: true
  when: proxmox_network_conntrack_service.changed

- name: Enable Proxmox firewall conntrack service
  ansible.builtin.systemd:
    name: "{{ proxmox_network_conntrack_service_file | basename }}"
    enabled: true
    state: started

- name: Reload nftables rules
  ansible.builtin.command: nft -f /etc/nftables.conf
  when: proxmox_nftables.changed
  changed_when: true

# Deadman-switch wrapper around `ifreload -a`. When the host transitions
# from "<iface> owns the IP directly" to "<bridge> owns the IP and
# enslaves <iface>", a misconfigured stanza (commonly an invalid IPv6
# link-local `gateway` directive, or a missed up/down route hook) leaves
# the management link in a half-applied state and bricks the box. The
# template `validate: ifquery -i %s -l` hook checks syntax, not semantics,
# so this slips through. We've also seen the box come back from
# `ifreload` fine but boot-time `ifup -a` fail on the next kernel reboot
# in a later role, which still bricks the host.
#
# Defense: snapshot the working /etc/network/interfaces, schedule a
# one-shot revert via `at` 4 minutes into the future, then apply the new
# config. If Ansible's wait_for_connection reaches the host afterwards
# the at job is cancelled. If wait_for_connection times out (or anything
# else goes wrong), the at job fires unattended, restores the good
# config, and re-applies — so operators don't need IPMI / Robot rescue
# to recover from a config bug.
- name: Ensure `at` is installed (deadman-switch dependency)
  ansible.builtin.apt:
    name: at
    state: present
  when: proxmox_interfaces.changed

- name: Snapshot the current /etc/network/interfaces for rollback
  ansible.builtin.copy:
    src: /etc/network/interfaces
    dest: /etc/network/interfaces.last-known-good
    remote_src: true
    mode: "0644"
  when: proxmox_interfaces.changed

# Use a flag-file pattern (rather than cancel-by-job-ID): the at job is
# always scheduled, but checks for the flag at fire time. If the disarm
# task ran (= network came back fine), the flag is gone and the revert
# is a no-op. Avoids races where `atrm` can't find the job (file write
# timing, awk parse failure, etc.) and the revert fires unwanted.
- name: Arm deadman-switch flag (revert fires in 240 s if flag still present)
  ansible.builtin.shell: |
    set -eu
    systemctl start atd 2>/dev/null || true
    : > /run/proxmox-network-revert.armed
    at now + 4 minutes <<'EOF'
    if [ -e /run/proxmox-network-revert.armed ]; then
      cp /etc/network/interfaces.last-known-good /etc/network/interfaces
      ifreload -a
      rm -f /run/proxmox-network-revert.armed
    fi
    EOF
  args:
    executable: /bin/bash
  changed_when: true
  when: proxmox_interfaces.changed

- name: Apply network changes with ifreload
  ansible.builtin.command: ifreload -a
  when: proxmox_interfaces.changed
  changed_when: true

- name: Wait for SSH after network reload
  ansible.builtin.wait_for_connection:
    timeout: 180
    connect_timeout: 5
    sleep: 2
  when: proxmox_interfaces.changed

- name: Disarm deadman-switch (clear the flag so the scheduled at job no-ops)
  ansible.builtin.file:
    path: /run/proxmox-network-revert.armed
    state: absent
  when: proxmox_interfaces.changed

- name: Refresh facts after network changes
  ansible.builtin.setup:
  when: proxmox_interfaces.changed

- name: Ensure Proxmox firewall configuration directory exists
  ansible.builtin.file:
    path: /etc/pve/firewall
    state: directory
    mode: "0755"

- name: Read current guest configurations for firewall enablement
  ansible.builtin.command: "qm config {{ item.vmid }}"
  register: proxmox_network_guest_config
  changed_when: false
  failed_when: false
  loop: "{{ proxmox_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record guests that currently exist on the Proxmox host
  ansible.builtin.set_fact:
    proxmox_network_existing_guests: >-
      {{
        proxmox_network_guest_config.results
        | selectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}

- name: Render per-guest Proxmox firewall policy to staging files
  ansible.builtin.template:
    src: vm.fw.j2
    dest: "/root/.lv3-vm-{{ guest.vmid }}.fw"
    mode: "0644"
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    loop_var: guest
    label: "{{ guest.name }}"

- name: Install per-guest Proxmox firewall policy
  ansible.builtin.shell: |
    set -euo pipefail
    target=/etc/pve/firewall/{{ guest.vmid }}.fw
    staged=/root/.lv3-vm-{{ guest.vmid }}.fw
    if ! cmp -s "$staged" "$target" 2>/dev/null; then
      cp "$staged" "$target"
      echo changed
    fi
  args:
    executable: /bin/bash
  register: proxmox_network_guest_firewall_files
  changed_when: "'changed' in proxmox_network_guest_firewall_files.stdout"
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    loop_var: guest
    label: "{{ guest.name }}"

- name: Enable Proxmox firewall on each guest net0 interface
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ item.item.vmid | string }}"
      - --net0
      - "{{ proxmox_network_desired_net0 }}"
  register: proxmox_network_guest_firewall_interfaces
  changed_when: true
  vars:
    proxmox_network_guest_firewall_enabled: "{{ item.item.proxmox_firewall_enabled | default(true) | bool }}"
    proxmox_network_current_net0: >-
      {{
        item.stdout
        | regex_search('(?m)^net0: .+$')
        | regex_replace('^net0: ', '')
      }}
    proxmox_network_current_net0_without_firewall: >-
      {{
        proxmox_network_current_net0
        | regex_replace('(^|,)firewall=(?:0|1)(?=,|$)', '')
        | regex_replace(',,+', ',')
        | regex_replace(',$', '')
      }}
    proxmox_network_desired_net0: >-
      {{
        proxmox_network_current_net0_without_firewall
        ~ ',firewall='
        ~ ('1' if proxmox_network_guest_firewall_enabled else '0')
      }}
  when:
    - "item.stdout is search('(?m)^net0: .+$')"
    - "proxmox_network_current_net0 != proxmox_network_desired_net0"
  loop: "{{ proxmox_network_guest_config.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Ensure Proxmox firewall service is enabled and started
  ansible.builtin.systemd:
    name: pve-firewall
    enabled: true
    state: started

- name: Compile Proxmox firewall configuration
  ansible.builtin.command: pve-firewall compile
  changed_when: false

- name: Restart Proxmox firewall after guest policy changes
  ansible.builtin.command: pve-firewall restart
  when: >
    (
      proxmox_network_guest_firewall_files.results | selectattr('changed') | list | length
    ) > 0 or (
      proxmox_network_guest_firewall_interfaces.results | default([]) | selectattr('changed') | list | length
    ) > 0
  changed_when: true

- name: Ensure Proxmox firewall conntrack rule is active
  ansible.builtin.command: "{{ proxmox_network_conntrack_helper_path }}"
  changed_when: false

- name: Check guest SSH reachability from the Proxmox host
  ansible.builtin.command: "nc -z -w 2 {{ item.ipv4 }} 22"
  register: proxmox_network_guest_ssh_reachability
  failed_when: false
  changed_when: false
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record guests that need restart after firewall activation
  ansible.builtin.set_fact:
    proxmox_network_guest_restart_vmids: "{{ (proxmox_network_guest_restart_vmids | default([])) + [item.item.vmid] }}"
  when: >
    (
      proxmox_network_guest_firewall_interfaces.results | default([]) | selectattr('item.item.vmid', 'equalto', item.item.vmid) | selectattr('changed') | list | length
    ) > 0 or item.rc != 0
  loop: "{{ proxmox_network_guest_ssh_reachability.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Stop guests that need firewall activation restart
  ansible.builtin.command: "qm stop {{ item.vmid }} --skiplock 1"
  register: proxmox_network_guest_stop
  failed_when: proxmox_network_guest_stop.rc not in [0, 255]
  changed_when: proxmox_network_guest_stop.rc == 0
  when: item.vmid in (proxmox_network_guest_restart_vmids | default([]))
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start guests after firewall activation restart
  ansible.builtin.command: "qm start {{ item.vmid }}"
  register: proxmox_network_guest_start
  failed_when: proxmox_network_guest_start.rc not in [0, 255]
  changed_when: proxmox_network_guest_start.rc == 0
  when: item.vmid in (proxmox_network_guest_restart_vmids | default([]))
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for guest SSH after firewall activation restart
  ansible.builtin.wait_for:
    host: "{{ item.ipv4 }}"
    port: 22
    timeout: 300
    connect_timeout: 5
    delay: 5
  when: item.vmid in (proxmox_network_guest_restart_vmids | default([]))
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"
