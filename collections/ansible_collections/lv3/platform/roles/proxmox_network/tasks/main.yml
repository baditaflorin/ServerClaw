---
# Purpose: Converge the Proxmox host bridge, nftables, and conntrack-helper configuration that exposes the managed guest networks and ingress rules.
# Use case: Run during host bootstrap, ingress changes, or recovery when vmbr topology, forwarding, nftables, or firewall helper state must be replayed from repo truth.
# Inputs: management_* and proxmox_* role variables describing the host uplink, internal bridge layout, optional staging bridge, and ingress/NAT helpers.
# Outputs: Host bridge configuration rendered, IPv4 forwarding enabled, nftables/proxmox-firewall helpers installed, and the managed network rules applied.
# Idempotency: Yes; templates, packages, and systemd/service tasks reconcile host network state and only apply when drift is detected.
# Dependencies: ADR 0165, ADR 0270, Proxmox VE host networking, nftables, and pve-firewall.
# Scoped run: `--tags proxmox-vm-firewall` renders and installs only /etc/pve/firewall/<vmid>.fw, compiles the
# result and restarts pve-firewall when a file changed. It never touches /etc/network/interfaces, nftables,
# forwarding, the conntrack helper, a guest NIC or a guest's power state. The input and SAFETY GUARD asserts
# below carry `always`, so no tag selection (including --skip-tags proxmox-vm-firewall) can skip them.
# tests/test_proxmox_network_vm_firewall_tag.py pins which tasks carry which tag.
# Install guard: the live per-VM files have other writers than the render (hand-authored rules, a migrated set,
# managed blocks such as `# BEGIN fleet-pool-fw`), so the render is never copied over them blindly. files/pve_fw_guard.py
# compares each render with the LIVE file (in --check mode too), shows the diff, fails before writing anything when the
# install would remove a rule or a managed block unless -e proxmox_network_allow_rule_removal=true, and saves every file
# it replaces to <backup root>/fw-backup-<timestamp>/ with a restore.sh. tests/test_pve_firewall_install_guard.py pins it.
- name: Validate Proxmox network inputs
  ansible.builtin.assert:
    that:
      - management_interface | length > 0
      - management_ipv4 | length > 0
      - management_gateway4 | length > 0
      - proxmox_wan_bridge | length > 0
      - proxmox_internal_bridge | length > 0
      - proxmox_internal_ipv4 | length > 0
      - proxmox_internal_network | length > 0
    fail_msg: "proxmox_network requires management and internal bridge topology inputs."
  tags:
    - always

- name: SAFETY GUARD — Reject a management interface that aliases the WAN bridge
  ansible.builtin.assert:
    that:
      - management_interface != proxmox_wan_bridge
    fail_msg: >-
      SAFETY GUARD TRIGGERED: management_interface={{ management_interface }} is the
      same as proxmox_wan_bridge={{ proxmox_wan_bridge }}. The WAN bridge must use
      the physical uplink as bridge-ports; self-referencing it can disconnect the
      Proxmox host. Remove the interface override from the identity overlay or set
      it to the verified physical uplink before applying this role.
  tags:
    - always

# SAFETY GUARD: Writing a placeholder IP to /etc/network/interfaces causes total host
# lockout on the next reboot or ifreload — the host gets the wrong IP and all traffic
# to the real IP is dropped at the network level. This guard aborts convergence before
# any file is written. Root cause incident: 2026-04-12, 6+ hours of downtime.
#
# Real values must come from .local/identity.yml via -e @.local/identity.yml.
# The committed codebase uses RFC 5737 (203.0.113.x) and RFC 3849 (2001:db8::/32)
# placeholder addresses; the identity overlay replaces them at runtime.
- name: SAFETY GUARD — Reject RFC 5737 / placeholder management IP before writing host network config
  ansible.builtin.assert:
    that:
      - not (management_ipv4 | regex_search('^203\.0\.113\.'))
      - not (management_ipv4 | regex_search('^192\.0\.2\.'))
      - not (management_ipv4 | regex_search('^198\.51\.100\.'))
      - not (management_gateway4 | regex_search('^203\.0\.113\.'))
      - not (management_ipv4 | regex_search('^2001:db8:'))
    fail_msg: >-
      SAFETY GUARD TRIGGERED: management_ipv4={{ management_ipv4 }} or
      management_gateway4={{ management_gateway4 }} is an RFC 5737/3849 documentation
      placeholder. Writing this to /etc/network/interfaces causes TOTAL HOST LOCKOUT
      on the next reboot (wrong IP — server unreachable). Aborting convergence.
      Fix: ensure .local/identity.yml is injected via -e @.local/identity.yml.
      See incident postmortem 2026-04-12 (6h outage on 203.0.113.1).
  tags:
    - always

- name: Validate optional staging bridge inputs
  ansible.builtin.assert:
    that:
      - proxmox_staging_bridge | default('') | length > 0
      - proxmox_staging_ipv4 | default('') | length > 0
      - proxmox_staging_network | default('') | length > 0
      - (proxmox_staging_cidr | default(0) | int) > 0
    fail_msg: "proxmox_network staging bridge mode requires bridge name, gateway, cidr, and network."
  when: proxmox_staging_bridge_enabled | default(false) | bool

- name: Ensure nftables is installed
  ansible.builtin.apt:
    name:
      - nftables
      - pve-firewall
    state: present
    update_cache: true
    force_apt_get: true
    cache_valid_time: 3600

- name: Persist IPv4 forwarding configuration
  ansible.builtin.copy:
    dest: "/etc/sysctl.d/99-{{ platform_config_prefix }}-ip-forwarding.conf"
    content: |
      net.ipv4.ip_forward = 1
    mode: "0644"
  register: proxmox_network_ipv4_forwarding

- name: Read the active IPv4 forwarding value
  ansible.builtin.command: sysctl -n net.ipv4.ip_forward
  register: proxmox_network_ipv4_forwarding_current
  changed_when: false

- name: Apply IPv4 forwarding configuration
  ansible.builtin.command: sysctl --system
  when:
    - proxmox_network_ipv4_forwarding.changed
      or (proxmox_network_ipv4_forwarding_current.stdout | trim) != "1"
  changed_when: true

- name: Render Proxmox host network interfaces
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: "0644"
    validate: "ifquery -i %s -l"
  register: proxmox_interfaces

- name: Render nftables rules for VM egress
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: "nft -c -f %s"
  register: proxmox_nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Install Proxmox firewall conntrack helper
  ansible.builtin.template:
    src: proxmox-firewall-conntrack.sh.j2
    dest: "{{ proxmox_network_conntrack_helper_path }}"
    mode: "0755"

- name: Install Proxmox firewall conntrack service
  ansible.builtin.template:
    src: proxmox-firewall-conntrack.service.j2
    dest: "{{ proxmox_network_conntrack_service_file }}"
    mode: "0644"
  register: proxmox_network_conntrack_service

- name: Reload systemd after conntrack service updates
  ansible.builtin.systemd:
    daemon_reload: true
  when: proxmox_network_conntrack_service.changed

- name: Enable Proxmox firewall conntrack service
  ansible.builtin.systemd:
    name: "{{ proxmox_network_conntrack_service_file | basename }}"
    enabled: true
    state: started

- name: Reload nftables rules
  ansible.builtin.command: nft -f /etc/nftables.conf
  when: proxmox_nftables.changed
  changed_when: true

- name: Apply network changes with ifreload
  ansible.builtin.command: ifreload -a
  when: proxmox_interfaces.changed
  changed_when: true

- name: Wait for SSH after network reload
  ansible.builtin.wait_for_connection:
    timeout: 120
    connect_timeout: 5
    sleep: 2
  when: proxmox_interfaces.changed

- name: Refresh facts after network changes
  ansible.builtin.setup:
  when: proxmox_interfaces.changed

- name: Ensure Proxmox firewall configuration directory exists
  ansible.builtin.file:
    path: "{{ proxmox_network_firewall_live_dir }}"
    state: directory
    mode: "0755"
  tags:
    - proxmox-vm-firewall

# Read only, so it runs in --check mode too: a skipped command reports rc 0, which would make a check run treat a guest
# that does not exist yet as existing and plan a firewall file the real run never writes.
- name: Read current guest configurations for firewall enablement
  ansible.builtin.command: "qm config {{ item.vmid }}"
  register: proxmox_network_guest_config
  check_mode: false
  changed_when: false
  failed_when: false
  loop: "{{ proxmox_guests }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - proxmox-vm-firewall

- name: Record guests that currently exist on the Proxmox host
  ansible.builtin.set_fact:
    proxmox_network_existing_guests: >-
      {{
        proxmox_network_guest_config.results
        | selectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}
  tags:
    - proxmox-vm-firewall

# Which guests' firewall files this run manages: all existing ones by default, or the ones named with
# -e proxmox_network_firewall_vmids=155 (or 155,191, or a JSON list). Naming them is how one VM's additive file is installed
# while another VM's live file still holds lines the render lacks (that VM would otherwise make the guard stop the whole
# run). The ids are read as digit runs so that the string form of `-e key=value` and a list behave the same.
- name: Select the guests whose firewall files this run manages
  ansible.builtin.set_fact:
    proxmox_network_firewall_guests: >-
      {{
        proxmox_network_existing_guests
        | selectattr('vmid', 'in', proxmox_network_firewall_vmids | string | regex_findall('[0-9]+') | map('int') | list)
        | list
        if (proxmox_network_firewall_vmids | string | regex_findall('[0-9]+') | length) > 0
        else proxmox_network_existing_guests
      }}
  tags:
    - proxmox-vm-firewall

- name: Refuse a firewall file selection that names a guest which does not exist
  ansible.builtin.assert:
    that:
      - >-
        (
          proxmox_network_firewall_vmids | string | regex_findall('[0-9]+') | map('int') | list
          | difference(proxmox_network_existing_guests | map(attribute='vmid') | map('int') | list)
        ) | length == 0
    fail_msg: >-
      proxmox_network_firewall_vmids names {{ proxmox_network_firewall_vmids }}, but only
      {{ proxmox_network_existing_guests | map(attribute='vmid') | list }} are declared guests that exist on this host.
    quiet: true
  tags:
    - proxmox-vm-firewall

# check_mode and diff are off on purpose: the staging copy is scratch that Proxmox never reads. Writing it in a --check run
# is what lets the comparison below test the render the real run would install; before this, check mode compared the new
# render with the previous staging copy and the live files were never looked at.
- name: Render per-guest Proxmox firewall policy to staging files
  ansible.builtin.template:
    src: vm.fw.j2
    dest: "{{ proxmox_network_firewall_stage_dir }}/.lv3-vm-{{ guest.vmid }}.fw"
    mode: "0644"
  check_mode: false
  diff: false
  loop: "{{ proxmox_network_firewall_guests }}"
  loop_control:
    loop_var: guest
    label: "{{ guest.name }}"
  tags:
    - proxmox-vm-firewall

# Read only, so it runs in --check mode as well. Exit status 2 means "would remove live rules" and is handled below so that
# the diff is printed before the play stops.
- name: Compare per-guest Proxmox firewall policy with the live files
  ansible.builtin.script:
    cmd: >-
      pve_fw_guard.py plan --format json
      --live-dir {{ proxmox_network_firewall_live_dir | quote }}
      --stage-dir {{ proxmox_network_firewall_stage_dir | quote }}
      {{ '--allow-rule-removal' if proxmox_network_allow_rule_removal | bool else '' }}
      {{ proxmox_network_firewall_guests | map(attribute='vmid') | map('string') | join(' ') }}
    executable: python3
  register: proxmox_network_vm_firewall_plan
  check_mode: false
  changed_when: false
  failed_when: proxmox_network_vm_firewall_plan.rc not in [0, 2]
  when: proxmox_network_firewall_guests | length > 0
  tags:
    - proxmox-vm-firewall

- name: Show per-guest Proxmox firewall diff against the live files
  ansible.builtin.debug:
    msg: "{{ (proxmox_network_vm_firewall_plan.stdout | from_json).report }}"
  when: proxmox_network_vm_firewall_plan.stdout is defined
  tags:
    - proxmox-vm-firewall

- name: Refuse to remove live Proxmox firewall rules without an explicit operator decision
  ansible.builtin.assert:
    that:
      - not (proxmox_network_vm_firewall_plan.stdout | from_json).refused
    fail_msg: >-
      REFUSED, nothing was written: the render would remove live rules or managed blocks from VM
      {{ (proxmox_network_vm_firewall_plan.stdout | from_json).removal_vmids | join(', ') }} (the diff is printed above).
      The render is not the source of truth for those lines. Add them to the inventory render, or, if removing them is
      intended, run again with -e proxmox_network_allow_rule_removal=true; the play then copies each file it replaces to
      {{ proxmox_network_firewall_backup_root }}/fw-backup-<timestamp>/ first.
    quiet: true
  when: proxmox_network_vm_firewall_plan.stdout is defined
  tags:
    - proxmox-vm-firewall

# The script plans again with the same flags before it writes, so it refuses on its own if the assert above is ever removed.
# The script module is skipped in --check mode, so nothing below this line writes in a check run.
- name: Install per-guest Proxmox firewall policy
  ansible.builtin.script:
    cmd: >-
      pve_fw_guard.py apply --format json
      --live-dir {{ proxmox_network_firewall_live_dir | quote }}
      --stage-dir {{ proxmox_network_firewall_stage_dir | quote }}
      --backup-root {{ proxmox_network_firewall_backup_root | quote }}
      {{ '--allow-rule-removal' if proxmox_network_allow_rule_removal | bool else '' }}
      {{ proxmox_network_firewall_guests | map(attribute='vmid') | map('string') | join(' ') }}
    executable: python3
  register: proxmox_network_vm_firewall_install
  changed_when: >-
    proxmox_network_vm_firewall_install.rc == 0 and
    (proxmox_network_vm_firewall_install.stdout | from_json).installed_vmids | length > 0
  failed_when: proxmox_network_vm_firewall_install.rc != 0
  when: proxmox_network_firewall_guests | length > 0
  tags:
    - proxmox-vm-firewall

- name: Show where the replaced Proxmox firewall files were saved
  ansible.builtin.debug:
    msg: "{{ (proxmox_network_vm_firewall_install.stdout | from_json).install_report }}"
  when: proxmox_network_vm_firewall_install is changed
  tags:
    - proxmox-vm-firewall

- name: Enable Proxmox firewall on each guest net0 interface
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ item.item.vmid | string }}"
      - --net0
      - "{{ proxmox_network_desired_net0 }}"
  register: proxmox_network_guest_firewall_interfaces
  changed_when: true
  vars:
    proxmox_network_guest_firewall_enabled: "{{ item.item.proxmox_firewall_enabled | default(true) | bool }}"
    proxmox_network_current_net0: >-
      {{
        item.stdout
        | regex_search('(?m)^net0: .+$')
        | regex_replace('^net0: ', '')
      }}
    proxmox_network_current_net0_without_firewall: >-
      {{
        proxmox_network_current_net0
        | regex_replace('(^|,)firewall=(?:0|1)(?=,|$)', '')
        | regex_replace(',,+', ',')
        | regex_replace(',$', '')
      }}
    proxmox_network_desired_net0: >-
      {{
        proxmox_network_current_net0_without_firewall
        ~ ',firewall='
        ~ ('1' if proxmox_network_guest_firewall_enabled else '0')
      }}
  when:
    - "item.stdout is search('(?m)^net0: .+$')"
    - "proxmox_network_current_net0 != proxmox_network_desired_net0"
  loop: "{{ proxmox_network_guest_config.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Ensure Proxmox firewall service is enabled and started
  ansible.builtin.systemd:
    name: pve-firewall
    enabled: true
    state: started

- name: Compile Proxmox firewall configuration
  ansible.builtin.command: pve-firewall compile
  changed_when: false
  tags:
    - proxmox-vm-firewall

# The net0 enablement task is outside the proxmox-vm-firewall slice, so in a scoped run its register
# is never defined; the explicit default keeps this condition from relying on undefined-attribute chaining.
- name: Restart Proxmox firewall after guest policy changes
  ansible.builtin.command: pve-firewall restart
  when: >
    (
      proxmox_network_vm_firewall_install.changed | default(false)
    ) or (
      (proxmox_network_guest_firewall_interfaces | default({})).results | default([]) | selectattr('changed') | list | length
    ) > 0
  changed_when: true
  tags:
    - proxmox-vm-firewall

- name: Ensure Proxmox firewall conntrack rule is active
  ansible.builtin.command: "{{ proxmox_network_conntrack_helper_path }}"
  changed_when: false

- name: Check guest SSH reachability from the Proxmox host
  ansible.builtin.command: "nc -z -w 2 {{ item.ipv4 }} 22"
  register: proxmox_network_guest_ssh_reachability
  failed_when: false
  changed_when: false
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record guests that need restart after firewall activation
  ansible.builtin.set_fact:
    proxmox_network_guest_restart_vmids: "{{ (proxmox_network_guest_restart_vmids | default([])) + [item.item.vmid] }}"
  when: >
    (
      proxmox_network_guest_firewall_interfaces.results | default([]) | selectattr('item.item.vmid', 'equalto', item.item.vmid) | selectattr('changed') | list | length
    ) > 0 or item.rc != 0
  loop: "{{ proxmox_network_guest_ssh_reachability.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Stop guests that need firewall activation restart
  ansible.builtin.command: "qm stop {{ item.vmid }} --skiplock 1"
  register: proxmox_network_guest_stop
  failed_when: proxmox_network_guest_stop.rc not in [0, 255]
  changed_when: proxmox_network_guest_stop.rc == 0
  when: item.vmid in (proxmox_network_guest_restart_vmids | default([]))
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start guests after firewall activation restart
  ansible.builtin.command: "qm start {{ item.vmid }}"
  register: proxmox_network_guest_start
  failed_when: proxmox_network_guest_start.rc not in [0, 255]
  changed_when: proxmox_network_guest_start.rc == 0
  when: item.vmid in (proxmox_network_guest_restart_vmids | default([]))
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for guest SSH after firewall activation restart
  ansible.builtin.wait_for:
    host: "{{ item.ipv4 }}"
    port: 22
    timeout: 300
    connect_timeout: 5
    delay: 5
  when: item.vmid in (proxmox_network_guest_restart_vmids | default([]))
  loop: "{{ proxmox_network_existing_guests }}"
  loop_control:
    label: "{{ item.name }}"
