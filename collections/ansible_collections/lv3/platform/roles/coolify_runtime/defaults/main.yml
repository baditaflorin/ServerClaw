# Purpose: Define the default Coolify runtime images, paths, controller artifacts, and network/publication settings.
# Use case: Loaded whenever the Coolify runtime role converges or verifies the repo-managed Coolify control plane and apps ingress surface.
# Inputs: Platform service topology, host inventory, and controller-local artifact paths for bootstrap and smoke verification.
# Outputs: Supplies stable runtime defaults consumed by the coolify_runtime tasks and templates.
# Idempotency: Fully idempotent because this file only declares desired defaults.
# Dependencies: ADR 0165 and ADR 0340.
---
# NOTE: Conventional variables (site_dir, image, compose_file, env_file,
# openbao_*, container_name, internal_port, local_artifact_dir) are derived
# from platform_service_registry — ADR 0373.
coolify_site_dir: /opt/coolify
coolify_compose_file: "{{ coolify_site_dir }}/docker-compose.yml"
coolify_env_file: "{{ coolify_data_root }}/source/.env"
coolify_internal_port: "{{ platform_service_topology | platform_service_port('coolify', 'internal') }}"
coolify_local_artifact_dir: "{{ repo_shared_local_root }}/coolify"
coolify_app_image: ghcr.io/coollabsio/coolify:latest
coolify_realtime_image: ghcr.io/coollabsio/coolify-realtime:1.0.11
coolify_postgres_image: postgres:15-alpine
coolify_redis_image: redis:7-alpine

coolify_service_name: coolify
coolify_proxy_service_name: coolify-proxy
coolify_realtime_service_name: coolify-realtime
coolify_postgres_service_name: coolify-db
coolify_redis_service_name: coolify-redis
coolify_proxy_image: traefik:v3.6
coolify_container_uid: "9999"
coolify_container_gid: "9999"

coolify_bootstrap_dir: /etc/coolify/bootstrap
coolify_data_root: /data/coolify
coolify_bootstrap_private_key_file: "{{ coolify_bootstrap_dir }}/server-key"
coolify_proxy_path: "{{ coolify_data_root }}/proxy"

coolify_dashboard_port: "{{ coolify_internal_port }}"
coolify_proxy_port: 80
coolify_controller_url: "http://{{ ansible_host }}:{{ coolify_dashboard_port }}"
coolify_private_url: "http://{{ ansible_host }}:{{ coolify_dashboard_port }}"
coolify_public_url: https://coolify.{{ platform_domain }}
coolify_apps_public_url: https://apps.{{ platform_domain }}
coolify_tunnel_host: "{{ hostvars[platform_topology_host].ansible_host | default(hostvars[platform_topology_host].management_ipv4 | default(''), true) }}"
coolify_tunnel_user: ops
coolify_bridge_subnet: 172.20.0.0/16
coolify_bridge_gateway: 172.20.0.1

coolify_root_username: LV3 Ops
coolify_root_email: ops@{{ platform_domain }}
coolify_api_token_name: "{{ platform_identity.config_prefix }}-automation"
coolify_api_allowed_ips:
  - 127.0.0.1
  - "{{ coolify_bridge_gateway }}"
  - "{{ hostvars[platform_topology_host].ansible_host }}"
coolify_verify_ssl: false

coolify_server_name: "{{ inventory_hostname }}"
coolify_server_description: Repo-managed local deployment target for LV3 application deploys.
coolify_server_user: root
coolify_server_host: host.docker.internal
coolify_server_port: 22
coolify_server_proxy_type: TRAEFIK

coolify_root_password_local_file: "{{ coolify_local_artifact_dir }}/root-password.txt"
coolify_api_token_local_file: "{{ coolify_local_artifact_dir }}/api-token.txt"
coolify_server_key_local_file: "{{ coolify_local_artifact_dir }}/server-key"
coolify_server_key_public_local_file: "{{ coolify_local_artifact_dir }}/server-key.pub"
coolify_admin_auth_local_file: "{{ coolify_local_artifact_dir }}/admin-auth.json"
# Public key string used by proxmox_tool.py coolify-install-deploy-key.
# Resolved at playbook runtime from the local artifact file written by coolify_runtime.
coolify_deploy_ssh_pubkey: "{{ lookup('file', coolify_server_key_public_local_file, errors='ignore') | default('') }}"

coolify_smoke_project_name: LV3 Apps
coolify_smoke_environment_name: production
coolify_smoke_app_name: repo-smoke
coolify_smoke_repo_url: https://github.com/coollabsio/coolify-examples
coolify_smoke_repo_branch: main
coolify_smoke_base_directory: static
coolify_smoke_domain: http://apps.{{ platform_domain }}
coolify_smoke_alias_domain: http://repo-smoke.apps.{{ platform_domain }}

# --- t1: coolify-apps bootstrap (ws-0447) ---
# IP of the coolify-apps VM. Coolify SSHes here to install Traefik after server registration.
coolify_apps_vm_ip: >-
  {{
    (proxmox_guests
     | selectattr('name', 'equalto', 'coolify-apps-lv3')
     | map(attribute='ipv4')
     | list
     | first)
    | default('')
  }}
# Port on coolify-apps that Coolify's SSH client connects to (usually 22).
coolify_apps_vm_ssh_port: 22
# Name Coolify uses for the apps deployment server record.
coolify_apps_server_name: coolify-apps

# --- t2: Traefik cert resolver (ws-0447) ---
# Set to "dns" to use DNS-01 via Hetzner (required when nginx is in front on port 80).
# Set to "http" to keep the legacy HTTP-01 challenge (only works when Traefik owns port 80).
# DNS-01 requires HETZNER_DNS_API_TOKEN to be available in the environment at converge time.
coolify_traefik_cert_resolver: dns
# Hetzner DNS API token env var name injected into the Traefik proxy container.
# Resolved from the shell environment at Ansible render time — never stored in the repo.
coolify_hetzner_dns_api_token: "{{ lookup('env', 'HETZNER_DNS_API_TOKEN') }}"

# Extra Traefik dynamic routing config files to deploy to {{ coolify_proxy_path }}/dynamic/.
# Each entry is a filename under roles/coolify_runtime/files/dynamic/ that adds
# per-app routers/services Coolify's Docker labels cannot express (e.g. routing
# /api/ to a backend container that has no Traefik labels of its own).
# Future: replaced by the coolify_app_deploy role (ws-0447 t3).
coolify_traefik_extra_dynamic_configs:
  - education-wemeshup-api.yml
