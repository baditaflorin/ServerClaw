---
- name: Verify Huly responds on local port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ huly_internal_port }}/"
    method: GET
    status_code: [200, 301, 302]
  register: huly_verify_response
  retries: 12
  delay: 5
  until: huly_verify_response.status in [200, 301, 302]
  changed_when: false
