---
huly_service_topology: "{{ platform_service_topology | service_topology_get('huly') }}"
huly_public_base_url: "https://{{ huly_service_topology.public_hostname }}"
huly_external_host: "{{ huly_service_topology.public_hostname }}"
huly_project_name: huly
huly_version: v0.7.423
huly_desktop_channel: "0.7.423"
huly_title: Huly
huly_default_language: en
huly_last_name_first: "true"
huly_cockroach_database: defaultdb
huly_cockroach_username: selfhost
huly_redpanda_admin_user: superadmin
huly_http_bind: "0.0.0.0"
huly_nginx_file: "{{ huly_site_dir }}/.huly.nginx"
huly_env_file_project: "{{ huly_site_dir }}/.env"
huly_huly_secret_remote_file: "{{ huly_secret_dir }}/huly-secret"
huly_cockroach_secret_remote_file: "{{ huly_secret_dir }}/cockroach-secret"
huly_redpanda_secret_remote_file: "{{ huly_secret_dir }}/redpanda-secret"
huly_huly_secret_local_file: "{{ huly_local_artifact_dir }}/huly-secret"
huly_cockroach_secret_local_file: "{{ huly_local_artifact_dir }}/cockroach-secret"
huly_redpanda_secret_local_file: "{{ huly_local_artifact_dir }}/redpanda-secret"
# Integration credentials — empty by default; populated at runtime from .local/huly/ files
huly_google_client_id: ""
huly_google_client_secret: ""
huly_google_credentials: ""
huly_calendar_watch_url: "{{ huly_public_base_url }}/_calendar"
huly_kvs_url: "http://kvs:8094"
huly_gmail_watch_topic: ""
huly_telegram_bot_token: ""
huly_telegram_api_id: ""
huly_telegram_api_hash: ""
huly_telegram_mongo_uri: ""
huly_github_app_name: ""
huly_github_app_id: ""
huly_github_client_id: ""
huly_github_client_secret: ""
huly_github_private_key: ""
huly_github_installation_url: ""
# Local credential file paths (read by tasks/main.yml if present)
huly_google_client_id_file: "{{ repo_shared_local_root }}/huly/google-client-id"
huly_google_client_secret_file: "{{ repo_shared_local_root }}/huly/google-client-secret"
huly_google_credentials_file: "{{ repo_shared_local_root }}/huly/google-credentials.json"
huly_telegram_bot_token_file: "{{ repo_shared_local_root }}/huly/telegram-bot-token"
huly_telegram_credentials_file: "{{ repo_shared_local_root }}/huly/telegram-credentials.yml"
huly_github_credentials_file: "{{ repo_shared_local_root }}/huly/github-credentials.yml"
