---
# Dependencies: ADR 0371.
- name: Verify the LibreChat runtime
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: verify_service_health
  vars:
    common_verify_service_name: librechat
    common_verify_port: "{{ librechat_internal_port }}"
    common_verify_port_timeout: 180
    common_verify_health_url: "http://127.0.0.1:{{ librechat_internal_port }}/"
    common_verify_health_retries: 18
    common_verify_health_delay: 5
