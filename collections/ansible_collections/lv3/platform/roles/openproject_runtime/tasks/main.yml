---
- name: Derive OpenProject conventional defaults from the service registry
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: derive_service_defaults
  vars:
    common_derive_service_name: openproject

- name: Validate OpenProject runtime inputs
  ansible.builtin.assert:
    that:
      - openproject_site_dir | length > 0
      - openproject_secret_dir | length > 0
      - openproject_compose_file | length > 0
      - openproject_internal_port | int > 0
      - openproject_public_base_url | length > 0
    fail_msg: "openproject_runtime requires site_dir, secret_dir, compose_file, port, and public URL."

- name: Ensure OpenProject directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ openproject_site_dir }}"
      mode: "0755"
    - path: "{{ openproject_secret_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure OpenProject local artifact directory exists
  ansible.builtin.file:
    path: "{{ openproject_local_artifact_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate OpenProject database password
  ansible.builtin.command:
    argv: [openssl, rand, -hex, 32]
  register: openproject_db_password_raw
  changed_when: false
  no_log: true

- name: Generate OpenProject secret key base
  ansible.builtin.command:
    argv: [openssl, rand, -hex, 64]
  register: openproject_secret_key_raw
  changed_when: false
  no_log: true

- name: Persist OpenProject secrets on guest (once-only)
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop:
    - path: "{{ openproject_db_password_remote_file }}"
      content: "{{ openproject_db_password_raw.stdout | trim }}"
    - path: "{{ openproject_secret_key_remote_file }}"
      content: "{{ openproject_secret_key_raw.stdout | trim }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Read OpenProject secrets from guest
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ openproject_db_password_remote_file }}"
    - "{{ openproject_secret_key_remote_file }}"
  register: openproject_secrets_raw
  no_log: true

- name: Decode OpenProject secrets
  ansible.builtin.set_fact:
    openproject_db_password: "{{ openproject_secrets_raw.results[0].content | b64decode | trim }}"
    openproject_secret_key: "{{ openproject_secrets_raw.results[1].content | b64decode | trim }}"
  no_log: true

- name: Mirror OpenProject secrets to control machine
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    mode: "0600"
    force: false
  delegate_to: localhost
  become: false
  loop:
    - path: "{{ openproject_db_password_local_file }}"
      content: "{{ openproject_db_password }}"
    - path: "{{ openproject_secret_key_local_file }}"
      content: "{{ openproject_secret_key }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Render the OpenProject compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ openproject_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  register: openproject_compose_template

- name: Converge the OpenProject runtime stack
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: docker_compose_converge
  vars:
    common_docker_compose_converge_compose_file: "{{ openproject_compose_file }}"
    common_docker_compose_converge_site_dir: "{{ openproject_site_dir }}"
    common_docker_compose_converge_service_name: openproject
    common_docker_compose_converge_force_recreate_entire_stack: true
    common_docker_compose_converge_template_results:
      - "{{ openproject_compose_template }}"

- name: Wait for OpenProject to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ openproject_internal_port }}"
    delay: 10
    timeout: 600

- name: Verify OpenProject runtime
  ansible.builtin.import_tasks: verify.yml
