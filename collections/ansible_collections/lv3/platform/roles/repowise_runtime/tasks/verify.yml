---
# Purpose: Verify the Repowise semantic search API health endpoint responds after convergence.
# Dependencies: ADR 0371.
- name: Verify the Repowise runtime
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: verify_service_health
  vars:
    common_verify_service_name: repowise
    common_verify_port: "{{ repowise_port }}"
    common_verify_port_timeout: 120
    common_verify_health_url: "http://127.0.0.1:{{ repowise_port }}/health"
    common_verify_health_retries: 24
    common_verify_health_delay: 5
