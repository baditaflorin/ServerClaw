---
# NOTE: Conventional variables (site_dir, image, compose_file, env_file,
# openbao_*, container_name, internal_port, local_artifact_dir) are derived
# from platform_service_registry — ADR 0373.
# NOTE: Ansible validates role argument specs before tasks run, so service-wrapper
# entrypoints also need the conventional defaults declared here.
# Purpose: Default runtime and controller-bootstrap inputs for the Uptime Kuma deployment.
# Use case: Consumed whenever the Uptime Kuma runtime, controller authentication, or monitor seed path must match repo truth.
#
# Inputs (required):
#   - platform_service_topology (generated): Shared service topology and port assignments for `uptime_kuma`.
#   - repo_shared_root / repo_shared_local_root (generated): Shared repo paths used for the local client requirements, monitor seeds, and admin session artifacts.
#
# Inputs (optional):
#   - uptime_kuma_local_auth_file (path, optional): Existing controller-local admin session artifact used for follow-up API operations.
#
# Outputs:
#   - Stable defaults for the Uptime Kuma compose runtime, controller bootstrap session, and monitor seed file locations.
#
# Idempotency: Fully idempotent
#              This file only declares role defaults.
#
# Dependencies:
#   - ADR 0165: Requires role metadata for governed automation entrypoints.
#   - ADR 0373: Conventional service defaults are derived from the service registry and generated topology catalogs.
#   - Requires: Shared controller-local artifact storage and generated Uptime Kuma service topology.
#
# Related ADRs: 0165, 0373
# Related Runbooks: docs/runbooks/deploy-uptime-kuma.md
#
# Author: LV3 Platform
# Last Updated: 2026-04-14
uptime_kuma_service_topology: "{{ platform_service_topology | platform_service('uptime_kuma') }}"
uptime_kuma_hostname: "{{ uptime_kuma_service_topology.public_hostname }}"
uptime_kuma_base_url: "https://{{ uptime_kuma_service_topology.public_hostname }}"
uptime_kuma_site_dir: /opt/uptime-kuma
uptime_kuma_compose_file: "{{ uptime_kuma_site_dir }}/docker-compose.yml"
uptime_kuma_data_dir: "{{ uptime_kuma_site_dir }}/data"
uptime_kuma_container_name: uptime-kuma
uptime_kuma_image: "{{ container_image_catalog.images.uptime_kuma_runtime.ref }}"
uptime_kuma_port: "{{ uptime_kuma_service_topology.ports.internal }}"
uptime_kuma_local_artifact_dir: "{{ repo_shared_local_root }}/uptime-kuma"
uptime_kuma_local_auth_file: "{{ repo_shared_local_root }}/uptime-kuma/admin-session.json"
uptime_kuma_local_requirements_file: "{{ repo_shared_root }}/requirements/uptime-kuma-client.txt"
uptime_kuma_local_seed_file: "{{ repo_shared_root }}/config/uptime-kuma/monitors.json"
