---
- name: Verify Tiki responds on local port
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tiki_internal_port }}/"
    method: GET
    status_code: [200, 301, 302]
  register: tiki_verify_response
  retries: 12
  delay: 5
  until: tiki_verify_response.status in [200, 301, 302]
  changed_when: false
