---
- name: Derive Tiki conventional defaults from the service registry
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: derive_service_defaults
  vars:
    common_derive_service_name: tiki

- name: Validate Tiki runtime inputs
  ansible.builtin.assert:
    that:
      - tiki_site_dir | length > 0
      - tiki_secret_dir | length > 0
      - tiki_compose_file | length > 0
      - tiki_internal_port | int > 0
      - tiki_public_base_url | length > 0
    fail_msg: "tiki_runtime requires site_dir, secret_dir, compose_file, port, and public URL."

- name: Ensure Tiki directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ tiki_site_dir }}"
      mode: "0755"
    - path: "{{ tiki_secret_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure Tiki local artifact directory exists
  ansible.builtin.file:
    path: "{{ tiki_local_artifact_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate Tiki database password
  ansible.builtin.command:
    argv: [openssl, rand, -hex, 32]
  register: tiki_db_password_raw
  changed_when: false
  no_log: true

- name: Persist Tiki secrets on guest (once-only)
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop:
    - path: "{{ tiki_db_password_remote_file }}"
      content: "{{ tiki_db_password_raw.stdout | trim }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Read Tiki secrets from guest
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ tiki_db_password_remote_file }}"
  register: tiki_secrets_raw
  no_log: true

- name: Decode Tiki secrets
  ansible.builtin.set_fact:
    tiki_db_password: "{{ tiki_secrets_raw.results[0].content | b64decode | trim }}"
  no_log: true

- name: Mirror Tiki secrets to control machine
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    mode: "0600"
    force: false
  delegate_to: localhost
  become: false
  loop:
    - path: "{{ tiki_db_password_local_file }}"
      content: "{{ tiki_db_password }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Render the Tiki compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ tiki_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  register: tiki_compose_template

- name: Converge the Tiki runtime stack
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: docker_compose_converge
  vars:
    common_docker_compose_converge_compose_file: "{{ tiki_compose_file }}"
    common_docker_compose_converge_site_dir: "{{ tiki_site_dir }}"
    common_docker_compose_converge_service_name: tiki
    common_docker_compose_converge_template_results:
      - "{{ tiki_compose_template }}"

- name: Wait for Tiki to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ tiki_internal_port }}"
    delay: 5
    timeout: 300

- name: Verify Tiki runtime
  ansible.builtin.import_tasks: verify.yml
