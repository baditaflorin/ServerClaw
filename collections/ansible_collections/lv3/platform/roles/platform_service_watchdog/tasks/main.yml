---
# Purpose: Install the platform service health watchdog on an application VM (ADR 0421).
# Use case: Probes configured services at a fixed interval and applies explicitly
#   configured recovery policy with rate limiting and ntfy alerts.
# Inputs:
#   - service_watchdog_* variables from defaults/main.yml
#   - service_watchdog_services: list of service probe definitions (required, non-empty)
# Outputs:
#   - Health check script, systemd timer+service, and state directories on the target VM.
# Idempotency: Fully idempotent.
# Dependencies:
#   - ADR 0421: Platform-wide service watchdog.
#   - ADR 0376: Identity core watchdog (predecessor pattern).
#   - Role: lv3.platform.common — reused for systemd unit activation.
# Related ADRs: 0421, 0376, 0226

- name: Validate platform service watchdog inputs
  ansible.builtin.assert:
    that:
      - service_watchdog_services | length > 0
      - service_watchdog_probe_interval_sec | int > 0
      - service_watchdog_failure_threshold | int > 0
      - service_watchdog_max_restarts_per_hour | int > 0
      - service_watchdog_script_path | length > 0
    fail_msg: "platform_service_watchdog requires a non-empty service list and valid probe configuration."

- name: Validate platform service watchdog recovery settings
  ansible.builtin.assert:
    that:
      - (item.recovery_driver | default('docker-compose')) in ['docker-compose', 'systemd']
      - (item.recovery_mode | default('enforce')) in ['enforce', 'shadow']
    fail_msg: >-
      {{ item.name }} must use recovery_driver docker-compose or systemd and
      recovery_mode enforce or shadow.
  loop: "{{ service_watchdog_services }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate systemd watchdog recovery settings
  ansible.builtin.assert:
    that:
      - item.systemd_unit is defined
      - item.systemd_unit | string | length > 0
      - (item.recovery_mode | default('enforce')) == 'shadow'
    fail_msg: >-
      {{ item.name }} uses the systemd recovery driver. It requires a non-empty
      systemd_unit and recovery_mode: shadow; systemd enforcement is not enabled.
  loop: "{{ service_watchdog_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.recovery_driver | default('docker-compose')) == 'systemd'

- name: Validate systemd watchdog recovery units are loaded
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ item.systemd_unit }}"
      - --property=LoadState
      - --value
  register: service_watchdog_systemd_unit_state
  changed_when: false
  check_mode: false
  failed_when: >-
    service_watchdog_systemd_unit_state.rc != 0 or
    (service_watchdog_systemd_unit_state.stdout | trim) != 'loaded'
  loop: "{{ service_watchdog_services }}"
  loop_control:
    label: "{{ item.name }}"
  when: (item.recovery_driver | default('docker-compose')) == 'systemd'

- name: Validate Docker Compose watchdog recovery directories
  ansible.builtin.assert:
    that:
      - item.compose_dir is defined
      - item.compose_dir | string | length > 0
    fail_msg: >-
      {{ item.name }} uses enforced docker-compose recovery but has no compose_dir.
  loop: "{{ service_watchdog_services }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - (item.recovery_driver | default('docker-compose')) == 'docker-compose'
    - (item.recovery_mode | default('enforce')) == 'enforce'

- name: Ensure the service watchdog root and state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ service_watchdog_root }}"
    - "{{ service_watchdog_state_dir }}"

- name: Ensure the service watchdog script directory exists
  ansible.builtin.file:
    path: "{{ service_watchdog_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the service watchdog health check script
  ansible.builtin.template:
    src: lv3-service-watchdog.sh.j2
    dest: "{{ service_watchdog_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart service watchdog timer

- name: Render the service watchdog systemd service unit
  ansible.builtin.template:
    src: lv3-service-watchdog.service.j2
    dest: "/etc/systemd/system/{{ service_watchdog_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart service watchdog timer

- name: Render the service watchdog systemd timer unit
  ansible.builtin.template:
    src: lv3-service-watchdog.timer.j2
    dest: "/etc/systemd/system/{{ service_watchdog_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart service watchdog timer

- name: Clear any stale failed state for the service watchdog service
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ service_watchdog_service_name }}"
  changed_when: false
  failed_when: false

- name: Ensure the service watchdog timer is enabled and active
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: systemd_unit
  vars:
    common_systemd_unit_name: "{{ service_watchdog_timer_name }}"
    common_systemd_unit_daemon_reload: true
    common_systemd_unit_verify_active: true
