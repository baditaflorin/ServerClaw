---
argument_specs:
  main:
    short_description: "Platform-wide service health watchdog (ADR 0421)"
    description: >
      Installs a systemd timer that probes configured services every N seconds and
      applies an explicit recovery policy after consecutive health failures.
      Docker Compose enforcement is the compatibility default; systemd recovery
      supports a shadow mode that records the action without executing it.
    options:
      service_watchdog_name:
        type: str
        required: false
        default: platform
        description: "Logical name for this watchdog instance (used in systemd unit names and state paths)."
      service_watchdog_services:
        type: list
        required: false
        default: []
        description: "List of service probe definitions. Each entry must have name, health_url, and expected_status; compose_dir is required only for docker-compose enforcement, while systemd recovery requires systemd_unit and shadow mode. Optional recovery_driver defaults to docker-compose and recovery_mode defaults to enforce."
      service_watchdog_probe_interval_sec:
        type: int
        required: false
        default: 30
        description: "Seconds between probe cycles."
      service_watchdog_probe_timeout_sec:
        type: int
        required: false
        default: 5
        description: "Per-probe HTTP timeout in seconds."
      service_watchdog_failure_threshold:
        type: int
        required: false
        default: 2
        description: "Consecutive failures before auto-restart is attempted."
      service_watchdog_max_restarts_per_hour:
        type: int
        required: false
        default: 6
        description: "Maximum restart attempts per service per hour (rate limit)."
      service_watchdog_ntfy_enabled:
        type: bool
        required: false
        default: true
        description: "Send ntfy notifications on failure, restart, and recovery."
      service_watchdog_ntfy_url:
        type: str
        required: false
        default: "http://127.0.0.1:2586"
        description: "ntfy server base URL."
      service_watchdog_ntfy_topic:
        type: str
        required: false
        default: "platform-service-watchdog"
        description: "ntfy topic name."
