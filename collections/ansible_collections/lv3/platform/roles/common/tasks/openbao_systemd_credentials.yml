# Purpose: Render and install an OpenBao-backed systemd credential delivery bundle for a host-native service.
# Use case: Included by roles that need repo-managed host-native secrets delivered through systemd credentials instead of plaintext files.
# Inputs: Service name, OpenBao secret payload, AppRole metadata, agent paths, rendered credential paths, and the pinned OpenBao image.
# Outputs: Ensures the OpenBao policy, AppRole, agent config, rendered credential template, and supervising systemd service exist for the target service.
# Idempotency: Partially idempotent because secret writes and AppRole bootstrap material can rotate when requested inputs change.
# Dependencies: ADR 0165, ADR 0043, ADR 0077, and ADR 0231.
---
- name: Validate OpenBao systemd credential helper inputs
  ansible.builtin.assert:
    that:
      - common_openbao_systemd_credentials_service_name | length > 0
      - common_openbao_systemd_credentials_agent_dir | length > 0
      - common_openbao_systemd_credentials_credential_dir | length > 0
      - common_openbao_systemd_credentials_credential_file | length > 0
      - common_openbao_systemd_credentials_secret_path | length > 0
      - common_openbao_systemd_credentials_secret_payload | length > 0
      - common_openbao_systemd_credentials_policy_name | length > 0
      - common_openbao_systemd_credentials_policy_rules | length > 0
      - common_openbao_systemd_credentials_approle_name | length > 0
      - common_openbao_systemd_credentials_agent_config_file | length > 0
      - common_openbao_systemd_credentials_agent_template_file | length > 0
      - >-
        (common_openbao_systemd_credentials_agent_template_local_file | default('') | length > 0)
        or
        (common_openbao_systemd_credentials_agent_template_src | default('') | length > 0)
        or (common_openbao_systemd_credentials_agent_template_content | default('') | length > 0)
      - common_openbao_systemd_credentials_role_id_file | length > 0
      - common_openbao_systemd_credentials_secret_id_file | length > 0
      - common_openbao_systemd_credentials_image | length > 0
      - common_openbao_systemd_credentials_container_entrypoint | length > 0
      - common_openbao_systemd_credentials_agent_service_name | length > 0
      - common_openbao_systemd_credentials_container_name | length > 0
      - openbao_init_local_file | length > 0
      - openbao_http_port | string | length > 0
      - >-
        not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
        or (common_openbao_systemd_credentials_provisioner_credential_file | length > 0)
      - >-
        not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
        or (common_openbao_systemd_credentials_provisioner_approle_name | length > 0)
      - >-
        not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
        or (common_openbao_systemd_credentials_provisioner_policy_name | length > 0)
    fail_msg: >-
      common openbao_systemd_credentials helper requires runtime paths, OpenBao secret payload,
      AppRole metadata, agent supervision settings, and either a controller-local template source
      or pre-rendered template content.

- name: Check whether the controller-local OpenBao init payload exists
  ansible.builtin.stat:
    path: "{{ openbao_init_local_file }}"
  delegate_to: localhost
  become: false
  register: common_openbao_systemd_credentials_init_payload_local
  no_log: true

- name: Fail when the controller-local OpenBao init payload is missing
  ansible.builtin.fail:
    msg: >-
      {{ openbao_init_local_file }} is missing on the control machine.
      Converge OpenBao before enabling host-native secret delivery for
      {{ common_openbao_systemd_credentials_service_name }}.
  when: not common_openbao_systemd_credentials_init_payload_local.stat.exists

- name: Record the controller-local OpenBao init payload
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_init_payload: "{{ lookup('ansible.builtin.file', openbao_init_local_file) | from_json }}"
  no_log: true

- name: Record OpenBao API facts for host-native secret delivery
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_api_url: >-
      {{
        common_openbao_systemd_credentials_openbao_address
        | default('http://127.0.0.1:' ~ (openbao_http_port | string), true)
      }}
  no_log: true

- name: Recover the local OpenBao runtime before helper API calls
  ansible.builtin.include_tasks: ensure_local_openbao_runtime.yml
  vars:
    common_local_openbao_runtime_consumer_name: "{{ common_openbao_systemd_credentials_service_name }}"
  when: common_openbao_systemd_credentials_manage_local_openbao_runtime | bool

- name: Ensure the controller-local SSH control path directory exists before OpenBao API retries
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_CONTROL_PATH_DIR') }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  changed_when: false
  when: (lookup('ansible.builtin.env', 'ANSIBLE_SSH_CONTROL_PATH_DIR') | default('', true) | length) > 0
- name: Wait for the local OpenBao API to answer
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/health"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 501
      - 503
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_api_health
  retries: 48
  delay: 5
  until: common_openbao_systemd_credentials_api_health.status in [200, 429, 472, 473, 501, 503]
  changed_when: false
  when: common_openbao_systemd_credentials_manage_local_openbao_runtime | bool

- name: Wait for the configured OpenBao API to answer before host-native secret delivery
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/health"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
      - 501
      - 503
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_api_health
  retries: 48
  delay: 5
  until: common_openbao_systemd_credentials_api_health.status in [200, 429, 472, 473, 501, 503]
  changed_when: false
  when: not common_openbao_systemd_credentials_manage_local_openbao_runtime | bool

- name: Ensure the configured OpenBao API is unsealed before host-native secret delivery
  ansible.builtin.include_tasks: unseal_openbao_api.yml
  vars:
    common_openbao_unseal_api_url: "{{ common_openbao_systemd_credentials_api_url }}"
    common_openbao_unseal_context: "host-native secret delivery for {{ common_openbao_systemd_credentials_service_name }}"
    common_openbao_unseal_init_payload: "{{ common_openbao_systemd_credentials_init_payload }}"

- name: Confirm the local OpenBao API is unsealed
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/seal-status"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    return_content: true
    status_code: 200
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_unsealed_status
  retries: 12
  delay: 2
  until:
    - common_openbao_systemd_credentials_unsealed_status.status == 200
    - not (common_openbao_systemd_credentials_unsealed_status.json.sealed | bool)
  changed_when: false

- name: Assert the local OpenBao API is unsealed before host-native secret delivery
  ansible.builtin.assert:
    that:
      - not (common_openbao_systemd_credentials_unsealed_status.json.sealed | bool)
    fail_msg: >-
      OpenBao remained sealed on the runtime host while preparing host-native secret delivery
      for {{ common_openbao_systemd_credentials_service_name }}.

- name: Wait for the local OpenBao API to become active
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/health"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_health
  retries: 24
  delay: 5
  until: common_openbao_systemd_credentials_health.status in [200, 429, 472, 473]
  changed_when: false

- name: Check for the controller-local runtime-secret provisioner credential
  ansible.builtin.stat:
    path: "{{ common_openbao_systemd_credentials_provisioner_credential_file }}"
  delegate_to: localhost
  become: false
  register: common_openbao_systemd_credentials_provisioner_credential_stat
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Require the controller-local runtime-secret provisioner credential
  ansible.builtin.assert:
    that:
      - common_openbao_systemd_credentials_provisioner_credential_stat.stat.exists
      - common_openbao_systemd_credentials_provisioner_credential_stat.stat.isreg | default(false)
    fail_msg: >-
      The narrow runtime-secret provisioner AppRole artifact is unavailable.
      Bootstrap it through the governed OpenBao administration path; no root-token fallback exists.
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool

- name: Read the runtime-secret provisioner credential
  ansible.builtin.slurp:
    src: "{{ common_openbao_systemd_credentials_provisioner_credential_file }}"
  delegate_to: localhost
  become: false
  register: common_openbao_systemd_credentials_provisioner_credential_raw
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Record the runtime-secret provisioner credential
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_provisioner_credential: >-
      {{ common_openbao_systemd_credentials_provisioner_credential_raw.content | b64decode | from_json }}
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Validate the runtime-secret provisioner credential shape
  ansible.builtin.assert:
    that:
      - >-
        common_openbao_systemd_credentials_provisioner_credential.role_name
        == common_openbao_systemd_credentials_provisioner_approle_name
      - common_openbao_systemd_credentials_provisioner_credential.auth_path | default('approle') == 'approle'
      - common_openbao_systemd_credentials_provisioner_credential.role_id | default('') | length > 0
      - common_openbao_systemd_credentials_provisioner_credential.secret_id | default('') | length > 0
    fail_msg: >-
      The runtime-secret provisioner artifact is malformed or belongs to a different AppRole.
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Login with the runtime-secret provisioner AppRole
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/auth/approle/login"
    method: POST
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    body_format: json
    body:
      role_id: "{{ common_openbao_systemd_credentials_provisioner_credential.role_id }}"
      secret_id: "{{ common_openbao_systemd_credentials_provisioner_credential.secret_id }}"
    return_content: true
    status_code:
      - 200
      - 400
      - 403
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit, true) }}"
  become: false
  register: common_openbao_systemd_credentials_provisioner_login
  changed_when: false
  failed_when: false
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Require a narrow authenticated provisioner token
  ansible.builtin.assert:
    that:
      - common_openbao_systemd_credentials_provisioner_login.status | default(0) == 200
      - common_openbao_systemd_credentials_provisioner_login.json.auth.client_token | default('') | length > 0
      - >-
        common_openbao_systemd_credentials_provisioner_policy_name
        in (common_openbao_systemd_credentials_provisioner_login.json.auth.policies | default([]))
      - "'root' not in (common_openbao_systemd_credentials_provisioner_login.json.auth.policies | default([]))"
      - >-
        (
          common_openbao_systemd_credentials_provisioner_login.json.auth.policies
          | default([])
          | difference(['default', common_openbao_systemd_credentials_provisioner_policy_name])
          | length
        ) == 0
    fail_msg: >-
      Runtime-secret provisioner authentication failed or returned an unsafe policy set.
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Record the bounded OpenBao manager token for host-native secret delivery
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_management_token: >-
      {{ common_openbao_systemd_credentials_provisioner_login.json.auth.client_token }}
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Record the legacy OpenBao manager token for host-native secret delivery
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_management_token: >-
      {{ common_openbao_systemd_credentials_init_payload.root_token }}
  when: not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
  no_log: true

- name: Record provisioner capability paths for host-native secret delivery
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_provisioner_kv_capability_path: >-
      {{ 'kv/data/' ~ common_openbao_systemd_credentials_secret_path }}
    common_openbao_systemd_credentials_provisioner_role_id_capability_path: >-
      {{ 'auth/approle/role/' ~ common_openbao_systemd_credentials_approle_name ~ '/role-id' }}
    common_openbao_systemd_credentials_provisioner_secret_id_capability_path: >-
      {{ 'auth/approle/role/' ~ common_openbao_systemd_credentials_approle_name ~ '/secret-id' }}
    common_openbao_systemd_credentials_provisioner_denied_capability_paths:
      - "kv/data/{{ common_openbao_systemd_credentials_secret_path }}/__contract_probe__"
      - "sys/policies/acl/{{ common_openbao_systemd_credentials_policy_name }}"
      - "auth/approle/role/controller-automation"
      - "auth/approle/role/controller-automation/role-id"
      - "auth/approle/role/controller-automation/secret-id"
      - "auth/approle/role/{{ common_openbao_systemd_credentials_provisioner_approle_name }}"
      - "auth/approle/role/{{ common_openbao_systemd_credentials_provisioner_approle_name }}/role-id"
      - "auth/approle/role/{{ common_openbao_systemd_credentials_provisioner_approle_name }}/secret-id"
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool

- name: Read the bounded provisioner token's effective capabilities
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/capabilities-self"
    method: POST
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    body_format: json
    body:
      paths: >-
        {{
          [
            common_openbao_systemd_credentials_provisioner_kv_capability_path,
            common_openbao_systemd_credentials_provisioner_role_id_capability_path,
            common_openbao_systemd_credentials_provisioner_secret_id_capability_path
          ]
          + common_openbao_systemd_credentials_provisioner_denied_capability_paths
        }}
    return_content: true
    status_code: 200
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit, true) }}"
  become: false
  register: common_openbao_systemd_credentials_provisioner_capabilities
  changed_when: false
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Require exact provisioner access for host-native secret delivery
  ansible.builtin.assert:
    that:
      - >-
        (
          common_openbao_systemd_credentials_provisioner_capabilities.json.data[
            common_openbao_systemd_credentials_provisioner_kv_capability_path
          ] | default([]) | sort
        ) == ['create', 'read', 'update']
      - >-
        (
          common_openbao_systemd_credentials_provisioner_capabilities.json.data[
            common_openbao_systemd_credentials_provisioner_role_id_capability_path
          ] | default([]) | sort
        ) == ['read']
      - >-
        (
          common_openbao_systemd_credentials_provisioner_capabilities.json.data[
            common_openbao_systemd_credentials_provisioner_secret_id_capability_path
          ] | default([]) | sort
        ) == ['create', 'update']
    fail_msg: >-
      The runtime-secret provisioner does not have the exact capabilities
      required by the host-native service contract.
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Require the provisioner to be denied policy and protected-AppRole management
  ansible.builtin.assert:
    that:
      - item in common_openbao_systemd_credentials_provisioner_capabilities.json.data
      - common_openbao_systemd_credentials_provisioner_capabilities.json.data[item] == ['deny']
    fail_msg: >-
      The runtime-secret provisioner unexpectedly has access to a policy or protected AppRole management path.
  loop: "{{ common_openbao_systemd_credentials_provisioner_denied_capability_paths }}"
  loop_control:
    label: "{{ item }}"
  when: common_openbao_systemd_credentials_use_runtime_provisioner | bool
  no_log: true

- name: Ensure the OpenBao agent and credential directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ common_openbao_systemd_credentials_agent_dir }}"
      mode: "0700"
    - path: "{{ common_openbao_systemd_credentials_credential_dir }}"
      mode: "0700"

- name: Check whether the current rendered host-native credential file exists
  ansible.builtin.stat:
    path: "{{ common_openbao_systemd_credentials_credential_file }}"
  register: common_openbao_systemd_credentials_rendered_credential_file
  no_log: true

- name: Read the current rendered host-native credential file
  ansible.builtin.slurp:
    src: "{{ common_openbao_systemd_credentials_credential_file }}"
  register: common_openbao_systemd_credentials_rendered_credential_before
  when: common_openbao_systemd_credentials_rendered_credential_file.stat.exists
  no_log: true

- name: Probe the current host-native secret payload from OpenBao
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/kv/data/{{ common_openbao_systemd_credentials_secret_path }}"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    return_content: true
    status_code:
      - 200
      - 404
      - 500
      - 502
      - 503
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_current_secret_probe
  changed_when: false
  failed_when: false
  no_log: true

- name: Read the local OpenBao seal status after a transient host-native secret payload read failure
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/seal-status"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    return_content: true
    status_code: 200
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_secret_recovery_seal_status
  retries: 12
  delay: 2
  until: common_openbao_systemd_credentials_secret_recovery_seal_status.status == 200
  changed_when: false
  when: common_openbao_systemd_credentials_current_secret_probe.status == 503

- name: Unseal the local OpenBao API when host-native secret payload reads catch it sealed
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/unseal"
    method: POST
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    body_format: json
    body:
      key: "{{ item }}"
    status_code: 200
  loop: "{{ common_openbao_systemd_credentials_init_payload.keys_base64[: (openbao_init_key_threshold | default(2) | int)] }}"
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_secret_recovery_unseal
  retries: 6
  delay: 2
  until: common_openbao_systemd_credentials_secret_recovery_unseal.status == 200
  when:
    - common_openbao_systemd_credentials_current_secret_probe.status == 503
    - common_openbao_systemd_credentials_secret_recovery_seal_status.json.sealed | bool
  no_log: true

- name: Wait for the local OpenBao API to become active after host-native secret payload recovery
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/health"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    status_code:
      - 200
      - 429
      - 472
      - 473
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_secret_recovery_health
  retries: 24
  delay: 5
  until: common_openbao_systemd_credentials_secret_recovery_health.status in [200, 429, 472, 473]
  changed_when: false
  when: common_openbao_systemd_credentials_current_secret_probe.status in [500, 502, 503]

- name: Read the current host-native secret payload from OpenBao
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/kv/data/{{ common_openbao_systemd_credentials_secret_path }}"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    return_content: true
    status_code:
      - 200
      - 404
      - 500
      - 502
      - 503
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_current_secret
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_current_secret.status in [200, 404]
  changed_when: false
  no_log: true

- name: Store the host-native secret payload in OpenBao
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/kv/data/{{ common_openbao_systemd_credentials_secret_path }}"
    method: POST
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    body_format: json
    body:
      data: "{{ common_openbao_systemd_credentials_secret_payload }}"
    status_code: 200
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_secret_write
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_secret_write.status == 200
  changed_when: >-
    common_openbao_systemd_credentials_current_secret.status == 404
    or (common_openbao_systemd_credentials_current_secret.json.data.data | default({})) != common_openbao_systemd_credentials_secret_payload
  when: >-
    common_openbao_systemd_credentials_current_secret.status == 404
    or (common_openbao_systemd_credentials_current_secret.json.data.data | default({})) != common_openbao_systemd_credentials_secret_payload
  no_log: true

- name: Read the current OpenBao policy for the host-native AppRole
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/policies/acl/{{ common_openbao_systemd_credentials_policy_name }}"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    return_content: true
    status_code:
      - 200
      - 404
      - 500
      - 502
      - 503
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_current_policy
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_current_policy.status in [200, 404]
  changed_when: false
  when: not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
  no_log: true

- name: Upsert the OpenBao policy for the host-native AppRole
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/sys/policies/acl/{{ common_openbao_systemd_credentials_policy_name }}"
    method: PUT
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    body_format: json
    body:
      policy: "{{ common_openbao_systemd_credentials_policy_rules }}"
    status_code: 204
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_policy_upsert
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_policy_upsert.status == 204
  when: >-
    not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
    and (
      common_openbao_systemd_credentials_current_policy.status == 404
      or (common_openbao_systemd_credentials_current_policy.json.data.policy | default('')) != common_openbao_systemd_credentials_policy_rules
    )
  no_log: true

- name: Upsert the OpenBao AppRole for the host-native agent
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/auth/approle/role/{{ common_openbao_systemd_credentials_approle_name }}"
    method: POST
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    body_format: json
    body:
      token_policies: "{{ common_openbao_systemd_credentials_policy_name }}"
      token_ttl: 15m
      token_max_ttl: 1h
      token_num_uses: 0
      secret_id_ttl: 0
      secret_id_num_uses: 0
    status_code: 204
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_approle_upsert
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_approle_upsert.status == 204
  when: not (common_openbao_systemd_credentials_use_runtime_provisioner | bool)
  no_log: true

- name: Read the OpenBao AppRole role ID
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/auth/approle/role/{{ common_openbao_systemd_credentials_approle_name }}/role-id"
    method: GET
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    return_content: true
    status_code: 200
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_role_id
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_role_id.status == 200
  changed_when: false
  no_log: true

- name: Persist the OpenBao AppRole role ID
  ansible.builtin.copy:
    dest: "{{ common_openbao_systemd_credentials_role_id_file }}"
    content: "{{ common_openbao_systemd_credentials_role_id.json.data.role_id }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Check whether the OpenBao AppRole secret ID already exists on disk
  ansible.builtin.stat:
    path: "{{ common_openbao_systemd_credentials_secret_id_file }}"
  register: common_openbao_systemd_credentials_secret_id_stat
  no_log: true

- name: Generate a durable OpenBao AppRole secret ID
  ansible.builtin.uri:
    url: "{{ common_openbao_systemd_credentials_api_url }}/v1/auth/approle/role/{{ common_openbao_systemd_credentials_approle_name }}/secret-id"
    method: POST
    validate_certs: "{{ common_openbao_systemd_credentials_validate_certs | default(true) }}"
    headers:
      X-Vault-Token: "{{ common_openbao_systemd_credentials_management_token }}"
    body_format: json
    body: {}
    return_content: true
    status_code: 200
  delegate_to: "{{ common_openbao_systemd_credentials_api_host | default(omit) }}"
  become: false
  register: common_openbao_systemd_credentials_secret_id
  retries: "{{ common_openbao_api_operation_retries }}"
  delay: "{{ common_openbao_api_operation_delay }}"
  until: common_openbao_systemd_credentials_secret_id.status == 200
  when: not common_openbao_systemd_credentials_secret_id_stat.stat.exists
  no_log: true

- name: Persist the durable OpenBao AppRole secret ID
  ansible.builtin.copy:
    dest: "{{ common_openbao_systemd_credentials_secret_id_file }}"
    content: "{{ common_openbao_systemd_credentials_secret_id.json.data.secret_id }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not common_openbao_systemd_credentials_secret_id_stat.stat.exists
  no_log: true

- name: Check whether the OpenBao runtime image is already present
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ common_openbao_systemd_credentials_image }}"
  register: common_openbao_systemd_credentials_image_present
  failed_when: false
  changed_when: false

- name: Pull the pinned OpenBao runtime image when missing
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ common_openbao_systemd_credentials_image }}"
  when: common_openbao_systemd_credentials_image_present.rc != 0
  register: common_openbao_systemd_credentials_image_pull
  changed_when: true

- name: Render the OpenBao agent configuration for systemd credentials
  ansible.builtin.template:
    src: openbao-agent-systemd-credentials.hcl.j2
    dest: "{{ common_openbao_systemd_credentials_agent_config_file }}"
    owner: root
    group: root
    mode: "0640"
  register: common_openbao_systemd_credentials_agent_config

- name: Render the OpenBao agent credential template
  ansible.builtin.copy:
    src: "{{ common_openbao_systemd_credentials_agent_template_local_file }}"
    dest: "{{ common_openbao_systemd_credentials_agent_template_file }}"
    owner: root
    group: root
    mode: "0640"
  when: common_openbao_systemd_credentials_agent_template_local_file | default('') | length > 0
  register: common_openbao_systemd_credentials_agent_template_copy
  no_log: true

- name: Render the OpenBao agent credential template
  ansible.builtin.copy:
    dest: "{{ common_openbao_systemd_credentials_agent_template_file }}"
    content: "{{ common_openbao_systemd_credentials_agent_template_content }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - common_openbao_systemd_credentials_agent_template_local_file | default('') | length == 0
    - common_openbao_systemd_credentials_agent_template_content | default('') | length > 0
  register: common_openbao_systemd_credentials_agent_template_content_render
  no_log: true

- name: Render the OpenBao agent credential template
  ansible.builtin.template:
    src: "{{ common_openbao_systemd_credentials_agent_template_src }}"
    dest: "{{ common_openbao_systemd_credentials_agent_template_file }}"
    owner: root
    group: root
    mode: "0640"
  when:
    - common_openbao_systemd_credentials_agent_template_local_file | default('') | length == 0
    - common_openbao_systemd_credentials_agent_template_content | default('') | length == 0
  register: common_openbao_systemd_credentials_agent_template_render
  no_log: true

- name: Render the OpenBao agent systemd unit
  ansible.builtin.template:
    src: openbao-agent-systemd-credentials.service.j2
    dest: "/etc/systemd/system/{{ common_openbao_systemd_credentials_agent_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: common_openbao_systemd_credentials_unit

- name: Enable and start the OpenBao agent systemd unit
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: systemd_unit
  vars:
    common_systemd_unit_name: "{{ common_openbao_systemd_credentials_agent_service_name }}"
    common_systemd_unit_enabled: true
    common_systemd_unit_state: >-
      {{
        'restarted'
        if (
          common_openbao_systemd_credentials_image_present.rc != 0
          or (common_openbao_systemd_credentials_secret_write is defined and common_openbao_systemd_credentials_secret_write.changed)
          or common_openbao_systemd_credentials_agent_config.changed
          or common_openbao_systemd_credentials_unit.changed
          or (common_openbao_systemd_credentials_agent_template_copy is defined and common_openbao_systemd_credentials_agent_template_copy.changed)
          or (common_openbao_systemd_credentials_agent_template_content_render is defined and common_openbao_systemd_credentials_agent_template_content_render.changed)
          or (common_openbao_systemd_credentials_agent_template_render is defined and common_openbao_systemd_credentials_agent_template_render.changed)
        )
        else 'started'
      }}
    common_systemd_unit_daemon_reload: "{{ common_openbao_systemd_credentials_unit.changed }}"
    common_systemd_unit_verify_active: true
    common_systemd_unit_expected_active_state: active

- name: Wait for the refreshed host-native credential file after OpenBao secret changes
  ansible.builtin.wait_for:
    path: "{{ common_openbao_systemd_credentials_credential_file }}"
    state: present
    timeout: 60
  when: common_openbao_systemd_credentials_secret_write is defined and common_openbao_systemd_credentials_secret_write.changed

- name: Render the normalized expected host-native credential lines after OpenBao secret changes
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_expected_credential_lines: |-
      {% for item in common_openbao_systemd_credentials_secret_payload | dict2items | sort(attribute='key') %}
      {{ item.key }}={{ item.value }}
      {% endfor %}
  when: common_openbao_systemd_credentials_secret_write is defined and common_openbao_systemd_credentials_secret_write.changed
  no_log: true

- name: Record explicit rendered host-native credential content after OpenBao secret changes
  ansible.builtin.set_fact:
    common_openbao_systemd_credentials_expected_rendered_content: >-
      {{ common_openbao_systemd_credentials_expected_credential_content | trim }}
  when:
    - common_openbao_systemd_credentials_secret_write is defined and common_openbao_systemd_credentials_secret_write.changed
    - common_openbao_systemd_credentials_expected_credential_content | default('') | length > 0
  no_log: true

- name: Confirm the refreshed host-native credential file content changed after OpenBao secret updates
  ansible.builtin.slurp:
    src: "{{ common_openbao_systemd_credentials_credential_file }}"
  register: common_openbao_systemd_credentials_refreshed_credential_file
  retries: 30
  delay: 1
  until: >-
    (common_openbao_systemd_credentials_refreshed_credential_file.content | default('') | length) > 0
    and
    (
      (
        (common_openbao_systemd_credentials_expected_credential_content | default('') | length > 0)
        and
        (
          common_openbao_systemd_credentials_refreshed_credential_file.content
          | b64decode
          | trim
        ) == common_openbao_systemd_credentials_expected_rendered_content
      )
      or
      (
        (common_openbao_systemd_credentials_expected_credential_content | default('') | length == 0)
        and
        (
          common_openbao_systemd_credentials_refreshed_credential_file.content | b64decode | splitlines()
          | map('trim') | reject('equalto', '') | sort | list
        )
        ==
        (
          common_openbao_systemd_credentials_expected_credential_lines | default('') | splitlines()
          | map('trim') | reject('equalto', '') | sort | list
        )
      )
    )
  when: common_openbao_systemd_credentials_secret_write is defined and common_openbao_systemd_credentials_secret_write.changed
  no_log: true
