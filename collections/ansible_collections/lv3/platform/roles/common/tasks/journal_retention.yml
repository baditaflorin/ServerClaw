---
# Purpose: Bound system journals before emergency storage recovery is needed.
# Use case: Host or guest baseline convergence or a targeted journal-retention apply.
# Inputs: common_journal_retention_* byte-size and time-span limits.
# Outputs: A managed journald drop-in and a running journal daemon.
# Idempotency: Restart journald only when its managed configuration changes.
# Dependencies: systemd-journald; ADR 0226 host-resident supervisors.

- name: Ensure the journald configuration directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render bounded system journal retention
  ansible.builtin.template:
    src: journal-retention.conf.j2
    dest: /etc/systemd/journald.conf.d/60-fleet-retention.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  register: common_journal_retention_config

- name: Restart journald after changing its retention limits
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: common_journal_retention_config.changed

- name: Verify journald remains active
  ansible.builtin.command: systemctl is-active systemd-journald.service
  changed_when: false
  when: not ansible_check_mode
