---
- name: Derive FlowInquiry conventional defaults from the service registry
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: derive_service_defaults
  vars:
    common_derive_service_name: flowinquiry

- name: Validate FlowInquiry runtime inputs
  ansible.builtin.assert:
    that:
      - flowinquiry_site_dir | length > 0
      - flowinquiry_secret_dir | length > 0
      - flowinquiry_compose_file | length > 0
      - flowinquiry_internal_port | int > 0
      - flowinquiry_public_base_url | length > 0
    fail_msg: "flowinquiry_runtime requires site_dir, secret_dir, compose_file, port, and public URL."

- name: Ensure FlowInquiry directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ flowinquiry_site_dir }}"
      mode: "0755"
    - path: "{{ flowinquiry_secret_dir }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure FlowInquiry local artifact directory exists
  ansible.builtin.file:
    path: "{{ flowinquiry_local_artifact_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate FlowInquiry database password
  ansible.builtin.command:
    argv: [openssl, rand, -hex, 32]
  register: flowinquiry_db_password_raw
  changed_when: false
  no_log: true

- name: Persist FlowInquiry secrets on guest (once-only)
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    owner: root
    group: root
    mode: "0600"
    force: false
  loop:
    - path: "{{ flowinquiry_db_password_remote_file }}"
      content: "{{ flowinquiry_db_password_raw.stdout | trim }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Read FlowInquiry secrets from guest
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ flowinquiry_db_password_remote_file }}"
  register: flowinquiry_secrets_raw
  no_log: true

- name: Decode FlowInquiry secrets
  ansible.builtin.set_fact:
    flowinquiry_db_password: "{{ flowinquiry_secrets_raw.results[0].content | b64decode | trim }}"
  no_log: true

- name: Mirror FlowInquiry secrets to control machine
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}\n"
    mode: "0600"
    force: false
  delegate_to: localhost
  become: false
  loop:
    - path: "{{ flowinquiry_db_password_local_file }}"
      content: "{{ flowinquiry_db_password }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true

- name: Render the FlowInquiry compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ flowinquiry_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  register: flowinquiry_compose_template

- name: Converge the FlowInquiry runtime stack
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: docker_compose_converge
  vars:
    common_docker_compose_converge_compose_file: "{{ flowinquiry_compose_file }}"
    common_docker_compose_converge_site_dir: "{{ flowinquiry_site_dir }}"
    common_docker_compose_converge_service_name: flowinquiry
    common_docker_compose_converge_template_results:
      - "{{ flowinquiry_compose_template }}"

- name: Wait for FlowInquiry to listen
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ flowinquiry_internal_port }}"
    delay: 10
    timeout: 300

- name: Verify FlowInquiry runtime
  ansible.builtin.import_tasks: verify.yml
