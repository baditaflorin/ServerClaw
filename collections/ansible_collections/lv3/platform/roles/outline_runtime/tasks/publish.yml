---
# Purpose: Bootstrap the public Outline knowledge surface after edge publication.

- name: Validate Outline publication inputs
  ansible.builtin.assert:
    that:
      - outline_public_base_url | length > 0
      - outline_oidc_provider == 'authentik'
      - outline_oidc_issuer | length > 0
      - outline_oidc_discovery_url | length > 0
      - outline_oidc_auth_uri | length > 0
      - outline_api_token_name | length > 0
      - outline_api_token_local_file | length > 0
      - outline_api_token_scopes | length > 0
    fail_msg: >-
      outline_runtime publication requires the public URL, selected Authentik
      metadata and the controller-local durable API token path.

- name: Check whether the Outline API token already exists on the control machine
  ansible.builtin.stat:
    path: "{{ outline_api_token_local_file }}"
  register: outline_api_token_local

- name: Record whether Outline already has durable API authority
  ansible.builtin.set_fact:
    outline_api_token_preexisting: >-
      {{
        outline_api_token_local.stat.exists | default(false)
        and (outline_api_token_local.stat.size | default(0) | int) > 0
      }}

- name: Require owner-only permissions on the durable Outline API token
  ansible.builtin.assert:
    that:
      - outline_api_token_local.stat.isreg | default(false)
      - outline_api_token_local.stat.mode == '0600'
    fail_msg: >-
      {{ outline_api_token_local_file }} must be a regular owner-only 0600 file.
      Restrict the existing durable token to its owner before converging Outline.
  when: outline_api_token_preexisting

- name: Require a durable Outline API token before publication
  ansible.builtin.assert:
    that:
      - outline_api_token_preexisting
    fail_msg: >-
      {{ outline_api_token_local_file }} is missing or empty. Sign in to Outline
      through Authentik, create a scoped API token named {{ outline_api_token_name }},
      and store it in that owner-only controller-local path before converging.

- name: Wait for the Outline public health endpoint
  ansible.builtin.uri:
    url: "{{ outline_public_base_url }}/_health"
    method: GET
    status_code: 200
  register: outline_publish_public_health
  retries: 18
  delay: 5
  until: outline_publish_public_health.status == 200
  changed_when: false

- name: Read the selected Outline OIDC discovery document
  ansible.builtin.uri:
    url: "{{ outline_oidc_discovery_url }}"
    method: GET
    status_code: 200
    return_content: true
  register: outline_oidc_discovery
  changed_when: false

- name: Assert the selected Outline OIDC discovery contract
  ansible.builtin.assert:
    that:
      - outline_oidc_discovery.json.issuer == outline_oidc_issuer
      - outline_oidc_discovery.json.authorization_endpoint == outline_oidc_auth_uri
      - outline_oidc_discovery.json.token_endpoint == outline_oidc_token_uri
      - outline_oidc_discovery.json.userinfo_endpoint == outline_oidc_userinfo_uri
      # Outline accepts a configured logout URI with a fixed
      # post_logout_redirect_uri query, while discovery advertises the
      # provider's endpoint without consumer-specific query parameters.
      - outline_oidc_discovery.json.end_session_endpoint == outline_oidc_logout_uri.split('?')[0]
    fail_msg: "Outline selected OIDC metadata does not match the live Authentik discovery document."

- name: Verify the Outline public login starts at the selected OIDC provider
  ansible.builtin.uri:
    url: "{{ outline_public_base_url }}/auth/oidc"
    method: GET
    follow_redirects: none
    status_code:
      - 302
      - 303
  register: outline_public_oidc_redirect
  changed_when: false

- name: Assert the Outline login redirect selects Authentik
  ansible.builtin.assert:
    that:
      - outline_public_oidc_redirect.location is defined
      - outline_public_oidc_redirect.location.startswith(outline_oidc_auth_uri)
      - "'client_id=' ~ (outline_oidc_client_id | urlencode) in outline_public_oidc_redirect.location"
    fail_msg: "Outline did not redirect its public OIDC login to the selected Authentik client."

- name: Record durable Outline API authority
  ansible.builtin.set_fact:
    outline_api_token_available: "{{ outline_api_token_preexisting }}"

- name: Sync the Outline landing and index documents
  ansible.builtin.command:
    argv:
      - python3
      - "{{ inventory_dir }}/../scripts/sync_docs_to_outline.py"
      - sync
      - --repo-root
      - "{{ inventory_dir }}/.."
      - --base-url
      - "{{ outline_public_base_url }}"
      - --api-token-file
      - "{{ outline_api_token_local_file }}"
  changed_when: "'updated' in outline_sync_docs.stdout or 'created' in outline_sync_docs.stdout"
  register: outline_sync_docs
  when: outline_api_token_available

- name: Verify the Outline public living knowledge surface
  ansible.builtin.command:
    argv:
      - python3
      - "{{ inventory_dir }}/../scripts/sync_docs_to_outline.py"
      - verify
      - --repo-root
      - "{{ inventory_dir }}/.."
      - --base-url
      - "{{ outline_public_base_url }}"
      - --api-token-file
      - "{{ outline_api_token_local_file }}"
  register: outline_verify_sync
  changed_when: false
  when: outline_api_token_available
