---
# NOTE: Conventional variables (site_dir, image, compose_file, env_file, openbao_*,
# container_name, internal_port, local_artifact_dir) are derived from
# platform_service_registry — ADR 0373.
# These defaults mirror the derive_service_defaults output so arg spec validation
# passes before derive_service_defaults runs (same pattern as glitchtip_runtime).
# Purpose: Default runtime inputs for the Outline knowledge wiki.

outline_site_dir: /opt/outline
outline_data_dir: "{{ outline_site_dir }}/data"
outline_compose_file: "{{ outline_site_dir }}/docker-compose.yml"
outline_env_file: "{{ compose_runtime_secret_root }}/outline/runtime.env"
outline_image: "{{ container_image_catalog.images.outline_runtime.ref }}"

outline_service_topology: "{{ hostvars[platform_topology_host].platform_service_topology | service_topology_get('outline') }}"
outline_authentik_service_topology: "{{ hostvars[platform_topology_host].platform_service_topology | service_topology_get('authentik') }}"
outline_session_authority: "{{ platform_session_authority }}"
outline_internal_base_url: "http://127.0.0.1:{{ outline_internal_port }}"
outline_public_base_url: "https://{{ outline_service_topology.public_hostname }}"
# S3 access via shared platform MinIO (ADR 0274, ADR 0397, ADR 0398)
outline_s3_bucket_name: "{{ minio_outline_bucket_name }}"
outline_s3_access_key_id: "{{ minio_outline_access_key_id }}"
outline_s3_secret_key_local_file: "{{ minio_outline_secret_key_local_file }}"
outline_s3_public_url: "{{ minio_public_base_url }}"
outline_s3_internal_url: "{{ minio_private_api_url }}"
outline_public_edge_private_ip: "{{ hostvars[platform_topology_host].proxmox_public_edge_ipv4 }}"
outline_public_hostname_overrides:
  - hostname: "{{ outline_service_topology.public_hostname }}"
    address: "{{ outline_public_edge_private_ip }}"
  - hostname: "{{ outline_authentik_service_topology.public_hostname }}"
    address: "{{ outline_public_edge_private_ip }}"
outline_redis_container_name: outline-redis
outline_minio_container_name: outline-minio
outline_redis_image: "{{ container_image_catalog.images.langfuse_redis_runtime.ref }}"
outline_minio_image: "{{ container_image_catalog.images.minio_runtime.ref }}"
outline_database_name: outline
outline_database_user: outline
outline_database_host: "{{ hostvars[hostvars[platform_topology_host].postgres_ha.initial_primary].ansible_host }}"
outline_database_password_local_file: "{{ outline_local_artifact_dir }}/database-password.txt"
outline_secret_key_local_file: "{{ outline_local_artifact_dir }}/secret-key.txt"
outline_utils_secret_local_file: "{{ outline_local_artifact_dir }}/utils-secret.txt"
outline_redis_password_local_file: "{{ outline_local_artifact_dir }}/redis-password.txt"
outline_minio_root_password_local_file: "{{ outline_local_artifact_dir }}/minio-root-password.txt"
outline_api_token_local_file: "{{ outline_local_artifact_dir }}/api-token.txt"
outline_oidc_provider: authentik
outline_oidc_display_name: Authentik
outline_oidc_client_id: outline
outline_oidc_client_secret_local_file: "{{ repo_shared_local_root }}/authentik/outline-client-secret.txt"
outline_oidc_issuer: "https://{{ outline_authentik_service_topology.public_hostname }}/application/o/outline/"
outline_oidc_discovery_url: "{{ outline_oidc_issuer }}.well-known/openid-configuration"
outline_oidc_auth_uri: "https://{{ outline_authentik_service_topology.public_hostname }}/application/o/authorize/"
outline_oidc_token_uri: "https://{{ outline_authentik_service_topology.public_hostname }}/application/o/token/"
outline_oidc_userinfo_uri: "https://{{ outline_authentik_service_topology.public_hostname }}/application/o/userinfo/"
outline_oidc_logout_uri: >-
  https://{{ outline_authentik_service_topology.public_hostname }}/application/o/outline/end-session/?post_logout_redirect_uri={{
  outline_session_authority.shared_logged_out_url | urlencode }}
outline_oidc_username_claim: preferred_username
outline_oidc_scopes: openid profile email
outline_secret_key_remote_file: "{{ outline_secret_dir }}/secret-key.txt"
outline_utils_secret_remote_file: "{{ outline_secret_dir }}/utils-secret.txt"
# ADR 0491 recovery: deployments that historically used the unabridged
# config-prefix retain their original Outline encryption keys here. The current
# unix-prefix path remains canonical; this path is read only as a compatible
# recovery source when the canonical key is absent or invalid.
outline_legacy_secret_dir: "/etc/{{ platform_config_prefix }}/outline"
outline_legacy_secret_key_remote_file: "{{ outline_legacy_secret_dir }}/secret-key.txt"
outline_legacy_utils_secret_remote_file: "{{ outline_legacy_secret_dir }}/utils-secret.txt"
outline_redis_password_remote_file: "{{ outline_secret_dir }}/redis-password.txt"
outline_minio_root_password_remote_file: "{{ outline_secret_dir }}/minio-root-password.txt"
outline_aws_region: eu-central-1
outline_api_token_name: "{{ platform_identity.config_prefix }}-outline-sync"
outline_api_token_scopes:
  - collections.create
  - collections.delete
  - collections.info
  - collections.list
  - collections.update
  - collections.memberships
  - collections.addUser
  - collections.removeUser
  - collections.addGroup
  - collections.removeGroup
  - documents.create
  - documents.delete
  - documents.info
  - documents.list
  - documents.update
  - groups.create
  - groups.delete
  - groups.info
  - groups.list
  - groups.update
  - groups.memberships
  - groups.addUser
  - groups.removeUser
  - users.list
  - users.read
outline_app_name: LV3 Knowledge Wiki
outline_force_https: true
outline_enable_updates: false
