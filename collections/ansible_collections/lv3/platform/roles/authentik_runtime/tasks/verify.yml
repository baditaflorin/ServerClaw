---
- name: Wait for the Authentik runtime to listen locally
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ authentik_internal_port }}"
    delay: 0
    timeout: 180

- name: Verify the Authentik health endpoint
  ansible.builtin.uri:
    url: "{{ authentik_private_url }}{{ authentik_healthcheck_path }}"
    method: GET
    status_code: 200
  register: authentik_verify_health
  retries: 18
  delay: 5
  until: authentik_verify_health.status == 200
  changed_when: false
