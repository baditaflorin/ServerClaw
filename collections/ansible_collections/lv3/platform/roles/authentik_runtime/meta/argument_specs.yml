---
argument_specs:
  main:
    short_description: Converge the OpenBao-backed Authentik identity runtime.
    options:
      authentik_service_topology:
        type: dict
        required: true
        description:
          - Service topology entry for the scaffolded runtime.
      authentik_secret_bootstrap_mode:
        type: str
        required: true
        choices:
          - preserve
          - adopt_legacy
          - generate
        description:
          - Fail-safe source selection for canonical Authentik secrets.
          - Existing deployments must explicitly adopt the legacy environment.
      authentik_legacy_env_file:
        type: path
        required: true
        description:
          - Existing root-owned environment used only during explicit adoption.
      authentik_legacy_env_backup_file:
        type: path
        required: true
        description:
          - Recoverable copy retained through the post-adoption verification window.
      authentik_legacy_compose_backup_file:
        type: path
        required: true
        description:
          - Root-only rollback copy of the pre-OpenBao compose definition.
      authentik_site_dir:
        type: path
        required: true
        description:
          - Base directory for the Authentik compose stack.
      authentik_secret_dir:
        type: path
        required: true
        description:
          - Guest-local directory that stores bootstrap secret material.
      authentik_compose_file:
        type: path
        required: true
        description:
          - Compose file path for the scaffolded runtime.
      authentik_env_file:
        type: path
        required: true
        description:
          - Runtime env file rendered for the application container.
      authentik_image:
        type: str
        required: true
        description:
          - Container image reference for the scaffolded application.
      authentik_container_name:
        type: str
        required: true
        description:
          - Docker container name for the scaffolded application.
      authentik_internal_port:
        type: int
        required: true
        description:
          - Host port exposed by the scaffolded runtime.
      authentik_container_port:
        type: int
        required: true
        description:
          - Container port exposed by the application image.
      authentik_healthcheck_path:
        type: str
        required: true
        description:
          - HTTP path used by the local verify contract.
      authentik_public_url:
        type: str
        required: true
        description:
          - Public Authentik authority used by the OAuth reconciler.
      authentik_bootstrap_admin_token_remote_file:
        type: path
        required: true
        description:
          - Guest-local file that stores the generated bootstrap admin token.
      authentik_local_artifact_dir:
        type: path
        required: true
        description:
          - Controller-local directory that mirrors the bootstrap admin token.
      authentik_bootstrap_admin_token_local_file:
        type: path
        required: true
        description:
          - Controller-local mirror path for the bootstrap admin token.
      authentik_postgres_image:
        type: str
        required: true
        description:
          - Container image reference for Authentik's own PostgreSQL database.
      authentik_redis_image:
        type: str
        required: true
        description:
          - Container image reference for Authentik's Redis cache/session store.
      authentik_secret_key_remote_file:
        type: path
        required: true
        description:
          - Guest-local file that stores the generated Django SECRET_KEY.
      authentik_postgres_password_remote_file:
        type: path
        required: true
        description:
          - Guest-local file that stores the shared Postgres password.
      authentik_bootstrap_token_remote_file:
        type: path
        required: true
        description:
          - Guest-local file that stores the generated API bootstrap token
            (AUTHENTIK_BOOTSTRAP_TOKEN), the surface that makes Authentik
            agentic/API-drivable per ADR 0491.
      authentik_oauth_reconcile_enabled:
        type: bool
        required: true
        description:
          - Reconcile the manifest after local runtime health succeeds.
      authentik_oauth_manifest_file:
        type: path
        required: true
        description:
          - Controller-side non-secret OAuth provider/application manifest.
      authentik_oauth_reconcile_script:
        type: path
        required: true
        description:
          - Controller-side idempotent Authentik API reconciler.
      authentik_oauth_reconcile_token_file:
        type: path
        required: true
        description:
          - Ignored controller-local Authentik API token file.
      authentik_oauth_reconcile_clients:
        type: list
        elements: str
        required: true
        description:
          - Manifest client identifiers reconciled by this converge.
      authentik_identity_reconcile_enabled:
        type: bool
        required: true
        description:
          - Reconcile the governed Authentik groups and initial internal accounts.
      authentik_identity_manifest_file:
        type: path
        required: true
        description:
          - Controller-side non-secret identity manifest.
      authentik_identity_reconcile_script:
        type: path
        required: true
        description:
          - Controller-side idempotent Authentik identity reconciler.
      authentik_identity_reconcile_token_file:
        type: path
        required: true
        description:
          - Ignored controller-local Authentik API token file.
      authentik_bootstrap_admin_username:
        type: str
        required: true
        description:
          - Existing Authentik bootstrap administrator reconciled into platform groups.
      authentik_blueprints_dir:
        type: path
        required: true
        description:
          - Guest-local directory that holds repository-managed Authentik blueprints.
      authentik_recovery_blueprint_file:
        type: path
        required: true
        description:
          - Controller-side non-secret recovery-flow blueprint.
      authentik_recovery_blueprint_remote_file:
        type: path
        required: true
        description:
          - Guest-local recovery-flow blueprint mounted into Authentik.
      authentik_recovery_verify_script:
        type: path
        required: true
        description:
          - Controller-side read-only verifier for recovery bindings.
      authentik_recovery_flow_slug:
        type: str
        required: true
        description:
          - Stable slug of the managed Authentik recovery flow.
      authentik_recovery_identification_stage_name:
        type: str
        required: true
        description:
          - Existing login identification stage that exposes recovery.
      authentik_recovery_email_stage_name:
        type: str
        required: true
        description:
          - Managed email stage configured to use global SMTP settings.
      authentik_recovery_verification_enabled:
        type: bool
        required: true
        description:
          - Verify recovery-flow bindings after Authentik starts.
      authentik_mail_platform_docker_network_name:
        type: str
        required: true
        description:
          - Existing external Docker network that exposes the managed SMTP relay.
      authentik_email_host:
        type: str
        required: true
        description:
          - SMTP relay DNS name resolved on the managed mail-platform network.
      authentik_email_port:
        type: int
        required: true
        description:
          - Private authenticated SMTP relay port for Authentik global email.
      authentik_email_username:
        type: str
        required: true
        description:
          - Managed SMTP mailbox login for Authentik global email.
      authentik_email_password_local_file:
        type: path
        required: true
        description:
          - Controller-local root-only SMTP password source.
      authentik_email_use_tls:
        type: bool
        required: true
        description:
          - Whether Authentik should negotiate STARTTLS with the private relay.
      authentik_email_use_ssl:
        type: bool
        required: true
        description:
          - Whether Authentik should use implicit TLS with the private relay.
      authentik_email_timeout:
        type: int
        required: true
        description:
          - SMTP connection timeout in seconds.
      authentik_email_from:
        type: str
        required: true
        description:
          - Managed sender address used for Authentik recovery mail.
