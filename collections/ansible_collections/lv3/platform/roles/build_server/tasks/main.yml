---
- name: Require the selected deployment identity before changing the build host
  ansible.builtin.assert:
    that:
      - platform_domain is string
      - platform_domain | lower not in ['example.com', 'example.org']
      - platform_identity is mapping
      - platform_identity.config_prefix is string
      - platform_identity.config_prefix | lower != 'example'
    fail_msg: >-
      Refusing to configure the production build host with a generic identity.
      Select the deployment's real identity.yml with PLATFORM_IDENTITY_OVERLAY.

- name: Validate build server inputs
  ansible.builtin.include_role:
    name: common
    tasks_from: assert_vars
  vars:
    common_assert_vars_required:
      - build_server_workspace
      - build_server_packer_plugin_cache
      - build_server_ansible_collection_cache
      - build_server_ansible_requirements_sha_file
      - build_server_pip_cache_volume
      - build_server_apt_cacher_report_url
      - build_server_buildkit_service_name
      - build_server_buildkit_builder_name
      - build_server_buildkit_config_file
      - build_server_buildkit_socket_file
      - build_server_buildkit_cache_dir
    common_assert_vars_expressions:
      - build_server_buildkit_cache_gb | int > 0
      - build_server_buildkit_keep_duration_hours | int > 0
      - build_server_apt_cacher_port | int > 0
    common_assert_vars_fail_msg: >-
      build_server requires cache directories, the BuildKit daemon settings,
      and apt-cacher-ng endpoints to be defined.

- name: Ensure build server packages are present
  ansible.builtin.apt:
    name: "{{ build_server_packages }}"
    state: present
    update_cache: true
    force_apt_get: true

- name: Ensure build server cache directories exist
  ansible.builtin.include_role:
    name: common
    tasks_from: directory_tree
  vars:
    common_directory_tree_paths: "{{ build_server_managed_directories }}"

- name: Validate private registry host mappings
  ansible.builtin.assert:
    that:
      - item.hostname is string
      - item.hostname is match('^[A-Za-z0-9.-]+$')
      - item.address is string
      - item.address is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
    fail_msg: Each build-server registry mapping needs a DNS hostname and IPv4 address.
  loop: "{{ build_server_registry_hosts }}"
  when: build_server_registry_hosts | length > 0

- name: Ensure the build host resolves private registries through the edge
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED BUILD SERVER REGISTRY HOSTS"
    block: |
      {% for registry_host in build_server_registry_hosts %}
      {{ registry_host.address }} {{ registry_host.hostname }}
      {% endfor %}
    state: "{{ 'present' if build_server_registry_hosts | length > 0 else 'absent' }}"
    owner: root
    group: root
    mode: "0644"

- name: Render BuildKit daemon configuration
  ansible.builtin.template:
    src: buildkitd.toml.j2
    dest: "{{ build_server_buildkit_config_file }}"
    owner: root
    group: root
    mode: "0644"
  register: build_server_buildkit_config

- name: Render BuildKit systemd unit
  ansible.builtin.template:
    src: lv3-buildkitd.service.j2
    dest: "/etc/systemd/system/{{ build_server_buildkit_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: build_server_buildkit_unit

- name: Ensure apt-cacher-ng is enabled and started
  ansible.builtin.systemd_service:
    name: apt-cacher-ng
    enabled: true
    state: started

- name: Validate explicit legacy BuildKit retirement request
  ansible.builtin.assert:
    that:
      - build_server_buildkit_legacy_containers_idle_confirmed | bool
      - build_server_buildkit_legacy_container_names | unique | list | length == build_server_buildkit_legacy_container_names | length
      - build_server_buildkit_container_name not in build_server_buildkit_legacy_container_names
    fail_msg: >-
      Explicit legacy BuildKit retirement requires an idle-build confirmation,
      unique container names, and must not target the managed container name.
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Inspect explicitly listed legacy BuildKit containers
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.Config.Image{{ '}}' }}|{{ '{{' }}.State.Running{{ '}}' }}|{{ '{{' }}range .Mounts{{ '}}' }}{{ '{{' }}.Source{{ '}}' }}:{{ '{{' }}.Destination{{ '}}' }};{{ '{{' }}end{{ '}}' }}"
      - "{{ item }}"
  loop: "{{ build_server_buildkit_legacy_container_names }}"
  register: build_server_legacy_buildkit_inspection
  changed_when: false
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Require listed legacy containers to be the expected BuildKit daemon with its persistent mounts
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout.startswith(build_server_buildkit_image ~ '|')
      - (build_server_buildkit_socket_dir ~ ':' ~ build_server_buildkit_socket_dir ~ ';') in item.stdout
      - (build_server_buildkit_cache_dir ~ ':/var/lib/buildkit;') in item.stdout
    fail_msg: >-
      Refusing to stop a listed container unless it is the expected BuildKit
      image and mounts the managed socket directory and persistent cache.
  loop: "{{ build_server_legacy_buildkit_inspection.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Inspect systemd units corresponding to explicitly listed legacy BuildKit containers
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ item }}.service"
  loop: "{{ build_server_buildkit_legacy_container_names }}"
  register: build_server_legacy_buildkit_systemd_inspection
  changed_when: false
  failed_when: false
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Require legacy BuildKit systemd-unit inspection to be conclusive
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | trim in ['loaded', 'not-found']
    fail_msg: >-
      Refusing to retire explicitly listed BuildKit containers because their
      corresponding systemd-unit state could not be determined.
  loop: "{{ build_server_legacy_buildkit_systemd_inspection.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}.service"
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Stop explicit legacy BuildKit systemd units and disable non-canonical units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}.service"
    state: stopped
    enabled: "{{ item.item == build_server_buildkit_service_name }}"
  loop: "{{ build_server_legacy_buildkit_systemd_inspection.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}.service"
  when:
    - build_server_buildkit_legacy_container_names | length > 0
    - item.stdout | trim == 'loaded'

- name: Reinspect legacy BuildKit containers after stopping their systemd units
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Running{{ '}}' }}"
      - "{{ item }}"
  loop: "{{ build_server_buildkit_legacy_container_names }}"
  register: build_server_legacy_buildkit_post_unit_inspection
  changed_when: false
  failed_when: false
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Require post-unit legacy BuildKit inspection to be conclusive
  ansible.builtin.assert:
    that:
      - "item.rc == 0 or ('No such object: ' ~ item.item) in item.stderr"
    fail_msg: >-
      Could not confirm the post-unit state of explicitly listed legacy
      BuildKit container {{ item.item }}.
  loop: "{{ build_server_legacy_buildkit_post_unit_inspection.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: build_server_buildkit_legacy_container_names | length > 0

- name: Stop explicitly listed idle legacy BuildKit containers
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - --time
      - "30"
      - "{{ item.item }}"
  loop: "{{ build_server_legacy_buildkit_post_unit_inspection.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - build_server_buildkit_legacy_container_names | length > 0
    - item.rc == 0
    - item.stdout | trim == 'true'
  register: build_server_legacy_buildkit_stop
  failed_when:
    - build_server_legacy_buildkit_stop.rc != 0
    - "'No such container' not in (build_server_legacy_buildkit_stop.stderr | default(''))"
  changed_when: build_server_legacy_buildkit_stop.rc == 0

- name: Ensure BuildKit daemon is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ build_server_buildkit_service_name }}"
    enabled: true
    daemon_reload: "{{ build_server_buildkit_unit.changed }}"
    state: "{{ 'restarted' if (build_server_buildkit_config.changed or build_server_buildkit_unit.changed) else 'started' }}"

- name: Wait for the BuildKit socket to appear
  ansible.builtin.command:
    argv:
      - test
      - -S
      - "{{ build_server_buildkit_socket_file }}"
  register: build_server_buildkit_socket
  changed_when: false
  retries: 12
  delay: 5
  until: build_server_buildkit_socket.rc == 0

- name: Ensure the BuildKit socket is accessible to the build operator
  ansible.builtin.file:
    path: "{{ build_server_buildkit_socket_file }}"
    owner: root
    group: "{{ build_server_ops_group }}"
    mode: "0660"

- name: Verify Docker buildx is available on the build server
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - version
  register: build_server_buildx_version
  changed_when: false
  become: true
  become_user: "{{ build_server_ops_user }}"

- name: Check whether the managed buildx builder already exists
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - inspect
      - "{{ build_server_buildkit_builder_name }}"
  register: build_server_buildx_builder
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ build_server_ops_user }}"

- name: Remove the managed buildx builder before refreshing it
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - rm
      - "{{ build_server_buildkit_builder_name }}"
  when:
    - build_server_buildx_builder.rc == 0
    - build_server_buildkit_config.changed or build_server_buildkit_unit.changed
  register: build_server_buildx_remove
  changed_when: build_server_buildx_remove.rc == 0
  become: true
  become_user: "{{ build_server_ops_user }}"

- name: Create the managed buildx builder
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - create
      - --name
      - "{{ build_server_buildkit_builder_name }}"
      - --driver
      - remote
      - "unix://{{ build_server_buildkit_socket_file }}"
      - --use
  when:
    - build_server_buildx_builder.rc != 0 or build_server_buildkit_config.changed or build_server_buildkit_unit.changed
  register: build_server_buildx_create
  changed_when: build_server_buildx_create.rc == 0
  become: true
  become_user: "{{ build_server_ops_user }}"

- name: Bootstrap the managed buildx builder
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - inspect
      - "{{ build_server_buildkit_builder_name }}"
      - --bootstrap
  register: build_server_buildx_bootstrap
  changed_when: false
  become: true
  become_user: "{{ build_server_ops_user }}"

- name: Ensure the pip cache Docker volume exists
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - inspect
      - "{{ build_server_pip_cache_volume }}"
  register: build_server_pip_cache_volume_inspect
  changed_when: false
  failed_when: false

- name: Create the pip cache Docker volume
  ansible.builtin.command:
    argv:
      - docker
      - volume
      - create
      - "{{ build_server_pip_cache_volume }}"
  when: build_server_pip_cache_volume_inspect.rc != 0
  register: build_server_pip_cache_volume_create
  changed_when: build_server_pip_cache_volume_create.rc == 0

- name: Ensure the Ansible collection SHA marker file exists
  ansible.builtin.file:
    path: "{{ build_server_ansible_requirements_sha_file }}"
    state: touch
    owner: "{{ build_server_ops_user }}"
    group: "{{ build_server_ops_group }}"
    mode: "0644"
    access_time: preserve
    modification_time: preserve

- name: Verify apt-cacher-ng serves the local report page
  ansible.builtin.uri:
    url: "{{ build_server_apt_cacher_report_url }}"
    method: GET
    status_code: 200
  register: build_server_apt_cacher_report
  changed_when: false
