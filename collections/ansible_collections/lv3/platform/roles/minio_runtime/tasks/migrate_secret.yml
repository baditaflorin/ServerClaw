---
# Purpose: Preserve one MinIO credential while moving to the ADR 0438 POSIX-safe secret directory.
# Use case: Included for the root credential and every managed consumer before any missing secret is generated.
# Inputs: minio_secret_contract with remote_file, local_file, and legacy_remote_files.
# Outputs: The canonical remote file exists when a legacy remote or controller-local copy is available.
# Idempotency: Fully idempotent; an existing canonical remote credential is never overwritten.
# Dependencies: ADR 0438 identity flavors and the minio_runtime secret contract resolver.
- name: Check the canonical MinIO secret for {{ minio_secret_contract.name }}
  ansible.builtin.stat:
    path: "{{ minio_secret_contract.remote_file }}"
  register: minio_canonical_secret_stat
  no_log: true

- name: Check legacy MinIO secret candidates for {{ minio_secret_contract.name }}
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ minio_secret_contract.legacy_remote_files }}"
  register: minio_legacy_secret_stats
  when: item != minio_secret_contract.remote_file
  no_log: true

- name: Select the first legacy MinIO secret for {{ minio_secret_contract.name }}
  ansible.builtin.set_fact:
    minio_selected_legacy_secret_file: >-
      {{
        minio_legacy_secret_stats.results
        | default([])
        | selectattr('stat', 'defined')
        | selectattr('stat.isreg', 'defined')
        | selectattr('stat.isreg', 'equalto', true)
        | map(attribute='item')
        | first
        | default('')
      }}
  no_log: true

- name: Check the controller-local MinIO secret for {{ minio_secret_contract.name }}
  ansible.builtin.stat:
    path: "{{ minio_secret_contract.local_file }}"
  delegate_to: localhost
  become: false
  register: minio_controller_secret_stat
  no_log: true

- name: Migrate the legacy MinIO secret for {{ minio_secret_contract.name }}
  ansible.builtin.copy:
    src: "{{ minio_selected_legacy_secret_file }}"
    dest: "{{ minio_secret_contract.remote_file }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - not minio_canonical_secret_stat.stat.exists
    - minio_selected_legacy_secret_file | length > 0
  no_log: true

- name: Restore the controller-local MinIO secret for {{ minio_secret_contract.name }}
  ansible.builtin.copy:
    src: "{{ minio_secret_contract.local_file }}"
    dest: "{{ minio_secret_contract.remote_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - not minio_canonical_secret_stat.stat.exists
    - minio_selected_legacy_secret_file | length == 0
    - minio_controller_secret_stat.stat.isreg | default(false)
  no_log: true

- name: Generate a new MinIO secret for {{ minio_secret_contract.name }}
  ansible.builtin.copy:
    dest: "{{ minio_secret_contract.remote_file }}"
    content: "{{ ('minio-' ~ minio_secret_contract.name) | secret(length=20) }}\n"
    force: false
    owner: root
    group: root
    mode: "0600"
  when:
    - not minio_canonical_secret_stat.stat.exists
    - minio_selected_legacy_secret_file | length == 0
    - not (minio_controller_secret_stat.stat.isreg | default(false))
  no_log: true
