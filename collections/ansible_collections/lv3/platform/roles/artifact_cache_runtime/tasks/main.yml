---
# Purpose: Deploy internal pull-through registry mirrors, render a repo-derived seed plan, and prewarm repeated image pulls on the selected cache host.
- name: Derive Artifact Cache conventional defaults from the service registry
  ansible.builtin.include_role:
    name: lv3.platform.common
    tasks_from: derive_service_defaults
  vars:
    common_derive_service_name: artifact_cache


- name: Validate artifact cache runtime inputs
  ansible.builtin.assert:
    that:
      - artifact_cache_state in ['present', 'absent']
      - artifact_cache_site_dir | length > 0
      - artifact_cache_data_root | length > 0
      - artifact_cache_compose_file | length > 0
      - artifact_cache_seed_plan_file | length > 0
      - artifact_cache_bind_host | length > 0
      - artifact_cache_registry_image | length > 0
      - artifact_cache_seed_script | length > 0
      - artifact_cache_seed_catalogs | length > 0
      - artifact_cache_registry_mirrors | length > 0
      - artifact_cache_ghcr_private_packages_enabled is boolean
      - artifact_cache_ghcr_private_proxy_config_file == '/etc/artifact-cache/ghcr-proxy/config.yml'
      - artifact_cache_ghcr_private_proxy_config_parent_dirs == ['/etc/artifact-cache', '/etc/artifact-cache/ghcr-proxy']
      - artifact_cache_ghcr_private_listener_host == '127.0.0.1'
      - artifact_cache_ghcr_private_listener_port | int == 5005
      - artifact_cache_ghcr_private_storage_path == (artifact_cache_data_root ~ '/ghcr-private')
    fail_msg: >-
      artifact_cache_runtime requires compose paths, a bind address, registry
      mirror definitions, and a controller-local seed planner.

- name: Validate the private GHCR cache boundary when enabled
  ansible.builtin.assert:
    that:
      - artifact_cache_network_mode == 'host'
      - artifact_cache_registry_mirrors.ghcr_io is defined
      - artifact_cache_registry_mirrors.ghcr_io.registry_host == 'ghcr.io'
      - artifact_cache_registry_mirrors.ghcr_io.service_name == 'ghcr'
      - artifact_cache_registry_mirrors.ghcr_io.bind_port == 5002
      - artifact_cache_registry_mirrors.ghcr_io.upstream_registry == 'https://ghcr.io'
      - artifact_cache_ghcr_private_listener_host == '127.0.0.1'
      - artifact_cache_ghcr_private_listener_port | int == 5005
      - artifact_cache_ghcr_private_storage_path == (artifact_cache_data_root ~ '/ghcr-private')
    fail_msg: >-
      Private GHCR upstream authentication is supported only by the dedicated
      loopback-only GHCR cache listener on 127.0.0.1:5005. It cannot be
      applied to the public :5002 adapter, another cache adapter, or an
      arbitrary registry endpoint.
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Inspect the cache-owned rendered GHCR proxy configuration
  ansible.builtin.stat:
    path: "{{ artifact_cache_ghcr_private_proxy_config_file }}"
    follow: false
  register: artifact_cache_ghcr_private_proxy_config_stat
  no_log: true
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Inspect the fixed parent directories for the private GHCR configuration
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ artifact_cache_ghcr_private_proxy_config_parent_dirs }}"
  register: artifact_cache_ghcr_private_proxy_parent_stats
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Require root-only non-symlink parent directories for private GHCR configuration
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.mode == '0700'
    fail_msg: >-
      Private GHCR upstream authentication requires a fixed, root-only,
      non-symlink configuration directory hierarchy.
  loop: "{{ artifact_cache_ghcr_private_proxy_parent_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Require a root-only regular GHCR proxy configuration
  ansible.builtin.assert:
    that:
      - artifact_cache_ghcr_private_proxy_config_stat.stat.exists
      - artifact_cache_ghcr_private_proxy_config_stat.stat.isreg
      - not artifact_cache_ghcr_private_proxy_config_stat.stat.islnk
      - artifact_cache_ghcr_private_proxy_config_stat.stat.uid == 0
      - artifact_cache_ghcr_private_proxy_config_stat.stat.gid == 0
      - artifact_cache_ghcr_private_proxy_config_stat.stat.mode == '0400'
    fail_msg: >-
      Private GHCR upstream authentication is fail-closed: its cache-only
      Docker Distribution configuration must already be a root:root regular
      file with mode 0400, rendered through the approved vault path.
  no_log: true
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Check whether the artifact cache compose file already exists
  ansible.builtin.stat:
    path: "{{ artifact_cache_compose_file }}"
  register: artifact_cache_compose_stat

- name: Stop the artifact cache stack when state=absent
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ artifact_cache_compose_file }}"
      - down
      - --remove-orphans
  args:
    chdir: "{{ artifact_cache_site_dir }}"
  register: artifact_cache_down
  changed_when: >-
    artifact_cache_compose_stat.stat.exists
    and (
      'Stopping' in artifact_cache_down.stdout
      or 'Removing' in artifact_cache_down.stdout
      or 'Network' in artifact_cache_down.stdout
    )
  when:
    - artifact_cache_state == 'absent'
    - artifact_cache_compose_stat.stat.exists

- name: Wait for artifact cache listeners to stop when state=absent
  ansible.builtin.wait_for:
    host: "{{ artifact_cache_bind_host }}"
    port: "{{ item.value.bind_port }}"
    state: stopped
    delay: 0
    timeout: 180
  loop: "{{ artifact_cache_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.value.registry_host }}"
  when: artifact_cache_state == 'absent'

- name: Wait for the private GHCR loopback listener to stop when state=absent
  ansible.builtin.wait_for:
    host: "{{ artifact_cache_ghcr_private_listener_host }}"
    port: "{{ artifact_cache_ghcr_private_listener_port }}"
    state: stopped
    delay: 0
    timeout: 180
  when: artifact_cache_state == 'absent'

- name: Ensure artifact cache directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{
      [artifact_cache_site_dir, artifact_cache_data_root]
      + (artifact_cache_registry_mirrors | dict2items | map(attribute='value.storage_path') | list)
    }}
  when: artifact_cache_state == 'present'

- name: Ensure private GHCR cache storage is root-only
  ansible.builtin.file:
    path: "{{ artifact_cache_ghcr_private_storage_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Render the artifact cache compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ artifact_cache_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  when: artifact_cache_state == 'present'

- name: Pull the artifact cache registry image
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ artifact_cache_compose_file }}"
      - pull
  args:
    chdir: "{{ artifact_cache_site_dir }}"
  register: artifact_cache_pull
  changed_when: >-
    'Pulling' in artifact_cache_pull.stdout
    or 'Downloaded newer image' in artifact_cache_pull.stdout
    or 'Pull complete' in artifact_cache_pull.stdout
  when: artifact_cache_state == 'present'

- name: Start the artifact cache stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ artifact_cache_compose_file }}"
      - up
      - -d
      - --remove-orphans
  args:
    chdir: "{{ artifact_cache_site_dir }}"
  register: artifact_cache_up
  changed_when: >-
    'Creating' in artifact_cache_up.stdout
    or 'Recreating' in artifact_cache_up.stdout
    or 'Starting' in artifact_cache_up.stdout
  when: artifact_cache_state == 'present'

- name: Wait for artifact cache listeners
  ansible.builtin.wait_for:
    host: "{{ artifact_cache_bind_host }}"
    port: "{{ item.value.bind_port }}"
    delay: 0
    timeout: 180
  loop: "{{ artifact_cache_registry_mirrors | dict2items }}"
  loop_control:
    label: "{{ item.value.registry_host }}"
  when: artifact_cache_state == 'present'

- name: Wait for the loopback-only private GHCR listener
  ansible.builtin.wait_for:
    host: "{{ artifact_cache_ghcr_private_listener_host }}"
    port: "{{ artifact_cache_ghcr_private_listener_port }}"
    delay: 0
    timeout: 180
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_ghcr_private_packages_enabled | bool

- name: Generate the artifact cache seed plan from repo catalogs
  ansible.builtin.shell: >-
    {{ ansible_playbook_python | quote }}
    {{ artifact_cache_seed_script | quote }}
    {% for catalog in artifact_cache_seed_catalogs %}
    --catalog {{ catalog | quote }}
    {% endfor %}
    {% for mirror in artifact_cache_registry_mirrors.values() %}
    --mirror {{ (mirror.registry_host ~ '=' ~ mirror.mirror_registry) | quote }}
    {% endfor %}
  delegate_to: localhost
  become: false
  changed_when: false
  register: artifact_cache_seed_plan_command
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_seed_enabled | bool

- name: Parse the artifact cache seed plan
  ansible.builtin.set_fact:
    artifact_cache_seed_plan: "{{ artifact_cache_seed_plan_command.stdout | from_json }}"
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_seed_enabled | bool

- name: Persist the artifact cache seed plan on the guest
  ansible.builtin.copy:
    content: "{{ artifact_cache_seed_plan_command.stdout }}\n"
    dest: "{{ artifact_cache_seed_plan_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_seed_enabled | bool

- name: Warm the mirrored image set through the cache endpoints
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ item.mirror_ref }}"
  loop: "{{ artifact_cache_seed_plan.seed_images }}"
  loop_control:
    label: "{{ item.mirror_ref }}"
  register: artifact_cache_warm_pull
  changed_when: >-
    'Pull complete' in artifact_cache_warm_pull.stdout
    or 'Downloaded newer image' in artifact_cache_warm_pull.stdout
    or 'Status: Downloaded newer image' in artifact_cache_warm_pull.stdout
  when:
    - artifact_cache_state == 'present'
    - artifact_cache_seed_enabled | bool
    - (artifact_cache_seed_plan.seed_images | default([])) | length > 0

- name: Verify artifact cache health probes
  ansible.builtin.import_tasks: verify.yml
  when: artifact_cache_state == 'present'
