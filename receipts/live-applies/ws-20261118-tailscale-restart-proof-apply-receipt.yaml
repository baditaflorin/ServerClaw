workstream: ws-20261118-tailscale-restart-proof
applied_at_utc: '2026-11-17T22:47:00Z'
source_commit: 98ead578ce5590e75d2b0587d3d4f69f71d934d9
status: partial
scope: One real runtime reboot, two guard-service restarts, two additional sender-filter runtime deployments, and one monitoring inventory addition.
verification:
  runtime_reboot: The runtime boot ID changed. The daemon and health timer were enabled and active, and an independent peer reached Tailscale and read healthy advertisement and sender-filter metrics.
  firewall_services: Restarted the owned nftables and physical-egress services sequentially. Both layers and the reconciliation timer were active and enabled; a controlled private-address UDP send was denied and public HTTPS succeeded.
  sender_rollout: The delayed runtime and a separate OpenObserve runtime passed endpoint, service, exporter, and host-guard checks with rollback timers armed; the commits were confirmed only after those checks. The monitoring job scraped eight registered sender guards as healthy.
  verifier_correction: The first reboot verifier used the wrong exporter textfile directory and reported failure; the correct path and independent exporter were checked directly and both sender metrics were healthy.
limitations: No hypervisor reboot or whole-host firewall reload was performed. Other unregistered peers remain to be upgraded. The vendor-version fallback may run the stock daemon, so the WAN guards remain required. The host carrying the two newly upgraded VMs has sustained I/O pressure of unknown cause.
