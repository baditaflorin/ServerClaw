workstream: ws-20261117-private-wan-guard
applied_at_utc: '2026-11-17T16:19:29Z'
status: partial
scope: affected public hypervisor only
change: Separate nftables output and forward chains drop private, CGNAT, and link-local IPv4 destinations on the public interface. Enabled boot-time systemd loader.
verification: Host send denied and output counter incremented; forwarded traffic incremented forward counter; 20-second public-interface capture saw zero guarded destinations; public CI HTTP 200; loader enabled and active.
limitations: Boot not tested; whole-ruleset flush may remove active protection; other hosts and internal-service routes require investigation; provider test and statement outstanding.
additional_scope: Three other verified public hypervisors received equivalent independent guards and enabled boot loaders at approximately 2026-11-17T16:29Z.
additional_verification: Controlled private destination sends failed with EPERM, counters increased, and public CI returned HTTP 200 from each.
additional_limitations: Whole-ruleset reload can remove standalone tables; no reboot or post-reload test; human-written provider statement and provider recheck remain outstanding.
fifth_host: A fifth public hypervisor was guarded at approximately 2026-11-17T16:44Z after verifying its WAN interface; full fleet automation remains in progress.
independent_layer: Physical-uplink TC drop filters plus device-bound systemd units and a health reconciliation timer were installed on all five checked hypervisors on 2026-11-17. Each TC unit was restarted and verified; each exported nft and TC health as 1 and public CI HTTPS succeeded.
independent_layer_validation: Isolated veth tests proved private drop, public pass, nft-ruleset-flush survival, idempotence, rollback, and health recovery after both layers were deleted. Production kernels were individually capability-tested in isolated namespaces.
remaining: A full host reboot was not attempted. Guard absence alert deployment, merged-main replay, Gitea network-policy apply and independent provider recheck remain pending.
monitoring: The monitoring host received the guard alert rules after promtool validation; Prometheus was reloaded without restart. All five hypervisors exposed nft and TC health as 1, and all three alert rules reported healthy.
edge_identity_recovery: At approximately 2026-11-17T17:09Z a narrowly scoped private edge hostname mapping was added to the edge VM hosts file under a lock, with a dated backup. Verified TLS OIDC discovery returned 200, two oauth2-proxy services recovered, and seven frontend paths returned sign-in redirects. Browser authentication and durable convergence remain pending.
edge_identity_boot_persistence: The cloud-init Debian hosts template was updated under the same lock and backed up; a read-only cloud-init template render returned exactly one mapping. Cloud-init logs show the prior boot rewrote the active hosts file. The canonical edge role now manages both files, pending merged-tree replay. A browser reached the Authentik login page; authenticated sign-in was not tested.
internal_hairpin: A separate NAT table was added on the 0mcp hypervisor for private-subnet requests to its own public IPv4 on TCP 80/443; DNAT reaches the private edge and SNAT makes same-subnet return traffic symmetric. Isolated bridge/veth tests proved baseline failure, repair, direct path and rollback. From monitoring, default identity and task hostname requests returned 302 and Gitea returned 200; both NAT counters incremented. The private gateway is the observed source at the edge for these hairpin flows. The standalone table is not yet reboot- or reload-persistent.
internal_hairpin_persistence: An independent nft include file was installed and the hypervisor nftables boot config updated atomically after a full syntax check and backup; no production firewall reload was performed. Canonical role template includes the same narrowly scoped logic for a future managed converge. A live physical uplink capture during identity and tasks requests showed zero frames to the hypervisor public HTTP(S) address. Full reboot and production reload not tested.
merged_main_replay: Commit 6fbf8e49836e8d9aad0120242c40175f6d467edb from merged pull request 698 was replayed on all five active public hypervisors. Both guard units and the reconciliation timer were enabled and active; Prometheus reported nft and TC health as 1 for each host.
gitea_monitoring_apply: After merge, the three planned Proxmox and guest input policy additions were applied with a guarded rollback timer. The monitoring VM obtained HTTP 200 from the internal health endpoint and Prometheus gitea-liveness reported 1.
apply_tool_recovery: The first targeted pve,input attempt exposed an omitted verification key for an unselected chain. The rollback completed and was independently verified. Replanning with pve,input,forward showed the same three additions and applied successfully; a regression fix for partial selection follows in the repository.
current_limitations: Full production firewall reload and host reboot were not attempted; tests cover reload and recovery in isolated network namespaces. The edge hairpin runs as an independent persisted include pending a future managed network converge. Authenticated browser login and the provider recheck are unverified. No control can guarantee immunity to privileged removal or unrelated failures.
