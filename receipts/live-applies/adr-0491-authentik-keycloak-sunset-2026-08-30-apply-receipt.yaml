notes:
  - Authentik readiness, signing-key discovery, declared OAuth provider reconciliation, and identity/group reconciliation completed successfully.
  - Active confidential-client and browser authorization-code flows were verified without recording credentials, tokens, cookies, or client secrets.
  - The public edge redirects protected surfaces to Authentik; API bearer-token validation accepts an Authentik-issued token and rejects invalid or retired-issuer input.
  - Grafana Generic OAuth redirect and GlitchTip OIDC plus event-ingestion smoke checks passed after their scoped converges.
  - Keycloak compose definitions were archived on both former runtime hosts before the stacks were stopped. Runtime data and archives remain retained for the governed rollback window; no volume purge was performed.
  - A supplied operator SSH public key was installed once through the established bootstrap access path and the Proxmox SSH service was verified without exposing key material.
  - The former Keycloak hostname no longer routes to Keycloak. Remaining chat and structured-search degradation are separate services and were not treated as identity-cutover success criteria.
