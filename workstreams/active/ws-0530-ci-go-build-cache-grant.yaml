  changelog_entry: Allow the pve01, 0infer and 0mcp CI agents to reach only the shared Go build cache port on the 0own build worker.
  release_bump: patch
  included_in_repo_version: null
context: >-
  A shared Go build cache (GOCACHEPROG server) runs on the 0own build worker
  so Go builds on any CI agent reuse compiled packages. Agents on other sites
  reach 0own only over the tailnet, so the policy needs one narrow grant to
  the cache port. The metrics port of the same server stays closed to agents.
