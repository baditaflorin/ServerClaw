canonical_truth:
  changelog_entry: Remove the unused GitHub Actions workflow and point validation metadata at Woodpecker while retaining the self-hosted Gitea validator.
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: |
  The repository has a root Woodpecker workflow and required Woodpecker status
  checks, but also retains a GitHub Actions Validate workflow. On the public
  sanitized snapshot, its validate and release-readiness jobs failed before
  any job steps started, while both required Woodpecker checks passed. The
  operator has directed that GitHub Actions not be used. Disable the duplicate
  workflow during transition, remove its tracked source file through the normal
  PR path, and update canonical metadata to reference the current Woodpecker
  workflow. Preserve the separate self-hosted Gitea validation workflow.
tasks:
  - id: t1
    title: Disable the legacy Validate workflow in the private and public repositories
    status: completed
  - id: t2
    title: Remove the tracked GitHub Actions workflow and validate the source tree
    status: completed
notes: |
  The GitHub Actions Validate workflow is absent from the current source and
  public baselines. This branch completes the metadata cleanup by replacing
  the stale workflow-catalog path with .woodpecker.yml and retaining the
  separate self-hosted Gitea validator. The local changed-service completeness
  gate, workstream ownership checks, catalog checks, generated-doc checks, and
  focused regression tests pass. The required Woodpecker PR and push contexts
  must still pass on this rebased branch before merge.
