context: The durable exporter ledger, stable worker label, and dashboard are live;
  historical coverage was 1 at the recorded snapshot. Earlier exporter behavior
  used rolling 24-hour gauges, and prior monitoring instructions referenced an old
  private address and offline jump host; both discrepancies have been corrected.
  The owner-provided trial cost remains in private Fleet State, while provider
  billing cutoff is unconfirmed. Dashboard totals distinguish Woodpecker
  pipelines/workflows from standalone Buildx and Fleet Runner activity.
