context: |
  The Builder metrics peer needs a private path to the Proxmox node-exporter
  listener. The firewall change is intentionally narrower than public ingress.
  Its branch push was blocked by an unrelated all-service completeness scan,
  so changed-service validation is corrected in the same workstream. The first
  live request then exposed the full proxy path: the Proxmox-host allow was
  present, but the docker-build guest firewall also needs to allow the host's
  proxy-backend connection to its node-exporter listener. A guest-policy
  preview also found a live MinIO S3 allow missing from canonical runtime-
  control policy; it is being recorded to avoid deleting that existing flow.
tasks:
  - id: t1
    title: Make the tailnet exception reproducible from canonical topology
    status: completed
  - id: t2
    title: Scope completeness validation to changed service-owned surfaces
    status: completed
  - id: t3
    title: Run impacted and full repository gates, then submit a PR
    status: completed
  - id: t4
    title: Preserve live host firewall exceptions and add a narrow policy target
    status: completed
  - id: t5
    title: Apply the merged policy and verify Builder metrics end to end
    status: completed
