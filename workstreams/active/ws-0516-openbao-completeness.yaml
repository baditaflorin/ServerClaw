context: |
  OpenBao is an active private secrets authority. Its profile was still using an
  expired legacy suppression for missing monitoring assets. Add a real private
  readiness SLO, dashboard, and alert rule so this service passes the current
  completeness contract without extending suppressions. OpenBao receives
  database credentials through its authenticated control API and does not
  consume a Compose env_file, so requires_compose_secrets is false while
  requires_secrets remains true. The same push-gate run also exposed unrelated
  repository-state defects: PostgreSQL's planned standby budget did not match
  its declared guest identity, and exposure-registry regeneration consumed the
  workstation's shared private identity rather than the tracked generation
  snapshot. Both are being corrected so the branch can pass the actual gate
  without claiming that PostgreSQL replication is live.
