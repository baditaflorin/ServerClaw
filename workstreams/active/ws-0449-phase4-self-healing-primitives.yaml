summary: >
  Phase 4 of the self-healing roadmap derived from postmortem 2026-04-28.
  Three deliverables: atomic ADR reservation CLI (eliminates
  number-collision class); validator catalogue generator (prevents the
  "we should add X validator (which already exists)" review-authoring
  failure mode); safe receipt-refresh classifier (turns 72 stale
  receipts into a one-command cleanup pass for the safe-to-refresh
  subset). Two further postmortem items (post-merge rename hook,
  make-doctor aggregator) deferred to phases 5/6.
phases:
  phase_0_open_workstream:
    status: in_progress
    target_version: 0.179.x
  phase_1_reserve_adr:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/reserve_adr.py — fetches origin/main, scans for highest ADR number, optionally writes reservation entry"
      - "tests/test_reserve_adr.py — fixture-based, no real git/network"
  phase_2_validator_catalogue:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/generate_validator_catalogue.py — extracts docstring + ADR refs from scripts/validate_*.py"
      - "build/validator-catalogue.yaml — generated artifact"
      - "advisory wiring in scripts/validate_repo.sh (validate_catalogue_freshness)"
      - "tests/test_generate_validator_catalogue.py"
  phase_3_safe_receipt_refresh:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/refresh_safe_receipts.py — classifies stale receipts into safe_to_refresh / needs_review / unknown"
      - "--apply mode writes [receipt-refresh] commit for safe set"
      - "tests/test_refresh_safe_receipts.py — git-log mocking, classification matrix"
  phase_4_windmill_schedule:
    status: deferred
    target_version: 0.180.x
    deferred_reason: |
      Production cron requires SSH access and Windmill schedule wiring
      that this worktree doesn't have. The helper script is shippable
      today; the recurring schedule needs a dedicated worktree with
      .local/ access.
  phase_5_post_merge_rename_hook:
    status: deferred
    target_version: 0.180.x
    deferred_reason: |
      Auto-rewrite of workstream YAMLs after a merge introduces new
      file renames. Needs a git hook + dry-run mode + safety on
      shared_contract surfaces. Belongs in its own focused ADR.
  phase_6_make_doctor:
    status: deferred
    target_version: 0.181.x
    deferred_reason: |
      Aggregator over every drift signal (stale receipts, dangling
      surfaces, blocked substrate, validator coverage gaps). Should
      land after phases 4 + 5 produce all the underlying signals in
      machine-readable form.
acceptance_criteria:
  - "scripts/reserve_adr.py --next prints the next free ADR number"
  - "scripts/generate_validator_catalogue.py --write produces build/validator-catalogue.yaml with >=25 validators"
  - "scripts/refresh_safe_receipts.py --json classifies every entry in versions/stack.yaml::live_apply_evidence"
  - "validate_catalogue_freshness wired into validate_repo.sh as advisory"
