canonical_truth:
  changelog_entry: "The three live-apply receipts of 2026-11-07 (log shipping labels, standby RAM scratch, standby scratch warning) now pass scripts/live_apply_receipts.py --validate: their workflow_id uses the adr-NNNN-<slug>-live-apply form the validator accepts for applies that did not run a catalog workflow, and each lists evidence_refs and notes (which the validator requires and the receipts lacked). origin/main failed the pre-push gate lane schema-validation on the first of them since PR 686. Receipt metadata only: no verification result, hash or time changes and nothing is applied."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  PR 686 (2026-11-07) merged the receipt 2026-11-07-log-shipping-labels-live-apply with workflow_id adr-0250-log-shipping-label-repair-and-main-replay, which is neither in
  config/workflow-catalog.json nor in RETIRED_WORKFLOW_IDS nor a full match of HISTORICAL_WORKFLOW_ID_PATTERNS (scripts/live_apply_receipts.py), so the data-models step of the pre-push
  gate lane schema-validation (scripts/validate_repo.sh data-models) fails for every branch cut from main. The validator stops at the first bad receipt; run over every receipt it
  rejects two more of the same day (PR 688 and PR 690), whose workflow_id is the workstream id (ws-20261107-...: eight digits where the patterns allow four, and no
  -live-apply suffix), and all three lack evidence_refs and notes, which validate_receipt requires (the JSON schema does not). The other 391 receipts pass. Woodpecker does not
  run data-models or the receipt validator (only validate_repo.sh json health-probes agent-standards and pytest lists), so the five PRs were green there and the failure showed
  up only in the gate on the next push.
