canonical_truth:
  changelog_entry: "The 0mcp build VM's 4-hourly docker-build-gc gains step 3d: the Go build cache inside each fleet-job-cache-* volume is kept under 20 GiB (nothing used within 12 h goes while a job uses the volume), by go-fleet-job v0.5.0's own program vendored byte for byte and pinned by sha256. Git only: nothing is installed on the VM by this change."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  On 2026-10-31 and again on 2026-11-02 one Go build cache volume of the 0mcp build VM, fleet-job-cache-gucapi-gocache, grew from 17 GiB to 80 GiB in two days
  (1.8 to 2.8 GiB an hour) and took the root filesystem from about 69 % to 94 % used, against the CI load controller's line of 10 % free. The volume is in use
  most weekday hours, so idle-cache-volumes-trim.sh (whole volumes, idle for 3 days) never touches it and nothing bounds its size. go-fleet-job v0.5.0
  (2026-11-02) has the program that does (`fleet-job cache prune`: a size cap inside a Go build cache, also while a job uses the volume, never a file used within a
  floor), but nothing schedules it. This change makes the host's own GC call that program, vendored unchanged, so no second implementation exists.
