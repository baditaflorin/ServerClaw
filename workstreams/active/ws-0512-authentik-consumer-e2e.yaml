context: |
  The Authentik migration record reports that all consumers and protected
  browser paths passed, but the operator subsequently observed Outline
  authorization-state/logout problems, failed Grafana token exchange, and
  intermittent 502/login behavior on Repo Intake, Chat, Errors, and Ops Portal.
  Recheck today's live state against current repository declarations and test
  the complete browser redirect/callback/session path before treating the old
  receipt as current proof. Keep credentials in the ignored local overlay and
  use a non-admin identity for consumer testing.

  2026-09-26 checkpoint: the recovery blueprint and dedicated test identity
  were reconciled, and the narrow Authentik converge passed. Gitea and Harbor
  browser OIDC checks pass. Grafana authenticates but returns no orgRole;
  Outline realtime still fails its WebSocket handshake; GlitchTip still
  reports signup_closed. Governed Grafana, GlitchTip, and Outline applies are
  blocked by the vulnerability budget. Do not bypass the gate or renew expired
  exceptions to finish this workstream.

  2026-10-01 checkpoint: current identity/OAuth catalog checks have zero
  drift, the live catalog has 22 Authentik providers/apps and no
  Keycloak-named objects, and no active Keycloak container remains on VM120 or
  VM192. Fresh Gitea/Harbor browser flows pass; Ops and Repository Intake give
  expected non-admin 403s. Outline WebSocket, Grafana session, GlitchTip
  signup_closed, and Chat's HTTP-500 OIDC callback remain failing. The local
  akadmin bootstrap password failed one browser attempt and is not confirmed
  current. Authentik image scans remain over policy; the isolated VM192 restore
  reached healthy Postgres but not Authentik web readiness. No identity,
  application, service, or Keycloak-runtime mutation was made.

  2026-10-01 recovery follow-up: the dedicated recovery page accepted an
  explicitly requested reset and displayed the generic inbox confirmation;
  a targeted Gmail search across all folders returned no matching recent mail.
  Code review found Authentik's role default still pointed at Stalwart:1587,
  contrary to the mail-platform contract requiring mail-gateway-smtp:1588 for
  provider-backed transactional delivery. Repository defaults/docs/tests are
  corrected, but the production payload was not changed because the Authentik
  security and verified-restore gates remain blocked.

  2026-10-01 operator security decision: the operator explicitly accepted the
  latest stable Authentik image's 3 Critical and 84 High findings for seven
  days. The branch pins digest
  sha256:09782fe56675bc616a0324468f1698e2d9d83c978bc5e426686fb7563517a442,
  includes fresh Syft/Grype receipts, and records an exception expiring
  2026-10-08. The Authentik vulnerability-budget check passes via that
  exception. Production still runs 2026.8.0; apply remains pending PR review,
  a short-lived VM192 rollback snapshot, and post-apply readiness/consumer
  smoke checks. Do not silently extend the exception.

  2026-10-11 Gitea browser-path correction: the public browser hostname reaches
  the private NGINX VM through the trusted Proxmox subnet-router address, but
  live NGINX had no matching vhost and served its unrelated default certificate.
  The direct Mac-to-PVE host proxy ACL is a separate controller-path issue, not
  the browser URL failure. A private TLS-only vhost is declared in source,
  restricted to the ingress /32, and requires an existing shared certificate
  that OpenSSL verifies covers the Git hostname. It does not enable public
  Gitea DNS, widen the Tailscale ACL, or request a per-host public ACME
  certificate. The managed edge route is now applied and a fresh strict-TLS
  browser OIDC test passed with the non-admin gitea-e2e identity. The governed
  converge completed with 133 tasks OK, 5 changed, 0 failed, and 53 skipped;
  NGINX syntax/active checks, the Gitea route, and Authentik readiness all
  passed. A governed Restic run protected five sources with zero uncovered.

  2026-10-11 Grafana scope diagnosis: the live Authentik `grafana-groups`
  mapping now exists and is attached to `grafana-oauth`; both read-only
  reconciliation checks report no drift. A fresh strict-TLS Grafana browser
  session still has no `orgRole`. Safe redirect inspection proved the active
  Grafana runtime requests `openid profile email groups`, while the managed
  Authentik mapping is exposed under `grafana-groups`. The role and regression
  test now request that exact custom scope. After merge and governed converge,
  fresh strict-TLS browser login succeeds as the non-admin test identity; the
  Viewer role is assigned and 48 dashboards are discoverable. Browser logout
  exposed a separate defect: Grafana sent its ID-token hint to the shared Ops
  Portal provider's end-session endpoint, which Authentik rejected with HTTP
  400. PR #288 now points Grafana at its own provider-scoped end-session URL,
  and the fix is merged and applied from origin/main. A fresh browser logout
  reached the expected Authentik confirmation, Grafana /api/user returned 401,
  and a new Authentik sign-in restored a non-admin Viewer session. The
  Grafana logout slice is complete; other workstream blockers remain.

  2026-10-11 Grafana verifier correction: `/api/user` confirms the browser
  identity and server-admin flag, while `/api/user/orgs` supplies workspace
  roles. The corrected fresh strict-TLS Firefox verifier passed for
  `gitea-e2e` with one Viewer membership and no Grafana server-admin access.

  2026-10-13 security/build continuation: operator notes report that the
  exact pinned stable Authentik image scan had 6 Critical / 99 High. Its
  2026-10-12 summary and CVE receipt are absent from the checkout; the last
  tracked same-digest receipt is dated 2026-10-11 and contains the same counts.
  The current upstream 2026.11.0-rc1
  source has moved to Python 3.14.8, AnyIO 4.14.2, and PyJWT 2.15.1, but that
  pre-release source is not a deployable stable candidate and has no resulting
  immutable image scan. Debian's tracker marks the exact bundled GnuTLS package
  3.8.9-3+deb13u4 vulnerable to both GnuTLS Criticals and lists no fixed Trixie
  version. Debian likewise still marks the bundled Trixie libxml2 version
  vulnerable. No findings were suppressed. A read-only 2026-10-12 22:01 UTC
  check found 2.9 GiB available and no swap on docker-build, with elevated
  five-minute memory PSI and concurrent CI/build containers; the Proxmox parent
  had 4.2 GiB available and 3.9/4.0 GiB swap used. No new heavy image build was
  started. The sanitization strict audit and publisher dry-run leak check pass.
  Only tracked scan/CVE receipts are declared in this workstream manifest; a
  fresh scan must be archived before its results are treated as current.

  2026-10-13 risk and repository-truth correction: the expired Authentik risk
  exception was removed from config/image-catalog.json; the current digest is
  explicitly marked blocked with no active exception. The catalog validator
  accepts this state only for an image with Critical findings, and the
  vulnerability-budget gate still denies Authentik at 6 Critical / 99 High.
  Focused tests for image policy, vulnerability budget, Authentik runtime,
  patched images, sanitization, and generated status/release-note checks pass
  (62 tests). The full local suite attempt
  made before this correction returned 3,963 passed, 190 failed, 17 errors, and
  26 skipped; it is not a full-suite pass and must be reconciled with Woodpecker
  before merge. Repository metadata also had platform_version 0.179.51 while
  release_tracks.platform_versioning.current and the 0.179.51 release notes
  both state 0.179.50/no live platform bump. versions/stack.yaml was corrected
  to 0.179.50 and the generated README refreshed; repository data-model and
  generated-README checks now pass.

  Recovery email delivery was confirmed by metadata-only Gmail search on
  2026-10-13, but the one-time link was not opened and no current operator
  credential or completed reset is confirmed.
blockers:
  - The current Authentik digest scans at 6 Critical / 99 High with zero known fixes; the prior 3 Critical / 84 High exception expired on 2026-10-08. Do not apply an Authentik runtime-image change until a policy-compliant stable image or an explicit new risk decision covering the current findings exists.
  - Outline and GlitchTip consumer changes remain blocked by unresolved critical image findings; no exception was authorized for either service.
  - The latest recorded application-level Authentik restore rehearsal failed. A new drill is unsafe until the restore network is genuinely isolated and host capacity is admitted; the live fixture bridge currently overlaps production.
  - The read-only source audit found no active Keycloak DNS declaration, but live DNS could not be verified: the legacy DNS Console API redirects without records and the available Hetzner Cloud API context has 34 zones but no example.org zone. Repeat with the canonical project-scoped Cloud API token; do not delete cold rollback archives in this workstream.
  - Public ServerClaw snapshot pull request 69's refreshed pipelines fail because the sanitizer intentionally removes the private Tailscale policy while inherited CI still requires it. A narrow source-side skip is being added for sanitized snapshots only; a missing policy remains fatal in private source. The protected source gate and refreshed public checks must pass before publication can merge.
  - The declared backup guest (VMID 160) is absent from the current Proxmox node and its inventory address is unreachable. PBS storage is independently online, but the backup-host security receipt remains stale; do not treat PBS availability as host-hardening evidence.
  - >-
    A current least-privileged operator credential and completed recovery reset
    are not confirmed; delivery of the reset email is confirmed, but link
    validity and successful reset are not.
