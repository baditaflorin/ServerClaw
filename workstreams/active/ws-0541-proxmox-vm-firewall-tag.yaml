canonical_truth:
  changelog_entry: "Add a proxmox-vm-firewall tag to the proxmox_network role: guest-network-policy.yml --tags proxmox-vm-firewall renders and installs only /etc/pve/firewall/<vmid>.fw, compiles, and restarts pve-firewall when a file changed, without replaying interfaces, nftables or forwarding and without stopping or starting a guest; the placeholder-address safety guards carry the always tag."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: "Until now the per-VM Proxmox firewall files were only rendered by the first play of guest-network-policy.yml, which a --limit on a guest skips and a full run replays together with the whole hypervisor network, so on 2026-10-29 one OpenBao rule for the agent-history guest was appended to /etc/pve/firewall/192.fw by hand. This adds a scoped, tagged way to render only those files. Nothing is applied by this change and no host is contacted; the first live use is a separate operator step."
