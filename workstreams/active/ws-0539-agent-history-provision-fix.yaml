canonical_truth:
  changelog_entry: "Fix the agent-history provisioning play so it never stops the VM before cloud-init's first boot has finished (graceful restart only when hardware settings are pending), and drop docker.io from that guest's cloud-init packages."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: "Found on the first real provisioning of VM 155: a forced qm stop seconds after the first start cut cloud-init off and the guest never got its network. The fix defers any restart until the first boot is done and makes it graceful. docker.io is dropped from the guest's cloud-init packages because the docker_runtime role installs Docker CE and removes docker.io."
