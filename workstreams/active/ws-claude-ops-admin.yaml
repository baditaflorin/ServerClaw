notes: |
  Adds a dedicated permanent admin identity `claude-ops` for AI automation
  (Claude Code SSH sessions): a Linux admin user with passwordless sudo +
  key-only login across the Proxmox host and all lv3_guests, a Proxmox
  `claude-ops@pam` user with PVEAdmin, and a privilege-separated Proxmox API
  token (`claude-ops-automation@pve`). Reuses linux_access / proxmox_access /
  proxmox_api_access via additive, empty-by-default extensions. Dedicated key
  at .local/ssh/claude-ops.id_ed25519. Scope: SSH + sudo + Proxmox only (no
  Keycloak SSO / Tailscale / step-ca).
