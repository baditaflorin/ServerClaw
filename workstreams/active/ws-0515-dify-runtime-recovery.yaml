context: |
  Dify's local NGINX config statically resolves Docker service names to the
  current API, web, and plugin-daemon addresses. Recreating the API left NGINX
  pointing at the former API IP, producing 502 responses even though Docker DNS
  resolves the replacement correctly. Separately, the Squid SSRF proxy enters a
  restart loop because its PID file under /run persists in the writable
  container layer across restarts. Fix both in the repo-managed role, verify
  the public Dify path, and replace the expired legacy completeness waiver with
  truthful Authentik, observability, SLO, and data-catalog evidence. Dify's UI
  is protected by the shared OIDC edge, while the gateway's Dify tool bridge is
  an API implemented by the gateway itself; a generic OIDC-to-Dify API proxy is
  not a valid upstream integration.
tasks:
  - id: t1
    title: Repair Dify Docker DNS re-resolution and transient Squid runtime state
    status: completed
  - id: t2
    title: Make Dify service-completeness requirements and evidence accurate
    status: completed
  - id: t3
    title: Validate templates, catalogs, and Dify end-to-end health
    status: in_progress
  - id: t4
    title: Merge the tested PR, converge Dify, and record live evidence
    status: pending
