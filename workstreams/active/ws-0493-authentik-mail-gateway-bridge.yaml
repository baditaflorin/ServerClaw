context: |
  The governed Authentik recovery request reached Stalwart, but its queued
  message repeatedly timed out during direct outbound SMTP delivery. ADR 0041
  designates the private mail gateway's Brevo API route as the live
  transactional delivery path. This workstream adds a private, authenticated
  SMTP compatibility bridge inside that gateway so Authentik can retain its
  supported SMTP interface without depending on blocked direct port-25 egress.
tasks:
  - id: t1
    title: Capture the failed direct-delivery evidence and select the governed gateway path
    status: completed
  - id: t2
    title: Implement and test the private authenticated SMTP-to-transactional gateway bridge
    status: completed
  - id: t3
    title: Apply mail platform then Authentik through the governed converge path
    status: completed
  - id: t4
    title: Dispatch a fresh recovery email and verify provider acceptance and public recovery flow
    status: completed
