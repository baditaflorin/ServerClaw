description: |
  Post-publish verification of the 2026-08-26 ServerClaw sanitized snapshot
  found a real leak: scripts/one-time/adr-0409-generalize-committed-code.py
  (exempt from Tier C rewriting because it documents the real values it once
  replaced) was published verbatim, exposing the operator's real name and
  email/domain/IP patterns. check_leaks() in publish_to_serverclaw.py was
  reusing config["exclude_paths"] -- meant only to skip regex rewriting -- to
  also skip leak-marker scanning, silencing the one safety net that should
  have caught this. Fixed check_leaks() to scan everything except binary
  files and already-deleted paths, added the specific leaking file to
  delete_paths, verified the fix catches the leak when reverted in isolation,
  and re-published to overwrite the leaking commit on serverclaw/main.

objectives:
  - Decouple leak-marker scanning from the Tier C rewrite exclusion list
  - Remove the leaking one-time migration script from the publish output
  - Re-publish to purge the leaked commit from serverclaw/main

completion_metrics:
  - check_leaks() no longer skips exclude_paths
  - scripts/one-time/adr-0409-generalize-committed-code.py is in delete_paths
  - serverclaw/main HEAD no longer contains the leaked file

related_adrs:
  - ADR 0409 — Generalize committed code to eliminate publication sanitization
