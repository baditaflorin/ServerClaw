canonical_truth:
  changelog_entry: Keep sanitized ServerClaw snapshots compatible with validation
    without publishing deployment-specific firewall exceptions.
  release_bump: patch
context: The generated ServerClaw snapshot replaces the private Proxmox inventory
  with a generic Tier A template. A deployment-specific monitoring test assumed the
  private firewall exception existed in that template, causing both public Woodpecker
  pipelines to fail. Keep the generic host template and regression test aligned while
  retaining strict validation of the private inventory.
