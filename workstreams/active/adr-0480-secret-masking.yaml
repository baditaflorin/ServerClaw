description: |
  Complete implementation of universal secret masking with srvclaw_ prefix across
  all credential generation in the platform. Enables pre-commit detection of real
  secrets and maintains deployment-agnostic code across lv3.org and 0fork.com.

objectives:
  - Migrate 54 Ansible role files from scattered openssl rand to unified | secret filter
  - Replace 134+ credential generation instances with deployment-agnostic approach
  - Implement pre-commit hook for detecting srvclaw_ patterns
  - Enable cross-deployment reuse of code between private and public repos
  - Document multi-repo architecture and deployment context

deliverables:
  - scripts/secret_masking_utility.py — Core secret generation with srvclaw_ prefix
  - scripts/generate_secret_with_mask.py — CLI generator for masked + real secrets
  - scripts/detect_unmasked_secrets.py — Pre-commit hook for credential safety
  - scripts/migrate_secrets_to_filter.py — Automated migration script
  - collections/ansible_collections/lv3/platform/plugins/filter/generate_secret.py — Jinja2 filter
  - docs/adr/0480-multi-deployment-certificate-validation.md — ADR with Phase 1-3
  - docs/postmortems/2026-05-05-universal-secret-masking-migration.md — Full postmortem
  - 53 Ansible role files migrated with 134 openssl rand replacements

completion_metrics:
  - 100% of Ansible-generated credentials now use srvclaw_ prefix
  - All 54 files using openssl rand migrated to | secret filter
  - Pre-commit hook passes for all commits (docs/adr/ allowed as examples)
  - Deployment-agnostic code verified across both repos
  - Zero regressions in Ansible validation

