notes: |
  Closes the PR #71 dangling-receipt class of bug.

  - write_receipt_atomic() helper: tmpfile + fsync + os.replace.
  - --check-files flag: detects latest_receipts entries with no
    matching receipts/live-applies/<slug>.json, exits 1 on findings.

  Live signal: two pre-existing dangling receipts surfaced
  (preview_environment, staging_environment, both 2026-03-27).
  Out of scope to fix here — operator action, separate workstream.

  10 new tests cover atomic write, idempotent rewrite, no-temp-leftover
  on success and on exception, parent-dir creation, dangling-check
  empty/dirty/empty-slug paths, and CLI exit codes.
