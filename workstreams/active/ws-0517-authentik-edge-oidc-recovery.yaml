  context: >-
    Fresh unauthenticated probes returned 5xx for two applications protected by
    the shared edge OAuth2 proxy. The proxy's OIDC configuration is valid and
    points to Authentik, but discovery resolves the public issuer back to the
    host's non-hairpinable public address. The managed role already pins the
    issuer hostname to the local edge; the live host lacked that entry. No
    authentication gate will be removed or bypassed. The live recovery preserves
    the existing proxy configuration and credentials while applying the verified
    local firewall source and issuer mapping. The existing non-admin browser
    harness did not reach the shared-proxy callback, so its callback and
    least-privilege denial assertion remain pending without any group widening.
  tasks:
