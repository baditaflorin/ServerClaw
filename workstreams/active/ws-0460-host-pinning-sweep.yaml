notes: |
  Sweep ADR 0457 Phase 2's host_pinning_guard role across every service
  playbook in one edit instead of touching 50+ files individually.

  Mechanism: 52 service playbooks (ops-portal, keycloak, gitea,
  mail-platform, openbao, dify, etc.) already import
  `playbooks/tasks/preflight.yml` as a shared pre_task surface. Adding
  the guard there propagates to all of them automatically.

  The guard is included via `include_role` (not import) so its tasks
  participate in the play's execution rather than being deferred to
  parse time. Operators can opt out per-play with
  `host_pinning_guard_skip_in_preflight: true` — documented but not
  recommended.

  Playbooks that do NOT use `tasks/preflight.yml` (proxmox-host
  bootstrap plays, fixture playbooks, the standalone public-edge
  playbook which already has the guard wired directly) are unchanged.
