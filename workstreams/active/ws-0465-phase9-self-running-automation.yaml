summary: >
  Phase 9 turns four LLM-orchestrated read/fix loops into deterministic
  CPU/scheduled jobs. Cached doctor snapshot eliminates per-session
  probe runs. apply_promotion graduates eligible advisories without
  operator input. Regression watcher inverts "agent must look" into
  "watcher must page". Daily heal-apply Windmill schedule converges
  drift overnight.
