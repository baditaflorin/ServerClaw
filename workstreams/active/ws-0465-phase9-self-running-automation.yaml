    tasks:
      - "scripts/doctor.py --snapshot writes build/doctor-snapshot.json"
      - "new probe_doctor_snapshot_freshness reports snapshot mtime vs git HEAD"
      - "tests cover snapshot generation + freshness logic"
  phase_2_apply_promotion:
    status: not_started
