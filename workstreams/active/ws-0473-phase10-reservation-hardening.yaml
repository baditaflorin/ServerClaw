summary: >
  Phase 10 closes the ADR-collision loop. Adds a make target that
  reserves an ADR number via a fast-merged single-commit PR
  (reservation lives on main within seconds, not stuck in feature
  branch). Adds a CI gate that rejects PRs adding unreserved ADRs.
  Adds `reserve_adr.py --release` to clear realized reservations.
