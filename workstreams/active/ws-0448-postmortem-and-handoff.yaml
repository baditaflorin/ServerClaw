notes: |
  Heads-up note for concurrent agents iterating on ws-0445 / 0446 /
  0447 surfaces. Captures three cross-cutting changes ws-0448 made
  that other agents need to know about:

  1. workstreams/active/**.yaml + workstreams/archive/2026/**.yaml all
     have their `adr:` field quoted now (YAML octal-int parser was
     coercing 0447 -> 295). Don't revert.
  2. receipts/live-applies/2026-04-28-coolify-0fork-runtime-live-apply.json
     was reconstructed because PR #71 referenced it but never committed
     the file.
  3. Pre-existing cert-validation drift on example.com domains (the box
     now serves 0fork.com after yesterday's recovery).

  Plus follow-ups not in ws-0448 scope:
   - Host-pinning per VM (Slice D in the original plan).
   - Deployment-aware cert validation.
   - `make new-deployment` / `make use-deployment` (ADR 0442) — the
     `run_with_deployment.sh` wrapper is the leaf they would invoke.
