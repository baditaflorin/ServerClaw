canonical_truth:
  changelog_entry: "agent-history semantic search: the store embeds the search question through bge-m3 on the embeddings Mac (one tailnet grant, tcp:8443 from tag:agent-history to mac14) and takes the embedding worker's vectors with a separate embed token rendered from OpenBao."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: "Makes `semantic` and `hybrid` search return hits on the live agent-history store. The role gains the embed flags and an embed-token secret file; the tailnet policy gains one grant and its tests. The Mac side (Ollama and agent-embed as launchd agents, tailscale serve) lives on the operator's Mac and is described in the runbook. The endpoint address is set in the guest's host_vars."
