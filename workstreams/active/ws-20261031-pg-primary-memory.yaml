canonical_truth:
  changelog_entry: The memory guardrails of the production Postgres VM701 after the 2026-10-31 global OOM (parallel-query limits, work_mem, the 10 GiB /dev/shm cap, the VM memory) are recorded in git; nothing is applied by merging.
  release_bump: patch
  included_in_repo_version: null
context: >-
  On 2026-10-31 at 01:25Z the kernel OOM killer ended nine postgres processes on VM701 (infer-pg-primary) and the cluster crash-recovered for about 25 s. The
  memory that ran the VM out was shared memory beyond the main segment (parallel-query dynamic shared memory, +24.5 GiB over the 24.6 GiB segment).
  Two live changes were made that morning by other sessions and are not in git: /dev/shm capped at 10 GiB (08:02Z) and the VM raised to 66560 MiB (about
  08:17Z). This change records both and lands the reload-only guardrails (max_parallel_workers_per_gather 2, max_parallel_workers 12, temp_file_limit 150GB, work_mem 64MB)
  as hostconf files. Applying any of it is a separate, supervised step; huge pages are a separate PR for a maintenance window.
  Update 2026-11-02: S1 was applied live on 2026-11-01 (S1a 11:04Z, S1b 11:41Z) and its 24 h acceptance found one regression (SELECT COUNT(*) FROM mv_domains_denormalized
  0.42 s -> 0.62 s with workers per call 3.94 -> 1.97), so max_parallel_workers_per_gather goes back to 4 (only that knob; 12, 150GB and work_mem 64MB stay), planned for 2026-11-03 11:03Z.
  Update 2026-11-04: log_temp_files = 64MB (a plain hostconf apply, reload only) so the statements behind the 612 GB of temporary files, which pg_stat_statements does not attribute (5,000 entries,
  2,000+ deallocations), show up in the server log.
