notes: |
  Closes follow-up #3 from the ws-0448 postmortem.

  Adds --all-deployments flag to scripts/certificate_validator.py
  AND auto-triggers it when no slug is passed AND multiple deployments
  exist under .local/deployments/. The pre-push gate's all-lane runner
  now covers every deployment instead of whichever happens to be active.

  6 new tests covering slug listing, flag presence in --help, and
  module-import sanity.
