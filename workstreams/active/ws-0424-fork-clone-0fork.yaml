summary: >
  First real fork-viability test. Stands up a collapsed nested-Proxmox topology
  on a Hetzner AX41-NVMe using 0fork.com (full apex) as the identity. Drives
  ADR 0385 (identity core) and ADR 0407 (generic-by-default) to their limits.
  Also produces ADR 0425 — a retrospective on the 420-ADR build process and
  what the clone attempt revealed about gaps in the platform's forkability
  claim. ADR numbers collided with a parallel LSP-AI evaluation workstream
  (0422/0423) that landed on main while this one was in progress; renumbered
  to 0424/0425.
