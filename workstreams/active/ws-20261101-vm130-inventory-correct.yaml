canonical_truth:
  changelog_entry: "VM 130 (docker-build-lv3) is declared as the live VM runs after the 2026-11-01 memory restart: 20 cores, memory_mb 14336 (fixed, balloon 0), disk_gb 600; a provision-guests run no longer shrinks the production CI builder. Inventory and docs only; nothing is applied."
  release_bump: patch
