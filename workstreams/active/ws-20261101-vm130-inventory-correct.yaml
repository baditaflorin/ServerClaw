context: >-
  On 2026-11-01 the 0mcp hypervisor ran out of memory and VM 130 was restarted at 14336 MiB with ballooning off (a drained restart, 08:48-08:51Z).
  The inventory entry still said 12 cores, 10240 MB and 320 GB, and the proxmox_guests role runs `qm set --cores --memory --balloon 0` on every declared guest,
  so a provision-guests run would have shrunk the production CI builder. The entry now matches `qm config 130` read on 2026-11-01. The generated
  inventory/group_vars/platform.yml is not regenerated here: a dry run differs in 1043 lines (other guests, including VM 155) and nothing reads sizes from it.
