notes: |
  Reads catalog/services/<svc>/service.yaml::health.liveness blocks
  (already populated per ADR 0205) and runs the probe live, writing
  per-probe receipts under receipts/health-probes/.

  HTTP and TCP probes supported. Unknown kinds fail cleanly.

  8 tests cover: TCP open/closed port, HTTP 200/404, unknown kind,
  receipt write content + atomicity, CLI exit codes for usage error
  and unknown service.

  Wiring into per-role converge tasks and a make doctor signal
  reading the receipt format are explicit follow-ups (out of scope
  here so the leaf primitive can land first).
