notes: |
  Closes follow-up #2 from the ws-0448 postmortem (2026-04-28).

  - scripts/certificate_validator.py: --deployment <slug> reads identity
    from .local/deployments/<slug>/identity.yml. Falls back to legacy
    .local/identity.yml for single-deployment installs.
  - config/gate-bypass-waiver-catalog.json: cross_deployment_drift reason
    code (max 2-day expiry) allows skip_cert_validation +
    skip_remote_gate. Composes with cert_lane_pre_existing_failures
    (ADR 0451).

  Renumbered through 0450/0451/0452/0453/0454/0455 (taken concurrently
  by other agents) before settling on 0456.
