canonical_truth:
  changelog_entry: Add the agent-history guest (vmid 155) in git only. ADR 0494, guest and network policy declarations, a per-guest provisioning playbook and make target, the agent_history_runtime role, and the service catalog entries. Nothing is provisioned.
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  The agent-history store (Postgres 17 with pgvector and agent-store) keeps every prompt, reply and tool call of the
  coding agents on the operator laptops. It is the most sensitive service on the platform and needs its own guest,
  an encrypted data volume, secrets delivered by OpenBao and tailnet-only exposure. This workstream is the git side
  only: it declares the guest and everything around it. Provisioning, OpenBao, the tailnet, capacity and the alert rules
  are separate, owner-approved steps and a separate change.
tasks:
  - id: t1
    title: Register the workstream and write ADR 0494
    status: completed
  - id: t2
