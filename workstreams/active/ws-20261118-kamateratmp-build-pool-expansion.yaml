canonical_truth:
  changelog_entry: Integrate the expiring temporary builder with shared Fleet Runner
    and GoURL Buildx admission, and stop assigning work after its lease target.
  release_bump: patch
  included_in_repo_version: null
context: >-
  The temporary Debian 13 KVM worker already runs a general ci.0exec.com Woodpecker
  agent with two bounded workflows. Fleet Runner's broad image-build pool and GoURL's
  project-specific Buildx selector are separate consumers. Fleet Runner centralizes
  live capacity probes and build leases. GoURL merged guest-scoped admission in PR #4339
  (`91eeb2fae9e6ff8d83ffbd47b6b7509c97c1bf38`), while retaining physical-host checks
  for hypervisor rows. The SSH key matched Tailscale's signed fingerprint and is pinned
  on the Mac; CT108's existing pin was verified. Fleet Runner and GoURL both admit the
  worker, and a cache-only GoURL Buildx canary passed. Fleet Runner's effective thresholds
  are 1.0 load/CPU and 20,000 MiB disk; the 0mcp worker is currently below the disk floor.
  PFS PR #705 merged at b1d5571dca1b26c1980f03f589444229f93be8c0. The patch release is
  still pending because the release manager reports 105 repository blockers, including
  expired pre-existing waiver failures. The owner-directed sunset target is
  2026-12-17T14:59:50Z; provider billing cutoff remains unconfirmed. Build selection and
  Woodpecker scheduling must fail closed at the target.
