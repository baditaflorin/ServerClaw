context: |
  GitHub push and pull-request deliveries to the managed Woodpecker instance
  received HTTP 502 while the server container lacked its declared Compose
  bridge attachment. This workstream records the minimal live recovery and
  the successful server-side validation that followed.
tasks:
  - id: t1
    title: Isolate the CI webhook failure to the runtime bridge attachment
    status: completed
  - id: t2
    title: Reattach the Woodpecker server to its declared Compose bridge
    status: completed
  - id: t3
    title: Verify the public CI endpoint and a fresh pull-request pipeline
    status: completed
