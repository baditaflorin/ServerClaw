objectives:
  - Allow explicitly entitled Authentik users to authenticate to private Gitea without granting platform-admin or Owners access.
  - Keep the test identity opt-in, non-admin, and backed by a generated local-only password.
  - Verify the full browser authorization-code flow and account role without bypassing TLS validation.
completion_metrics:
  - The Gitea OIDC requirement uses a dedicated ordinary-user group while the platform-admins-to-Owners mapping remains unchanged.
  - The standard Authentik identity reconcile does not create the test identity; a separate explicit manifest does.
  - Automated tests prove no password or token is written to output and that the browser flow lands in Gitea as a non-admin user.
  - Live Authentik and Gitea state is reconciled only after a selected deployment passes the fail-closed deployment guard.
  - A PR passes the repository's required CI before merge; no private deployment values or credentials are published.
blockers:
  - >-
    The fail-closed live selector rejects the current generated platform snapshot
    because it does not match the selected private deployment overlay. No live
    identity or Gitea mutation is allowed until the selected deployment state is
    reconciled in a reviewed deployment worktree.
acceptance_criteria_met: false
lifecycle_state: in_progress
portable: true
portable_notes: >-
