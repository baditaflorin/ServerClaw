canonical_truth:
  changelog_entry: Document the active temporary external build worker's monitoring and Woodpecker integration, its fail-closed Buildx exclusion, and manual sunset process.
  release_bump: patch
  included_in_repo_version: null
context: The provider supplied a short-lived Debian 13 KVM guest for build and CI
  execution. Tailscale is installed; the user completed interactive authentication
  and confirmed Tailnet Lock signing, and the tagged node is online and reachable.
  Docker CE, Buildx, Compose, the named ops account, bounded logs, and a daily cache-prune
  timer are installed. SSH is key-only on the tailnet address with root/password
  login disabled. A tailnet-only node-exporter target is monitored, and a
  Woodpecker Docker agent is active on the general CI plane with a fresh heartbeat
  and bounded two-workflow/5-GiB-per-step limits. The general controller mirror
  was reconciled before registration. Follow-up verification on 2026-11-18
  confirmed registration 140 is online, schedulable, and has capacity for two
  workflows; the latest 100-pipeline report included it in 33 pipelines, 17 of
  which succeeded. One successful pipeline ran entirely on Kamatera. The other
  matching records used multiple agents. Twelve matching pipelines were marked
  killed; their cause is not established by the report. The project-specific
  Buildx pool is intentionally not used because its fail-closed selector requires
  physical Proxmox hypervisor telemetry that this provider-managed KVM guest cannot
  supply. The provider cutoff is unconfirmed; the private host record's expiry is
  an operator target only and triggers no automatic alert or retirement. The
  full-repository YAML validator still reports pre-existing findings outside this
  workstream; the changed-scope remote pre-push gate passed.
