canonical_truth:
  changelog_entry: "The proxmox_network per-VM Proxmox firewall install compares each render with the live /etc/pve/firewall file (also in --check mode), fails before writing anything when it would remove a rule line or a managed block unless -e proxmox_network_allow_rule_removal=true, copies every file it replaces to /root/fw-backup-<timestamp>/ with a restore.sh, and can be limited to named VMs with -e proxmox_network_firewall_vmids=155; the 0mcp nightly PBS job's fleecing is recorded in the PBS runbook."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: "On 2026-10-30 an apply of the proxmox-vm-firewall slice on 0mcp copied the inventory render over the live per-VM firewall files and removed about 25 production rules for about three minutes (hand-authored rules, an AUTO-MIGRATED set, and the fleet-pool-fw block on VM 191); the --check --diff before it had compared the render with the staging copy and showed only additions. Nothing is applied by this change and no host is contacted: the tests run the guard against fixtures and the role against a temporary directory with stand-ins for qm and pve-firewall."
