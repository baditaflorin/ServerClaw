canonical_truth:
  changelog_entry: The VM 100 state backup in git now has the 12 inventory entries and 6 archives that run on the host, so installing it from git no longer drops them.
  release_bump: patch
  included_in_repo_version: null
context: >-
  On 2026-10-29 someone added 12 inventory entries to the installed dockerhost-state-backup script on VM 100 (20:48Z) and 6 archives to its config (21:01Z)
  by hand; neither is in any PR. The merged staging change (#617) was installed on VM 100 on 2026-10-30 07:05Z as a hybrid: the merged script plus those
  12 entries, with the config left alone, so installing the script or config from git would silently drop them from the backup. This change makes git match
  what runs, byte for byte for the script and equal apart from whitespace and key order for the config. Nothing is installed or changed on any host.
