context: >-
  The shared Go build cache added under ws-0530 was measured slower than no cache on
  every other site and no better than a host-mounted cache directory on its own host, so
  its server is stopped. Nothing uses TCP 18335 on the build worker any more; the grant
  and its three policy tests are removed so no unused path stays open.
