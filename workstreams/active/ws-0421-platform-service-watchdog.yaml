summary: >
  Extends the ADR 0376 identity-core watchdog pattern to ALL application VMs and
  ALL HTTP-probed services (57 services across 6 VMs). Deploys a platform_service_watchdog
  Ansible role that installs a 30-second systemd timer per VM, auto-restarts services on
  2 consecutive failures (6/hour/service rate limit), and sends ntfy alerts.
  Also publishes a postmortem on the "whack-a-mole" service outage pattern.
