canonical_truth:
  changelog_entry: "hostconf manages a drop-in on the 0docker hypervisor's tailscale0 device unit (Wants=woodpecker-exec-proxy@9000.socket), and may write drop-ins of device units; a tailnet flap no longer leaves the Woodpecker exec proxy stopped"
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  On 2026-11-02 from 11:33Z to 12:44Z every Woodpecker agent of ci.0exec.com was refused on 100.64.0.5:9000 (the 0docker hypervisor's tailnet address) and the whole CI plane stood
  still (91 pipelines pending, 1 of 31 agents online). woodpecker-exec-proxy@9000.socket listens on that address with BindToDevice=tailscale0; when tailscale0 went away systemd stopped the
  socket, the automatic start at 12:34:59 CET failed because the device was not active yet, and nothing started it again. The web API stayed up, so the plane looked alive. It was
  started by hand at 12:44Z. A dummy-interface test on the hypervisor (systemd 252) showed that a unit Wanted by a device unit is started when the device comes back; the drop-in
  does that for the socket.
