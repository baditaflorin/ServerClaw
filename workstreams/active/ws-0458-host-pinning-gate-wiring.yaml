notes: |
  Promotes the ADR 0457 audit primitive from operator-on-demand to
  pre-push-gate visibility. New advisory lane `host-pinning` runs
  `scripts/host_pinning_check.py --all` and reports drift without
  blocking — same pattern as `validate_catalogue_freshness` (ADR 0449).

  Skip-when-absent: when `.local/deployments/` is missing (CI runner
  with no overlays) the lane no-ops with a clear message instead of
  failing.

  Phase 2 of ADR 0457 (role-side enforcement in nginx_edge_publication
  + public_edge_oidc_auth) is the real incident-prevention. That belongs
  in a separate per-role workstream that the role-author reviews.
  ws-0458 only ships the gate visibility so role-author conversations
  have a live signal to grep against.
