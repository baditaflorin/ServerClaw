notes: |
  Phase 2 of ADR 0457. Closes the lv3 ↔ 0fork oauth2-proxy@4180
  collision class of bug at converge time rather than at incident time.

  New role `lv3.platform.host_pinning_guard`:
   - Resolves the active deployment slug from active_deployment_slug,
     $DEPLOYMENT, or .local/active-deployment.
   - Looks up the host's deployment_owner from proxmox_guests.
   - Refuses the converge with a remediation message when the slugs
     mismatch, OR when deployment_owner is set but no active slug is
     resolvable (strict mode default).
   - Skips silently when neither side is set (legacy single-deployment
     behavior).

  Wired into playbooks/public-edge.yml as the first role so it runs
  before linux_guest_firewall, public_edge_oidc_auth, and
  nginx_edge_publication. Other playbooks (ops-portal.yml,
  keycloak.yml, etc.) can opt in by adding the same role. Wiring
  beyond public-edge is deliberately deferred — each playbook's
  author should review the change.

  9 tests: 5 structure (role exists, files present, defaults
  unchanged, public-edge wired) + 4 behavioural (ansible-playbook
  --check on a synthetic inventory). Behavioural tests skip when
  ansible-playbook is not on PATH.
