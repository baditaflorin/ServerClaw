shared_surfaces:
  # ADR + workstream docs
  - docs/adr/0446-phase2-multi-deployment-hardening.md
  - workstreams/active/ws-0446-phase2-multi-deployment-hardening.yaml
  # Item 14 — receipt freshness checker
  - scripts/check_receipt_freshness.py
  - tests/test_check_receipt_freshness.py
  # Item 11 — Molecule scaffold (DEFERRED to phase 4; the
  # proxmox-fixture driver under collections/.../molecule/ is presently
