context: >-
  DBeaver Community needs a direct private-tailnet route to the production PostgreSQL
  primary. The network grant is limited to the operator device, database VM and
  TCP port 5432. PostgreSQL requires TLS and matches the login to the production
  database; it rejects other database and role combinations from that device.
