canonical_truth:
  changelog_entry: "The build VM's docker-build-gc step 3d (the Go build cache cap inside the fleet-job-cache-* volumes) no longer needs one particular golang image on the host: it takes the first of golang:1.27 and golang:1.26 that exists, pulls golang:1.27 (bounded, through the registry mirror, only with room on the disk) when neither does, says WARNING and exits 3 when it still cannot run, and writes a textfile metric. Git only: nothing is installed on the VM by this change."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  Step 3d of docker-build-gc.sh (PR 657) runs go-fleet-job's program in throw-away containers of a golang image with docker's --pull never. Its default image
  golang:1.26 was missing from the host at 2026-11-02 23:10Z, so the wrapper said SKIPPED and exited 0: once step 4 (the GC script calling it) is applied, the step would
  silently never run. Read-only evidence of 2026-11-03: the image is back (a job pulled it), but an unused image goes whenever someone prunes: the host has two scheduled
  pruners (docker-build-gc step 3 every 4 hours and fleet-docker-prune daily, both `docker image prune -a --until=168h`, which goes by the image's creation date, so all three
  golang tags created 2026-10-28 03:15Z become prunable on 11-04 03:15Z) and a session pruned with until=24h at 22:46Z. This change makes the step independent of that.
