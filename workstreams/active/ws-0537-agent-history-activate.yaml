context: >-
  ADR 0494 declared VM 155 with lifecycle planned so that the declaration was inert until the owner approved it. This
  workstream is that approval as one reviewed change: the line is deleted, the inventory is regenerated (the planned_guests
  group stays, empty), the tests that counted planned guests are updated, and the ADR and the runbook record the activation
  and the capacity decision. It was prepared on top of ws-0534 and rebased onto main after #598 merged; it is merged
  immediately before provisioning, because from the merge the unrestricted provisioning and the scoped runs no longer skip
  the guest, which does not exist until make provision-agent-history-vm has run.
