canonical_truth:
  changelog_entry: A branch stacked on an unmerged branch can pass the pre-push gate by setting LV3_VALIDATION_BASE_REF to its parent's ref; remote_exec.sh keeps it, computes the changed files against it and refuses one that does not resolve, and workstream-surfaces uses it. Unset, nothing changes.
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  The gate diffed every branch against origin/main in two places (scripts/remote_exec.sh built the changed-file list and
  exported the base, scripts/validate_repo.sh passed origin/main to the workstream surface check), so a branch stacked on an
  unmerged parent was judged on the parent's files too and failed workstream-surfaces on every builder; the pre-push hook
  then fell back to a local run on the laptop, which the fleet forbids. The caller can now name the parent
  (LV3_VALIDATION_BASE_REF=origin/claude/parent). Nothing else changes: with the variable unset the behaviour is as before.
