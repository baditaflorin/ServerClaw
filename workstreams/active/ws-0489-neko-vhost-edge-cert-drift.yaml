context: |
  The generated browser.<domain> vhost pointed ssl_certificate at a per-host
  Let's Encrypt lineage (/etc/letsencrypt/live/browser.<domain>/) that certbot
  never issues. Every other vhost on the edge uses the shared lineage that
  nginx_edge_publication manages (public_edge_cert_name =
  "<config_prefix>-edge"). The live vhost had been hand-corrected to the shared
  lineage; the template would have reverted it on the next converge.
tasks:
  - id: t1
    title: Point nginx-site-neko.conf.j2 at the shared edge certificate lineage
    status: completed
  - id: t2
    title: Verify the rendered vhost matches the corrected live file byte-for-byte
    status: completed
