description: |
  The Authentik cutover is live: declared clients and identities were reconciled,
  the shared edge and native consumers now use Authentik, and the retired
  Keycloak runtime was archived and stopped after end-to-end verification.

  Historical registrations are not recreated. Archive and runtime data are
  retained only as governed rollback evidence; active configuration contains no
  Keycloak runtime, route, probe, or dependency contract.
objectives:
  - Make Authentik provider, application, group, and named-operator state declarative and idempotent.
  - Cut the shared edge OAuth proxy, native OIDC consumers, and API token validation to Authentik.
  - Validate confidential-client, browser authorization-code, protected-edge, and service-token flows live.
  - Remove Keycloak runtime, public routing, active health checks, and active dependency contracts only after all checks pass.
completion_metrics:
  - Every active OIDC issuer, JWKS URL, service secret path, and edge login URL resolves to Authentik.
  - The Authentik operator account can complete a protected browser login and has the required platform groups.
  - The API gateway accepts Authentik-issued bearer tokens and rejects the retired Keycloak issuer.
  - Public protected services redirect to Authentik, and their health checks remain green after the cutover.
  - No Keycloak container, active NGINX route, active health probe, or active dependency contract remains.
  - A completed live-apply receipt records a tested cold backup and rollback reference for the retired Keycloak data.
