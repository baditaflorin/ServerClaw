notes: |
  Closes the "ssh failed once and we never retried" failure mode.

  Drop-in wrapper around ssh: --retries (default 3), exponential
  backoff with jitter, classifier that distinguishes auth_failure
  / banner_timeout / connection_refused / dns_failure /
  network_partition / host_key_mismatch / unknown.

  Receipts at receipts/ssh-failures/<target>-<ts>.json composed with
  the ADR 0461 atomic-write helper.

  21 tests cover the classifier (12), backoff (2), receipt write (1),
  target extraction from ssh args (4), and CLI exit codes (2).

  Wiring into Ansible's ssh_common_args / convergence paths is a
  follow-up workstream — that's per-role review territory. ws-0467
  ships only the leaf primitive.
