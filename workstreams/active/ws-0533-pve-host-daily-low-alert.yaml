canonical_truth:
  changelog_entry: Warn when the hypervisor root filesystem's 24-hour free-space low is under 16%, two points above the CI admission hold, so a bad day stays visible for a day.
  release_bump: patch
  included_in_repo_version: null
  latest_receipts:
    pve_host_free_space_alert: 2026-10-26-pve-host-daily-low-alert-monitoring-live-apply
context: >-
  The hypervisor's root filesystem holds every guest disk of that host. CI admission is
  held under 14% free and the existing warning is at 15%, but the free fraction swings by
  several points within minutes (a daily state backup stages about 18 GiB, and an
  application database log grew by tens of GiB overnight), so by the time the 15% warning
  has waited its five minutes the hold is already on. The new warning looks at the lowest
  value of the last 24 hours instead of the current one, so a dip that came close to the
  hold stays visible for a day after the filesystem has recovered.
