description: |
  ServerClaw PR #43 (external contributor webbrain-one) pointed out that the
  README's architecture diagram used the wrong example IP octet (10.0.0.x)
  -- inconsistent with the 10.10.10.x convention used everywhere else in the
  repo's docs/scripts. The PR itself was unmergeable (ServerClaw's force-push
  snapshot publish model means any PR predating the latest publish diffs
  against hundreds of unrelated files and can never merge cleanly), so the
  fix was extracted and reapplied at the source: docs/templates/README.md.j2
  (README.md is a generated file, regenerated via
  scripts/generate_readme.py --write, which also refreshed the stale
  platform-status block as a side effect).

objectives:
  - Fix the example IP octet in docs/templates/README.md.j2
  - Regenerate README.md

completion_metrics:
