context: >-
  PR 653 merged the budget runbook and its alert as a proposal that says nothing is applied. On 2026-11-02 stage 1 was taken in part and three VMs were given fixed sizes when the host
  fell under 5 percent available again, and on 2026-11-03 the alert was shipped. The runbook still said "nothing applied" and "80.15 today", its test pinned that sentence, and the alert
  it links to computes 82.14. The 2026-11-01 tables stay as the dated measurement (their tests are unchanged); a new section 11 records the changes and the new totals, and the old
  "nothing applied" test becomes two tests: which steps were applied, and that section 11's figures add up against the budget table. The live changes were made and verified before this
  change (live_applied is true); nothing is applied by it.
