context: >-
  On 2026-11-01 the 0mcp hypervisor (pve-0mcp, 128716 MiB) fell to 3.9 percent available memory with its 4 GiB of swap full; a restart of VM 130 at a fixed 14336 MiB ended it.
  This workstream turns the read-only analysis into a reviewed proposal: where memory and balloon settings are defined and how a change reaches the host, what every guest uses over
  seven days (Prometheus) and what it holds on the host (qm), floors, fixed VMs, host swap, KSM, the budget rule, an apply plan, and one alert on the budget. Applying any of it
  (qm set, a restart, a swap file, a KSM switch, shipping the rule file) is a separate step that needs the owner's yes.
