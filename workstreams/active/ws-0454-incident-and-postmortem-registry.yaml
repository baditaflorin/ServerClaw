portable_notes: |
  Agent-neutral. The bootstrap migration helper accepts notes from
  any agent's private store (Claude memory, Codex notes, Aider
  history, operator scratchpads) via a generic `--from <path>`
  interface. No agent-specific assumptions in either the directory
  layout, the schema, or the migration script.
notes: |
  Independent of ws-0452 and ws-0453 once the ADR-numbering coordination
  is done. Order in the bundle is: ws-0452 first (lifecycle data), then
