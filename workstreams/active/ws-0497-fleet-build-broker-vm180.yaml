context: |
  The broker is a private mTLS-only builder control plane, not a public service.
  Its credentials are rendered exclusively by go-fleet-secrets under a root-only
  deployment contract. VM180 already reserves 5002 for the central GHCR cache;
  the broker may use only that cache and must not install a VM-local package
  credential. Private-GHCR cache authentication is a separate cache-owned
  remediation and blocks an apply until verified.
