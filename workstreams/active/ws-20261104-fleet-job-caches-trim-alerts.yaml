canonical_truth:
  changelog_entry: "Alerts for the build VM's Go build cache trim (step 3d of docker-build-gc, textfile metric fleet_job_caches_trim.prom): FleetJobCachesTrimFailed (the last full run failed or was skipped), FleetJobCachesTrimStale (no run for 9 hours), FleetJobCachesTrimMissing (no metric for a day) and FleetJobCachesOverCap (info: a volume over its size cap at every run for 24 hours), with promtool unit tests, a runbook section and a README section. Applied to the monitoring VM on 2026-11-04 (a targeted one-file play, receipt 2026-11-04-fleet-job-caches-trim-alerts-monitoring-live-apply)."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts:
    fleet_job_caches_trim_alerts: 2026-11-04-fleet-job-caches-trim-alerts-monitoring-live-apply
context: >-
  Step 3d of the build VM's 4-hourly GC (platform_server PRs 657 and 664) trims the Go build cache inside the fleet-job-cache-* volumes to a 20 GiB cap and keeps the
  VM's root off the disk-full line (the go-url-categorizer-api cache grew from 17 to 80 GiB in two days before it existed). It has run on its own since 2026-11-03 10:05Z and
  writes fleet_job_caches_trim.prom into node_exporter's textfile directory, but no rule on either Prometheus read that file: a failed or skipped run, a timer that stopped, a
  file that is gone or a volume stuck over its cap would have told nobody (on 2026-11-02 the step would have been skipped silently, its helper image had been pruned). This change
  adds the four alerts, their unit tests and the runbook text. Putting the rule file on the monitoring VM was a separate step that needed the owner's yes; it was taken on 2026-11-04.
