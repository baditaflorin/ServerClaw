canonical_truth:
  changelog_entry: Huge pages for the production Postgres VM701 (vm.nr_hugepages 12800 and huge_pages on) are recorded as hostconf files with the window runbook; nothing is applied by merging, the apply is a maintenance window, planned 2026-11-04, 11:00-12:00Z (any day 11:00-13:00Z once S1c has run 24 h).
  release_bump: patch
  included_in_repo_version: null
context: >-
  S2 of ADR 0495. The shared-memory segment of VM701 (24.66 GiB, 12628 huge pages of 2 MiB) is backed by 4 kB pages, so every backend carries 43-48 MiB of page
  tables (3.7 GiB at the 140 processes of the 2026-10-31 01:25Z OOM, about 15 GiB in the connection-storm worst case). Reserving 12800 huge pages and starting Postgres
  with huge_pages = on removes that cost. It needs one restart (5 s measured on 2026-10-30, 60 s budget) and a sysctl file whose apply runs `sysctl -p` at once, so it is
  applied only inside a maintenance window, with Postgres stopped for the reservation. Merging applies nothing: the daily drift check reports both files missing until then.
  Rider (stacked on the S2 PR): pg_stat_statements.max 5000 -> 20000, a restart setting of a preloaded library, rides on the same restart so the next 24 h of pg_stat_statements attribution are
  complete (the 5,000-entry table evicts and attributes only 3.8 GB of the 612 GB of temporary files). About 6 MB of shared memory, inside the 172-page margin. Same seed, apply, reset order as huge_pages.
