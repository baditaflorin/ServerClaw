context: |
  Gitea's configured OIDC group requirement currently allows only platform
  administrators to authenticate. Add a dedicated login-only group for
  ordinary users and a separately invoked non-admin test account so the full
  Authentik redirect, authentication, callback, and Gitea session can be
  verified without granting the account administrative access. The service
  completeness gate scopes its existing checklist to changed services and
  retains a full-inventory fallback for global or unscoped changes.
