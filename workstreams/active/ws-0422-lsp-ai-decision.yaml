summary: >
  Evaluation of SilasMarvin/lsp-ai as an LSP-based editor-side AI coding
  assistant. ADR 0422 (Accepted, decision-only): do not deploy lsp-ai in
  any form — Claude Code remains the primary developer-AI interface, and
  editor-native plugins (Continue.dev, avante.nvim, Zed AI) can point at
  the existing LiteLLM endpoint directly. ADR 0423 (Rejected): kept as a
  historical design record so a future reviewer has the full scope
  (FIM model, LiteLLM alias, runbook, rollback) in one place if the
  decision is ever reopened.
