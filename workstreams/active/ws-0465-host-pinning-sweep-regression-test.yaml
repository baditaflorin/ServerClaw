notes: |
  Locks in the ws-0460 sweep that wired host_pinning_guard into 52
  service playbooks via shared preflight. Without this test, a
  refactor of tasks/preflight.yml could silently remove the guard
  from every service playbook at once.

  10 tests cover:
   - role exists at documented path
   - tasks/preflight.yml mentions host_pinning_guard
   - tasks/preflight.yml invokes via include_role/import_role (not
     just text mention)
   - playbooks/public-edge.yml has the role wired explicitly
   - >= 30 service playbooks import tasks/preflight.yml
   - 5 canonical service playbooks (ops-portal, keycloak, gitea,
     mail-platform, openbao) import tasks/preflight.yml

  No new ADR — this is a regression-test increment for ADR 0457
  Phase 2. Reservation res-0463 cleared after merge.
