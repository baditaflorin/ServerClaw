summary: >
  Phase 5 of the postmortem-driven self-healing roadmap. Aggregates
  every Phase-1/2/3/4 drift signal behind a single `make doctor`
  command; auto-rewrites workstream-YAML `shared_surfaces` paths after
  a merge introduces file renames; commits a Windmill schedule
  template for the receipt-refresh cron the next production session
  activates.
phases:
  phase_0_open_workstream:
    status: in_progress
    target_version: 0.179.x
  phase_1_doctor_aggregator:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/doctor.py — runs check_receipt_freshness, generate_traceability --validate, generate_validator_catalogue summary, validate_no_hardcoded_topology --rule late_bound_default"
      - "Makefile `doctor` target as thin wrapper"
      - "tests/test_doctor.py — fixture-based aggregation logic"
  phase_2_post_merge_rename_hook:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/heal_workstream_renames.py — pure helper, scans workstream YAMLs for old paths, rewrites in place"
      - ".githooks/post-merge — executable shim that calls the helper"
      - "tests/test_heal_workstream_renames.py — synthetic rename pairs + workstream YAML rewrite"
  phase_3_windmill_schedule_template:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "config/windmill/schedules/refresh-safe-receipts.yaml — declarative template"
      - "schema-validates against existing Windmill schedule contract"
  phase_4_activate_in_production:
    status: deferred
    target_version: 0.180.x
    deferred_reason: Requires SSH access to runtime-control + Windmill API key. The template lands now; production session imports it.
acceptance_criteria:
  - "make doctor runs against the live repo and reports every drift signal in <10s"
  - ".githooks/post-merge exists, executable, exercised by unit test"
  - "scripts/heal_workstream_renames.py rewrites paths conservatively (exact-match only)"
  - "config/windmill/schedules/refresh-safe-receipts.yaml exists"
