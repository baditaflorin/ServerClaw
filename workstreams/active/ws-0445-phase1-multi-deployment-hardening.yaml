summary: >
  Open Phase 1 of the 20-change platform-maturity review (2026-04-28).
  Adds the four items not already in flight: fork-shape fixture
  inventories, per-service convergence dry-run in the pre-push gate, a
  lint banning late-bound topology lookups in role defaults, and
  parameterization of inventory/hosts.yml from deployment-model.yaml.
  Tracks (does not redefine) ws-0438 and ws-0439 as Phase 1 items 1
  and 2.
phases:
  phase_0_open_workstream:
    status: completed
    target_version: 0.179.x
    tasks:
      - draft ADR 0445
      - draft workstream YAML
      - regenerate workstreams.yaml + ADR index
      - commit workstream registration before implementation
  phase_1_fork_shape_fixtures:
    status: completed
    target_version: 0.179.x
    done:
      - "tests/fixtures/inventories/lv3-shape.yml (equal-flavor path)"
      - "tests/fixtures/inventories/0fork-shape.yml (divergent-flavor path: leading digit stripped)"
      - "tests/fixtures/inventories/synthetic-shape.yml (testfork.invalid third identity)"
      - "tests/fixtures/inventories/README.md documenting fixture contract"
      - "tests/test_fixture_inventories.py — 12 cases covering parse, scalars, identity render, prefix uniqueness, shape-path coverage"
  phase_2_convergence_dry_run:
    status: completed
    target_version: 0.179.x
    done:
      - "scripts/converge_dry_run.py — git-diff-based change detection, playbook discovery, per-fixture matrix, advisory mode"
      - "tests/test_converge_dry_run.py — 13 cases covering helper functions"
      - "wired into .githooks/pre-push as advisory step (SKIP_CONVERGE_DRY_RUN=1 to bypass)"
    notes: |
      Default mode is `--syntax-check` (fast, no SSH); `--mode=full` runs
      `--check --diff` for manual investigation. Live smoke run on the
      current branch shows api_gateway_runtime passes 3/3 cells.
  phase_3_late_bound_topology_lint:
    status: completed
    target_version: 0.179.x
    done:
      - "scripts/validate_no_hardcoded_topology.py: new `late_bound_default` rule scanning roles/*/defaults/main.yml + collections mirror"
      - "allow-comment escape hatch: `# late-bound-allow: <reason>` (reason required)"
      - "tests/test_validate_no_hardcoded_topology.py — 10 cases covering match, suppression, scope, edge cases"
      - "wired automatically through scripts/validate_repo.sh which already calls the validator with --rule all"
    notes: |
      Live scan against the branch returns clean (zero existing hits) so
      the rule lands forward-looking — no cleanup pass required.
  phase_4_inventory_as_parameter:
    status: completed_via_ws0439
    target_version: 0.180.x
    notes: |
      Substrate already shipped through ws-0439:
        - scripts/deployment.py — slug resolver + Deployment loader
        - config/contracts/deployment-v1/{identity,topology,profile}.schema.json
        - Makefile MULTI_DEPLOYMENT_ENABLED=1 + DEPLOYMENT_ARG flag
        - .local/deployments/<slug>/ layout (operator-authored, gitignored)
      ws-0445's contribution is the integration test that confirms the
      fork-shape fixtures load + validate through that loader, closing
      the seam between phase 1.1 (fixtures) and ws-0439 (substrate).
    done:
      - "test: tests/test_ws0445_deployment_loader_integration.py — 7 cases proving lv3/0fork/synthetic identity shapes validate through scripts/deployment.py against config/contracts/deployment-v1/ schemas"
    deferred_to_phase_2:
      - one-release deprecation warning for legacy `env=production` enum
      - default-on of MULTI_DEPLOYMENT_ENABLED once all generators verified
  phase_5_promote_to_required:
    status: not_started
    target_version: 0.181.x
    tasks:
      - promote convergence dry-run from advisory to required
      - promote late-bound topology lint from advisory to required
      - retire or restructure ws-0438 phase 6 (generic_deploy_ci) — duplicate ownership
acceptance_criteria:
  - "Three fixture inventories render full platform_service_registry without error"
  - "Pre-push gate runs ansible-playbook --check --diff per changed role across all three fixtures"
  - "validate_no_hardcoded_topology.py flags default('<known-prod-IP-or-domain>') in role defaults"
  - "make converge-X deployment=0fork and make converge-X deployment=lv3 are first-class entry points"
  - "ws-0438 phase 6 is retired or restructured (no duplicate ownership)"
ownership_manifest:
  owned_surfaces:
    - id: ws_0444_docs
      paths:
        - docs/adr/0445-phase1-multi-deployment-hardening.md
        - workstreams/active/ws-0445-phase1-multi-deployment-hardening.yaml
      mode: shared_contract
      contract: adr-0445-phase1-multi-deployment-hardening-v1
    - id: ws_0444_fixtures
      paths:
