        - tests/test_converge_dry_run.py
      mode: shared_contract
      contract: adr-0445-convergence-dry-run-v1
    - id: ws_0444_topology_lint_extension
      paths:
        - scripts/validate_no_hardcoded_topology.py
        - tests/test_validate_no_hardcoded_topology.py
      mode: shared_contract
      contract: adr-0445-late-bound-topology-lint-v1
notes:
  - >
    Phase 1 items 1 (ADR 0438) and 2 (ADR 0439) are already in flight as
    ws-0438 and ws-0439 respectively. This workstream tracks their
    status under a Phase 1 milestone but does not own their surfaces.
  - >
    ws-0438 phase 6 (generic_deploy_ci) overlaps with this workstream's
    phase 1 + phase 2. On merge, ws-0438 phase 6 should be retired and
    its remaining tasks subsumed here.
  - >
    Phase 4 (inventory as parameter) is coordinated with ADR 0442 but
    not blocked on its full design — the inventory generation is the
    load-bearing mechanism either way.
