notes: |
  Started from latest origin/main commit 04638e669 on 2026-04-21.

  Branch-local fixes completed before live apply:
  - decommission plans now read current subdomain-catalog service_id/fqdn fields while preserving legacy service/hostname compatibility
  - --validate-registry keeps stdout as parseable JSON and writes human status to stderr
  - platform_ops decommission-preview reports HTTPS/TLS marker files and the new JSON list-item registry handlers
  - generate_slo_rules.py emits ADR 0396 # BEGIN/END SERVICE markers in the active generated SLO assets
  - uptime_contract.py stamps generated Uptime Kuma monitors with service_id for structural decommission cleanup
  - code purge skips fallback line deletion for structured JSON/YAML files and uses structured handlers plus regeneration instead

  Disposable purge proof:
  - service: browser_runner
  - command: python3 scripts/decommission_service.py --service browser_runner --purge-code --confirm browser_runner --validate-registry
  - result: code_purged=true, registry_warnings=[], integrity_errors=[]
  - regenerated: SLO assets, HTTPS/TLS assurance assets, platform manifest, discovery artifacts, workstream registry

