context: |
  The public GHCR pull-through cache remains anonymous on VM180:5002. A
  separate `127.0.0.1:5005` adapter may receive one narrowly scoped
  package-read identity through an approved cache-only vault renderer. The
  credential must never be copied to the broker, a builder, public adapter,
  Ansible output, Compose environment, or another cache adapter. Private pulls
  are fail-closed unless a fixed root:root 0400 regular configuration beneath
  fixed root:root 0700 directories is already present.
tasks:
  - id: t1
    title: Add an opt-in root-only GHCR proxy configuration contract
    status: in_progress
  - id: t2
