notes: |
  Installs 10 project management tools on the platform:
  Focalboard, Huly, Kan, Leantime, OpenProject, Planka, Taiga, Tiki,
  Vikunja, and FlowInquiry. DNS A records at <tool>.0mcp.com already
  created (2026-07-01). Each tool gets an nginx edge proxy, TLS via
  step-ca, and admin users for baditaflorin@gmail.com and
  alexander@knibo-invest.de. Simple tools run single-container Docker
  Compose on docker-runtime-lv3; tools needing PostgreSQL get a database
  on postgres-vm. Huly and Taiga use multi-container stacks.

  2026-07-01 Codex follow-up: Planka, Focalboard, and Kan were healthy on
  docker-runtime loopback but unreachable through the public edge because their
  Docker published ports were bound to 127.0.0.1 while nginx-edge proxies to
  10.10.10.20. Live compose files and role templates now bind those three
  services to 0.0.0.0. Workstation verification returns Planka 200,
  Focalboard 200, and Kan 307 -> /login.

  2026-07-01 Codex follow-up: Huly's front-only placeholder compose rendered,
  but the container crashed with "Please provide server secret" and never opened
  port 8112. Live state now runs the full Huly self-host stack under /opt/huly,
  with generated secrets persisted in /etc/lv3/huly, internal nginx bound on
  0.0.0.0:8112, and workstation verification returning HTTP 200 at
  huly.0mcp.com. The Huly runtime role now renders the full stack, .env, and
  internal nginx config. The other six tools still lack running backend
  listeners and remain deployment-completion work.
