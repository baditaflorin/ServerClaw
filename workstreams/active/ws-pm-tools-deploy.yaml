ownership_manifest:
  owned_surfaces:
  - id: pm_tools_service_registry
    paths:
    - inventory/group_vars/all/platform_services.yml
    mode: additive
  - id: pm_tools_topology
    paths:
    - inventory/host_vars/proxmox-host.yml
    mode: additive
  - id: pm_tools_runtime_roles
    paths:
    - collections/ansible_collections/lv3/platform/roles/focalboard_runtime
    - collections/ansible_collections/lv3/platform/roles/huly_runtime
    - collections/ansible_collections/lv3/platform/roles/kan_runtime
    - collections/ansible_collections/lv3/platform/roles/leantime_runtime
    - collections/ansible_collections/lv3/platform/roles/openproject_runtime
    - collections/ansible_collections/lv3/platform/roles/planka_runtime
    - collections/ansible_collections/lv3/platform/roles/taiga_runtime
    - collections/ansible_collections/lv3/platform/roles/tiki_runtime
    - collections/ansible_collections/lv3/platform/roles/flowinquiry_runtime
    mode: exclusive
  - id: pm_tools_playbooks
    paths:
    - playbooks/services/focalboard.yml
    - playbooks/services/huly.yml
    - playbooks/services/kan.yml
    - playbooks/services/leantime.yml
    - playbooks/services/openproject.yml
    - playbooks/services/planka.yml
    - playbooks/services/taiga.yml
    - playbooks/services/tiki.yml
