notes: |
  Closes Slice D from the ws-0448 postmortem (the lv3 ↔ 0fork
  oauth2-proxy@4180 collision class of bug).

  Phase 1 (this workstream) ships:
   - config/contracts/deployment-v1/topology.schema.json: optional
     `deployment_owner` field on each proxmox_guests[*] entry,
     pattern ^[a-z0-9][a-z0-9_-]*$.
   - scripts/host_pinning_check.py: read-only audit primitive that
     walks active or all deployments and reports drift (declared_owner
     != declaring deployment).
   - 12 new tests covering schema acceptance, drift detection,
     host filter, cross-deployment info surfacing, and CLI exit codes.

  Phase 2 (NOT in this workstream — deferred): wire the field into
  nginx_edge_publication / public_edge_oidc_auth role tasks so a
  converge refuses to install services on a host pinned to a
  different deployment. That's role-author work that should land
  per-role with review.
