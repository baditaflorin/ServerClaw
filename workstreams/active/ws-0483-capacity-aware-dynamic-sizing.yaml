findings:
  - "2026-05-11 incident on 0fork showed the lv3-sized topology over-allocates RAM to 180GB on a 64GB host. The fix is structural, not parametric: sizing must be derived from probed host capacity, not copied from another deployment."
  - The 0fork-incident audit revealed every VM had balloon=0 (ballooning disabled). Always-on ballooning (40% floor) is now part of the policy defaults; the 0fork host has been queued to enable ballooning on next VM reboot, but new deployments will be ballooning-enabled from creation.
