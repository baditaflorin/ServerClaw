canonical_truth:
  changelog_entry: "The 0mcp hypervisor's tailnet proxy sockets bind with FreeBind=true and tailscale0 Wants= them (hostconf drop-ins, role template, inventory), so a tailscaled restart no longer leaves them dead; a throwaway-systemd rig proves it"
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  On 2026-11-02 at 12:33:26 CET tailscaled on the 0mcp hypervisor updated itself (the Tailscale control plane sent a c2n update, which ran `tailscale update --yes`, which ran
  `apt-get install --yes --allow-downgrades tailscale=1.104.4`) and restarted. systemd stopped every socket with Requires=tailscaled.service and started them again 3 s later, before tailscale0 existed
  and before it had its address: the 19 lv3-tailscale-proxy-* sockets (BindToDevice=tailscale0) failed with "Bound to unit sys-subsystem-net-devices-tailscale0.device, but unit isn't active" and
  zmcp-runtime-general-metrics-proxy.socket with "Cannot assign requested address". All 20 stayed dead for 8 hours (OpenBao, Postgres, Vaultwarden, Gitea, Woodpecker, ...; the alert was
  FleetNodeExporterDown for runtime-general) until they were started by hand. woodpecker-0exec-build-metrics-proxy.socket had FreeBind=true and came back at once. The same self-update ran on the 0docker
  hypervisor at 12:33:24 CET and was the unexplained tailscale0 flap behind #659. The fix is FreeBind=true plus a tailscale0 device drop-in that Wants= every proxy socket.
