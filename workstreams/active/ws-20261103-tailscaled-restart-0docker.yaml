canonical_truth:
  changelog_entry: "The 0docker hypervisor's tailnet proxy sockets survive a tailscaled restart: woodpecker-exec-proxy@.socket gets FreeBind=true and zdocker-hypervisor-metrics-proxy.socket is Wanted by the tailscale0 device (hostconf drop-ins); the throwaway-systemd rig models the 0docker unit shapes on systemd 252"
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  On 2026-11-02 at 12:33 CET tailscaled on the 0docker hypervisor updated itself (the control plane's `tailscale update --yes`, the same update that hit 0mcp) and was restarted: the restart took 90 s because
  tailscaled's stop timed out, and when it started again at 12:34:59 woodpecker-exec-proxy@9000.socket (BindToDevice=tailscale0, no FreeBind) failed with "Bound to unit sys-subsystem-net-devices-tailscale0.device,
  but unit isn't active" and the Woodpecker CI plane stood still for 71 minutes. PR 659 added a tailscale0 device drop-in that Wants= the socket; PR 661 (0mcp) showed in a rig that this is half a fix: the device
  appears about 0.3 s (0docker) to 0.8 s (0mcp) before it has its address, so the Wants= start fails with "Cannot assign requested address" unless the socket has FreeBind=true. zdocker-hypervisor-metrics-proxy.socket has
  FreeBind but is only WantedBy=sockets.target, so after a separate stop and start of tailscaled nothing starts it. This workstream adds the FreeBind drop-in and the device Wants= for the 0docker hypervisor.
