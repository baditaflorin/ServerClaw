canonical_truth:
  changelog_entry: "standby-ctl (DomainScope standby VM 8101): when a guest step runs out of time it runs one bounded, docker-free diagnostic script in the guest and keeps the result in the run record (guest_diag). Code, tests and README only; nothing is applied to the hypervisor."
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  The daily DomainScope standby rehearsal failed on 2026-10-31 (exit 5, 603.6 s): silent and teardown both ended in "guest exit 124: guest command did not finish in time",
  and the guest-shutdown timed out too. The guest's boot had stalled before multi-user.target (cloud-init never started its final stage, which is ordered after
  multi-user.target; docker.service is Type=notify with TimeoutStartSec=0), the guest was idle (load 0, no IO or memory pressure) and the hypervisor was quiet. The next
  rehearsal (2026-11-01) passed. What docker or containerd waited for could not be shown: the record had no guest output, and the guest's journald (SystemKeepFree=5G on a
  disk with 5.6 GB free) had already deleted the journal of that boot. This workstream makes the next occurrence explain itself.
