notes: |
  Mirror the existing Make targets (mk/multi-deployment.mk:
  new-deployment / use-deployment / bind-worktree) as Python CLI
  subcommands on scripts/deployment.py.

  Why both surfaces: Make targets are operator-friendly (terminal),
  Python CLI is agent-friendly (typed exit codes, unit-testable).
  Both produce the same .local/deployments/<slug>/ data layout —
  ADR 0440 contract is the source of truth.

  9 new tests cover slug validation, file scaffolding, overwrite
  refusal, operator parsing, and worktree binding.
