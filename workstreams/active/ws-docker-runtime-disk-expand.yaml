notes: |
  Live operations only: resize Proxmox VMID 120 (`docker-runtime-lv3`) from the
  observed 128G virtual disk / 126G root filesystem to the repo-declared 256G
  disk target, then grow `/dev/sda1` with `growpart` and `resize2fs`.

  Plane sync was intentionally skipped from the isolated worktree because
  scripts/sync_plane_agent_issues.py writes `.local/plane/aw-auth.json` under
  the current worktree. Worktrees must not receive copied credential state.

  Completed 2026-07-01: Proxmox `scsi0` now reports 256G, guest `/dev/sda1`
  now reports a 252G ext4 root filesystem with about 122G available, and Docker
  remained active with 40/40 containers running.

  PR #32 opened as a draft against main. GitHub Actions did not run because the
  GitHub account is locked due to a billing issue; both `release-readiness` and
  `validate` failed at job startup with that platform-level blocker.
