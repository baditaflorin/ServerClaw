canonical_truth:
  changelog_entry: Patch every identified NGINX runtime to an official fixed release
    and block the unused SCTP kernel module on affected hosts until the kernel fix
    is available.
  release_bump: patch
  included_in_repo_version: null
context: The disclosed NGINX CVEs affect installed packages and container images across
  both the managed platform and external Docker hosts. Debian's current NGINX packages
  remain vulnerable, while official NGINX stable 1.30.7 and mainline 1.31.9 contain
  the published fixes. The privilege-escalation chain also depends on an unfixed SCTP
  kernel issue; no SCTP listeners or sockets were found on the inspected NGINX hosts.
  The workstream inventories all reachable NGINX instances, patches managed and external
  runtimes, and records any host that remains unreachable or awaiting a safe image
  rebuild.
