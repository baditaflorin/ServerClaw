canonical_truth:
  changelog_entry: PveBackupFreshnessLow holds a guest whose only vzdump job is weekly to the collector's 8.5 day limit and keeps the 30 hour limit for every other guest, so CT 108 no longer raises a critical alert for most of every week.
  release_bump: patch
  included_in_repo_version: null
  latest_receipts:
    pve_backup_weekly_freshness: 2026-10-30-pve-backup-weekly-freshness-monitoring-live-apply
context: >-
  CT 108 (the builder) has had a weekly vzdump job since 2026-10-28 (ct108-nightly, "sun 03:30"; its daily restore point is the file-level
  group host/ct108-live). PveBackupFreshnessLow held every guest to a fixed 30 hours since the last successful vzdump, so it fires 30 hours
  after each Sunday run and stays critical until the next run: about 5.75 days of every 7, with nothing failing. The host collector
  (baditaflorin/fleet-state hypervisor-0docker/libexec/pve-host-health-metrics.py, PR 619, installed on the hypervisor on 2026-10-28) already
  reads each job's schedule and publishes proxmox_backup_max_age_seconds per guest (36 hours, or 8.5 days for a weekly guest) and looks back
  10 days for a weekly guest. This change makes the alert in this repository use that limit for a weekly guest and nothing else; a daily guest
  stays at 30 hours. Applying it to the monitoring VM is a separate decision.
