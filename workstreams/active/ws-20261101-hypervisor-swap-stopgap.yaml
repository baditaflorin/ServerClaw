context: >-
  On 2026-11-01 the 0mcp hypervisor (pve-0mcp) had 8 GiB of 125 GiB available, its 4 GiB swap partition 3.8 GiB full and its VMs configured for 139 GiB; the owner approved a stopgap
  and a 32 GiB swapfile /swapfile-0mcp-stopgap was created live on / (md2, ext4) at 22:03Z, by hand. It is not in /etc/fstab, so a reboot drops it, and it was in no repository.
  hostconf manages sysctl files, systemd drop-ins and Postgres conf.d files only (no swap or fstab kind), so this uses the install-script pattern of config/0mcp and config/0infer.
  Nothing is installed or changed on the host by this change (the read-only check verb was run once against the live host, 22:27Z, to test it); persisting the swapfile (install-host.sh --persist) needs the owner's yes. The lasting fix (VM memory sizes that fit the host)
  is the owner's decision and belongs to the capacity plan and the memory-budget proposal (PR 653), not here.
