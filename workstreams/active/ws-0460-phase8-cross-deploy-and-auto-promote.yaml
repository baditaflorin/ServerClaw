summary: >
  Phase 8 ships the two structural follow-ups left after Phase 7:
  cross-deployment visibility (Option B) and advisory auto-promotion
  (Option C). The local doctor signal is already at 1/7 non-zero;
  Phase 8 makes the remaining drift surfaces visible across
  deployments and starts graduating long-clean advisories toward
  required.
phases:
  phase_0_open_workstream:
    status: in_progress
  phase_1_promotion_tracker:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/promotion_tracker.py: classify each gate as eligible/streaking/unstable from receipts/gate-runs/"
      - "receipts/gate-runs/README.md: schema + one synthetic example"
      - "tests cover ledger parsing, classification window, malformed-entry tolerance"
  phase_2_cross_deployment_doctor:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "scripts/cross_deployment_doctor.py: walks .local/deployments/<slug>/state/, computes per-receipt drift"
      - "Output shape mirrors doctor.py for ops_portal consumers"
      - "tests/test_cross_deployment_doctor.py covers no-deployments, single-deployment, multi-deployment"
  phase_3_doctor_integration:
    status: not_started
    target_version: 0.179.x
    tasks:
      - "make doctor surfaces [promotion_eligible] row"
      - "make doctor deployment=<slug> entry point invokes cross-deployment subset"
  phase_4_apply_promotions:
    status: deferred
    target_version: 0.180.x
    deferred_reason: |
      Flipping a gate from advisory to required mutates validate_repo.sh
      and possibly the pre-push hook. That's a deliberate cross-cutting
      operation that should land in its own focused PR after the
      tracker has produced multi-week eligibility evidence.
acceptance_criteria:
  - "promotion_tracker --list classifies the three known-clean gates as eligible against synthetic ledger fixtures"
  - "cross_deployment_doctor reports per-deployment drift or graceful no-deployment fallback"
  - "make doctor integrates promotion_eligible row"
  - "all new tests pass; existing tests unaffected"
