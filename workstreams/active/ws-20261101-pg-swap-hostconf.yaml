canonical_truth:
  changelog_entry: "hostconf manages /etc/sysctl.d/91-pg-swap.conf (vm.swappiness = 10) on infer-pg-primary, the sysctl that went with the 16 GiB swapfile of 2026-10-31; drift reports it, the entry documents the swapfile rebuild commands"
  release_bump: patch
  included_in_repo_version: null
  latest_receipts: {}
context: >-
  On 2026-10-31 13:27Z VM701 (the production DomainScope Postgres) got a 16 GiB swapfile on its root disk and /etc/sysctl.d/91-pg-swap.conf with vm.swappiness = 10, by hand,
  after the 01:25Z global OOM. The file existed on the host and nowhere else, which is what hostconf exists to prevent. The manifest now lists it with the effective setting
  (sysctl vm.swappiness = 10); the live file was read before the entry was written and `hostconf.py drift --host infer-pg-primary` reports it in sync (live_applied is true: nothing
  needs applying).
