canonical_truth:
  changelog_entry: The VM 100 state backup stages its large SQLite copies one at a time and compresses each, so its staging peak on the guest disk falls and the hypervisor root filesystem dips less.
  release_bump: patch
  included_in_repo_version: null
context: >-
  The daily dockerhost-state-backup on VM 100 stages about 18 GiB (three SQLite online copies of 17.5 GiB) on the guest root
  before one client call, which lets the hypervisor's root filesystem (/dev/md3, the only storage of the host) fall by about four
  points for twenty minutes. On 2026-10-28 it reached 13.72 % free at 17:55Z and held CI admission (under 14 %) from 17:47 to
  17:55Z. This change lowers the peak staged bytes without changing what is backed up; deploying it is a separate decision.
tasks:
  - id: t1
    title: Measure the old script and the candidates on a quiet fleet host with the guest disk modelled as a sparse file
    status: in_progress
  - id: t2
    title: Stage the large copies one at a time, compress each, verify before deleting the raw copy, trim what was freed
    status: in_progress
  - id: t3
    title: Restore-drill one large compressed copy from a real snapshot on a scratch Proxmox Backup Server
    status: pending
  - id: t4
    title: Review and merge (the user decides); installing on VM 100 is a separate step
    status: pending
