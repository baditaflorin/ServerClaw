context: |
  The private broker PKI handoff needs one atomic ten-record vault batch but
  must never receive persistent vault-write authority or Dockerhost API-key
  administration material. This workstream installs only the narrow, remote
  forced-command transaction boundary. The follow-up corrects an OpenSSH
  Match-block directive, restores the minimum privilege-safe
  AuthorizedKeysFile traversal that OpenSSH requires, and permits that exact
  traversal-only parent in the root-only executable's fixed-config validator.
  It does not create a client key, issue certificates, write a vault record,
  expose a route, or broaden the restricted account's authority.
tasks:
  - id: t1
    title: Install root-only transaction code with fixed one-use authority and batch validation
    status: completed
  - id: t2
    title: Restrict Dockerhost SSH and sudo to the exact PKI transaction
    status: completed
  - id: t3
    title: Correct the fail-closed SSH syntax, key traversal, and fixed-config validation invariants
    status: in_progress
