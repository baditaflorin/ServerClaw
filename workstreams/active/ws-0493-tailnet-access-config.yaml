objectives:
  - Make tailnet-only service intent explicit without changing public exposure semantics.
  - Keep service network access independent of the chosen mesh control plane.
  - Allow the operator to select hosted Tailscale or self-hosted Headscale without an implicit live migration.
completion_metrics:
  - A tailnet service must be private-only and have managed tailnet-scoped DNS plus a repo-managed Tailscale TCP proxy path.
  - The mesh selector accepts Tailscale with no custom login server or Headscale with an HTTPS login server, and rejects mismatched combinations before apply.
  - An enrolled host cannot change control plane unless the dedicated migration flag is explicitly enabled.
  - Existing catalog generation and Ansible syntax checks pass without deployment-specific values or secrets in committed files.
  - No live mesh migration or ACL change is performed by this workstream.
