summary: >
  Move the platform from "generic by convention" (ADR 0407) to
  "generic by construction" for the axis ADR 0409 did not cover:
  role-internal prefix hardcoding. Audit found 190+ literal lv3_*/lv3-*
  identifiers across role defaults, templates, and !unsafe blocks, plus
  a structural credential-variable-name divergence pattern that breaks
  fork overrides silently.
phases:
  phase_0_stop_the_bleed:
    status: completed
    done:
      - "fix(openbao): parameterize creation_statements connect role"
      - "fix(openbao): align openbao_postgres_admin_password_local_file to fork path"
      - "fix(inventory): use platform_config_prefix for Proxmox automation user"
      - "fix(openbao): fix fork topology IP mismatches + artifact path isolation"
      - "fix(postgres): add openbao_rotator pg_hba entry via platform_postgres_clients"
  phase_1_platform_identity:
    status: completed
    target_version: 0.179.0
    done:
      - "feat(identity): platform_identity filter plugin with 5 flavors (config/sql/pve/unix/dns_label)"
      - "test: 18 unit tests across lv3/0fork/UPPERCASE/edge-case inputs"
      - "fix(identity): migrate proxmox_notification_*, keycloak_realm_name, monitoring_influxdb_org to platform_identity"
      - "fix(identity): migrate proxmox_api_automation_user to pve_prefix (was config_prefix)"
      - "fix(identity): migrate proxmox_acme_plugin_id to config_prefix (was sql_prefix)"
      - "test(lint): Tier-0 raw-split scanner + Tier-0 cross-ref validator + pytest gates"
  phase_2_literal_prefix_sweep:
    status: in_progress
    target_version: 0.180.0
    done:
      - "fix(postgres): parameterize /etc/lv3/ in all platform_postgres_clients (54 A2 warnings cleared)"
      - "fix(derive): parameterize /etc/lv3/ in derive_service_defaults.yml (covers all 70+ services)"
      - "fix(roles): parameterize /etc/lv3/ in 63 role defaults/main.yml files (80 occurrences)"
      - "fix(playbooks): parameterize /etc/lv3/ in mail-platform playbooks and inline vars"
      - "fix(scaffold): update service scaffold template to use platform_identity.unix_prefix"
      - "fix(roles): parameterize lv3- identifiers in 68 role defaults (203 occurrences — container_name, policy_name, network_name, service_image_name)"
      - "fix(tests): update 6 role defaults test files to expect platform_identity template values"
      - "fix(openbao): replace 4 !unsafe SQL grants with Jinja-escape pattern (Phase 0 ef1445216)"
    remaining:
      - "Rename platform_service_topology fact to platform_service_topology (50+ callsites)"
  phase_3_unified_credentials:
    status: in_progress
    target_version: 0.181.0
    done:
      - "fix(openbao): rename openbao_postgres_admin_password_local_file → openbao_postgres_rotator_password_local_file in writer role (openbao_postgres_backend)"
      - "feat(credentials): create config/platform_credentials.yml registry with 10 initial entries"
      - "feat(credentials): create config/schemas/credentials.schema.json JSON schema"
      - "feat(credentials): add credentials registry validation to validate_tier0_crossrefs.py"
      - "test(credentials): contract test — each credential has exactly one owner, consumer roles exist"
    remaining:
      - Sweep remaining ~20 credential variable divergences (audit in progress)
      - Remove now-redundant openbao_postgres_rotator_password_local_file bridge alias from group_vars/all/main.yml
  phase_4_shard_laziness:
    status: not_started
    target_version: 0.182.0
    blocked_on: audit-3-shard-bake-behavior
    tasks:
      - Change ansible_scope_runner.py to emit Jinja templates for derived paths
      - Drop redundant override lines from playbooks/vars/fork-overrides.yml
  phase_5_phase_aware_address:
    status: not_started
    target_version: 0.183.0
    tasks:
      - Write platform_host_address filter with phase semantics
      - Migrate common_openbao_compose_env_openbao_address + ~5 known callsites
      - Add lint for raw IPs in role defaults
  phase_6_generic_deploy_ci:
    status: not_started
    target_version: 0.184.0
    tasks:
      - Add tests/fixtures/synthetic-identity.yml
      - CI job runs every playbook in --check mode against synthetic identity
      - Promote from advisory to required
acceptance_criteria:
  - Pre-push lint scanner green on main with zero allow-comments outside docs/tests
  - "PLATFORM_IDENTITY_OVERLAY=.local/identity.yml.0fork make bootstrap completes without any lv3/prefix/credential hardcoding workaround in fork-overrides.yml"
  - Generic-deploy CI job green against testfork.invalid synthetic identity
