notes: |
  Fix 500 Internal Server Error on OIDC-protected sites (ops.<domain>,
  grafana.<domain>, …) caused by oauth2-proxy header overflow on both
  the /oauth2/auth subrequest and the /oauth2/callback response.

  Root cause: nginx default proxy_buffer_size (4k / one OS page) is too
  small for oauth2-proxy responses when Keycloak group/role claims are
  attached. v0.179.2 hot-fixed only /oauth2/callback (16k); v0.179.4
  generalises the fix to both locations and bumps to 64k to absorb
  future claim growth without further hot-patches.

  ADR 0444 codifies the rationale, the chosen value, and the rule that
  any future oauth2-proxy location must use the same buffer settings.
