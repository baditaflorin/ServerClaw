context: |
  The dedicated 0docker Builder LXC108 needs a stable local non-secret identity
  before it can be trusted as the fleet-runner image-publishing surface. The
  contract must be unavailable to general docker-build guests and must not carry a
  registry endpoint, credential, package token, image reference, or runtime
  topology.
