notes: |
  Closes the half-applied-state class of bug at the receipt layer.

  scripts/converge_state_receipt.py with two subcommands:
   - snapshot <paths>...: emit JSON array of {path, sha256, size_bytes}
   - write-receipt --run-id --host --role --before --after --handlers-fired:
     diff snapshots, write atomic receipt to receipts/converge-state/

  9 tests cover snapshot existing/missing files, diff change/no-change
  /add/remove, atomic receipt write, and both CLI subcommands.

  Wiring into per-role task files is a follow-up. ws-0468 only ships
  the leaf primitive.
