context: |
  Authentik is live and the operator account is valid. This workstream adds a
  declarative, rate-limited recovery flow through the platform's authenticated
  internal SMTP relay, bound to the active brand and default authentication
  identification stage. The worker resolves that relay over the existing
  private mail-platform Docker network, avoiding runtime-host SMTP hairpinning.
