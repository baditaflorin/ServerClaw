context: |
  PR 263 merged the Authentik 2026.8.3 runtime upgrade at
  7063709d1ac1d9ca693043c63772dd045955e030. PR 261 merged the linux/amd64
  digest pin, current Syft and Grype evidence, and the explicitly approved seven-day exception for 3 Critical
  and 84 High findings. Production was not changed by that merge. This separate
  workstream owns the repository release integration, guarded VM192 rollout,
  and post-apply evidence. The previous broad consumer workstream has a
  completed apply receipt and must not be reused for a second apply. A prerequisite
  mail DNS repair was applied narrowly so the approved recovery email could be
  verified end-to-end.

  The exception expires on 2026-10-08. Re-scan before expiry; do not extend it
  silently. The last restore rehearsal restored PostgreSQL but did not reach
  Authentik web readiness. A short-lived VM disk snapshot is the immediate
  rollback mechanism for the rollout; it was removed after verification. This is
  not proof of off-host recoverability.
