description: |
  Continue ADR 0491 after the parallel Authentik deployment. First close the
  incomplete GlitchTip verification and replace its one-off API/ORM setup with
  repeatable repository automation. Reconcile the Authentik deployment with
  its OpenBao-backed target and validate the supported Ansible path before
  adding more dependants. Only after those gates pass, migrate Outline as the
  next approved client and prove a complete authorization-code round trip.

  No other OIDC client is changed in this workstream. Keycloak remains live as
  the per-client rollback path. Human operator migration, MFA re-enrolment,
  serverclaw-runtime coordination, and Keycloak decommission remain outside
  scope and require later review checkpoints.
objectives:
  - Prove the repaired GlitchTip domain and Authentik OIDC path end to end.
  - Make Authentik application/provider and GlitchTip SocialApp state declarative and idempotent.
  - Reconcile Authentik secrets with OpenBao and validate the Ansible deployment path.
  - Migrate Outline only after the GlitchTip and Authentik foundation gates pass.
completion_metrics:
  - GlitchTip reports the correct allowed host and completes an Authentik login round trip.
  - Re-running the governed automation produces no duplicate Authentik or GlitchTip objects.
  - Authentik runs from OpenBao-rendered secrets and remains healthy through the edge.
  - The Authentik playbook passes syntax and controlled live converge verification.
  - Outline completes an Authentik login round trip while Keycloak remains available for rollback.
blockers: []
