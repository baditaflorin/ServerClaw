notes: |
  Replace hardcoded example.com sidebar links in the ops portal with deploy-time
  {{ platform_domain }} injection (ADR 0407 generic-by-default pattern).
  Adds OPS_PORTAL_PARENT_DOMAIN and OPS_PORTAL_{HOME,CHANGELOG,GRAFANA,TASKS,WIKI}_URL
  env vars. Registers portal_domain + portal_links as Jinja globals so all templates
  see them with no per-route plumbing. Extends safe_requested_url to allow
  https://*.<portal_domain> deep links so the entry router policy text matches behaviour.
