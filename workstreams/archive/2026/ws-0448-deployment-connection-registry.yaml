notes: |
  Closes the operator-surface gap left by ws-0445 phase 1: every
  deployment now carries its SSH/Proxmox-host metadata as committed
  data (.local/deployments/<slug>/connection.yml), not as a per-target
  Makefile constant.

  Three pieces:
  1. config/contracts/deployment-v1/connection.schema.json — schema +
     Deployment.connection field + `connection` CLI subcommand on
     scripts/deployment.py emitting LV3_PROXMOX_HOST_*,
     LV3_BOOTSTRAP_SSH_PRIVATE_KEY, PLATFORM_IDENTITY_OVERLAY.
  2. scripts/run_with_deployment.sh — exec-style wrapper that resolves
     the slug, loads the env block, exec's the inner command. No
     Makefile edits — composes with ws-0445 phase 1's MULTI_DEPLOYMENT
     opt-in.
  3. scripts/generate_platform_vars.py — proxmox_guests[*].role now
     defaults to name when absent, so per-deployment topology overlays
     stay minimal.

  Out-of-scope for this slice (deferred to follow-ups):
  - Host-pinning so two deployments can't both install services on the
    same VM (the lv3↔0fork port-4180 collision).
  - inventory/hosts.yml parameterization (ws-0445 item 5 owns this).
  - 0fork's topology.yml still needs more guests — operator data gap,
    not a code change.
