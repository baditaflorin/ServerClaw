notes: The scripted sanitized publication of the retention release passed leak and
  coverage checks but public Woodpecker collection failed because three modules read
  the excluded policy at import time. Deployment assertions now skip only when that
  input is absent; parser and fake-world tests use a minimal generic fixture. Existing
  private policy and guard inputs remain byte-identical and first choice.
