context: |
  The private GHCR adapter requires one complete Docker Distribution
  configuration, but VM180 must not retain an API key or receive a general
  vault capability. A Dockerhost-only forced-command bridge issues one
  300-second, one-use reader for the exact cache renderer identity. The
  root-only cache renderer receives it over the pinned bridge, reads only
  artifact_cache_ghcr_proxy_config, validates the complete private-adapter
  configuration, atomically replaces the fixed file, records only a
  non-secret receipt, and acknowledges consumption so the bridge revokes the
  reader before disconnecting.
