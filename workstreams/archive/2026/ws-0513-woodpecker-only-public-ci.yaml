context: |
  GitHub Actions workflow checks on the sanitized public repository were not
  executed because the account has no available GitHub-hosted runner. Public
  ServerClaw already has a governed Woodpecker status check and a pipeline
  targeting the isolated self-hosted runner, so keep public CI on that supported path
  and remove the obsolete workflow and its runtime/catalog dependencies.

  The changed API Gateway and Woodpecker completeness profiles now pass their
  scoped validation without suppressions; focused tests pass. The canonical CI
  API and edge are reachable, but the dedicated builder agent is rejecting
  gRPC with `too_many_pings`; server keepalive and image configuration are being
  repaired. The runtime VM is under memory pressure, so unrelated service
  containers and the VM itself are being left running. A persistent, relative
  CPU-share policy is being added to Plausible ClickHouse after a temporary
  cgroup scheduler-weight mitigation. The Plausible image update uses fresh
  scans and time-limited exceptions for critical findings without available
  image-level fixes; it does not bypass the vulnerability gate. Do not merge
  until the Woodpecker API, runner, webhook, and required branch check are
  verified green.

  The first governed Plausible apply safely stopped before mutation because the
  DNS publication include loaded only the legacy .local/identity.yml path and
  ignored the explicit deployment identity overlay used by worktrees. The
  include and its collection copy now honor PLATFORM_IDENTITY_OVERLAY, including
  the .local/deployments/<profile>/identity.yml layout.
tasks:
  - id: t1
    title: Remove GitHub Actions workflow and update Woodpecker-backed metadata
    status: completed
  - id: t2
    title: Run focused local validation and verify the required Woodpecker check
    status: completed
  - id: t3
    title: Merge the private source PR and publish the sanitized ServerClaw snapshot
    status: completed
