        alertname: ProxmoxHostGuaranteedMemoryOverBudget
        exp_alerts:
          - exp_labels: {severity: warning, service: proxmox_host_memory_budget, pve_host: "0mcp"}
            exp_annotations:
              summary: "Hypervisor 0mcp: balloon floors plus fixed VMs are 80.1% of RAM (budget 80%)"
              description: "The running VMs of 0mcp are guaranteed 80.1% of the host's RAM (balloon floors plus VMs with balloon 0), over the 80% budget. pvestatd keeps every ballooned guest at its floor while the host is over its ballooning target (85% used on this node), and a guaranteed footprint above 80% leaves too little room under that target for guests to hold anything above their floors, so the floors are the real sizes and the maximums do not matter. Do not add a VM or raise a floor or a fixed size before cutting the same amount elsewhere; the table and the apply order are in the runbook."
              runbook_url: docs/runbooks/pve-0mcp-memory-budget.md

