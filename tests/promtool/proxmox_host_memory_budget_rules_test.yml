# promtool unit tests for config/prometheus/rules/proxmox-host-memory-budget.yml (run by tests/test_proxmox_host_memory_budget.py when promtool is installed).
# Sizes are in MiB (the rule only divides two byte counts, so the unit cancels). The first case is the real snapshot of pve-0mcp taken on 2026-11-01 from the 0mcp Prometheus:
# 19 running VMs and the stopped template 9000; the three VMs with balloon 0 (130, 180, 200) have no balloon_minimum_bytes series, as in the live data.
