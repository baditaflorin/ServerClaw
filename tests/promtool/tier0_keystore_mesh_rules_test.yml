# promtool unit tests for the keystore-mesh alerts of the failover chain in config/prometheus/rules/tier0-standby.yml (run by tests/test_tier0_keystore_mesh_promtool.py when promtool
# is installed). The firing state is read from the ALERTS series so the long descriptions need not be repeated here.
rule_files:
  - ../../config/prometheus/rules/tier0-standby.yml

evaluation_interval: 1m

tests:
  - name: a healthy mesh and a passing rehearsal raise nothing
    interval: 1m
    input_series:
      - series: 'tier0_runner_edge_compat_keystore_mesh_nodes{instance="r:9101"}'
        values: "2x600"
      - series: 'tier0_runner_edge_compat_keystore_mesh_nodes_ok{instance="r:9101"}'
        values: "2x600"
      - series: 'tier0_runner_edge_compat_keystore_mesh_key_checked{instance="r:9101"}'
        values: "1x600"
      - series: 'tier0_runner_keystore_probe_failed_lines{instance="r:9101"}'
        values: "0x600"
    promql_expr_test:
      - expr: ALERTS{alertname=~"Tier0KeystoreMesh.*|Tier0KeystoreVerifyFailing", alertstate="firing"}
        eval_time: 500m
        exp_samples: []

  - name: one node that does not answer warns after two hours, not before, and is not the critical case
    interval: 1m
    input_series:
      - series: 'tier0_runner_edge_compat_keystore_mesh_nodes{instance="r:9101"}'
        values: "2x600"
      - series: 'tier0_runner_edge_compat_keystore_mesh_nodes_ok{instance="r:9101"}'
        values: "1x600"
    promql_expr_test:
      - expr: ALERTS{alertname="Tier0KeystoreMeshNodeNotAnswering", alertstate="firing"}
        eval_time: 100m
        exp_samples: []
      - expr: ALERTS{alertname="Tier0KeystoreMeshNodeNotAnswering", alertstate="firing"}
        eval_time: 130m
        exp_samples:
          - labels: 'ALERTS{alertname="Tier0KeystoreMeshNodeNotAnswering", alertstate="firing", severity="warning"}'
            value: 1
      - expr: ALERTS{alertname="Tier0KeystoreMeshAllNodesDown", alertstate="firing"}
        eval_time: 300m
        exp_samples: []

  - name: no node at all answering is critical after one hour
    interval: 1m
    input_series:
      - series: 'tier0_runner_edge_compat_keystore_mesh_nodes{instance="r:9101"}'
        values: "2x600"
      - series: 'tier0_runner_edge_compat_keystore_mesh_nodes_ok{instance="r:9101"}'
        values: "0x600"
    promql_expr_test:
      - expr: ALERTS{alertname="Tier0KeystoreMeshAllNodesDown", alertstate="firing"}
        eval_time: 50m
        exp_samples: []
      - expr: ALERTS{alertname="Tier0KeystoreMeshAllNodesDown", alertstate="firing"}
        eval_time: 70m
        exp_samples:
          - labels: 'ALERTS{alertname="Tier0KeystoreMeshAllNodesDown", alertstate="firing", severity="critical"}'
            value: 1

  - name: a test key that could not be used warns after six hours
    interval: 1m
    input_series:
      - series: 'tier0_runner_edge_compat_keystore_mesh_key_checked{instance="r:9101"}'
        values: "0x600"
    promql_expr_test:
      - expr: ALERTS{alertname="Tier0KeystoreMeshKeyUnchecked", alertstate="firing"}
        eval_time: 300m
        exp_samples: []
      - expr: ALERTS{alertname="Tier0KeystoreMeshKeyUnchecked", alertstate="firing"}
        eval_time: 370m
        exp_samples:
          - labels: 'ALERTS{alertname="Tier0KeystoreMeshKeyUnchecked", alertstate="firing", severity="warning"}'
            value: 1

  - name: a failed check in the daily rehearsal warns after one hour
    interval: 1m
    input_series:
      - series: 'tier0_runner_keystore_probe_failed_lines{instance="r:9101"}'
        values: "1x600"
    promql_expr_test:
      - expr: ALERTS{alertname="Tier0KeystoreVerifyFailing", alertstate="firing"}
        eval_time: 50m
        exp_samples: []
      - expr: ALERTS{alertname="Tier0KeystoreVerifyFailing", alertstate="firing"}
        eval_time: 70m
        exp_samples:
          - labels: 'ALERTS{alertname="Tier0KeystoreVerifyFailing", alertstate="firing", severity="warning"}'
            value: 1
