              description: "The live policy changed between two runs of the reconciler on b:9100, and the reconciler did not change it. via=sync_tool: `tailscale_policy_sync.py apply` (scripts/tailscale-policy-ct108.sh apply) ran on the builder; /var/lib/tailscale-policy-sync/applies.jsonl names the rollback copy. via=unknown: the admin console, another credential or an old copy of the sync tool. A merged additive change never needs a hand apply (the reconciler applies it, after its daily cap if that is spent), and rules that git lacks block the reconciler until git has them. The reconcile events log (out_of_band_change) has both ETags; `scripts/tailscale-policy-ct108.sh drift` shows what differs from git. A planned manual apply of a blocked change needs nothing more."
