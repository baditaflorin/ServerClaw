  # A tick that finds the pools lock held leaves fleet_pool_guardian_lock_skip_timestamp_seconds (fleet-runner v0.7.672): a guardian kept out by a deploy batch is alive.
  # The heartbeat below is a textfile gauge whose value is the time of the last such tick: "0+60x400" is one every minute (the real cadence is ten minutes, well inside the
  # 75 minute window), "0+60x30 1800x300" is ticks for 30 minutes and then the same old value for ever, which is what the exporter serves once ticks stop.
  - name: "kept out of the pools lock by a deploy batch for hours: a warning, and the critical stays quiet while the heartbeat is fresh"
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x400"
      - series: 'fleet_pool_guardian_lock_skip_timestamp_seconds{instance="b:9100"}'
        values: "0+60x400"
    alert_rule_test:
      - {eval_time: 70m, alertname: FleetPoolGuardianLockedOut, exp_alerts: []}        # under two hours: only the slow warning
      - {eval_time: 135m, alertname: FleetPoolGuardianLockedOut, exp_alerts: []}       # over two hours (true since 131 m), inside the 10 m delay
      - eval_time: 145m
        alertname: FleetPoolGuardianLockedOut
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 is alive but kept out by the pools lock: no finished run for 2 hours"
              description: "fleet-pool-guardian.timer is ticking (the lock-skip heartbeat is fresh) but every tick finds the pools lock held: a deploy-pool or an nginx-render batch holds it exclusively, and the guardian's scan, which takes the shared lock, never starts while one does. No run has FINISHED for 2h 15m 0s. It clears by itself about 20 minutes after the lock frees. Who holds it, and what to do if it is stuck: docs/runbooks/fleet-observability.md, Fleet loops, guardian kept out by the lock. After 8 hours without a finished run FleetPoolGuardianSilent (critical) takes over."
              runbook_url: docs/runbooks/fleet-observability.md
      - {eval_time: 140m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - {eval_time: 300m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - {eval_time: 400m, alertname: FleetPoolGuardianSilent, exp_alerts: []}

  - name: "ticks stopped (the timer died or a scan hung) and no run finished: the critical fires and the locked-out warning does not"
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x300"
      - series: 'fleet_pool_guardian_lock_skip_timestamp_seconds{instance="b:9100"}'
        values: "0+60x30 1800x300"
    alert_rule_test:
      - {eval_time: 100m, alertname: FleetPoolGuardianSilent, exp_alerts: []}         # under two hours
      - {eval_time: 135m, alertname: FleetPoolGuardianSilent, exp_alerts: []}         # over two hours (true since 131 m), inside the 10 m delay
      - eval_time: 150m
        alertname: FleetPoolGuardianSilent
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 has not finished a run for 2 hours"
              description: "fleet-pool-guardian.timer fires every 10 minutes. Nothing has observed or repaired the service pools for 2h 20m 0s. On the builder check `systemctl status fleet-pool-guardian.timer fleet-pool-guardian.service` and `journalctl -u fleet-pool-guardian.service`: a scan hung on an ssh child holds the lock (flock -n) and every later timer run is skipped. If every tick says `another run holds the lock; nothing to do` instead, a deploy batch has held the pools lock for hours: that is FleetPoolGuardianLockedOut (a warning for up to 8 hours), and this alert only fires for it after 8 hours or when the lock-skip heartbeat stops (docs/runbooks/fleet-observability.md, Fleet loops)."
              runbook_url: docs/runbooks/fleet-observability.md
      - {eval_time: 150m, alertname: FleetPoolGuardianLockedOut, exp_alerts: []}      # the last tick was 2 hours ago: not alive, not a lock problem

  - name: "kept out for two hours, then a run starts and takes 45 minutes: no critical page while it runs, the critical comes if it hangs"
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x300"
      - series: 'fleet_pool_guardian_lock_skip_timestamp_seconds{instance="b:9100"}'
        values: "0+60x125 7500x300"
    alert_rule_test:
      - {eval_time: 160m, alertname: FleetPoolGuardianSilent, exp_alerts: []}         # the run that started at 125 m is 35 minutes old
      - {eval_time: 195m, alertname: FleetPoolGuardianSilent, exp_alerts: []}         # 70 minutes after the last tick: still inside the window
      - eval_time: 230m
        alertname: FleetPoolGuardianSilent
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 has not finished a run for 2 hours"
              description: "fleet-pool-guardian.timer fires every 10 minutes. Nothing has observed or repaired the service pools for 3h 40m 0s. On the builder check `systemctl status fleet-pool-guardian.timer fleet-pool-guardian.service` and `journalctl -u fleet-pool-guardian.service`: a scan hung on an ssh child holds the lock (flock -n) and every later timer run is skipped. If every tick says `another run holds the lock; nothing to do` instead, a deploy batch has held the pools lock for hours: that is FleetPoolGuardianLockedOut (a warning for up to 8 hours), and this alert only fires for it after 8 hours or when the lock-skip heartbeat stops (docs/runbooks/fleet-observability.md, Fleet loops)."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: "kept out for more than 8 hours: the critical is back"
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x560"
      - series: 'fleet_pool_guardian_lock_skip_timestamp_seconds{instance="b:9100"}'
        values: "0+60x560"
    alert_rule_test:
      - {eval_time: 495m, alertname: FleetPoolGuardianSilent, exp_alerts: []}         # 7 h 55 m without a finished run
      - eval_time: 520m
        alertname: FleetPoolGuardianSilent
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 has not finished a run for 2 hours"
              description: "fleet-pool-guardian.timer fires every 10 minutes. Nothing has observed or repaired the service pools for 8h 30m 0s. On the builder check `systemctl status fleet-pool-guardian.timer fleet-pool-guardian.service` and `journalctl -u fleet-pool-guardian.service`: a scan hung on an ssh child holds the lock (flock -n) and every later timer run is skipped. If every tick says `another run holds the lock; nothing to do` instead, a deploy batch has held the pools lock for hours: that is FleetPoolGuardianLockedOut (a warning for up to 8 hours), and this alert only fires for it after 8 hours or when the lock-skip heartbeat stops (docs/runbooks/fleet-observability.md, Fleet loops)."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: "a heartbeat from another instance holds nothing back"
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x300"
      - series: 'fleet_pool_guardian_lock_skip_timestamp_seconds{instance="other:9100"}'
        values: "0+60x300"
    alert_rule_test:
      - eval_time: 150m
        alertname: FleetPoolGuardianSilent
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 has not finished a run for 2 hours"
              description: "fleet-pool-guardian.timer fires every 10 minutes. Nothing has observed or repaired the service pools for 2h 20m 0s. On the builder check `systemctl status fleet-pool-guardian.timer fleet-pool-guardian.service` and `journalctl -u fleet-pool-guardian.service`: a scan hung on an ssh child holds the lock (flock -n) and every later timer run is skipped. If every tick says `another run holds the lock; nothing to do` instead, a deploy batch has held the pools lock for hours: that is FleetPoolGuardianLockedOut (a warning for up to 8 hours), and this alert only fires for it after 8 hours or when the lock-skip heartbeat stops (docs/runbooks/fleet-observability.md, Fleet loops)."
              runbook_url: docs/runbooks/fleet-observability.md
      - {eval_time: 150m, alertname: FleetPoolGuardianLockedOut, exp_alerts: []}
