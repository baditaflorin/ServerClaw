# promtool unit tests for config/prometheus/rules/fleet-loops.yml (run by tests/test_fleet_loops_promtool.py when
# promtool is installed). promtool starts its clock at the Unix epoch, so a heartbeat sample whose value equals its own
# timestamp in seconds means "the loop ran just now": "0+60x99" at a 1m interval is a loop that reports every minute.
rule_files:
  - ../../config/prometheus/rules/fleet-loops.yml

evaluation_interval: 1m

tests:
  - name: a loop that reports on time raises nothing
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x180"
      - series: 'fleet_horizon_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x180"
    alert_rule_test:
      - {eval_time: 120m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - {eval_time: 120m, alertname: FleetPoolGuardianSlow, exp_alerts: []}
      - {eval_time: 120m, alertname: FleetPoolGuardianNotReporting, exp_alerts: []}
      - {eval_time: 120m, alertname: FleetHorizonSilent, exp_alerts: []}
      - {eval_time: 120m, alertname: FleetHorizonNotReporting, exp_alerts: []}

  - name: the nightly ten-minute stop of the builder raises nothing
    interval: 1m
    input_series:
      # reports every minute, then no samples for 10 minutes (CT108 stopped by its backup), then reports again
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x99 _x10 6600+60x70"
      - series: 'fleet_horizon_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x99 _x10 6600+60x70"
    alert_rule_test:
      - {eval_time: 105m, alertname: FleetPoolGuardianNotReporting, exp_alerts: []}
      - {eval_time: 112m, alertname: FleetPoolGuardianNotReporting, exp_alerts: []}
      - {eval_time: 112m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - {eval_time: 112m, alertname: FleetPoolGuardianSlow, exp_alerts: []}
      - {eval_time: 112m, alertname: FleetHorizonNotReporting, exp_alerts: []}
      - {eval_time: 150m, alertname: FleetPoolGuardianNotReporting, exp_alerts: []}

  - name: a guardian that has not finished a run warns after 45 minutes plus the wait and is critical after two hours plus the wait
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x180"
    alert_rule_test:
      - {eval_time: 40m, alertname: FleetPoolGuardianSlow, exp_alerts: []}
      - {eval_time: 60m, alertname: FleetPoolGuardianSlow, exp_alerts: []}
      - eval_time: 70m
        alertname: FleetPoolGuardianSlow
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 has not finished a run for 45 minutes"
              description: "fleet-pool-guardian.timer fires every 10 minutes, but a run takes 25-45 minutes on the loaded builder, so completions are 35-55 minutes apart. No run has FINISHED for 1h 0m 0s: `systemctl status fleet-pool-guardian.service` on the builder says `activating` with ssh children alive = a slow scan, not a dead loop. It becomes critical (FleetPoolGuardianSilent) at 2 hours."
              runbook_url: docs/runbooks/fleet-observability.md
      - {eval_time: 70m, alertname: FleetPoolGuardianSilent, exp_alerts: []}                  # an hour without a finished run was critical before: it is a warning now
      - {eval_time: 135m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - eval_time: 150m
        alertname: FleetPoolGuardianSilent
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian on b:9100 has not finished a run for 2 hours"
              description: "fleet-pool-guardian.timer fires every 10 minutes. Nothing has observed or repaired the service pools for 2h 20m 0s. On the builder check `systemctl status fleet-pool-guardian.timer fleet-pool-guardian.service` and `journalctl -u fleet-pool-guardian.service`: a scan hung on an ssh child holds the lock (flock -n) and every later timer run is skipped. If every tick says `another run holds the lock; nothing to do` instead, a deploy batch has held the pools lock for hours: that is FleetPoolGuardianLockedOut (a warning for up to 8 hours), and this alert only fires for it after 8 hours or when the lock-skip heartbeat stops (docs/runbooks/fleet-observability.md, Fleet loops)."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a slow guardian whose runs finish 55 minutes apart warns and never pages
    interval: 1m
    input_series:
      # a run completes every 55 minutes: the timestamp jumps to the current time at t=0, 55, 110, 165 and is old in between
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0x54 3300x55 6600x55 9900x30"
    alert_rule_test:
      - {eval_time: 54m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - {eval_time: 109m, alertname: FleetPoolGuardianSilent, exp_alerts: []}
      - {eval_time: 164m, alertname: FleetPoolGuardianSilent, exp_alerts: []}

  - name: a guardian that vanished from Prometheus (builder or exporter down, file unreadable) is caught by absent()
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x59"
    alert_rule_test:
      # the series goes stale five minutes after its last sample (t=59m); absent() then holds for 30 minutes
      - {eval_time: 80m, alertname: FleetPoolGuardianNotReporting, exp_alerts: []}
      - eval_time: 100m
        alertname: FleetPoolGuardianNotReporting
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops}
            exp_annotations:
              summary: "No pool guardian metrics are visible to Prometheus"
              description: "fleet_pool_guardian_last_run_timestamp_seconds has been absent for 30 minutes: the builder (CT108) or its node exporter is down, or the textfile is missing or not readable by the exporter user (it must be mode 0644; fleet-runner before v0.7.340 wrote it 0600)."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a horizon watch that missed two runs warns
    # promtool's lookback is 5 minutes, so the samples must be as dense as a real scrape: one a minute
    interval: 1m
    input_series:
      - series: 'fleet_horizon_last_run_timestamp_seconds{instance="b:9100"}'
        values: "7200x1100"
    alert_rule_test:
      - {eval_time: 12h, alertname: FleetHorizonSilent, exp_alerts: []}
      - {eval_time: 15h, alertname: FleetHorizonSilent, exp_alerts: []}
      - eval_time: 16h
        alertname: FleetHorizonSilent
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The horizon watch on b:9100 has not run for 13 hours"
              description: "fleet-horizon.timer fires every 6 hours; two runs were missed (14h 0m 0s since the last one). Nothing is watching expiring certificates, tokens, domains, RAID or backups. On the builder check `systemctl status fleet-horizon.timer fleet-horizon.service` and `journalctl -u fleet-horizon.service`."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a horizon watch that vanished from Prometheus warns after an hour, not before
    interval: 1m
    input_series:
      - series: 'fleet_horizon_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x59"
    alert_rule_test:
      - {eval_time: 100m, alertname: FleetHorizonNotReporting, exp_alerts: []}
      - eval_time: 140m
        alertname: FleetHorizonNotReporting
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops}
            exp_annotations:
              summary: "No horizon watch metrics are visible to Prometheus"
              description: "fleet_horizon_last_run_timestamp_seconds has been absent for an hour: the builder or its node exporter is down, or the textfile is missing or not readable by the exporter user (it must be mode 0644)."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: findings and states raise only when they persist
    interval: 1m
    input_series:
      - series: 'fleet_pool_guardian_findings{instance="b:9100", severity="critical"}'
        values: "0x20 1x100"
      - series: 'fleet_pool_guardian_circuits_open{instance="b:9100"}'
        values: "0x20 2x100"
      - series: 'fleet_pool_guardian_paused{instance="b:9100"}'
        values: "1x2000"
      - series: 'fleet_horizon_findings{instance="b:9100", severity="critical"}'
        values: "1x200"
      - series: 'fleet_horizon_findings{instance="b:9100", severity="warning"}'
        values: "1x200"
    alert_rule_test:
      - {eval_time: 50m, alertname: FleetPoolGuardianCriticalFinding, exp_alerts: []}
      - {eval_time: 90m, alertname: FleetPoolGuardianCriticalFinding, exp_alerts: [{exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}, exp_annotations: {summary: "A service pool has had a critical finding for an hour", description: "1 critical pool finding(s) on b:9100 for 1 hour. The guardian repairs what is safe within minutes, so a finding this old is one it cannot or may not repair (credentials, capacity, an open circuit). Run `fleet-runner pool-guardian` (without --apply) on the builder for the findings.", runbook_url: docs/runbooks/fleet-observability.md}}]}
      - {eval_time: 40m, alertname: FleetPoolGuardianCircuitOpen, exp_alerts: []}
      - eval_time: 60m
        alertname: FleetPoolGuardianCircuitOpen
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool guardian stopped repairing 2 service(s)"
              description: "The repair circuit is open for 2 service(s) on b:9100: three repairs failed within 24 hours, so the guardian leaves them alone until the hold passes. Read the failure output in /root/fleet-state/state/pool-guardian/events.jsonl."
              runbook_url: docs/runbooks/fleet-observability.md
      - {eval_time: 23h, alertname: FleetPoolGuardianPaused, exp_alerts: []}
      - {eval_time: 25h, alertname: FleetPoolGuardianPaused, exp_alerts: [{exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}, exp_annotations: {summary: "The pool guardian kill switch has been on for 24 hours", description: "Repairs are off on b:9100 (PAUSE file or FLEET_GUARDIAN_PAUSE) and have been for a day. The kill switch is meant for short interventions; remove it when the intervention is over.", runbook_url: docs/runbooks/fleet-observability.md}}]}
      - {eval_time: 30m, alertname: FleetHorizonCriticalFinding, exp_alerts: []}
      - eval_time: 90m
        alertname: FleetHorizonCriticalFinding
        exp_alerts:
          - exp_labels: {severity: critical, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The horizon watch has 1 critical finding(s)"
              description: "Something that expires or degrades slowly has crossed its critical threshold (a degraded RAID array, a disk or backup problem, an expiry inside two weeks). Run `fleet-runner horizon` on the builder for the list; the horizon verb also pages its own ntfy topic, this is the independent second path."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: runner config that stays different from git for an hour warns, a matching file and a short difference do not
    interval: 1m
    input_series:
      - series: 'fleet_runner_config_drift{instance="b:9100", file="service-pools.json"}'
        values: "1x200"
      - series: 'fleet_runner_config_drift{instance="b:9100", file="nginx-upstreams.json"}'
        values: "0x200"
      - series: 'fleet_runner_config_drift{instance="b:9100", file="builder-pool.json"}'
        values: "0x30 1x10 0x160"
    alert_rule_test:
      - {eval_time: 50m, alertname: FleetRunnerConfigDrift, exp_alerts: []}
      - eval_time: 90m
        alertname: FleetRunnerConfigDrift
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100", file: service-pools.json}
            exp_annotations:
              summary: "service-pools.json on b:9100 differs from git"
              description: "The runner config file service-pools.json on the builder has differed from master of the fleet-state repository for an hour. A standby builder is bootstrapped from git, so a promoted standby would run the old file. Run `journalctl -u runner-config-drift.service -n 60` on the builder for the diff, then open a PR that brings fleet-state in line with the live file (or restore the live file from git). A pool's weights adjusted by pool-balance are not drift while the pool has base_weights."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a drift check that cannot read the repository says so after three hours, not before
    interval: 1m
    input_series:
      - series: 'fleet_runner_config_check_ok{instance="b:9100"}'
        values: "0x300"
    alert_rule_test:
      - {eval_time: 150m, alertname: FleetRunnerConfigCheckFailing, exp_alerts: []}
      - eval_time: 200m
        alertname: FleetRunnerConfigCheckFailing
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The runner-config drift check on b:9100 cannot read the fleet-state repository"
              description: "fleet_runner_config_check_ok has been 0 for three hours: the builder cannot fetch master of the private fleet-state repository (credentials, GitHub or network), so whether the live runner config matches git is unknown. Check `journalctl -u runner-config-drift.service -n 20` and `git ls-remote https://github.com/baditaflorin/fleet-state` as root on the builder."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a drift check whose timer died is silent after three hours plus the wait, and one that vanished is caught by absent()
    interval: 1m
    input_series:
      - series: 'fleet_runner_config_check_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x330"
    alert_rule_test:
      - {eval_time: 60m, alertname: FleetRunnerConfigCheckSilent, exp_alerts: []}
      - {eval_time: 190m, alertname: FleetRunnerConfigCheckSilent, exp_alerts: []}
      - eval_time: 300m
        alertname: FleetRunnerConfigCheckSilent
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The runner-config drift check on b:9100 has not run for 3 hours"
              description: "runner-config-drift.timer fires hourly; nothing has compared the live runner config with git for 4h 50m 0s. On the builder check `systemctl status runner-config-drift.timer runner-config-drift.service`."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a drift check that vanished from Prometheus warns after an hour, not before
    interval: 1m
    input_series:
      - series: 'fleet_runner_config_check_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x59"
    alert_rule_test:
      - {eval_time: 100m, alertname: FleetRunnerConfigNotReporting, exp_alerts: []}
      - eval_time: 140m
        alertname: FleetRunnerConfigNotReporting
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops}
            exp_annotations:
              summary: "No runner-config drift metrics are visible to Prometheus"
              description: "fleet_runner_config_check_last_run_timestamp_seconds has been absent for an hour: the builder or its node exporter is down, or runner_config_drift.prom is missing or not readable by the exporter."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a pool balance loop that runs every 15 minutes raises nothing
    interval: 1m
    input_series:
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x300"
      - series: 'fleet_pool_balance_failed{instance="b:9100"}'
        values: "0x300"
    alert_rule_test:
      - {eval_time: 150m, alertname: FleetPoolBalanceSilent, exp_alerts: []}
      - {eval_time: 150m, alertname: FleetPoolBalanceNotReporting, exp_alerts: []}
      - {eval_time: 150m, alertname: FleetPoolBalanceFailed, exp_alerts: []}

  - name: a pool balance loop whose timer died is silent after an hour plus the wait
    interval: 1m
    input_series:
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x300"
    alert_rule_test:
      - {eval_time: 50m, alertname: FleetPoolBalanceSilent, exp_alerts: []}
      - {eval_time: 70m, alertname: FleetPoolBalanceSilent, exp_alerts: []}
      - eval_time: 170m
        alertname: FleetPoolBalanceSilent
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The pool balance loop on b:9100 has not run for an hour"
              description: "fleet-pool-balance.timer fires every 15 minutes; nothing has planned capacity-based routing for the service pools for 2h 40m 0s. On the builder check `systemctl status fleet-pool-balance.timer fleet-pool-balance.service` and `journalctl -u fleet-pool-balance.service -n 40`."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a pool balance loop that vanished from Prometheus warns after an hour, not before
    interval: 1m
    input_series:
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x59"
    alert_rule_test:
      - {eval_time: 100m, alertname: FleetPoolBalanceNotReporting, exp_alerts: []}
      - eval_time: 140m
        alertname: FleetPoolBalanceNotReporting
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops}
            exp_annotations:
              summary: "No pool balance metrics are visible to Prometheus"
              description: "fleet_pool_balance_last_run_timestamp_seconds has been absent for an hour: the builder or its node exporter is down, or fleet_pool_balance.prom is missing or not readable by the exporter."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a failed routing change warns only when it persists, a clean run does not
    interval: 1m
    input_series:
      - series: 'fleet_pool_balance_failed{instance="b:9100"}'
        values: "0x20 1x100"
    alert_rule_test:
      - {eval_time: 40m, alertname: FleetPoolBalanceFailed, exp_alerts: []}
      - eval_time: 90m
        alertname: FleetPoolBalanceFailed
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "A pool routing change failed or was rolled back on b:9100"
              description: "pool-balance reports 1 failed or rolled-back routing change(s) in its last run. A rollback leaves the pool as it was; a failed rollback means the gateway route for that pool must be checked by hand (`fleet-runner pool-status --only <service>`). Details are in the pool guardian's events.jsonl (balance_failed, balance_rolled_back) under /root/fleet-state/state/pool-guardian/."
              runbook_url: docs/runbooks/fleet-observability.md

  - name: a tailnet reconciler that stopped running warns after an hour plus the wait, not before
    interval: 1m
    input_series:
      - series: 'tailscale_policy_reconcile_last_run_timestamp_seconds{instance="b:9100"}'
        values: "600x180"
    alert_rule_test:
      - {eval_time: 60m, alertname: FleetTailnetReconcileSilent, exp_alerts: []}
      - {eval_time: 75m, alertname: FleetTailnetReconcileSilent, exp_alerts: []}
      - eval_time: 90m
        alertname: FleetTailnetReconcileSilent
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The tailnet policy reconciler on b:9100 has not run for an hour"
              description: "tailscale-policy-reconcile.timer fires every 15 minutes; no merged tailnet policy change has been judged or applied for 1h 20m 0s. On the builder check `systemctl status tailscale-policy-reconcile.timer tailscale-policy-reconcile.service` and `journalctl -u tailscale-policy-reconcile.service`."
              runbook_url: docs/runbooks/tailscale-metrics-grants.md

  - name: a reconciler that vanished from Prometheus is caught by absent()
    interval: 1m
    input_series:
      - series: 'tailscale_policy_reconcile_last_run_timestamp_seconds{instance="b:9100"}'
        values: "0+60x59"
    alert_rule_test:
      - {eval_time: 70m, alertname: FleetTailnetReconcileNotReporting, exp_alerts: []}
      - eval_time: 100m
        alertname: FleetTailnetReconcileNotReporting
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops}
            exp_annotations:
              summary: "No tailnet policy reconciler metrics are visible to Prometheus"
              description: "tailscale_policy_reconcile_last_run_timestamp_seconds has been absent for 30 minutes: the builder or its node exporter is down, or tailscale_policy_reconcile.prom is missing or not readable by the exporter."
              runbook_url: docs/runbooks/tailscale-metrics-grants.md

  - name: a blocked reconciler warns after an hour; an out-of-sync one that is not blocked waits two hours; a healthy one raises nothing
    interval: 1m
    input_series:
      - series: 'tailscale_policy_reconcile_in_sync{instance="blocked:9100"}'
        values: "0x240"
      - series: 'tailscale_policy_reconcile_blocked{instance="blocked:9100"}'
        values: "1x240"
      - series: 'tailscale_policy_reconcile_in_sync{instance="waiting:9100"}'
        values: "0x240"
      - series: 'tailscale_policy_reconcile_blocked{instance="waiting:9100"}'
        values: "0x240"
      - series: 'tailscale_policy_reconcile_in_sync{instance="ok:9100"}'
        values: "1x240"
      - series: 'tailscale_policy_reconcile_blocked{instance="ok:9100"}'
        values: "0x240"
    alert_rule_test:
      - {eval_time: 50m, alertname: FleetTailnetReconcileBlocked, exp_alerts: []}
      - eval_time: 70m
        alertname: FleetTailnetReconcileBlocked
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "blocked:9100"}
            exp_annotations:
              summary: "A merged tailnet policy change needs a human: the reconciler is blocked"
              description: "The reconciler will not apply what is in git: a removal, a grant outside its guard (a management port, a wildcard, more than 8 endpoints), an edit of groups/tagOwners/ssh/nodeAttrs, an installed reconciler that differs from git, or live edits that git does not have (found 2026-10-18: one live-only grant kept it blocked for four days). `scripts/tailscale-policy-ct108.sh drift` and `plan` show the difference; adopt live-only text into git first, then `apply`. The last ntfy notice names the reasons."
              runbook_url: docs/runbooks/tailscale-metrics-grants.md
      - {eval_time: 100m, alertname: FleetTailnetPolicyOutOfSync, exp_alerts: []}
      - eval_time: 130m
        alertname: FleetTailnetPolicyOutOfSync
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "waiting:9100"}          # only the one that is out of sync and NOT blocked: the blocked one has its own alert
            exp_annotations:
              summary: "The live tailnet policy has differed from git for two hours and the reconciler has not applied the difference"
              description: "An additive or text-only change is waiting (`tailscale_policy_reconcile_pending_apply`): its commit's CI is not green, the daily cap of 3 rule-changing applies is used up (text-only applies do not count), an apply failed twice for that commit, or the reconciler is paused (a PAUSE file) or in report-only mode. `journalctl -u tailscale-policy-reconcile.service` on the builder says which; `scripts/tailscale-policy-ct108.sh plan` shows the difference."
              runbook_url: docs/runbooks/tailscale-metrics-grants.md

  - name: a reconciler that cannot read git or the live policy warns after an hour
    interval: 1m
    input_series:
      - series: 'tailscale_policy_reconcile_look_ok{instance="b:9100"}'
        values: "1x30 0x200"
    alert_rule_test:
      - {eval_time: 60m, alertname: FleetTailnetReconcileCannotLook, exp_alerts: []}
      - eval_time: 120m
        alertname: FleetTailnetReconcileCannotLook
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_loops, instance: "b:9100"}
            exp_annotations:
              summary: "The tailnet policy reconciler cannot read git or the live policy"
              description: "look_ok has been 0 for an hour: the vault OAuth client for the tailnet API (`tailscale_policy_oauth_client`, read on the builder through fleet-vault), the GitHub token, the network or the policy API failed. `journalctl -u tailscale-policy-reconcile.service` on the builder names the step."
              runbook_url: docs/runbooks/tailscale-metrics-grants.md

  # The two hand applies of 2026-10-20/21 as the reconciler now reports them: the counter of live changes it did not make steps once per change. Its own applies
  # (applied_total) never move it, a counter that went back to 0 because the state file was reset is not a change, and the alert clears three hours after the step.
  - name: a live tailnet policy change the reconciler did not make warns at once, per via; its own applies and a reset counter raise nothing
    interval: 1m
    input_series:
      - series: 'tailscale_policy_reconcile_out_of_band_changes_total{instance="b:9100", via="unknown"}'
        values: "0x30 1x300"
      - series: 'tailscale_policy_reconcile_out_of_band_changes_total{instance="b:9100", via="sync_tool"}'
