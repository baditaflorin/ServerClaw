      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="drained9",target="infer-runtime"}'
        values: "10x300"
    alert_rule_test:
      - {eval_time: 60m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}
      - {eval_time: 200m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}

  - name: a frozen balancer file does not raise the share alert (the silent alerts own that case)
    interval: 5m
    input_series:
      # the last run was at minute 20 and nothing was written since: the file is older than 30 minutes from minute 50 on
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{job="node_exporter"}'
        values: "0+300x4 1200x296"
      # eight pools start to look collapsed at minute 20, exactly when the file freezes
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen0",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen0",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen1",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen1",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen2",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen2",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen3",target="infer-runtime"}'
        values: "62x4 0x296"
