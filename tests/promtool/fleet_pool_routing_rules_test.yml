        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen4",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen4",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen5",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen5",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen6",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen6",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="frozen7",target="infer-runtime"}'
        values: "62x4 0x296"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="frozen7",target="infer-runtime"}'
        values: "60x300"
    alert_rule_test:
      # 25 minutes of the condition, the file is still fresh: pending, not firing
      - {eval_time: 45m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}
      # the file went stale before the delay was over; whatever it still says does not alert
      - {eval_time: 100m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}
      - {eval_time: 300m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}

  - name: the pools that carry traffic come and go (the bulk scan ends and 120 of 133 pools stop reporting) and a healthy fleet stays quiet
