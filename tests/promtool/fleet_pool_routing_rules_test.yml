      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="drained5",target="infer-runtime"}'
        values: "10x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="drained6",target="infer-runtime"}'
