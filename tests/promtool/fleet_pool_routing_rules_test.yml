  - name: a balancer that has many proposals and applies none for two hours raises the stuck alert, in no other state
    interval: 5m
    input_series:
      # run timestamps that keep up with the clock (value = eval time in seconds): the balancer runs and writes its file
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{job="node_exporter"}'
        values: "0+300x300"
      - series: 'fleet_pool_balance_apply_enabled{job="node_exporter"}'
        values: "1x300"
      # 3 h of 200 pending proposals with nothing applied (the 2026-10-22 shape), then the restore: 40 applied per run
      - series: 'fleet_pool_balance_proposals_pending{job="node_exporter"}'
        values: "5x24 200x36 74x240"
      - series: 'fleet_pool_balance_applied{job="node_exporter"}'
        values: "0x60 40x240"
    alert_rule_test:
      # 100 min after the stuck state began (at 120 min): nothing yet
      - {eval_time: 200m, alertname: FleetPoolBalanceStuck, exp_alerts: []}
      # 120 min of the condition have passed at 240 min: it fires
      - eval_time: 250m
        alertname: FleetPoolBalanceStuck
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_pool_routing}
            exp_annotations:
              summary: "The pool balancer has 200 routing proposals and has applied none for 2 hours"
              description: "Apply is on and the balancer ran in the last 30 minutes, yet it applied nothing while more than 30 pools wait for a routing change. Usual causes: the gateway no longer matches what nginx-render renders for those pools ('a render is pending, left to whoever owns it' in /root/fleet-state/state/pool-guardian/events.jsonl, balance_skipped), a guard that refuses every pool (environment contract, cordon), or the load gate. Look at `grep balance_skipped /root/fleet-state/state/pool-guardian/events.jsonl | tail` on the builder, then run `fleet-runner nginx-render --service-pools /root/fleet-state/service-pools.json` (read-only) to see how many files differ."
              runbook_url: docs/runbooks/pool-routing-collapse.md
      # applying again (40 per run) while 74 proposals are still pending: quiet
      - {eval_time: 400m, alertname: FleetPoolBalanceStuck, exp_alerts: []}
      # the normal baseline of 5 pending never alerts
      - {eval_time: 100m, alertname: FleetPoolBalanceStuck, exp_alerts: []}

  - name: a frozen balancer file does not raise the stuck alert (the silent alerts own that case)
    interval: 5m
    input_series:
      # the last run was at minute 100 and nothing was written since: the file keeps its last values
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{job="node_exporter"}'
        values: "0+300x20 6000x280"
      - series: 'fleet_pool_balance_apply_enabled{job="node_exporter"}'
        values: "1x300"
      - series: 'fleet_pool_balance_proposals_pending{job="node_exporter"}'
        values: "200x300"
      - series: 'fleet_pool_balance_applied{job="node_exporter"}'
        values: "0x300"
    alert_rule_test:
      - {eval_time: 150m, alertname: FleetPoolBalanceStuck, exp_alerts: []}
      - {eval_time: 300m, alertname: FleetPoolBalanceStuck, exp_alerts: []}

  # FleetPoolBalanceEnvGuardHolding. fleet_pool_balance_skipped_env_contract is heavy-tailed per run: a quick batch run holds 1, a full planning run (one an hour here, the last sample
  # of the hour) holds most pools. H = a full run held 200 of 282 (71 %, the 2026-10-24/25 freeze: 66-95 %), B = 90 (32 %, the standing level while infer-runtime is pressured, measured 2026-10-26 04-05Z), L = 7 (2 %).
  - name: a guard that holds most pools in a full planning run, hour after hour, raises the alert at the sixth hour and clears three hours after the fix
    interval: 5m
    input_series:
      - series: 'fleet_pool_balance_pools{job="node_exporter"}'
        values: "282x131"
      - series: 'fleet_pool_balance_apply_enabled{job="node_exporter"}'
        values: "1x131"
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{job="node_exporter"}'
        values: "0+300x131"
      - series: 'fleet_pool_balance_skipped_env_contract{job="node_exporter"}'
        values: "1x10 200 1x10 200 1x10 200 1x10 200 1x10 200 1x10 200 1x10 200 1x10 200 1x10 7 1x10 7 1x10 7"
    alert_rule_test:
      # five hours over 40 %: not enough
      - {eval_time: 330m, alertname: FleetPoolBalanceEnvGuardHolding, exp_alerts: []}
      # the sixth hour: firing
      - eval_time: 390m
        alertname: FleetPoolBalanceEnvGuardHolding
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_pool_routing}
            exp_annotations:
              summary: "The pool balancer's environment contract guard held over 40 % of the pools in at least 6 of the last 8 hours"
              description: "In a full planning run the guard left more than 40 % of the pools where they were because the copy that would gain traffic lacks environment variable names another copy of the pool has (or the copies could not be compared). Pools that cannot be balanced keep their old traffic split, so replica load stops being rebalanced although nothing is down. Usual cause: a fleet-wide environment change staged over days (a wave) that sets a variable on some copies of a pool before the others. Find the names in the balance_skipped events on the builder (runbook), then finish the wave, or, when the variable differs by design and a copy works without it, make the guard ignore it."
              runbook_url: docs/runbooks/pool-routing-collapse.md
      # the fix lands at hour 8; hours 2 to 7 are still over 40 % at 10 h 30 min (six of the last eight): still firing
      - eval_time: 630m
        alertname: FleetPoolBalanceEnvGuardHolding
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_pool_routing}
            exp_annotations:
              summary: "The pool balancer's environment contract guard held over 40 % of the pools in at least 6 of the last 8 hours"
              description: "In a full planning run the guard left more than 40 % of the pools where they were because the copy that would gain traffic lacks environment variable names another copy of the pool has (or the copies could not be compared). Pools that cannot be balanced keep their old traffic split, so replica load stops being rebalanced although nothing is down. Usual cause: a fleet-wide environment change staged over days (a wave) that sets a variable on some copies of a pool before the others. Find the names in the balance_skipped events on the builder (runbook), then finish the wave, or, when the variable differs by design and a copy works without it, make the guard ignore it."
              runbook_url: docs/runbooks/pool-routing-collapse.md
      # at 11 h 30 min only five of the last eight hours are over 40 %: cleared
      - {eval_time: 690m, alertname: FleetPoolBalanceEnvGuardHolding, exp_alerts: []}

