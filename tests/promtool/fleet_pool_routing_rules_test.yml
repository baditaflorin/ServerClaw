# promtool unit tests for config/prometheus/rules/fleet-pool-routing.yml (run by tests/test_fleet_pool_routing_rules.py when promtool is installed).
# The series are the balancer's per-pool numbers, one sample every 5 minutes (a sparser input than the 5 minute lookback would make the selectors vanish).
rule_files:
  - ../../config/prometheus/rules/fleet-pool-routing.yml

evaluation_interval: 5m

tests:
  - name: eight pools that carry traffic and send under 5 percent of it to replicas their weights favour raise the alert after the delay, and clear when the traffic comes back
    interval: 5m
    input_series:
      # fresh balancer file for the whole run (value = eval time in seconds)
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{job="node_exporter"}'
        values: "0+300x400"
      # the eight pools: healthy for 500 min (100 samples), then the replicas get nothing for 500 min, then healthy again
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad0",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad0",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad1",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad1",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad2",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad2",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad3",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad3",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad4",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad4",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad5",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad5",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad6",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad6",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="bad7",target="infer-runtime"}'
        values: "62x100 0x100 62x200"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="bad7",target="infer-runtime"}'
        values: "60x400"
      # four healthy pools all along: measured close to configured
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="ok0",target="infer-runtime"}'
        values: "58x400"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="ok0",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="ok1",target="infer-runtime"}'
        values: "58x400"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="ok1",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="ok2",target="infer-runtime"}'
        values: "58x400"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="ok2",target="infer-runtime"}'
        values: "60x400"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="ok3",target="infer-runtime"}'
        values: "58x400"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="ok3",target="infer-runtime"}'
        values: "60x400"
    alert_rule_test:
      # healthy so far
      - {eval_time: 400m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}
      # the collapse starts at minute 505; 10 minutes later the 30 minute delay has not passed
      - {eval_time: 515m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}
      # 45 minutes into it: firing, with the number of pools in the text
      - eval_time: 550m
        alertname: FleetPoolReplicaShareCollapsed
        exp_alerts:
          - exp_labels: {severity: warning, service: fleet_pool_routing}
            exp_annotations:
              summary: "8 pools that carry traffic send under 5 % of it to their replicas although their weights give the replicas more than 30 %"
              description: "The balancer measures, per pool, the share of requests each member took over the last hour and compares it with the share its weights give it. 8 pools whose weights send more than 30 % to replicas see under 5 % arrive there. The usual cause: the gateway's vhosts no longer route through their pool upstreams (a push of nginx-render from a host without the pools file; the pool balancer then says 'a render is pending'), or the replica hosts dropped out. Restore: on the builder run `fleet-runner nginx-render --exact-filter <the pooled services> --service-pools /root/fleet-state/service-pools.json` (read-only: how many files change), then the same with --push --reload."
              runbook_url: docs/runbooks/pool-routing-collapse.md
      # the traffic is back on the replicas from minute 1005: cleared
      - {eval_time: 1030m, alertname: FleetPoolReplicaShareCollapsed, exp_alerts: []}

  - name: five pools, a drained replica and healthy pools stay quiet
    interval: 5m
    input_series:
      - series: 'fleet_pool_balance_last_run_timestamp_seconds{job="node_exporter"}'
        values: "0+300x300"
      # five pools with a zero measured share is the normal worst case (the alert needs more than five): quiet
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="few0",target="infer-runtime"}'
        values: "0x300"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="few0",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="few1",target="infer-runtime"}'
        values: "0x300"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="few1",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="few2",target="infer-runtime"}'
        values: "0x300"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="few2",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="few3",target="infer-runtime"}'
        values: "0x300"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="few3",target="infer-runtime"}'
        values: "60x300"
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="few4",target="infer-runtime"}'
        values: "0x300"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="few4",target="infer-runtime"}'
        values: "60x300"
      # ten pools whose replica is drained (configured 10 %, under the 30 % line): quiet
      - series: 'fleet_pool_balance_member_measured_share_pct{job="node_exporter",service="drained0",target="infer-runtime"}'
        values: "0x300"
      - series: 'fleet_pool_balance_member_configured_share_pct{job="node_exporter",service="drained0",target="infer-runtime"}'
