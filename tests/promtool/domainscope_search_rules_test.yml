# promtool unit tests for config/prometheus/rules/domainscope-search.yml (run by tests/test_domainscope_search_probe.py when promtool is
# installed; on the monitoring VM: promtool test rules tests/promtool/domainscope_search_rules_test.yml from the repo root).
# The textfile written by the probe keeps its last values between runs, so the series are step functions: a run ends every 15 minutes
# and "900x14" is the timestamp 900 (the run that ended at minute 15) held for 15 one-minute samples. promtool's clock starts at the Unix
# epoch, so a timestamp equal to the minute*60 is "this run just ended". "_" is a missing sample (the builder is stopped).
rule_files:
- ../../config/prometheus/rules/domainscope-search.yml
evaluation_interval: 1m
tests:
- name: a probe that passes every 15 minutes raises nothing
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x480
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 1800x14 2700x14 3600x14 4500x14 5400x14 6300x14 7200x14 8100x14 9000x14 9900x14 10800x14 11700x14 12600x14 13500x14 14400x14 15300x14 16200x14 17100x14 18000x14 18900x14 19800x14
      20700x14 21600x14 22500x14 23400x14 24300x14 25200x14 26100x14 27000x14 27900x14 28800x14
  alert_rule_test:
  - eval_time: 4h
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 4h
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 8h
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 8h
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
- name: two failed runs in a row alert about 25 minutes after the first one and resolve with the next good run
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x14 0x29 1x60
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 1800x14 2700x60
  alert_rule_test:
  - eval_time: 16m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 33m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 40m
    alertname: DomainScopeSearchBroken
    exp_alerts:
    - exp_labels:
        severity: warning
        service: domainscope
        instance: 100.114.37.21:9100
        job: node_exporter
        target: https://domainscope.scrapetheworld.org
      exp_annotations:
        summary: DomainScope production search is failing its golden queries (https://domainscope.scrapetheworld.org)
        description: 'Two search probe runs in a row failed against https://domainscope.scrapetheworld.org: a golden query errored (HTTP 5xx, 429, timeout), returned fewer rows than its minimum or answered
          catalog_matches_not_searchable, or the probe itself could not run. The [FAIL] lines are in `journalctl -u domainscope-search-probe.service -n 80` on the builder (CT108); run the probe by hand
          with `scripts/search-probe.sh --all --markets 20` from the DomainScope repository. Rows gated known-failing never fail it.'
        runbook_url: docs/runbooks/domainscope-search-probe.md
  - eval_time: 50m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 40m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
- name: one failed run between good ones does not alert
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x14 0x14 1x60
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 1800x60
  alert_rule_test:
  - eval_time: 25m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 31m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 40m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
- name: failures that alternate with good runs do not alert
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x14 0x14 1x14 0x14 1x30
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 1800x14 2700x14 3600x30
  alert_rule_test:
  - eval_time: 35m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 50m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 65m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
- name: one failed run and then the builder stops (nightly backup) is not two failed runs
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x14 0x14 _x60
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 _x60
  alert_rule_test:
  - eval_time: 30m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 40m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
  - eval_time: 60m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
- name: the nightly backup stop of the builder (70 minutes without the series) raises nothing
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x89 _x69 1x60
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 1800x14 2700x14 3600x14 4500x14 _x69 9600x14 10500x45
  alert_rule_test:
  - eval_time: 100m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 159m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 170m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 170m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
- name: a probe whose runs stop (the exporter still serves the old file) is stale after 3 hours
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x530
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 1800x500
  alert_rule_test:
  - eval_time: 200m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 215m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 225m
    alertname: DomainScopeSearchProbeStale
    exp_alerts:
    - exp_labels: &id001
        severity: warning
        service: domainscope
      exp_annotations:
        summary: The DomainScope search probe has not finished a run for 3 hours
        description: 'Nothing has checked production DomainScope search for 3 hours (the nightly backup stop of the builder is about an hour): domainscope-search-probe.timer on CT108 stopped, the run fails
          before it writes metrics (a failed fetch with no earlier probe), or the builder or its node exporter is down. On the builder: `systemctl status domainscope-search-probe.timer domainscope-search-probe.service`,
          `journalctl -u domainscope-search-probe.service -n 40`; from the repository `scripts/domainscope-search-probe-install.sh --status`.'
        runbook_url: docs/runbooks/domainscope-search-probe.md
  - eval_time: 225m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
- name: a builder that stays down is stale after 3 hours and stays stale once the series is gone for 6 hours
  interval: 1m
  input_series:
  - series: domainscope_search_probe_success{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 1x29 _x500
  - series: domainscope_search_probe_last_run_timestamp_seconds{instance="100.114.37.21:9100",job="node_exporter",target="https://domainscope.scrapetheworld.org"}
    values: 0x14 900x14 _x500
  alert_rule_test:
  - eval_time: 190m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 210m
    alertname: DomainScopeSearchProbeStale
    exp_alerts:
    - exp_labels: *id001
      exp_annotations:
        summary: The DomainScope search probe has not finished a run for 3 hours
        description: 'Nothing has checked production DomainScope search for 3 hours (the nightly backup stop of the builder is about an hour): domainscope-search-probe.timer on CT108 stopped, the run fails
          before it writes metrics (a failed fetch with no earlier probe), or the builder or its node exporter is down. On the builder: `systemctl status domainscope-search-probe.timer domainscope-search-probe.service`,
          `journalctl -u domainscope-search-probe.service -n 40`; from the repository `scripts/domainscope-search-probe-install.sh --status`.'
        runbook_url: docs/runbooks/domainscope-search-probe.md
  - eval_time: 400m
    alertname: DomainScopeSearchProbeStale
    exp_alerts:
    - exp_labels: *id001
      exp_annotations:
        summary: The DomainScope search probe has not finished a run for 3 hours
        description: 'Nothing has checked production DomainScope search for 3 hours (the nightly backup stop of the builder is about an hour): domainscope-search-probe.timer on CT108 stopped, the run fails
          before it writes metrics (a failed fetch with no earlier probe), or the builder or its node exporter is down. On the builder: `systemctl status domainscope-search-probe.timer domainscope-search-probe.service`,
          `journalctl -u domainscope-search-probe.service -n 40`; from the repository `scripts/domainscope-search-probe-install.sh --status`.'
        runbook_url: docs/runbooks/domainscope-search-probe.md
  - eval_time: 500m
    alertname: DomainScopeSearchProbeStale
    exp_alerts:
    - exp_labels: *id001
      exp_annotations:
        summary: The DomainScope search probe has not finished a run for 3 hours
        description: 'Nothing has checked production DomainScope search for 3 hours (the nightly backup stop of the builder is about an hour): domainscope-search-probe.timer on CT108 stopped, the run fails
          before it writes metrics (a failed fetch with no earlier probe), or the builder or its node exporter is down. On the builder: `systemctl status domainscope-search-probe.timer domainscope-search-probe.service`,
          `journalctl -u domainscope-search-probe.service -n 40`; from the repository `scripts/domainscope-search-probe-install.sh --status`.'
        runbook_url: docs/runbooks/domainscope-search-probe.md
- name: a probe that never reported is stale after 10 minutes (deploy the rules after the first run)
  interval: 1m
  input_series:
  - series: up{job="node_exporter"}
    values: 1x60
  alert_rule_test:
  - eval_time: 5m
    alertname: DomainScopeSearchProbeStale
    exp_alerts: []
  - eval_time: 15m
    alertname: DomainScopeSearchProbeStale
    exp_alerts:
    - exp_labels: *id001
      exp_annotations:
        summary: The DomainScope search probe has not finished a run for 3 hours
        description: 'Nothing has checked production DomainScope search for 3 hours (the nightly backup stop of the builder is about an hour): domainscope-search-probe.timer on CT108 stopped, the run fails
          before it writes metrics (a failed fetch with no earlier probe), or the builder or its node exporter is down. On the builder: `systemctl status domainscope-search-probe.timer domainscope-search-probe.service`,
          `journalctl -u domainscope-search-probe.service -n 40`; from the repository `scripts/domainscope-search-probe-install.sh --status`.'
        runbook_url: docs/runbooks/domainscope-search-probe.md
  - eval_time: 15m
    alertname: DomainScopeSearchBroken
    exp_alerts: []
