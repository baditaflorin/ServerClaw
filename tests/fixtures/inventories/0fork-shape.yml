# 0fork-shape — fixture identity overlay (ADR 0444 item 12)
#
# Mirrors the example.org fork deployment shape. First DNS label is `0fork`,
# which forces the platform_identity flavors to diverge:
#
#   config_prefix = "0fork"   (DNS-label shape, no restrictions)
#   sql_prefix    = "fork"    (PostgreSQL: leading [a-z_], digit stripped)
#   pve_prefix    = "fork"    (Proxmox VE: leading [A-Za-z], digit stripped)
#   unix_prefix   = "fork"    (POSIX user: leading [a-z_], digit stripped)
#   dns_label     = "0fork"   (RFC 1123 label, today == config_prefix)
#
# Use this fixture to exercise every flavor's transformation path. A role
# that hardcodes `lv3_*` rather than `{{ platform_identity.sql_prefix }}_*`
# will pass against lv3-shape but fail here — that's the value.
#
# This file is publishable — uses 0fork.example.invalid rather than the real
# example.org domain so the fixture can stay in-repo without leaking deployment
# detail. See tests/fixtures/inventories/README.md for the full contract.

platform_domain: 0fork.example.invalid
platform_operator_email: operator@0fork.example.invalid
platform_operator_name: "0fork Test Operator"
