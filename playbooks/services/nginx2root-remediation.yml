# Purpose: Apply NGINX package and SCTP kernel mitigations to managed NGINX-bearing hosts.
# Use case: Run after identifying NGINX hosts and confirming SCTP is unused.
# Inputs: Production or staging inventory selected by the env variable.
# Outputs: Fixed system NGINX on the edge and persistent SCTP module blocks on managed NGINX hosts.
# Idempotency: Yes; service restarts only when the NGINX package or module config changes.
# Dependencies: ADR 0498, NGINX.org signing key, and SCTP-free hosts.
---
- name: Contain the SCTP kernel escalation path on managed NGINX hosts
  hosts: "{{ 'nginx-staging' if env | default('production') == 'staging' else 'nginx:docker-runtime:runtime-control:coolify' }}"
  become: true
  gather_facts: true
  roles:
    - role: lv3.platform.nginx2root_kernel_mitigation

- name: Install fixed NGINX on the managed system edge
  hosts: "{{ 'nginx-staging' if env | default('production') == 'staging' else 'nginx' }}"
  become: true
  gather_facts: true
  roles:
    - role: lv3.platform.nginx_org_security_package
  post_tasks:
    - name: Restart NGINX after the validated package change
      ansible.builtin.meta: flush_handlers

    - name: Verify the NGINX system service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - nginx
      register: nginx2root_service_status
      changed_when: false
      failed_when: nginx2root_service_status.stdout | trim != 'active'
