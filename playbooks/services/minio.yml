---
# Playbook: services/minio.yml
# Purpose: Provide the canonical service-scoped entrypoint for the ADR 0274 MinIO live apply.
# Use case: Used by shared live-apply and service-scoped automation paths that target only MinIO.
#
# Inputs (required):
#   - None.
#
# Inputs (optional):
#   - None.
#
# Outputs:
#   - Imports the top-level MinIO playbook without redefining service scope.
#
# Idempotency: Fully idempotent
#              This file only re-exports the canonical playbook entrypoint.
#
# Dependencies:
#   - ADR 0274: Owns the MinIO runtime and public publication contract.
#   - Requires: playbooks/minio.yml.
#   - Role: import_playbook - delegates execution to the canonical playbook.
#
# Related ADRs: 0165, 0274
# Related Runbooks: docs/runbooks/minio-object-storage.md
#
# Author: LV3 Platform
# Last Updated: 2026-03-30
- import_playbook: ../minio.yml
  vars:
    service_audit_name: minio
    service_runtime_roles:
      - lv3.platform.linux_guest_firewall
      - lv3.platform.docker_runtime
      - lv3.platform.minio_runtime
    service_needs_dns: false
    service_needs_postgres: false
    service_needs_nginx_edge: true
    minio_site_dir: /opt/minio
    minio_data_dir: /opt/minio/data
    minio_secret_dir: "/etc/{{ platform_identity.unix_prefix }}/minio"
    minio_local_artifact_dir: "{{ repo_shared_local_root }}/minio"
    minio_compose_file: "{{ minio_site_dir }}/docker-compose.yml"
    minio_env_file: "{{ minio_site_dir }}/minio.env"
    minio_openbao_agent_dir: "{{ minio_site_dir }}/openbao-agent"
    minio_openbao_secret_path: minio/data/root
    minio_openbao_policy_name: minio-runtime
    minio_openbao_approle_name: minio-runtime
    minio_container_name: minio
