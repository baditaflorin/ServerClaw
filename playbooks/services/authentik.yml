---
# Playbook: services/authentik.yml
# Purpose: Provide the stable live-apply service wrapper for Authentik.
# Use case: Run `make live-apply-service service=authentik` so the generic
#   service lane can invoke the Authentik converge playbook.
#
# Inputs (required):
#   - env (str, required): Environment selector passed by the live-apply wrapper.
#
# Inputs (optional):
#   - proxmox_guest_ssh_connection_mode (str, optional, default=proxmox_host_jump)
#
# Outputs:
#   - Imports the canonical Authentik converge playbook.
#
# Idempotency: Fully idempotent
#              The wrapper only imports the canonical playbook and adds no extra mutation.
#
# Dependencies:
#   - ADR 0491: Authentik is the shared identity plane.
#   - Requires: playbooks/authentik.yml
#
# Related ADRs: 0077, 0078, 0491
# Related Runbooks: docs/runbooks/configure-authentik.md
#
# Author: LV3 Platform
# Last Updated: 2026-08-27

- import_playbook: ../authentik.yml
