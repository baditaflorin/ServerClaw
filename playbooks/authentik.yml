---
# Playbook: authentik.yml
# Purpose: Converge DNS publication, runtime state, and edge publication for the
#   repo-managed Authentik SSO broker (ADR 0491, replacing Keycloak).
# Use case: Run during initial Authentik deployment or recovery when the
#   identity broker must match repo truth. Deliberately parallel to Keycloak
#   (id.example.org, not sso.example.org) during the Phase 1-2 migration window.
#
# Inputs (required):
#   - env (string, required): Target environment selector used to choose the
#     runtime-control and nginx guests.
#
# Inputs (optional):
#   - proxmox_guest_ssh_connection_mode (string, optional, default=proxmox_host_jump)
#
# Outputs:
#   - Authentik DNS records, self-contained Postgres/Redis stack, runtime
#     configuration, and edge publication are reconciled to the declared
#     platform state.
#
# Idempotency: Fully idempotent
#
# Dependencies:
#   - ADR 0491: Authentik replaces Keycloak as the shared identity plane.
#   - Requires: runtime-control and the shared edge stack to already exist.
#   - Role: lv3.platform.authentik_runtime - converges the application runtime
#     (self-contained Postgres + Redis, no shared-fleet-postgres dependency
#     unlike Keycloak).
#
# Related ADRs: 0056, 0077, 0078, 0491
# Related Runbooks: docs/runbooks/configure-authentik.md
#
# Author: LV3 Platform
# Last Updated: 2026-08-27

- import_playbook: _includes/dns_publication.yml
  vars:
    service_dns_fqdn: id.{{ platform_domain }}

- name: Converge Authentik on the runtime-control VM
  hosts: "{{ 'docker-runtime-staging' if (env | default('production')) == 'staging' else 'runtime-control' }}"
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/vars/authentik.yml"

  pre_tasks:
    - name: Run shared preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
      vars:
        playbook_execution_require_debian: true
        playbook_execution_audit_action: playbook.start.authentik
        playbook_execution_audit_target: authentik
        required_hosts:
          - "{{ playbook_execution_required_hosts.runtime_control[playbook_execution_env] }}"

  roles:
    - role: lv3.platform.docker_runtime
    - role: lv3.platform.authentik_runtime

- name: Publish Authentik through the NGINX edge
  hosts: "{{ 'nginx-staging' if (env | default('production')) == 'staging' else 'nginx' }}"
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/platform.yml"

  pre_tasks:
    - name: Run shared preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
      vars:
        playbook_execution_require_debian: true
        playbook_execution_emit_audit: false
        required_hosts:
          - "{{ playbook_execution_required_hosts.nginx_edge[playbook_execution_env] }}"

  roles:
    - role: lv3.platform.nginx_edge_publication
