---
- name: Converge Planka on the Docker runtime VM
  hosts: docker-runtime
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/vars/planka.yml"
  vars:
    preflight_wait_for_connection: false
  tags: [tier-2, service-planka]
  pre_tasks:
    - ansible.builtin.assert:
        that: ansible_distribution == "Debian"
        fail_msg: "Debian required."
  roles:
    - role: lv3.platform.linux_guest_firewall
    - role: lv3.platform.docker_runtime
    - role: lv3.platform.planka_runtime

- name: Publish Planka on the shared NGINX edge
  hosts: nginx
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/platform.yml"
  vars:
    preflight_wait_for_connection: false
    public_edge_sync_generated_static_dirs: false
  tags: [tier-1, service-planka]
  roles:
    - role: lv3.platform.linux_guest_firewall
    - role: lv3.platform.nginx_edge_publication
