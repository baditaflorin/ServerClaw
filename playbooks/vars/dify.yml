---
service_audit_name: dify
service_dns_fqdn: agents.{{ platform_domain }}
service_postgres_role: lv3.platform.dify_postgres
service_runtime_roles:
  - lv3.platform.docker_runtime
  - lv3.platform.dify_runtime
service_needs_dns: true
service_needs_postgres: true
service_needs_nginx_edge: true
playbook_execution_health_probe_overrides:
  dify:
    startup:
      url: "http://{{ ansible_host }}:{{ platform_service_registry.dify.internal_port }}/console/api/setup"
    liveness:
      url: "http://{{ ansible_host }}:{{ platform_service_registry.dify.internal_port }}/healthz"
    readiness:
      url: "http://{{ ansible_host }}:{{ platform_service_registry.dify.internal_port }}/console/api/setup"
