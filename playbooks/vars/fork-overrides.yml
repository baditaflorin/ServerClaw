---
# Purpose: Aggregate the common extra-vars needed to run LV3 playbooks against
# a forked deployment (ADR 0424) where certain LV3-specific features are
# intentionally disabled and the collapsed topology uses a remote OpenBao.
#
# Use case: Included via `-e @playbooks/vars/fork-overrides.yml` to avoid
# repeating the same 6-flag --extra-vars JSON on every converge. Individual
# flags can still be overridden by a later -e on the command line.
#
# Inputs: None.
#
# Outputs: Override variables consumed by the keycloak, mail-platform, and
# openbao-agent-sidecar paths.
#
# Idempotency: N/A for vars file because it only declares variables.
#
# Dependencies:
#   - ADR 0407 (generic-by-default / .local overlay)
#   - ADR 0424 (0fork clone topology)
#   - ADR 0430 (topology host_vars overlay)

# --- Public edge ---
# Forks typically run behind a single shared nginx and skip the per-service
# edge-publication play. Individual services that DO want public edge can
# override by passing -e service_needs_nginx_edge=true after this file.
service_needs_nginx_edge: false

# --- Identity (ADR 0407) ---
# Real deployment domain normally lives in .local/identity.yml, which
# worktrees do not ship. Fork deploys set it explicitly.
# Override on the CLI for non-0fork forks: -e platform_domain=<your-domain>.
platform_domain: 0fork.com

# --- Keycloak reconciliation flags ---
# Mail-platform submission recovery runs an SSO-authenticated smoke test
# against the live edge. It is optional and frequently fails on fresh
# forks whose TLS / oauth2-proxy are not yet warmed up.
keycloak_mail_platform_submission_recovery_enabled: false

# GlitchTip: the keycloak_runtime role reads its OAuth client secret but
# has no matching create task. Forks that do not run GlitchTip must set
# this to false to skip the 24-retry 404 loop (see ADR 0435 notes + the
# gated read/mirror tasks in keycloak_runtime/tasks/main.yml).
keycloak_glitchtip_enabled: false

# --- OpenBao sidecar ---
# ADR 0424 §2 collapses openbao onto runtime-control for the fork. Other
# docker-runtime roles that ship an openbao-agent sidecar (minio, gitea,
# directus, etc.) must be told NOT to start a local OpenBao and to speak
# to the remote one instead.
# ADR 0438 Phase 5 (partial): common_openbao_compose_env_openbao_address is now a group_var
# derived from platform_service_topology.openbao.private_ip — no hardcoded IP needed here.
common_openbao_compose_env_manage_local_openbao_runtime: false
# Fork topology separates OpenBao (runtime-control) from the service VMs that need it
# (e.g. docker-runtime for minio, docker-build for gitea-runner). The plain HTTP loopback
# port (8201) is not reachable cross-VM. Solution: delegate all OpenBao API calls to
# runtime-control itself, where http://127.0.0.1:8201 resolves to the running OpenBao.
common_openbao_compose_env_api_host: runtime-control
# Same delegation for the host-native (systemd credentials) OpenBao path used by
# roles like gitea_runner for Renovate credential bundles on docker-build.
common_openbao_systemd_credentials_manage_local_openbao_runtime: false
common_openbao_systemd_credentials_api_host: runtime-control

# --- OpenBao local artifact isolation ---
# ADR 0438 Phase 4: individual path overrides removed — role defaults now use
# {{ openbao_local_artifact_dir }}/... resolved lazily at task time (not baked
# by the shard generator). Only the base directory needs a fork-specific override.
# Adjust the "0fork" component for non-0fork forks.
openbao_local_artifact_dir: "{{ repo_shared_local_root }}/0fork/openbao"

# --- OpenBao legacy restore ---
# The legacy migration path (openbao_runtime/tasks/main.yml) tries to reach
# the old docker-runtime VM (10.10.10.20) to pull a raft snapshot.  Fork
# deployments start fresh — there is no pre-existing OpenBao on docker-runtime
# to migrate from.  Disabling this path prevents the role from delegating to a
# non-existent host and timing-out with connection-refused.
openbao_legacy_restore_enabled: false

# --- OpenBao PostgreSQL backend ---
# openbao_postgres_host resolves from hostvars[...postgres_ha.initial_primary].ansible_host,
# which is 10.10.10.60 in the production inventory.  The fork's postgres VM
# was re-addressed to 10.10.10.50 during bootstrap network reconfiguration.
# Without this override OpenBao cannot verify its DB connection and returns HTTP 400.
openbao_postgres_host: 10.10.10.50

# --- OpenBao TLS certificate duration ---
# The step-ca services provisioner has no explicit claims overrides, so the
# default max TLS cert duration is 24h. The role default (72h) exceeds this.
# Override to 24h so cert issuance succeeds; use 23h renewal threshold so
# openbao converge renews with at least 1h left on the cert.
# TODO: fix the step-ca role to add --x509-max-dur to provisioner creation
# so longer durations are supported without fork-specific overrides.
openbao_tls_certificate_not_after: 24h
openbao_tls_cert_renew_before_seconds: 3600

# --- Loki / MinIO ---
# Production Loki uses MinIO (10.10.10.20:9010) as its S3 chunk backend.
# Fork deployments do not ship a MinIO VM, so the S3 schema cutover is
# pushed far into the future and the compactor delete-request store is
# switched to filesystem. Without these overrides Loki crash-loops on
# startup trying to reach the non-existent MinIO endpoint.
# (Root cause documented in postmortem 2026-04-23-loki-minio-missing-fork.md)
monitoring_loki_minio_schema_cutover_date: "2099-01-01"
monitoring_loki_delete_request_store: filesystem

# --- Monitoring public-edge verify ---
# Public-edge verify tasks hit https://grafana.<domain>/ from the controller.
# They require nginx-edge to be converged first. Skip until nginx is up.
monitoring_verify_public_edge: false

# --- MinIO public-edge verify ---
# MinIO verify tasks hit https://minio.<domain>/ from the controller.
# Requires nginx-edge publication and a resolvable public domain.
# Skip on fork deployments where service_needs_nginx_edge=false.
minio_verify_public_edge: false

# --- nginx-edge Let's Encrypt certificate ---
# Fork bootstrap runs before DNS is fully wired and before platform.yml is
# regenerated with 0fork.com values — the committed platform.yml carries
# sanitised example.com hostnames which Let's Encrypt rejects. Skip certbot
# on fresh fork deployments; run nginx_edge_publication manually once DNS
# A-records are live and platform.yml has been regenerated for the fork.
public_edge_skip_certbot: true
