---
- name: Recover the existing public-edge OIDC proxy without changing credentials
  hosts: "{{ 'nginx-lv3-staging' if (env | default('production')) == 'staging' else 'nginx-lv3' }}"
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/platform.yml"
  tags:
    - public-edge-oidc-recovery
  tasks:
    - name: Run credential-preserving edge OIDC recovery tasks
      ansible.builtin.include_role:
        name: lv3.platform.public_edge_oidc_auth
        tasks_from: recover_existing_proxy.yml
        apply:
          tags:
            - public-edge-oidc-recovery
      tags:
        - public-edge-oidc-recovery

- name: Configure public publication on the NGINX edge VM
  hosts: "{{ 'nginx-staging' if (env | default('production')) == 'staging' else 'nginx' }}"
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/platform.yml"
  tags:
    - tier-1
    - access
    - service-public-edge

  roles:
    - role: lv3.platform.linux_guest_firewall
      tags:
        - public-edge-firewall
    - role: lv3.platform.public_edge_oidc_auth
      tags:
        - public-edge-oidc-auth
    - role: lv3.platform.nginx_edge_publication
      tags:
        - public-edge-nginx
