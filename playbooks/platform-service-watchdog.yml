---
# Playbook: platform-service-watchdog.yml
# Purpose: Deploy the platform-wide service health watchdog to all application VMs (ADR 0421).
# Use case: Run to install or update the systemd timers that probe Docker Compose services
#   every 30 seconds and auto-restart them on consecutive health failures.
#
# Inputs (required):
#   - env (string, required): Target environment selector (production or staging).
#
# Inputs (optional):
#   - Use --tags <vm-name> to restrict deployment to a single VM:
#       ansible-playbook ... --tags runtime-control
#       ansible-playbook ... --tags docker-runtime
#     Omit --tags to deploy to all VMs.
#
# Outputs:
#   - systemd timer lv3-<vm>-watchdog.timer active on each target VM.
#   - Status file /var/lib/lv3-<vm>-watchdog/status.json updated every probe cycle.
#
# Idempotency: Fully idempotent.
#
# Dependencies:
#   - ADR 0421: Platform-wide service watchdog.
#   - ADR 0376: Identity core watchdog (predecessor, runtime-control only).
#   - Requires: target VMs provisioned and reachable via Ansible.
#   - Role: lv3.platform.platform_service_watchdog
#
# Related ADRs: 0421, 0376, 0064, 0123, 0226
#
# Author: LV3 Platform
# Last Updated: 2026-04-21

# ---------------------------------------------------------------------------
# runtime-control (P0 — identity-critical + app services)
# Extends ADR 0376: adds non-identity services to the existing watchdog
# ---------------------------------------------------------------------------
- name: Deploy service watchdog on runtime-control
  hosts: "{{ 'docker-runtime-staging' if (env | default('production')) == 'staging' else 'runtime-control' }}"
  become: true
  gather_facts: true
  tags:
    - platform-service-watchdog
    - watchdog
    - runtime-control

  pre_tasks:
    - name: Run shared preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
      vars:
        playbook_execution_require_debian: true
        playbook_execution_audit_action: playbook.start.platform-service-watchdog
        playbook_execution_audit_target: platform_service_watchdog
        required_hosts:
          - "{{ playbook_execution_required_hosts.runtime_control[playbook_execution_env] }}"

  roles:
    - role: lv3.platform.platform_service_watchdog
      vars:
        service_watchdog_name: runtime-control
        service_watchdog_ntfy_topic: platform-service-watchdog-runtime-control
        service_watchdog_services:
          # Identity-core (P0 — also covered by identity_core_watchdog for redundancy)
          - name: authentik
            compose_dir: /opt/authentik
            compose_service: authentik
            health_url: "http://127.0.0.1:9010/-/health/ready/"
            expected_status: "200"
          - name: step-ca
            compose_dir: /opt/step-ca
            compose_service: step-ca
            health_url: "https://127.0.0.1:9000/health"
            health_method: "-k"
            expected_status: "200"
          - name: openbao
            compose_dir: /opt/openbao
            compose_service: openbao
            health_url: "http://127.0.0.1:8201/v1/sys/seal-status"
            expected_status: "200"
            exclude_from_auto_restart: true   # unsealing requires operator key shares
          - name: api-gateway
            compose_dir: /opt/api-gateway
            compose_service: api-gateway
            health_url: "http://127.0.0.1:8083/healthz"
            expected_status: "200"
          # App services on runtime-control
          - name: gitea
            compose_dir: /opt/gitea
            compose_service: gitea
            health_url: "http://127.0.0.1:3003/api/healthz"
            expected_status: "200"
          - name: harbor
            compose_dir: /opt/harbor/installer/harbor
            compose_service: ""
            restart_args: "up -d"
            health_url: "http://127.0.0.1:8095/api/v2.0/ping"
            expected_status: "200"
          - name: mail-platform
            compose_dir: /opt/mail-platform
            compose_service: stalwart
            health_url: "http://127.0.0.1:8081/healthz"
            expected_status: "200"
          - name: openfga
            compose_dir: /opt/openfga
            compose_service: openfga
            health_url: "http://127.0.0.1:8098/healthz"
            expected_status: "200"
          - name: semaphore
            compose_dir: /opt/semaphore
            compose_service: semaphore
            health_url: "http://127.0.0.1:3004/api/ping"
            expected_status: "200"
          - name: temporal
            compose_dir: /opt/temporal
            compose_service: temporal
            health_url: "http://127.0.0.1:8099"
            expected_status: "200"
          - name: windmill
            compose_dir: /opt/windmill
            compose_service: windmill_server
            health_url: "http://127.0.0.1:8000/api/version"
            expected_status: "200"

  post_tasks:
    - name: Verify runtime-control service watchdog
      ansible.builtin.include_role:
        name: lv3.platform.platform_service_watchdog
        tasks_from: verify.yml
      vars:
        service_watchdog_name: runtime-control
        service_watchdog_timer_name: lv3-runtime-control-watchdog.timer
        service_watchdog_service_name: lv3-runtime-control-watchdog.service
        service_watchdog_status_file: /var/lib/lv3-runtime-control-watchdog/status.json
        service_watchdog_probe_interval_sec: 30

    - name: Run shared completion notifications
      ansible.builtin.import_tasks: tasks/notify.yml
      vars:
        playbook_execution_notification_service: platform_service_watchdog

# ---------------------------------------------------------------------------
# docker-runtime (P1 — highest density application VM)
# ---------------------------------------------------------------------------
- name: Deploy service watchdog on docker-runtime
  hosts: "{{ 'docker-runtime-staging' if (env | default('production')) == 'staging' else 'docker-runtime' }}"
  become: true
  gather_facts: true
  tags:
    - platform-service-watchdog
    - watchdog
    - docker-runtime

  pre_tasks:
    - name: Run shared preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
      vars:
        playbook_execution_require_debian: true
        playbook_execution_audit_action: playbook.start.platform-service-watchdog
        playbook_execution_audit_target: platform_service_watchdog
        required_hosts:
          - "{{ playbook_execution_required_hosts.docker_runtime[playbook_execution_env] }}"

  roles:
    - role: lv3.platform.platform_service_watchdog
      vars:
        service_watchdog_name: docker-runtime
        service_watchdog_ntfy_topic: platform-service-watchdog-docker-runtime
        # Only list apps that are actually deployed under /opt/<app> on docker-runtime.
        # directus, nextcloud, superset, matrix-synapse, paperless, grist, langfuse, n8n,
        # flagsmith, label-studio and repowise were never deployed here (removed 2026-10-12);
        # changedetection, crawl4ai, lago, litellm, mattermost, netbox, ollama, piper, searxng
        # and typesense have no /opt/<app> and no container on docker-runtime (removed 2026-10-12).
        service_watchdog_services:
          - name: browser-runner
            compose_dir: /opt/browser-runner
            compose_service: browser-runner
            health_url: "http://127.0.0.1:8096/healthz"
            expected_status: "200"
          - name: dify
            compose_dir: /opt/dify
            compose_service: api
            health_url: "http://127.0.0.1:8094/healthz"
            expected_status: "200"
          - name: dozzle
            compose_dir: /opt/dozzle
            compose_service: dozzle
            health_url: "http://127.0.0.1:8089/healthcheck"
            expected_status: "200"
          - name: glitchtip
            compose_dir: /opt/glitchtip
            compose_service: web
            health_url: "http://127.0.0.1:3005/api/0/internal/health/"
            expected_status: "200"
          - name: minio
            compose_dir: /opt/minio
            compose_service: minio
            health_url: "http://127.0.0.1:9010/minio/health/live"
            expected_status: "200"
          - name: ntfy
            compose_dir: /opt/ntfy
            compose_service: ntfy
            health_url: "http://127.0.0.1:2586/v1/health"
            expected_status: "200"
          - name: ops-portal
            compose_dir: /opt/ops-portal
            compose_service: ops-portal
            health_url: "http://127.0.0.1:8092/health"
            expected_status: "200"
          - name: outline
            compose_dir: /opt/outline
            compose_service: outline
            health_url: "http://127.0.0.1:3006/_health"
            expected_status: "200"
          - name: plane
            compose_dir: /opt/plane
            compose_service: web
            health_url: "http://127.0.0.1:8093/"
            expected_status: "200"
          - name: plausible
            compose_dir: /opt/plausible
            compose_service: plausible
            health_url: "http://127.0.0.1:8016/api/system/health/live"
            expected_status: "200"
          - name: repo-intake
            compose_dir: /opt/repo-intake
            compose_service: repo-intake
            health_url: "http://127.0.0.1:8101/health"
            expected_status: "200"
          - name: woodpecker
            compose_dir: /opt/woodpecker
            compose_service: woodpecker-server
            health_url: "http://127.0.0.1:8102/healthz"
            expected_status: "204"

  post_tasks:
    - name: Verify docker-runtime service watchdog
      ansible.builtin.include_role:
        name: lv3.platform.platform_service_watchdog
        tasks_from: verify.yml
      vars:
        service_watchdog_name: docker-runtime
        service_watchdog_timer_name: lv3-docker-runtime-watchdog.timer
        service_watchdog_service_name: lv3-docker-runtime-watchdog.service
        service_watchdog_status_file: /var/lib/lv3-docker-runtime-watchdog/status.json
        service_watchdog_probe_interval_sec: 30

    - name: Run shared completion notifications
      ansible.builtin.import_tasks: tasks/notify.yml
      vars:
        playbook_execution_notification_service: platform_service_watchdog

