schema_version: 1.0.0
service:
  id: authentik
  name: Authentik
  description: Open-source IAM/SSO broker, agentic-first, replaces Keycloak (ADR 0491)
  category: access
  lifecycle_status: active
  vm: runtime-control
  internal_url: http://10.10.10.92:9010
  exposure: edge-published
  health_probe_id: authentik
  image_catalog_ids:
    - authentik_runtime
  secret_catalog_ids:
    - authentik_admin_token
    - authentik_glitchtip_client_secret
    - authentik_outline_client_secret
  adr: 0491
  runbook: docs/runbooks/configure-authentik.md
  tags:
    - identity
    - oidc
    - saml
    - sso
    - keycloak-replacement
  notes: Replaces Keycloak per ADR 0491. Deployed at a new subdomain (id.example.com,
    not sso.example.com) so Keycloak remains fully functional throughout the parallel
    rollout and staged client migration.
  environments:
    production:
      status: active
      url: https://id.example.com
      subdomain: id.example.com
  vmid: 192
  public_url: https://id.example.com
  subdomain: id.example.com
completeness:
  service_type: compose
  requires_subdomain: true
  requires_oidc: false
  requires_secrets: true
  requires_compose_secrets: true
  dashboard_file: config/grafana/dashboards/authentik.json
  alert_rule_file: config/alertmanager/rules/authentik.yml
  keycloak_client_generated: false
  suppressed_checks: {}
redundancy:
  tier: R1
  recovery_objective:
    rto_minutes: 120
    rpo_minutes: 1440
  backup_sources:
    - git_repository
    - pbs_vm_192
  standby:
    kind: cold
    location: runtime-control
    failover_trigger: Restore runtime-control's Authentik Postgres database from PBS
      when Authentik or its dependent runtime state cannot be recovered in place.
    failback_method: Restore or rebuild the authentik-postgres bind mount from backup,
      then redeploy the authentik_runtime role and reapply the OAuth client manifest
      to reconcile providers and applications without rotating secrets.
dependency:
  node:
    id: authentik
    service: authentik
    vm: runtime-control
    tier: 1
    name: Authentik
    category: access
    adr: 0491
  outbound_edges:
    - from: authentik
      to: openbao
      type: startup_only
      description: Authentik's runtime secrets (SECRET_KEY, database credentials,
        bootstrap admin token) are provisioned through the OpenBao agent sidecar
        before startup, matching every other compose-based service in this fleet
        (ADR 0077).
health:
  service_name: authentik
  owning_vm: runtime-control
  role: authentik_runtime
  verify_file: roles/authentik_runtime/tasks/verify.yml
  startup:
    kind: http
    description: Authentik startup completes once the readiness endpoint confirms
      both PostgreSQL and Redis connections are established.
    timeout_seconds: 60
    retries: 12
    delay_seconds: 5
    url: http://127.0.0.1:9010/-/health/ready/
    method: GET
    expected_status:
      - 200
  liveness:
    kind: http
    description: The Authentik liveness endpoint responds as long as the server
      process is running, independent of its database/cache connectivity.
    timeout_seconds: 60
    retries: 12
    delay_seconds: 5
    url: http://127.0.0.1:9010/-/health/live/
    method: GET
    expected_status:
      - 200
  readiness:
    kind: http
    description: The Authentik readiness endpoint confirms PostgreSQL and Redis
      connections can be established, meaning the server can actually handle auth
      traffic.
    timeout_seconds: 60
    retries: 12
    delay_seconds: 5
    url: http://127.0.0.1:9010/-/health/ready/
    method: GET
    expected_status:
      - 200
    docker_publication:
      container_name: authentik
      bindings:
        - host: 10.10.10.92
          port: 9010
      required_networks: []
  uptime_kuma:
    enabled: true
    monitor:
      name: Authentik OIDC Discovery
      type: http
      url: https://id.example.com/-/health/ready/
      description: Authentik SSO broker published through the NGINX edge VM (ADR 0491, Phase 1 -- deployed in parallel with Keycloak).
      interval: 60
      retryInterval: 60
      maxretries: 0
      maxredirects: 5
      accepted_statuscodes:
        - "200-299"
data:
  - id: authentik_primary_data
    service: authentik
    name: Authentik primary data
    class: internal
    retention_days: 30
    backup_included: true
    access_role: platform-read
    pii_risk: low
    locations:
      - authentik-postgres (runtime-control)
    notes: Primary datastore is Authentik's own PostgreSQL database (users, groups,
      applications, providers, flows, and session state); Redis holds only ephemeral
      session/cache data, not durable state.
slos:
  - id: authentik-availability
    service_id: authentik
    indicator: availability
    objective_percent: 99.5
    window_days: 30
    target_url: https://id.example.com/-/health/ready/
    probe_module: http_2xx_follow_redirects
    description: Authentik's readiness endpoint remains reachable through the shared
      edge for operator and service authentication.
