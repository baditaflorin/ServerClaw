# =============================================================================
# Fleet observability inventory (0mcp hypervisor, 0docker, 0database, 0own)
# =============================================================================
# Hand-written, NOT generated (inventory/hosts.yml is generated from
# proxmox_guests and only knows the 0mcp guests). Host names are the SSH aliases
# from ssh-fleet-sync/00-fleet.conf, so `ansible_host` is the alias and the
# operator's ~/.ssh/config supplies the ProxyJump, user and identity.
#
# It is only ever used explicitly:
#   ansible-playbook -i inventory/fleet-observability.yml \
#     playbooks/fleet-observability.yml --limit <one host> --check --diff
# ansible.cfg still points at inventory/hosts.yml, so no other playbook sees
# these hosts, and playbooks/fleet-observability.yml refuses to run without a
# --limit. See docs/runbooks/fleet-observability.md.
#
# Hosts listed in a fleet group but in none of the fleet_*_hosts role groups are
# inventory seeds only: nothing manages them yet.
# =============================================================================
all:
  vars:
    # Hosts one run may touch. Raise it with -e fleet_observability_max_hosts=N.
    fleet_observability_max_hosts: 1
  children:
    fleet_observability:
      children:
        fleet_0mcp: {}
        fleet_0docker: {}
        fleet_0own: {}
        fleet_0infer: {}

    # ------------------------------------------------------------------ 0mcp
    # The hypervisor, plus the docker-build guest for fleet_docker_prune only: the other 0mcp guests are modelled by
    # inventory/hosts.yml and the lv3.platform roles.
    fleet_0mcp:
      hosts:
        # 0mcp guest VM 130 (Woodpecker agents). Listed here only for fleet_docker_prune; its other roles stay with
        # inventory/hosts.yml (docker-build-lv3) and the lv3.platform roles.
        0mcp_docker_build:
          ansible_host: 0mcp_docker_build
          ansible_become: true
          # Debian's prometheus-node-exporter reads this directory by default (ARGS is empty on this host).
          fleet_docker_prune_textfile_dir: /var/lib/prometheus/node-exporter
        operator-bastion:
          ansible_host: operator-bastion
          # node_exporter binds the tailnet address on 9100 and 9102 (exporter >= 1.9 binds several addresses).
          fleet_node_exporter_listen_addresses:
            - 100.64.0.6:9100
            - 100.64.0.6:9102
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
          fleet_node_exporter_textfile_owner: root
          fleet_node_exporter_textfile_group: root
          fleet_node_exporter_args_quote: "'"
          fleet_node_exporter_args_prefix: " "
          fleet_node_exporter_proxyd_path: /lib/systemd/systemd-socket-proxyd
          fleet_hypervisor_memory_reclaim_textfile_dir: /var/lib/prometheus/node-exporter/textfile
          # Port plan of the tailnet address 100.64.0.6: 9100 exporter, 9101 runtime-general proxy, 9102 exporter,
          # 9103 build-metrics proxy.
          fleet_node_exporter_socket_proxies:
            # free_bind added 2026-11-02: tailscaled updated itself at 12:33 CET, the bind failed with "Cannot assign requested address" and this proxy
            # stayed dead for 8 hours (FleetNodeExporterDown for runtime-general). See docs/runbooks/tailscaled-restart-proxies.md.
            - name: zmcp-runtime-general-metrics-proxy
              state: present
              listen_address: 100.64.0.6
              listen_port: 9101
              upstream: 10.10.10.91:9100
              free_bind: true
              socket_description: Tailscale-only node-exporter proxy for runtime-general VM191
              service_description: Forward runtime-general node-exporter over Tailscale only
            # Moved from tailnet :9100 (now the hypervisor exporter) to :9103 on 2026-10-12. FreeBind lets the socket start
            # and survive a tailscaled restart: without it the bind failed with "Cannot assign requested address" when
            # tailscaled restarted on 2026-10-11 00:53 and the proxy stayed dead.
            - name: woodpecker-0exec-build-metrics-proxy
              state: present
              listen_address: 100.64.0.6
              listen_port: 9103
              upstream: 10.10.10.30:9100
              free_bind: true
              socket_description: Tailscale-only node-exporter proxy for 0mcp docker-build-lv3
              service_description: Forward the 0mcp builder node-exporter over Tailscale only
              # Documentation only (not rendered): who reads this proxy, and the rules that let them.
              consumer: CT108 0docker-builder (tailnet 100.114.37.21, tag:builder-metrics-controller) reads docker-build metrics
              consumer_grants:
                - tailnet policy grant tag:builder-metrics-controller -> 100.64.0.6/32 tcp:9103 (config/tailscale/policy.hujson)
                - PVE host.fw line IN ACCEPT -source 100.114.37.21/32 -dest 100.64.0.6 -p tcp -dport 9103 (proxmox_host_additional_tcp_rules)

    # ----------------------------------------------------------------- 0docker
    fleet_0docker:
      hosts:
        0docker_bastion:
          ansible_host: 0docker_bastion
          # Exporter 1.5.0 cannot bind two addresses: it binds the internal bridge address and a socket proxy publishes it
          # on the tailnet address (FreeBind lets the socket start before tailscale0 has its address).
          fleet_node_exporter_listen_addresses:
            - 10.10.10.1:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
          fleet_node_exporter_textfile_owner: root
          fleet_node_exporter_textfile_group: root
          fleet_node_exporter_args_quote: "'"
          fleet_node_exporter_proxyd_path: /usr/lib/systemd/systemd-socket-proxyd
          fleet_node_exporter_socket_proxies:
            - name: zdocker-hypervisor-metrics-proxy
              state: present
              listen_address: 100.64.0.5
              listen_port: 9100
              upstream: 10.10.10.1:9100
              free_bind: true
              socket_description: Tailscale-only node-exporter proxy for 0docker hypervisor (10.10.10.1:9100)
              service_description: Forward 0docker hypervisor node-exporter over Tailscale only
            # Stale ws-0513 instance of the template unit woodpecker-exec-proxy@.socket. It forwarded the tailnet :9100 to
            # CT108 and would collide with the proxy above (same address:port) after a reboot. Disabled and inactive live;
            # the role keeps it that way and never renders it. The 9000 instance (Woodpecker agent path) is not touched.
            - name: woodpecker-exec-proxy@9100
              state: disabled
              listen_address: 100.64.0.5
              listen_port: 9100
          # Single /32 routes only (the tailnet policy auto-approves nothing wider). .109 (CT109) was added 2026-10-12;
          # the others were already advertised and must stay in the list because `tailscale set` replaces it.
          fleet_tailscale_node_advertise_routes:
            - 10.10.10.30/32
            - 10.10.10.106/32
            - 10.10.10.107/32
            - 10.10.10.109/32
        0docker_docker:
          # VM100 (ubuntuvm1, the dockerhost): listens on its internal and its tailnet address. Its flags (netdev
          # exclude, disabled arp/netclass/systemd collectors) predate this inventory and are kept as they are. The
          # textfile files in /var/lib/prometheus/node-exporter are not collected (no textfile flag), so none is managed.
          ansible_host: 0docker_docker
          fleet_node_exporter_listen_addresses:
            - 10.10.10.20:9100
            - 100.64.0.7:9100
          fleet_node_exporter_extra_args:
            - '--collector.netdev.device-exclude=^(veth.*|br-.*|docker.*)$'
            - --no-collector.arp
            - --no-collector.netclass
            - --no-collector.systemd
        0docker_docker_prod:
          ansible_host: 0docker_docker_prod
        0docker_nginx:
          # VM104 (nginx-proxy-manager). The SSH alias logs in as an unprivileged user with sudo.
          ansible_host: 0docker_nginx
          ansible_become: true
          fleet_node_exporter_listen_addresses:
            - 100.64.0.8:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
        0docker_pve_exporter:
          # CT107: no tailscaled; reached through the hypervisor's /32 route.
          ansible_host: 0docker_pve_exporter
          fleet_node_exporter_listen_addresses:
            - 10.10.10.107:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
        0docker_builder:
          # CT108 (0docker-builder): userspace-mode tailscaled has no tailscale0, so a socket cannot bind its tailnet
          # address; `tailscale serve --tcp=9100` forwards the tailnet :9100 to the internal exporter instead.
          ansible_host: 0docker_builder
          fleet_node_exporter_listen_addresses:
            - 10.10.10.108:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus-node-exporter/textfile
          fleet_node_exporter_tailscale_serve_tcp:
            - port: 9100
              target: 10.10.10.108:9100
        0docker_scrapetheworld:
          # CT109: no tailscaled; reached through the hypervisor's 10.10.10.109/32 route.
          ansible_host: 0docker_scrapetheworld
          fleet_node_exporter_listen_addresses:
            - 10.10.10.109:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile

    # -------------------------------------------------------------------- 0own
    fleet_0own:
      hosts:
        0own_bastion:
          ansible_host: 0own_bastion
          fleet_tailscale_node_advertise_routes:
            - 10.60.10.50/32
            - 10.60.10.60/32
        0own_build_worker:
          ansible_host: 0own_build_worker
        0own_pbs:
          # VM620. The PBS side of the Postgres backup path.
          ansible_host: 0own_pbs
          fleet_node_exporter_listen_addresses:
            - 100.64.0.11:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
          # Debian's default --collector.filesystem.mount-points-exclude also hides /mnt, which is where the datastore
          # (/mnt/pbs-datastore) lives. Same regex without mnt|media; the PBSDatastore* alerts depend on this series.
          fleet_node_exporter_extra_args:
            - '--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)'
          fleet_pg_backup_components: [pbs_server]
          fleet_pg_backup_pbs_datastore: own-pbs
          fleet_pg_backup_pbs_datastore_path: /mnt/pbs-datastore/store
          fleet_pg_backup_pbs_namespace: 0database
          fleet_pg_backup_pbs_user:
            id: backup-0database@pbs
            comment: 0database pg-primary vzdump writer (ns 0database only)
          fleet_pg_backup_pbs_token_name: vzdump-0database
          fleet_pg_backup_pbs_acls:
            - {path: /datastore/own-pbs/0database, role: DatastoreBackup, auth_id: "backup-0database@pbs"}
            - {path: /datastore/own-pbs/0database, role: DatastoreAudit, auth_id: "backup-0database@pbs"}
            - {path: /datastore/own-pbs/0database, role: DatastoreBackup, auth_id: "backup-0database@pbs!vzdump-0database"}
            - {path: /datastore/own-pbs/0database, role: DatastoreAudit, auth_id: "backup-0database@pbs!vzdump-0database"}
            # 0own namespace: the 0own hypervisor's vzdump writer (user and token are operator-managed; token secret in the
            # fleet vault as pbs-0own-vzdump-token-secret).
            - {path: /datastore/own-pbs/0own, role: DatastoreBackup, auth_id: "backup-0own@pbs"}
            - {path: /datastore/own-pbs/0own, role: DatastoreAudit, auth_id: "backup-0own@pbs"}
            - {path: /datastore/own-pbs/0own, role: DatastoreBackup, auth_id: "backup-0own@pbs!vzdump-0own"}
            - {path: /datastore/own-pbs/0own, role: DatastoreAudit, auth_id: "backup-0own@pbs!vzdump-0own"}
          fleet_pg_backup_pbs_prune_jobs:
            # Root namespace only. Without max_depth 0 this job recursed into every namespace (default full depth) and
            # applied keep-daily 7 to 0database, overriding the tighter prune-0database job. 0mcp-legacy is frozen and
            # deliberately not pruned further (needs a decision before anything is deleted).
            - id: own-pbs-retention
              store: own-pbs
              schedule: "04:00"
              keep_last: 3
              keep_daily: 7
              keep_weekly: 4
              keep_monthly: 6
              max_depth: 0
              comment: "Retention for root namespace only (max-depth 0); 0docker/0database have own jobs, 0mcp-legacy frozen"
            - id: prune-0docker
              store: own-pbs
              ns: 0docker
              schedule: "04:15"
              keep_last: 3
              keep_daily: 7
              keep_weekly: 4
              keep_monthly: 6
              comment: "0docker namespace: same retention own-pbs-retention applied before max-depth 0"
            - id: prune-0database
              store: own-pbs
              ns: 0database
              schedule: "04:30"
              keep_last: 3
              keep_weekly: 1
              comment: "0database pg-primary vzdump retention: 3 last + 1 weekly (capacity-bound, see report)"
            - id: prune-0own
              store: own-pbs
              ns: 0own
              schedule: "04:45"
              max_depth: 0
              keep_last: 3
              keep_weekly: 1
              comment: "0own guests (VMs 610 630 640 650 660 670): 3 last + 1 weekly, see docs/runbooks/pbs-0own-backups.md"
        0own_openobserve:
          # VM630
          ansible_host: 0own_openobserve
          fleet_node_exporter_listen_addresses:
            - 100.64.0.12:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
        0own_github_mirror:
          # VM640. Its nftables file only lets the monitoring VM's tailnet address reach tcp 9100 on tailscale0.
          ansible_host: 0own_github_mirror
          ansible_become: true
          fleet_node_exporter_listen_addresses:
            - 100.64.0.13:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
          fleet_guest_firewall_flush_mode: ruleset
          fleet_guest_firewall_allowed_inbound:
            - {source: 10.60.10.1, protocol: tcp, ports: [22, 3000]}
            - {interface: tailscale0, protocol: tcp, ports: [22, 443]}
            - interface: tailscale0
              source: 100.64.0.4
              protocol: tcp
              ports: [9100]
              description: Prometheus (monitoring-lv3) node_exporter scrape only
            - {protocol: icmp}
            - {protocol: icmpv6}
        0own_pyroscope_canary:
          # VM650: no tailscaled; reached through the hypervisor's 10.60.10.50/32 route.
          ansible_host: 0own_pyroscope_canary
          fleet_node_exporter_listen_addresses:
            - 10.60.10.50:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
        0own_staging_runtime:
          # VM660: no tailscaled; reached through the hypervisor's 10.60.10.60/32 route (autoApprover + grant in
          # config/tailscale/policy.hujson, added 2026-10-13).
          ansible_host: 0own_staging_runtime
          fleet_node_exporter_listen_addresses:
            - 10.60.10.60:9100
          fleet_node_exporter_textfile_dir: /var/lib/prometheus/node-exporter/textfile
        # VM670 (pdm, 100.65.106.57) also runs prometheus-node-exporter on its tailnet address and its nftables file opens
        # tcp 9100 on tailscale0 to 100.64.0.4 only, but our SSH key is not accepted there (it was set up through the
        # QEMU guest agent: `qm guest exec 670`), so it is not an Ansible host yet.

    # ----------------------------------------------------------------- 0infer
    # New Proxmox hypervisor and PostgreSQL VM. Exporters bind to Tailscale only.
    fleet_0infer:
      hosts:
        0infer_bastion:
          ansible_host: 0infer_bastion
          fleet_node_exporter_listen_addresses:
            - 100.64.0.21:9100
        0infer_pg_primary:
          ansible_host: 0infer_pg_primary
          ansible_become: true
          fleet_node_exporter_listen_addresses:
            - 100.64.0.22:9100

    # ------------------------------------------------------------- role groups
    # Each play of playbooks/fleet-observability.yml targets one of these.
    fleet_node_exporter_hosts:
      hosts:
        operator-bastion:
        0docker_bastion:
        0docker_docker:
        0docker_nginx:
        0docker_pve_exporter:
        0docker_builder:
        0docker_scrapetheworld:
        0own_pbs:
        0own_openobserve:
        0own_github_mirror:
        0own_pyroscope_canary:
        0own_staging_runtime:
        0infer_bastion:
        0infer_pg_primary:
    fleet_tailscale_node_hosts:
      hosts:
        0docker_bastion:
        0own_bastion:
    fleet_guest_firewall_hosts:
      hosts:
        0own_github_mirror:
    fleet_docker_prune_hosts:
      hosts:
        0mcp_docker_build:
    # Ballooning hypervisors whose MemAvailable hides memory stranded in deferred-split huge pages (0mcp, 2026-10-13).
    fleet_hypervisor_memory_reclaim_hosts:
      hosts:
        operator-bastion:
    fleet_pg_backup_hosts:
      hosts:
        0own_pbs:
