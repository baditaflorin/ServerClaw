---
# Guest-specific variables for the agent-history guest (ADR 0494, ws-0545).
#
# Nightly redaction canary scan. The role installs a systemd timer that counts, per database column, the rows holding one of
# the canary's fake secrets (the store's API never returns `raw`, so only the database can show a leak that is only in `raw`)
# and writes agent_history_canary_* to the node exporter's textfile directory. It needs the SQL file
# `agent_history_canary_scan_sql_file`, generated by agent-eval's scripts/dbscan for the canary host and delivered by the owner
# as root:root 0600 (never committed: see docs/runbooks/configure-agent-history.md, "The redaction canary"). Without that file
# the role stops with a clear message on purpose; set this to false to converge a guest that does not have it yet.
agent_history_canary_scan_enabled: true
# The host the SQL file was generated for. It must start with "canary-" (the role asserts it): the dedicated host of the
# canary collector on one laptop, with its own write token, so everything stored under it is a canary by construction.
agent_history_canary_scan_host: canary-mac14

# Semantic search (ADR 0494, ws-20261029-agent-history-embed-query). The store embeds each search question through bge-m3 on mac14: Ollama listens
# on the Mac's loopback only and `tailscale serve --tcp=8443 tcp://127.0.0.1:11434` forwards it to the Mac's tailnet address, which the tailnet
# policy opens to this guest on that one port (config/tailscale/policy.hujson). Plain http by tailnet IP, because Ollama answers 403 to the
# MagicDNS name as a Host header (runbook, "Semantic search: the embeddings Mac"). It lives here, not in an overlay, so that no later converge
# silently drops the embed flags and turns semantic search off. The model name must equal the embedding worker's --storeModel.
agent_history_embed_url: "http://100.89.103.45:8443"
agent_history_embed_model: "bge-m3"
