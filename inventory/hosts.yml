all:
  vars:
    playbook_execution_env: '{{ env | default(''production'') }}'
    playbook_execution_allowed_envs:
    - production
    - staging
    playbook_execution_host_patterns:
      proxmox_hosts:
        production: proxmox_hosts:&production
        clone: proxmox_hosts:&production
      lv3_guests:
        production: lv3_guests:&production
        clone: lv3_guests:&production
      postgres_guests:
        production: postgres_guests:&production
        clone: postgres_guests:&production
      backup_guests:
        production: backup_guests:&production
        clone: backup_guests:&production
      nginx_edge:
        production: nginx-lv3
        clone: nginx-lv3
      docker_runtime:
        production: docker-runtime-lv3
        clone: docker-runtime-lv3
      docker_build:
        production: docker-build-lv3
        clone: docker-build-lv3
      monitoring:
        production: monitoring-lv3
        clone: monitoring-lv3
      postgres:
        production: postgres-lv3
        clone: postgres-lv3
      backup:
        production: backup-lv3
        clone: backup-lv3
      runtime_control:
        production: runtime-control-lv3
        clone: runtime-control-lv3
      coolify:
        production: coolify-lv3
        clone: coolify-lv3
  children:
    production:
      hosts: {}
    platform:
      children:
        proxmox_hosts: null
        lv3_guests: null
        postgres_guests: null
        backup_guests: null
    proxmox_hosts:
      hosts:
        proxmox-host:
          ansible_host: 203.0.113.10
          ansible_user: ops
          ansible_become: true
          ansible_become_method: sudo
    lv3_guests:
      hosts:
        nginx-lv3:
          ansible_host: 10.10.10.10
          deployment_environment: production
        docker-runtime-lv3:
          ansible_host: 10.10.10.20
          deployment_environment: production
        monitoring-lv3:
          ansible_host: 10.10.10.40
          deployment_environment: production
        postgres-lv3:
          ansible_host: 10.10.10.50
          deployment_environment: production
        runtime-control-lv3:
          ansible_host: 10.10.10.92
          deployment_environment: production
        docker-build-lv3:
          ansible_host: 10.10.10.30
          deployment_environment: production
        backup-lv3:
          ansible_host: 10.10.10.60
          deployment_environment: production
        coolify-lv3:
          ansible_host: 10.10.10.70
          deployment_environment: production
        coolify-apps-lv3:
          ansible_host: 10.10.10.71
          deployment_environment: production
        artifact-cache-lv3:
          ansible_host: 10.10.10.80
          deployment_environment: production
        runtime-ai-lv3:
          ansible_host: 10.10.10.90
          deployment_environment: production
        runtime-general-lv3:
          ansible_host: 10.10.10.91
          deployment_environment: production
        postgres-replica-lv3:
          ansible_host: 10.10.10.51
          deployment_environment: production
        postgres-apps-lv3:
          ansible_host: 10.10.10.52
          deployment_environment: production
        postgres-data-lv3:
          ansible_host: 10.10.10.54
          deployment_environment: production
        runtime-comms-lv3:
          ansible_host: 10.10.10.21
          deployment_environment: production
        runtime-apps-lv3:
          ansible_host: 10.10.10.22
          deployment_environment: production
    postgres_guests:
      hosts: {}
    backup_guests:
      hosts: {}
    # Role-based group aliases — playbooks use these names in their hosts: fields.
    # Each group points to the -lv3 host; connection vars come from .local/inventory.
    runtime-control:
      hosts:
        runtime-control-lv3: null
    docker-runtime:
      hosts:
        docker-runtime-lv3: null
    docker-build:
      hosts:
        docker-build-lv3: null
    nginx:
      hosts:
        nginx-lv3: null
    monitoring:
      hosts:
        monitoring-lv3: null
    postgres:
      hosts:
        postgres-lv3: null
    postgres-apps:
      hosts:
        postgres-apps-lv3: null
    runtime-ai:
      hosts:
        runtime-ai-lv3: null
    runtime-general:
      hosts:
        runtime-general-lv3: null
    runtime-apps:
      hosts:
        runtime-apps-lv3: null
    runtime-comms:
      hosts:
        runtime-comms-lv3: null
    coolify:
      hosts:
        coolify-lv3: null
    coolify-apps:
      hosts:
        coolify-apps-lv3: null
    artifact-cache:
      hosts:
        artifact-cache-lv3: null
