# =============================================================================
# ServerClaw Platform — Inventory Skeleton (group definitions only)
# =============================================================================
# This file defines the *group structure* of the inventory. Concrete host
# entries are filled in by the overlay inventory at
# `.local/inventory/hosts.yml`, which is generated by
# `make derive-host-vars` + `make generate-inventory` from
# `.local/manifest.yml` and the live capacity probe.
#
# Keeping concrete hosts OUT of the committed inventory matters because
# the public mirror is published from this checkout. Operator-specific
# hostnames or IPs in this file would either leak through the publish
# pipeline or break fresh-host bootstrap as "unreachable placeholder hosts".
#
# See ADR 0488 for the single-deployment-per-checkout model and
# `inventory/group_vars/all/main.yml` for the playbook_execution_host_patterns
# expressions that resolve roles to hostnames at play time.
# =============================================================================

all:
  vars:
    playbook_execution_env: "{{ env | default('production') }}"
    playbook_execution_allowed_envs:
      - production
      - staging
    playbook_execution_host_patterns:
      proxmox_hosts:
        production: "proxmox_hosts:&production"
      lv3_guests:
        production: "lv3_guests:&production"
      postgres_guests:
        production: "postgres_guests:&production"
      backup_guests:
        production: "backup_guests:&production"

  children:
    production:
      hosts: {}

    platform:
      children:
        proxmox_hosts:
        lv3_guests:
        postgres_guests:
        backup_guests:

    proxmox_hosts:
      hosts: {}

    lv3_guests:
      hosts: {}

    postgres_guests:
      hosts: {}

    backup_guests:
      hosts: {}
