    wan_bridge: vmbr0
    internal_bridge: vmbr10
    internal_ipv4: 10.10.10.1
    internal_cidr: 24
    internal_network: 10.10.10.0/24
    public_edge_ipv4: 10.10.10.10
    public_ingress_tcp_ports:
      - 25
      - 80
      - 443
      - 587
      - 993
      - 7881
      - 8080
    public_ingress_tcp_forwards:
      - listen_port: 25
        target_host: 10.10.10.92
        target_port: 25
      - listen_port: 80
        target_host: 10.10.10.10
        target_port: 80
      - listen_port: 443
        target_host: 10.10.10.10
        target_port: 443
      - listen_port: 587
        target_host: 10.10.10.92
        target_port: 587
      - listen_port: 993
        target_host: 10.10.10.92
        target_port: 993
      - listen_port: 7881
        target_host: 10.10.10.21
        target_port: 7881
      - listen_port: 8080
        target_host: '{{ neko_vm_ipv4 | default(''10.10.10.41'') }}'
        target_port: 8080
        description: Neko remote desktop signalling (proxied via NGINX edge as browser.0fork.com)
    tailscale_hostname: proxmox-host-subnet-router
    tailscale_advertise_routes:
      - 10.10.10.0/24
      - 10.20.10.0/24
    tailscale_operator_target_guest: 10.10.10.30
    tailscale_tcp_proxies: []
