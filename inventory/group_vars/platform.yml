# Generated by scripts/generate_platform_vars.py from versions/stack.yaml,
# inventory/host_vars/proxmox-host.yml,
# inventory/group_vars/all/identity.yml, and (when present) .local/identity.yml.
# Do not edit by hand — run: make generate-platform-vars
