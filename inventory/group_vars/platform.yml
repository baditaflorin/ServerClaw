platform_service_topology:
  nginx_edge:
    service_name: nginx-edge
    owning_vm: nginx
    private_ip: 10.10.10.10
    public_hostname: nginx.0fork.com
    exposure_model: edge-static
    observability:
      guest_dashboard: true
      service_telemetry: true
    dns:
      managed: true
      visibility: public
      name: nginx
      type: A
      target: 65.109.84.223
      ttl: 60
    edge:
      enabled: true
      tls: true
      kind: static
      slug: nginx
      title: LV3 Edge
      description: NGINX is the public edge for published 0fork.com services on this
        platform.
      meta: Use the named subdomains for the actual service entry points exposed at
        the edge.
    service_id: nginx_edge
    runtime_pool: dedicated-edge
    deployment_surface: playbooks/services/public-edge.yml
    restart_domain: dedicated-edge-publication
    api_contract_ref: config/contracts/service-partitions/catalog.json#/partitions/dedicated-edge
    mobility_tier: anchor
    ports: {}
    urls:
      public: https://nginx.0fork.com
  grafana:
    service_name: grafana
    owning_vm: monitoring
    private_ip: 10.10.10.40
    public_hostname: grafana.0fork.com
    exposure_model: edge-published
    urls:
      public: https://grafana.0fork.com
      internal: http://10.10.10.40:3000
      influxdb: http://10.10.10.40:8086
      loki_push: http://10.10.10.40:3100/loki/api/v1/push
      prometheus: http://10.10.10.40:9090
      tempo: http://10.10.10.40:3200
      otlp_grpc: http://10.10.10.40:4317
      otlp_http: http://10.10.10.40:4318/v1/traces
    observability:
      guest_dashboard: true
      service_telemetry: false
    dns:
      managed: true
      visibility: public
      name: grafana
      type: A
      target: 65.109.84.223
      ttl: 60
    edge:
      enabled: true
      tls: true
      noindex: true
      kind: proxy
      upstream: http://10.10.10.40:3000
      proxy_hide_headers:
        - X-Grafana-Version
        - Via
      blocked_exact_paths:
        - path: /api/health
          status: 404
    service_id: grafana
    runtime_pool: dedicated-monitoring
    deployment_surface: playbooks/services/grafana.yml
    restart_domain: dedicated-monitoring-core
    api_contract_ref: config/contracts/service-partitions/catalog.json#/partitions/dedicated-monitoring
    mobility_tier: anchor
    ports:
      internal: 3000
  headscale:
    service_name: headscale
    owning_vm: proxmox-host
    private_ip: 10.10.10.1
    public_hostname: headscale.0fork.com
    exposure_model: edge-published
    observability:
      guest_dashboard: false
      service_telemetry: false
    dns:
      managed: true
      visibility: public
      name: headscale
      type: A
      target: 65.109.84.223
      ttl: 60
    edge:
      enabled: true
      tls: true
      kind: proxy
      upstream: http://10.10.10.1:8080
    service_id: headscale
    runtime_pool: host-management
    deployment_surface: playbooks/services/headscale.yml
    restart_domain: host-management-access
    api_contract_ref: config/contracts/service-partitions/catalog.json#/partitions/host-management
    mobility_tier: anchor
    ports:
      internal: 8080
    urls:
      public: https://headscale.0fork.com
      internal: http://10.10.10.1:8080
  alertmanager:
    service_name: alertmanager
    owning_vm: monitoring
    private_ip: 10.10.10.40
    exposure_model: private-only
    observability:
      guest_dashboard: false
      service_telemetry: false
    service_id: alertmanager
    runtime_pool: dedicated-monitoring
