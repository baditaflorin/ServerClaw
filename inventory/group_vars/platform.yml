  stack_source: versions/stack.yaml
  host_vars_source: inventory/host_vars/proxmox-host.yml
platform_host:
  id: proxmox-host
  public_hostname: fork-pve-01
  management:
    interface: enp41s0
    ipv4: 65.109.84.223
    ipv4_cidr: 26
    gateway4: 65.109.84.193
    ipv6: 2a01:4f9:3051:52d5::2
    ipv6_cidr: 64
    gateway6: fe80::1
    tailscale_ipv4: 100.64.0.1
