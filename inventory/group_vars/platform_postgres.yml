---
# ADR 0359: Declarative PostgreSQL client registry.
# Single source of truth for all service database relationships.
# Add one entry per service.
# source_vm is DERIVED from platform_service_registry[service].host_group at template render time (ADR 0416 Phase 2).
# Do NOT add source_vm to entries — it is no longer used and will emit a LEGACY warning in pg_hba.conf.
# This drives: pg_hba.conf (least-privilege), nftables allowed_inbound, and postgres_client role.
platform_postgres_clients:
  - service: dify
    database: dify
    user: dify
    password_local_file: "{{ repo_shared_root }}/.local/dify/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/dify"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/dify/database-password"

  - service: directus
    database: directus
    user: directus
    password_local_file: "{{ repo_shared_root }}/.local/directus/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/directus"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/directus/database-password"

  - service: flagsmith
    database: flagsmith
    user: flagsmith
    password_local_file: "{{ repo_shared_root }}/.local/flagsmith/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/flagsmith"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/flagsmith/database-password.txt"

  - service: gitea
