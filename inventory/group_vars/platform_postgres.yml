  - service: windmill
    database: windmill
    user: windmill_admin
    password_local_file: "{{ repo_shared_root }}/.local/windmill/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/windmill"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/windmill/database-password"
    support_role: windmill_user
    role_options: BYPASSRLS

  - service: woodpecker
    database: woodpecker
    user: woodpecker
    password_local_file: "{{ repo_shared_root }}/.local/woodpecker/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/woodpecker"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/woodpecker/database-password"

  # OpenBao dynamic credential backend — uses the postgres database with the
  # openbao_rotator user (created by openbao_postgres_backend role).  No
  # password_local_file here because the backend role manages its own credential;
  # this entry exists solely to generate the pg_hba.conf allow-line so OpenBao
  # can reach PostgreSQL from runtime-control without hitting auth rejection.
  - service: openbao
    database: postgres
    user: openbao_rotator

  # DBeaver administrative access for database diagnostics and management
  - service: dbeaver
    database: postgres
    user: dbeaver
    password_local_file: "{{ repo_shared_root }}/.local/dbeaver/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/dbeaver"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/dbeaver/database-password"
    role_options: SUPERUSER CREATEDB CREATEROLE
