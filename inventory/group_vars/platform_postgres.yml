  - service: outline
    database: outline
    user: outline
    password_local_file: "{{ repo_shared_root }}/.local/outline/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/outline"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/outline/database-password"

