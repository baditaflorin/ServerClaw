    password_local_file: "{{ repo_shared_root }}/.local/langfuse/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/langfuse"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/langfuse/database-password"

  - service: matrix_synapse
    database: matrix_synapse
    user: matrix_synapse
    password_local_file: "{{ repo_shared_root }}/.local/matrix-synapse/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/matrix-synapse"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/matrix-synapse/database-password.txt"
