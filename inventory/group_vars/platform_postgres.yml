    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/paperless/database-password"

  - service: plane
    database: plane
    user: plane_admin
    password_local_file: "{{ repo_shared_root }}/.local/plane/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/plane"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/plane/database-password"
    support_role: plane_user

  - service: semaphore
    database: semaphore
    user: semaphore_admin
    password_local_file: "{{ repo_shared_root }}/.local/semaphore/database-password.txt"
    password_remote_dir: "/etc/{{ platform_identity.unix_prefix }}/semaphore"
    password_remote_file: "/etc/{{ platform_identity.unix_prefix }}/semaphore/database-password"
