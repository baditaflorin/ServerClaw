labels:
  lv3: "true"

steps:
  validate-woodpecker-contract:
    image: python:3.12-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends bash git make ca-certificates
      - python3 -m pip install --no-cache-dir uv ansible-core
      - python3 --version
      - uv --version
      # This clean CI checkout intentionally has no ignored deployment overlays.
      # The validator checks tracked structure and skips only overlay-derived
      # equivalence when those private generated inputs are unavailable. Do not
      # regenerate deployment-specific facts from committed defaults here.
      - make validate-generated-vars
      - ANSIBLE_CONFIG="$PWD/ansible.cfg" ANSIBLE_COLLECTIONS_PATH="$PWD/collections" make syntax-check-woodpecker
      - ./scripts/validate_repo.sh json health-probes agent-standards
      - uv run --with pytest --with pyyaml --with jsonschema --with jinja2 python -m pytest tests/test_generate_platform_vars.py tests/test_postgres_vm_access_policy.py tests/test_woodpecker_playbook.py tests/test_woodpecker_runtime_role.py tests/test_woodpecker_client.py tests/test_woodpecker_workflow_contract.py tests/test_authentik_identity_reconcile.py tests/test_gitea_authentik_e2e.py tests/test_gitea_runtime_role.py tests/test_validate_service_completeness.py tests/test_subdomain_catalog.py tests/test_linux_guest_firewall_role.py tests/test_grafana_sso_role.py tests/test_grafana_authentik_e2e.py tests/test_librechat_authentik_e2e.py tests/test_librechat_tool_specs.py tests/test_parse_lynis_report.py tests/test_security_posture_report.py tests/test_upgrade_container_image.py tests/test_sbom_scanner.py tests/test_container_image_policy.py tests/test_vulnerability_budget.py tests/test_patched_runtime_images.py tests/test_certificate_validator_retiring_routes.py tests/test_ws0456_deployment_aware_cert_validation.py tests/test_ws0461_cert_validator_multi_deployment.py -q
      - uv run --with pytest --with pyyaml --with jinja2 python -m pytest tests/test_plausible_playbook.py tests/test_monitoring_prometheus_codification.py -q
      - uv run --with pytest --with pyyaml python -m pytest tests/test_ci_provider_policy.py tests/test_api_gateway_runtime_role.py tests/test_fleet_backup_freshness.py -q
    when:
      - event: [manual, push, pull_request]

  # Tailscale policy as code (config/tailscale/). Offline checks ONLY: no credential is available to CI and none is
  # needed. Syntax, no allow-all grant, every tag defined in tagOwners, and the lockout guard (the policy tests must
  # keep proving the operator Mac and the bastions can SSH). Plan/apply against the live tailnet is a manual step run
  # from CT108 (docs/runbooks/tailscale-metrics-grants.md); CI never applies a policy.
  validate-tailscale-policy:
    image: python:3.12-slim
    commands:
      - python3 -m pip install --no-cache-dir pytest==8.3.4 pyyaml==6.0.2
      - python3 scripts/tailscale_policy_sync.py check
      - python3 -m pytest tests/test_tailscale_policy_sync.py -q
    when:
      - event: manual
      - event: [push, pull_request]
        path:
          include:
            - config/tailscale/**
            - scripts/tailscale_policy_sync.py
            - tests/test_tailscale_policy_sync.py
            - tests/fixtures/tailscale/**
            - .woodpecker.yml

  validate-secret-contract:
    image: alpine:3.22
    commands:
      - test -n "$LV3_WOODPECKER_SECRET_SMOKE"
    environment:
      LV3_WOODPECKER_SECRET_SMOKE:
        from_secret: LV3_WOODPECKER_SECRET_SMOKE
    when:
      - event: manual
      - event: push
        branch: main
